ap tidak apa-apa.\n- Silakan konsumsi sesuai dosis normal.\n- Untuk yang khawatir benjolan muncul lagi: Novia berperan menjaga keseimbangan hormon dan kesehatan kewanitaan, sedangkan benjolan di payudara bisa terjadi akibat ketidakseimbangan hormon tersebut.\n- Fungsi Novia bukan sebagai obat.","p":["Novia"],"k":"kondisi medis & penyakit","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-06-22","n":3,"kasus":[{"d":"2026-04-13","t":"Konsumen pernah punya FAM (tumor jinak di payudara) dan selama ini menghindari pemicu hormonal → boleh bila FAM sudah diterapi & dinyatakan sembuh."},{"d":"2026-04-30","t":"Operasi tumor jinak payudara 6 tahun lalu, kadang nyeri di area bekas operasi, tanpa keluhan tumor lain → boleh dosis normal."},{"d":"2026-06-22","t":"Pernah operasi benjolan payudara, kadang nyeri, khawatir payudara membesar dan benjolan muncul lagi; ada riwayat keturunan hipertensi → boleh, tapi bukan obat."}],"kw":["fam","fibroadenoma","tumor jinak payudara","benjolan payudara","riwayat benjolan","riwayat tumor","operasi payudara","pasca operasi","bekas operasi","nyeri payudara","payudara","hormonal"]},{"id":158,"q":"Kenapa konsumen pegal-pegal di pinggang setiap minum Novia (hilang saat berhenti, muncul lagi saat minum lagi), dan apakah harus distop?","a":"Kalau pegalnya sampai mengganggu aktivitas, stop Novia.\n- Dokter curiga ada efek samping berbeda yang dirasakan konsumen ini.","p":["Novia"],"k":"efek samping & keluhan","s":"tergantung","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-06-21","n":1,"kasus":[{"d":"2026-06-21","t":"Wanita 42 th, 2–3 hari minum Novia terasa pegal pinggang, hilang saat stop 1 minggu, muncul lagi saat minum ulang; dulu saat gadis sering pegal tapi setelah melahirkan tidak → stop bila mengganggu aktivitas."}],"kw":["pegal","pegal-pegal","pegal pinggang","sakit pinggang","nyeri pinggang","linu","efek samping"]},{"id":159,"q":"Apakah konsumen yang memakai KB IUD (spiral) boleh minum Novia?","a":"Seharusnya aman, dengan catatan:\n- IUD terpasang di rahim dan sedikit memengaruhi hormon, sedangkan Novia bekerja menjaga kesehatan dan keseimbangan hormon.\n- Mulai dari dosis ringan dulu, yaitu 2 hari sekali.\n- Waspadai reaksi sebaliknya, seperti perdarahan haid, nyeri panggul, nyeri perut, dan lainnya.","p":["Novia"],"k":"minum bersama obat/suplemen","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-06-19","n":1,"kasus":[{"d":"2026-06-19","t":"IUD terpasang ±1 tahun (rencana ±4 tahun lagi), haid jadi 2 bulan sekali dan berat badan naik → boleh, mulai dosis ringan 2 hari sekali."}],"kw":["iud","spiral","kb spiral","akdr","kontrasepsi","kb","dosis ringan","2 hari sekali"]},{"id":160,"q":"Bagaimana jika konsumen ternyata hamil saat sedang/sudah minum Novia — apakah berbahaya dan apa yang harus dilakukan?","a":"Stop Novia begitu dipastikan positif hamil.\n- Novia disarankan untuk wanita yang tidak sedang hamil, karena fungsinya meregulasi hormon tubuh.\n- Selama belum dipastikan positif hamil, tidak apa-apa diminum.\n- Jika sudah positif hamil, tidak usah diminum: segera stop dan informasikan ke dokter kandungan tentang riwayat minum Novia tersebut.\n- Dokter tidak memberi penjelasan lain soal bahaya atau tidaknya; pada kasus Novia langsung dihentikan begitu tahu hamil, saran dokter cukup tetap distop.","p":["Novia"],"k":"hamil, menyusui & promil","s":"tidak","rd":true,"by":["Dr Rizky Nasution","Nutritionist Novrianti"],"d":"2026-06-18","n":2,"kasus":[{"d":"2026-04-08","t":"Konsumen khawatir: minum Novia setelah haid terakhir, lalu ternyata hamil (usia kehamilan dihitung dari haid terakhir) → selama belum positif boleh; bila positif, stop & lapor ke dokter kandungan."},{"d":"2026-06-18","t":"Sebelumnya haid tidak teratur; minum Novia ±1 bulan, haid jadi teratur lalu hamil (±3 minggu); Novia langsung dihentikan → cukup stop."}],"kw":["hamil","ternyata hamil","positif hamil","tidak sadar hamil","hamil muda","telanjur minum","hpht","haid terakhir","dokter kandungan","janin","kehamilan","stop novia"]},{"id":161,"q":"Apakah S-Glow bisa menumbuhkan rambut di kepala yang sudah botak (botak licin/kinclong, atau rontok karena DHT sampai botak)?","a":"Tidak bisa.\n- Botak licin (kinclong): akar rambut sudah tidak ada dan tidak pernah terlihat rambut tumbuh, sehingga tidak bisa dibantu.\n- Rambut rontok karena DHT (bahkan sampai botak): tidak bisa disembuhkan dengan S-Glow, karena S-Glow bukan obat hormonal khusus penumbuh rambut.","p":["S-Glow"],"k":"manfaat & hasil","s":"tidak","rd":false,"by":["Dr Rizky Nasution","Nutritionist Novrianti"],"d":"2026-06-18","n":2,"kasus":[],"kw":["botak","kebotakan","rambut rontok","alopecia","menumbuhkan rambut","akar rambut","rambut","dht","penumbuh rambut","rontok hormonal","botak kinclong"]},{"id":162,"q":"Apakah Novia aman untuk penderita hidrosalping (saluran tuba berisi cairan) dan bisakah menyembuhkannya?","a":"Boleh dikonsumsi, tetapi Novia bukan obat dan tidak berefek ke hidrosalpingnya.\n- Hidrosalping adalah masalah pada bentuk organ kewanitaan dan membutuhkan penanganan operasi dari dokter obgyn.\n- Novia boleh diminum, namun bukan sebagai obat utama.","p":["Novia"],"k":"kondisi medis & penyakit","s":"bersyarat","rd":true,"by":["Dr Rizky Nasution"],"d":"2026-06-18","n":1,"kasus":[],"kw":["hidrosalping","hydrosalpinx","saluran tuba","tuba falopi","cairan di tuba","sumbatan tuba","obgyn","operasi"]},{"id":163,"q":"Kenapa muncul bercak seperti memar/lebam di paha dan lengan setelah minum DVN 3 botol, dan apakah bisa karena DVN?","a":"Bisa karena efek pengencer darah, atau karena alergi.\n- Reaksi seperti ini biasanya akibat efek samping obat/vitamin/suplemen yang mengandung pengencer darah. Menurut dokter, kandungan Viqua pomegranate (di DVN) memiliki efek pengencer darah, jadi betul bisa karena DVN.\n- Bisa juga akibat intoleransi tubuh (alergi).\n- Jika selalu muncul setiap minum suplemen dan mengganggu keseharian, sebaiknya tidak dikonsumsi lagi karena bisa berefek jangka panjang ke sistem tubuh lainnya.","p":["DVN"],"k":"efek samping & keluhan","s":"tergantung","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-06-17","n":1,"kasus":[{"d":"2026-06-17","t":"Setelah 3 botol DVN muncul bercak seperti memar di paha dan lengan → bisa efek pengencer darah (Viqua pomegranate) atau alergi; stop bila selalu muncul dan mengganggu."}],"kw":["memar","lebam","biru-biru","bercak kulit","pengencer darah","pomegranate","delima","viqua","alergi","intoleransi"]},{"id":164,"q":"Apakah Novia/DVN bisa membuat kulit wajah sangat kering sampai kemerahan, dan apa yang harus dilakukan?","a":"Bisa, pada sebagian konsumen.\n- Terutama perempuan usia di atas 40 tahun, yang secara hormonal memang sedang mulai menurun secara normal.\n- Coba kurangi dosis DVN: minum selang 1 hari (2 hari sekali).\n- Perbanyak minum air putih dan tetap pakai skincare seperti biasa.","p":["DVN","Novia"],"k":"efek samping & keluhan","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-06-17","n":1,"kasus":[{"d":"2026-06-17","t":"Konsumen 42 th, kulit kombinasi-berminyak & sensitif, minum DVN pagi serta Novia + DVN malam, skincare tidak diganti; wajah jadi sangat kering sampai merah → DVN dikurangi jadi 2 hari sekali."}],"kw":["kulit kering","wajah kering","kemerahan","kulit merah","kulit sensitif","usia 40","kurangi dosis","skincare","air putih"]},{"id":165,"q":"Apakah S-Glow boleh diminum penderita autoimun rheumatoid arthritis (RA) yang rutin minum obat steroid?","a":"Tidak disarankan.\n- Untuk kondisi autoimun, reaksi tiap pasien terhadap vitamin dan suplemen berbeda-beda.","p":["S-Glow"],"k":"kondisi medis & penyakit","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-06-16","n":1,"kasus":[{"d":"2026-06-16","t":"Penderita RA, sudah ±1,5 tahun minum obat steroid → jangan."}],"kw":["autoimun","rheumatoid arthritis","ra","rematik","radang sendi","steroid","obat steroid","kortikosteroid"]},{"id":166,"q":"Apakah S-Glow boleh diminum konsumen yang rutin minum obat saraf (Dyvalprox), asam folat, allopurinol, candesartan, serta obat ginjal-hipertensi (bicarbonat, vitamin B12, amlodipin)?","a":"Boleh dicoba, dengan catatan:\n- Bedakan jam minum S-Glow dengan jam minum obat sarafnya.","p":["S-Glow"],"k":"minum bersama obat/suplemen","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-06-14","n":1,"kasus":[{"d":"2026-06-14","t":"Rutin Dyvalprox Sodium 500 mg 2x sehari, asam folat 1 mg, allopurinol 100 mg, candesartan 10 mg, bicarbonat 500 mg & vitamin B12 2x sehari, amlodipin 10 mg → boleh, beda jam minum dengan obat saraf."}],"kw":["obat saraf","obat syaraf","dyvalprox","divalproex","allopurinol","asam urat","candesartan","amlodipin","hipertensi","ginjal"]},{"id":167,"q":"Apakah Novia boleh dilanjutkan atau dicoba lagi oleh konsumen yang sudah terdiagnosa gangguan hormon dan mengalami perdarahan seperti haid setelah minum 1 kapsul Novia?","a":"Tidak. Segera stop Novia dan periksa ke dokter kandungan.\n- Konsumen sudah jelas terdiagnosa gangguan hormon; untuk kondisi ini yang disarankan hanya obat hormonal dari dokter, tidak boleh dicampur vitamin atau suplemen lain karena reaksinya di tubuh bisa berbeda.\n- Segera periksa lagi ke dokter spesialis obgyn yang menangani konsumen.\n- Selanjutnya tidak disarankan minum Novia lagi selama kondisi kesehatannya seperti ini.","p":["Novia"],"k":"efek samping & keluhan","s":"tidak","rd":true,"by":["Dr Rizky Nasution"],"d":"2026-06-14","n":1,"kasus":[{"d":"2026-06-14","t":"Wanita 41 th, haid rutin (siklus 23–28 hari), ada beberapa kista kecil, ±5 th flek di masa subur, pernah terapi progesteron; minum 1 kapsul Novia lalu esoknya perdarahan seperti haid di hari ke-17 → stop, periksa ke obgyn, jangan lanjut."}],"kw":["perdarahan","pendarahan","flek","gangguan hormon","progesteron","kista","efek estrogenik","masa subur","haid di luar jadwal","obgyn"]},{"id":168,"q":"Apakah konsumen yang punya anggota keluarga langsung dengan kanker payudara atau kanker rahim boleh minum Novia?","a":"Boleh.\n- Selama yang menderita kanker bukan konsumennya sendiri, tidak apa-apa.","p":["Novia"],"k":"kondisi medis & penyakit","s":"boleh","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-06-12","n":1,"kasus":[],"kw":["riwayat keluarga","keturunan kanker","kanker payudara","kanker rahim","genetik","faktor keturunan","kanker"]},{"id":169,"q":"Apakah Novia aman untuk penderita jantung (bradikardia) dan GERD/asam lambung?","a":"Boleh, dengan catatan:\n- Minum Novia setelah makan.\n- Pastikan lambung dalam keadaan terisi.","p":["Novia"],"k":"kondisi medis & penyakit","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-06-12","n":1,"kasus":[{"d":"2026-06-12","t":"Konsumen dengan bradikardia dan GERD → boleh, diminum setelah makan."}],"kw":["jantung","bradikardia","detak jantung lambat","sakit jantung","gerd","asam lambung","maag","lambung"]},{"id":170,"q":"Apakah konsumen yang masih memakai KB implan boleh minum Novia?","a":"Tidak disarankan (jangan).\n- Jawaban untuk konsumen yang saat ini masih memakai KB implan.","p":["Novia"],"k":"minum bersama obat/suplemen","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-06-11","n":1,"kasus":[],"kw":["kb implan","implan","susuk kb","kontrasepsi","kb hormonal","alat kontrasepsi","kb"]},{"id":171,"q":"Kenapa nama PT pendaftar di data BPOM DVN berbeda — dengan PT pendaftar S-Glow/Novia, maupun dengan nama PT di sertifikat halal DVN?","a":"Karena DVN diproduksi lokal, sehingga berlaku aturan pendaftaran produk lokal.\n- Untuk produk lokal, yang berhak menjadi pendaftar di BPOM adalah produsen/manufaktur atau perusahaan yang memiliki izin (dijelaskan saat ditanya kenapa PT pendaftar DVN berbeda dengan S-Glow/Novia).\n- Saat ditanya kenapa nama PT di data BPOM berbeda dengan PT di sertifikat halal: untuk produk lokal, pihak yang berhak mendaftarkan adalah manufaktur (pabrik pembuat) yang memiliki izin Cara Pembuatan Obat yang Baik.","p":["DVN","Novia","S-Glow"],"k":"kandungan & keamanan produk","s":"info","rd":false,"by":["Nutritionist Novrianti"],"d":"2026-06-05","n":2,"kasus":[{"d":"2026-06-05","t":"Customer mempertanyakan nama PT di BPOM dan di sertifikat halal yang berbeda, dan mana yang benar."}],"kw":["bpom","izin edar","nomor bpom","pt pendaftar","beda pt","nama pt","sertifikat halal","produk lokal","manufaktur","produsen","cpob","legalitas"]},{"id":172,"q":"Apakah konsumen yang rutin minum obat depresi/cemas atau obat dari psikiater (mis. Cipralex, fluoxetine, alprazolam, lorazepam, quetiapine) boleh minum Novia?","a":"Boleh, dengan jarak waktu minum.\n- Jam minum Novia dipisah dari obat-obatnya.\n- Untuk Cipralex (obat depresi/kecemasan), dokter menyarankan jarak 6 jam antara Novia dan obatnya, supaya ada toleransi waktu interaksi obat.","p":["Novia"],"k":"minum bersama obat/suplemen","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-06-05","n":2,"kasus":[{"d":"2026-04-17","t":"Konsumen minum Cipralex (obat depresi untuk kecemasan) → Novia boleh dengan jeda 6 jam."},{"d":"2026-06-05","t":"Rutin obat psikiater sejak awal 2023 (pagi fluoxetine 10 mg; malam alprazolam 0,5 mg, lorazepam 2 mg, racikan quetiapine) → boleh, jarak minum dipisah."}],"kw":["obat psikiater","obat depresi","antidepresan","depresi","cemas","obat penenang","cipralex","escitalopram","fluoxetine","alprazolam","lorazepam","quetiapine"]},{"id":173,"q":"Apakah konsumen dengan kelebihan hormon estrogen yang sedang minum obat hormon (Regumen 2x1) boleh minum Novia?","a":"Tidak disarankan.\n- Dikhawatirkan justru terjadi ketidakseimbangan hormonal.","p":["Novia"],"k":"minum bersama obat/suplemen","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-06-05","n":1,"kasus":[{"d":"2026-06-05","t":"Kelebihan hormon estrogen, sedang minum obat hormon Regumen 2x1 → jangan."}],"kw":["kelebihan estrogen","estrogen tinggi","regumen","obat hormon","terapi hormon","ketidakseimbangan hormon","hormon tidak seimbang"]},{"id":174,"q":"Kenapa kulit yang awalnya cerah saat minum DVN tiba-tiba jadi kusam, kering, dan muncul flek setelah botol ke-5, padahal rutin pakai sunscreen?","a":"Karena perubahan siklus haid yang terjadi secara alami.\n- Pada kasus ini konsumen sudah 6 bulan terakhir tidak haid, sementara aktivitasnya tidak berubah.\n- Perubahan siklus haid alami ini tidak bisa dikontrol dan berefek ke kondisi kulit yang dirasakan sekarang.","p":["DVN"],"k":"efek samping & keluhan","s":"info","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-06-03","n":1,"kasus":[{"d":"2026-06-03","t":"Konsumen DVN: botol 1–2 kulit cerah, botol ke-5 kusam/kering/flek walau pakai sunscreen; 6 bulan terakhir tidak haid → efek perubahan siklus haid alami."}],"kw":["kulit kusam","flek","kulit kering","tidak haid","tidak mens","siklus haid","hasil menurun","sunscreen","glowing hilang"]},{"id":175,"q":"Kenapa kulit wajah konsumen jadi sangat kering, mengelupas, dan menggelap setelah rutin minum produk Wellous (naik ke paket lebih besar)? Apa yang harus dilakukan?","a":"Itu reaksi alergi, sebaiknya stop.\n- Kemungkinan dari salah satu kandungan di dalam produk.\n- Prinsipnya: jika muncul reaksi alergi saat minum produk, segera evaluasi dan stop.\n- Respons tiap orang berbeda dan reaksi alergi bisa berbahaya, jadi harus dievaluasi dan dimonitor sesegera mungkin.","p":["Umum"],"k":"efek samping & keluhan","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-06-03","n":1,"kasus":[{"d":"2026-06-03","t":"Pembelian pertama belum ada reaksi; setelah naik paket dan beli sampai 4x, wajah kering sampai mengelupas dan menggelap hingga berobat ke dokter → reaksi alergi, stop."}],"kw":["alergi","reaksi alergi","kulit kering","wajah kering","mengelupas","kulit gosong","kulit menghitam","iritasi"]},{"id":176,"q":"Apakah DVN dan S-Glow aman untuk penyintas kanker payudara yang masih minum obat Femara dan Kryxana?","a":"Boleh (tidak apa-apa), dengan catatan:\n- Beri jarak waktu antara minum produk dan obat-obatnya.\n- Evaluasi efek setelah konsumsi produk.","p":["DVN","S-Glow"],"k":"minum bersama obat/suplemen","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-06-03","n":1,"kasus":[{"d":"2026-06-03","t":"Penyintas kanker payudara yang masih minum Femara & Kryxana → boleh, beri jarak minum dengan obat dan evaluasi efeknya."}],"kw":["kanker payudara","penyintas kanker","breast cancer","femara","letrozole","kryxana","ribociclib","obat kanker","survivor kanker"]},{"id":177,"q":"Kenapa konsumen jadi mengantuk dan lemas terus setelah minum Novia (diminum malam hari), dan bagaimana mengatasinya?","a":"Kemungkinan efek dari salah satu kandungan Novia (respons tiap orang berbeda).\n- Jika mengganggu aktivitas, minum hanya menjelang tidur saja; selain waktu itu jangan.\n- Opsi lain: minum dengan jeda sehari (selang-seling) supaya tidak lemas dan mengantuk.","p":["Novia"],"k":"efek samping & keluhan","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-05-30","n":1,"kasus":[{"d":"2026-05-30","t":"Konsumen minum Novia tiap malam ±10 hari, mengantuk & lemas tidak seperti biasa (olahraga pun jadi lemas), padahal keputihan sudah jauh berkurang → minum menjelang tidur atau selang sehari."}],"kw":["mengantuk","ngantuk","lemas","lelah","capek","efek samping novia","minum sebelum tidur","jeda sehari"]},{"id":178,"q":"Apakah wanita perimenopause dengan endometriosis yang sedang disuntik Zoladex (obat hormon) untuk dibuat menopause boleh minum Novia?","a":"Tidak disarankan.\n- Kontraindikasi dengan kondisi konsumen.","p":["Novia"],"k":"haid, hormon & menopause","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-05-30","n":1,"kasus":[{"d":"2026-05-30","t":"Konsumen dengan endometriosis, sempat perdarahan 2 bulan nonstop hingga kontraksi, sudah 4 bulan disuntik Zoladex agar menopause (usia perimenopause) → jangan."}],"kw":["endometriosis","zoladex","goserelin","suntik hormon","obat hormon","menopause buatan","perimenopause","perdarahan"]},{"id":179,"q":"Apakah penderita sakit jantung yang rutin minum banyak obat (Bisoprolol, Uperio, Jardiance, Lixiana, Spironolactone, Rosuvastatin) boleh minum Erojan?","a":"Tidak disarankan.\n- Fokus ke terapi obatnya dulu.","p":["Erojan"],"k":"minum bersama obat/suplemen","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-05-30","n":1,"kasus":[{"d":"2026-05-30","t":"Penderita sakit jantung dengan obat Bisoprolol, Uperio, Jardiance, Lixiana, Spironolactone, Rosuvastatin → jangan Erojan."}],"kw":["sakit jantung","penyakit jantung","obat jantung","bisoprolol","uperio","jardiance","lixiana","spironolakton","rosuvastatin"]},{"id":180,"q":"Apakah S-Glow boleh diminum bersamaan dengan obat autoimun baricitinib?","a":"Boleh, dengan waktu minum dipisah.\n- Pisahkan konsumsi S-Glow dan obatnya; beri jeda/berbeda waktu makan.","p":["S-Glow"],"k":"minum bersama obat/suplemen","s":"bersyarat","rd":false,"by":["Nutritionist Novrianti"],"d":"2026-05-29","n":1,"kasus":[{"d":"2026-05-29","t":"Konsumen alopecia areata yang sedang pengobatan dokter dengan baricitinib → S-Glow dipisah waktu minumnya dari obat."}],"kw":["baricitinib","unamity","obat autoimun","alopecia areata","jeda minum","beda waktu makan","interaksi obat"]},{"id":181,"q":"Apakah S-Glow bisa membantu alopecia areata (rambut rontok karena autoimun)? Apakah ada kasus serupa yang membaik?","a":"S-Glow membantu menutrisi rambut, bukan mengatasi autoimunnya.\n- Yang dibantu lebih ke nutrisi rambut, bukan mengurangi pengaruh autoimun; kemungkinan rambut rontoknya berkurang.\n- Pada kondisi autoimun, kerontokan rambut memang tidak bisa dielakkan; paling tidak rambut tetap terlihat sehat.\n- S-Glow adalah suplemen, bukan obat utama; kondisi autoimun akan sangat memengaruhi kerontokan rambut.\n- Jelaskan ke konsumen agar tidak salah paham terhadap kinerja S-Glow.","p":["S-Glow"],"k":"manfaat & hasil","s":"info","rd":false,"by":["Nutritionist Novrianti","Dr Rizky Nasution"],"d":"2026-05-29","n":1,"kasus":[],"kw":["alopecia areata","alopesia","rambut rontok","kerontokan","autoimun","botak","pitak","rambut"]},{"id":182,"q":"Apakah konsumen yang pernah biopsi kelenjar (sudah aman) dan dianjurkan dokter menghindari makanan tinggi hormon serta hanya boleh KB IUD aman minum Novia?","a":"Tidak disarankan.\n- Konsumen tampaknya hipersensitif terhadap kandungan makanan/minuman yang memengaruhi hormonalnya, jadi jangan konsumsi Novia.","p":["Novia"],"k":"kondisi medis & penyakit","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-05-28","n":1,"kasus":[{"d":"2026-05-28","t":"Pernah biopsi kelenjar (hasil aman), dianjurkan hindari makanan tinggi hormon seperti ayam broiler, KB hanya IUD → jangan."}],"kw":["biopsi","biopsi kelenjar","kelenjar","hormonal","sensitif hormon","ayam broiler","kb iud","benjolan"]},{"id":183,"q":"Apakah wanita 35 tahun dengan menopause dini yang sedang minum Fetavita, Biosan, Profertil, dan Ascardia boleh minum Novia?","a":"Boleh dicoba dengan dosis setengah.\n- Dosis setengah = selang-seling (2 hari sekali), karena dosis normal Novia 1 kapsul sehari.\n- Evaluasi selama 1–2 minggu, apakah muncul keluhan/kendala setelah minum Novia.","p":["Novia"],"k":"minum bersama obat/suplemen","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-05-26","n":1,"kasus":[{"d":"2026-05-26","t":"Wanita 35 tahun, menopause dini, minum Fetavita, Biosan, Profertil, Ascardia → coba Novia selang-seling, evaluasi 1–2 minggu."}],"kw":["menopause dini","profertil","ascardia","fetavita","biosan","dosis setengah","selang-seling","promil","aspirin"]},{"id":184,"q":"Bagaimana jika area psoriasis terasa merah dan sedikit gatal setelah 2 hari minum S-Glow? Apakah boleh lanjut dengan 1 tablet per hari?","a":"Boleh dicoba 1 tablet per hari, tapi stop jika keluhan masih ada.\n- Psoriasis merupakan salah satu bentuk autoimun, jadi bisa saja konsumen alergi terhadap salah satu kandungan S-Glow.\n- Hentikan jika mengganggu dan menimbulkan keluhan baru.\n- Jika sudah dicoba 1 tablet dan keluhan masih ada → stop.","p":["S-Glow"],"k":"efek samping & keluhan","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-05-24","n":1,"kasus":[{"d":"2026-05-24","t":"Konsumen psoriasis (tidak alergi yeast) minum S-Glow 2 hari, area psoriasis merah & sedikit gatal → boleh coba 1 tablet/hari, stop bila keluhan berlanjut."}],"kw":["psoriasis","autoimun","gatal","kemerahan","kambuh","yeast","alergi","turun dosis"]},{"id":185,"q":"Apakah penderita psoriasis (autoimun) atau eksim boleh minum DVN?","a":"Tergantung pemicu kambuhnya; minum dengan hati-hati demi keamanan.\n- Sebaiknya konsumen sudah tahu apa pemicu kambuh atau munculnya rasa gatal.\n- Jika salah satu pemicunya kolagen atau pemanis → mungkin bisa minum DVN saat kondisi sedang remisi.\n- Jika tetap mau minum DVN → minum di pagi hari dan mulai 1 kali sehari dulu (disetujui Dr Rizky).\n- DVN bukan pengobatan spesifik untuk eksim/psoriasis; tetap harus dibarengi obat spesifiknya.\n- Pastikan sebelumnya konsumen tidak punya alergi makanan ikan.\n- Catatan: jawaban lama (2025-03-09, Dr Rizky Nasution) menyatakan dari sisi keamanan aman/tidak ada masalah (tanpa syarat pemicu); ikuti yang terbaru yang lebih hati-hati.","p":["DVN"],"k":"kondisi medis & penyakit","s":"tergantung","rd":false,"by":["Nutritionist Novrianti","Dr Rizky Nasution"],"d":"2026-05-24","n":2,"kasus":[{"d":"2026-05-24","t":"Konsumen 40 tahun dengan autoimun psoriasis → kenali pemicu; bila tetap minum, pagi hari mulai 1x sehari."}],"kw":["psoriasis","eksim","eczema","autoimun","dermatitis","penyakit kulit","remisi","kambuh","gatal","alergi ikan","kulit bersisik","pemanis"]},{"id":186,"q":"Apakah Novia tetap diminum saat haid atau saat masih keluar flek?","a":"Tidak, stop dulu selama haid/flek; lanjutkan lagi setelah haid benar-benar selesai.\n- Saat haid keluar (termasuk bila haid datang ketika sedang rutin minum Novia), hentikan dulu konsumsi Novia.\n- Jika muncul flek-flek (belum haid penuh) saat minum Novia → stop dulu, lanjutkan lagi setelah menstruasi selesai.\n- Jika haid hanya lancar 1–3 hari lalu berlanjut flek (bisa sampai ±2 minggu) → tetap stop sampai bersih; kalau masih flek, dikhawatirkan nanti jadi haid lagi dan menyalahi siklus normalnya.\n- Setelah haid selesai, tetap disarankan melanjutkan Novia, karena perlu waktu untuk memperbaiki regulasi hormon agar lebih sehat.\n- Catatan: jawaban lama (2024-12-03, Nutritionist Novrianti) sempat menyebut Novia sudah boleh diminum saat haid hari ke-7 walau masih ada sedikit flek cokelat; ikuti yang terbaru.","p":["Novia"],"k":"haid, hormon & menopause","s":"tidak","rd":false,"by":["Nutritionist Novrianti","Dr Rizky Nasution"],"d":"2026-05-24","n":5,"kasus":[{"d":"2024-12-03","t":"Haid hari ke-7 masih ada sedikit flek cokelat → saat itu dinyatakan sudah boleh minum (saran lama, lihat Catatan)."},{"d":"2025-02-13","t":"Haid keluar saat sedang rutin minum Novia (detail keluhan dikirim lewat foto) → stop selama haid, lanjutkan lagi setelah selesai."},{"d":"2025-02-25","t":"Ditanya apakah Novia tetap diminum saat haid (sekaligus konfirmasi 1 kapsul/hari, yang tidak dijawab di sini) → stop saat haid keluar."},{"d":"2026-05-24","t":"Haid lancar 1–3 hari lalu flek bisa sampai ±2 minggu → stop Novia selama flek."}],"kw":["haid","menstruasi","mens","datang bulan","flek","spotting","flek cokelat","flek lama","stop saat haid","minum saat haid","siklus haid","regulasi hormon"]},{"id":187,"q":"Apakah konsumen dengan autoimun yang haidnya berhenti tiba-tiba setelah minum obat mingguan (disebut pencegah kanker) dan kini rutin minum obat pengencer darah serta kolesterol boleh minum Novia?","a":"Tidak disarankan.\n- Interaksi antara obat rutin dan suplemennya terlalu berat.","p":["Novia"],"k":"minum bersama obat/suplemen","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-05-23","n":1,"kasus":[{"d":"2026-05-23","t":"Konsumen autoimun; di usia 51 haid masih lancar, lalu berhenti tiba-tiba setelah minum obat seminggu sekali (disebut pencegah kanker) hingga badan sakit semua; kini rutin minum pengencer darah & kolesterol → jangan."}],"kw":["autoimun","pengencer darah","kolesterol","haid berhenti","obat rutin","interaksi obat","obat pencegah kanker","menopause"]},{"id":188,"q":"Apakah wanita 50 tahun yang rahim dan indung telurnya sudah diangkat, lalu mengalami gejala menopause dini setelah terapi hormonnya dihentikan (karena muncul benjolan di payudara), boleh minum Novia?","a":"Boleh, dengan evaluasi.\n- Boleh dikonsumsi.\n- Tetap evaluasi setelah 2–3 minggu konsumsi Novia.","p":["Novia"],"k":"haid, hormon & menopause","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-05-21","n":1,"kasus":[{"d":"2026-05-21","t":"Wanita 50 tahun, 8 tahun lalu operasi angkat rahim & indung telur (miom dan kista); sempat diresepkan Esthero 0,625 mg tetapi dihentikan 5 tahun lalu karena tumbuh benjolan di payudara; kini hot flush, kulit kering, penurunan fungsi tubuh → boleh, evaluasi 2–3 minggu."}],"kw":["menopause","menopause dini","angkat rahim","histerektomi","angkat indung telur","hot flush","esthero","terapi hormon","benjolan payudara"]},{"id":189,"q":"Apakah wajar jadi susah tidur setelah sekitar seminggu minum Novia? Lanjut atau berhenti dulu?","a":"Boleh distop dulu.\n- Konsumen justru merasakan efek susah tidur, padahal seharusnya sebaliknya.","p":["Novia"],"k":"efek samping & keluhan","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-05-21","n":1,"kasus":[{"d":"2026-05-21","t":"Konsumen minum Novia ±1 minggu, 2–3 hari terakhir susah tidur disertai hot flash dan sakit kepala → stop dulu."}],"kw":["susah tidur","sulit tidur","insomnia","tidur tidak nyenyak","hot flash","sakit kepala","efek samping novia"]},{"id":190,"q":"Apakah penderita hepatitis B (termasuk yang juga punya penyakit jantung) boleh minum DVN, S-Glow, atau Novia?","a":"Pastikan dulu ke dokter yang merawat sebelum konsumsi.\n- Seharusnya tidak ada kontraindikasi, tetapi kondisi hepatitis tiap orang berbeda-beda, begitu juga tingkat keparahannya.\n- Jadi lebih baik dipastikan terlebih dahulu dengan dokternya.\n- Catatan: jawaban lama sempat berbeda — jangan minum DVN dulu karena akan membebani organ hati (menambah kerja metabolisme hati) (2026-01-30, Dr Rizky Nasution); boleh asal diberi jeda waktu dengan obat rutin (2024-05-01, Nutritionist Novrianti); ikuti yang terbaru.","p":["DVN","Novia","S-Glow"],"k":"kondisi medis & penyakit","s":"tergantung","rd":true,"by":["Dr Rizky Nasution","Nutritionist Novrianti"],"d":"2026-05-19","n":3,"kasus":[{"d":"2026-01-30","t":"Satu konsumen dengan penyakit jantung koroner dan virus hepatitis B → jangan minum DVN dulu karena hepatitisnya."}],"kw":["hepatitis b","hepatitis","hep b","liver","hati","organ hati","fungsi hati","penyakit hati","jantung","jantung koroner","sakit jantung","jeda obat"]},{"id":191,"q":"Apakah penderita diabetes (sakit gula) yang sedang minum obat gula dan kolesterol boleh minum DVN?","a":"Boleh, dengan catatan:\n- Pastikan dulu keperluan konsumsinya: DVN bukan obat dan bukan yang utama, hanya sebatas suplemen.\n- Jika mau konsumsi, beri jeda 6 jam dari obat rutinnya.","p":["DVN"],"k":"minum bersama obat/suplemen","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-05-19","n":1,"kasus":[{"d":"2026-05-19","t":"Konsumen sakit gula, rutin minum obat gula & kolesterol → boleh, jeda 6 jam."}],"kw":["diabetes","sakit gula","kencing manis","dm","obat gula","kolesterol","obat kolesterol","jeda 6 jam"]},{"id":192,"q":"Apakah konsumen yang sedang minum Profertil boleh minum Novia? Kapan boleh mulai?","a":"Jangan dulu.\n- Biarkan pengobatan sesuai dosis Profertil dulu; tidak boleh dicampur vitamin ataupun suplemen tambahan.\n- Setelah pengobatan selesai: pastikan tidak ada keluhan lagi, dan amannya tunggu sampai selesai 1 siklus haid normal dulu.","p":["Novia"],"k":"minum bersama obat/suplemen","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-05-18","n":1,"kasus":[{"d":"2026-05-18","t":"Konsumen sedang minum Profertil karena 4 kali siklus haid lebih dari 14 hari → jangan dulu; mulai setelah pengobatan selesai, tanpa keluhan, dan lewat 1 siklus haid normal."}],"kw":["profertil","clomiphene","obat kesuburan","promil","program hamil","haid panjang","siklus haid","obat hormon"]},{"id":193,"q":"Apakah wanita dengan hormon prolaktin tidak seimbang boleh minum Novia, dan apakah Novia bisa membantu?","a":"Boleh dikonsumsi.\n- Soal membantu atau tidak: Novia hanya suplemen, bukan obat utama untuk menaikkan hormon prolaktin.","p":["Novia"],"k":"haid, hormon & menopause","s":"boleh","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-05-17","n":1,"kasus":[],"kw":["prolaktin","hormon prolaktin","prolactin","hormon tidak seimbang","ketidakseimbangan hormon","imbalance hormon"]},{"id":194,"q":"Apakah penderita diabetes (termasuk DM tipe 2 atau pengguna insulin) boleh minum DVN, dan apakah pemanis sukralosanya aman?","a":"Boleh, pada dasarnya tidak ada masalah, dengan catatan:\n- Beri jarak 6 jam dari konsumsi obat rutin diabetes.\n- Jika ada kendala seperti gangguan ginjal dan hati, tidak disarankan minum DVN.\n- Jika konsumen juga pasien kanker yang sedang minum obat kemo, jangan diberi suplemen apa pun.\n- Pemanis DVN adalah sukralosa (bukan gula pasir atau sejenisnya), tidak menaikkan gula darah secara drastis/tidak menimbulkan lonjakan; peringatan 'mengandung pemanis buatan sukralosa' di kemasan bukan larangan, masih dalam batas aman.\n- Penderita diabetes tetap lebih dianjurkan mengatur pola makan dan gaya hidup agar gula darah terkontrol dan tidak terjadi komplikasi, karena diabetes sebenarnya tidak bisa sembuh.","p":["DVN"],"k":"kondisi medis & penyakit","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution","Nutritionist Novrianti"],"d":"2026-05-17","n":4,"kasus":[{"d":"2026-03-31","t":"Diabetes, kaki kiri sudah diamputasi, pakai insulin & Neurobion serta salep wajah → boleh jika tidak ada gangguan ginjal/hati."}],"kw":["diabetes","kencing manis","gula darah","dm","diabetes tipe 2","dm tipe 2","insulin","sukralosa","pemanis buatan","obat diabetes","gangguan ginjal","gangguan hati"]},{"id":195,"q":"Apakah pasien atau penyintas kanker yang masih menjalani pengobatan (kemoterapi, kemo oral, radioterapi, terapi hormon, atau masih rutin minum obat kanker) boleh minum DVN?","a":"Tidak disarankan selama masih dalam pengobatan kanker — utamakan dan selesaikan pengobatannya dulu.\n- Untuk semua pasien kanker yang sedang minum obat kemo (termasuk kemo oral di masa observasi), produk suplemen apa pun jangan diberikan.\n- Jika sedang terapi hormon (mis. kanker payudara ER+), jangan dulu sampai terapinya selesai; jika sedang radioterapi, dahulukan radioterapinya.\n- Fokuskan ke obat kankernya karena itu yang utama; dikhawatirkan ada kontraindikasi, karena ada beberapa obat kanker yang kontraindikasi dengan beberapa vitamin dan suplemen.\n- Kondisi klien dan proses pengobatan (termasuk radiasi) memengaruhi efektivitas kerja zat gizi DVN, sehingga hasilnya tidak sesuai harapan dan butuh waktu lama.\n- Kulit kusam/flek pada pasien yang sedang terapi kanker memang bisa merupakan efek samping obat-obatannya.\n- Catatan: jawaban lama sempat berbeda — konsultasi dulu ke dokter yang merawat/Sp.Onkologi soal kandungan DVN, terutama fish collagen (2024-03-21 & 2024-12-21, Nutritionist Novrianti; 2025-07-12 & 2025-09-16, Dr Rizky Nasution), atau boleh dicoba bila sudah fase maintenance/remisi (dosis obat tidak berubah, tanpa tindakan medis) di bawah kontrol dokter, mulai 1x sehari dengan jeda 1–2 jam setelah obat atau beda waktu makan (2024-06-17, 2024-08-17, 2024-09-16, 2025-07-31, 2025-10-15, Nutritionist Novrianti); ikuti yang terbaru.","p":["DVN","Umum"],"k":"kondisi medis & penyakit","s":"tidak","rd":true,"by":["Dr Rizky Nasution","Nutritionist Novrianti"],"d":"2026-05-17","n":17,"kasus":[{"d":"2024-03-21","t":"Konsumen pasca kemoterapi, kulit kusam, masih wajib minum obat kanker Nolvadex (ditulis 'Novaldex') selama 10 tahun → konsultasi dokter dulu."},{"d":"2024-06-17","t":"Konsumen sudah selesai pengobatan kanker tiroid dan kemoterapi, sekarang hanya obat jalan → cek pantangan, mulai 1x/hari."},{"d":"2024-08-17","t":"Wanita 55 tahun, penyintas kanker payudara, operasi 18 bulan lalu → boleh dicoba di bawah kontrol dokter, beri jarak 1 jam dari obat."},{"d":"2024-09-16","t":"Konsumen leukemia sejak 3 tahun, sudah membaik tapi masih minum Tasigna → di bawah konsultasi dokter, DVN diminum 2 jam setelah obat."},{"d":"2024-12-21","t":"Pasien kanker payudara yang baru akan menjalani kemoterapi → konsultasikan kandungan DVN ke dokter, terutama soal fish collagen."},{"d":"2025-01-07","t":"Konsumen kanker payudara stadium 3A, masih minum obat kanker rutin, mengeluh kulit kusam & flek → jangan dulu, utamakan pengobatan kanker."},{"d":"2025-03-05","t":"Konsumen kanker payudara masih menjalani radioterapi (terapi sinar) → jangan dulu."},{"d":"2025-07-12","t":"Pasien kanker minum Nateran malam hari + OAT merah 4 tablet malam untuk TB kelenjar → konsultasi ke Sp.Onkologi."},{"d":"2025-07-31","t":"Kanker sudah diangkat, hanya minum Lenvima (fase maintenance/remisi) → DVN dengan beda waktu makan dari obat."},{"d":"2025-09-16","t":"Konsumen sedang dalam pengobatan kanker → konsultasi dulu ke dokter yang merawat sebelum minum DVN."},{"d":"2025-10-15","t":"Konsumen pernah kemoterapi kanker payudara dan masih minum obat → boleh bila sudah maintenance, dengan jeda 1–2 jam setelah obat."},{"d":"2026-04-23","t":"Penyintas kanker payudara stadium awal, sedang terapi hormon karena ER+ → jangan DVN sampai terapi selesai."},{"d":"2026-05-17","t":"Penderita kanker payudara masa observasi dengan obat kemo oral → jangan suplemen apa pun."}],"kw":["kanker","cancer","kemoterapi","kemo","kemo oral","radioterapi","radiasi","terapi hormon","obat kanker","penyintas kanker","kanker payudara","kanker serviks"]},{"id":196,"q":"Apakah konsumen yang alergi ikan/ikan laut/seafood (termasuk alergi DNA salmon) boleh minum DVN?","a":"Tidak disarankan.\n- Kolagen DVN adalah kolagen ikan laut (fish/marine collagen); DVN berisi full kolagen (asam amino) ikan laut.\n- Jika memang memiliki alergi terhadap bahan pangan ikan, tidak bisa konsumsi DVN, karena reaksi sistem alergi di tubuh tidak bisa dihindari.\n- Alergi DNA salmon: juga tidak disarankan, dikhawatirkan alerginya muncul.\n- Berisiko: pada yang alergi ikan/seafood, DVN kemungkinan bisa memicu reaksi alergi.","p":["DVN"],"k":"kandungan & keamanan produk","s":"tidak","rd":false,"by":["Dr Rizky Nasution","Nutritionist Novrianti"],"d":"2026-05-17","n":4,"kasus":[{"d":"2025-09-04","t":"Konsumen alergi ikan dan sebelumnya alergi saat minum kolagen lain yang berbahan ikan → tidak bisa minum DVN."}],"kw":["alergi ikan","alergi ikan laut","alergi seafood","alergi salmon","dna salmon","salmon","kolagen ikan","fish collagen","marine collagen","alergi kolagen","alergi","gatal"]},{"id":197,"q":"Apakah S-Glow bisa jadi alternatif untuk konsumen yang alergi DNA salmon (sehingga tidak disarankan minum DVN)?","a":"S-Glow juga mengandung kolagen ikan.\n- Karena itu S-Glow juga tidak disarankan sebagai pengganti DVN untuk konsumen dengan alergi ini.","p":["S-Glow"],"k":"kandungan & keamanan produk","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-05-17","n":1,"kasus":[],"kw":["alergi salmon","dna salmon","kolagen ikan","fish collagen","alergi ikan","pengganti dvn","alternatif","kandungan sglow"]},{"id":198,"q":"Bagaimana menjawab customer yang alergi (leher & muka bengkak, gatal, kulit menebal) setelah minum DVN dan reaksinya masih berlanjut walau sudah berhenti 2 minggu?","a":"Kemungkinan besar ada faktor lain yang memicu alerginya.\n- Jika sudah lama berhenti DVN tetapi alergi masih ada, kemungkinan besar dipengaruhi faktor lain, karena kandungan suplemen berbahan herbal lebih mudah diserap tubuh dan tidak bertahan berhari-hari di dalam tubuh.\n- Perlu dicek ada pemicu lain atau tidak; kondisinya terlihat seperti eksim.\n- Mintakan nomor batch dan foto produk, serta tanyakan apakah DVN diminum bersama teh, susu, obat, atau suplemen lain.\n- Bila customer sangat perlu konsultasi langsung, bisa dijadwalkan via Zoom dengan tim Wellous.","p":["DVN"],"k":"efek samping & keluhan","s":"info","rd":false,"by":["Nutritionist Novrianti","Dr Rizky Nasution"],"d":"2026-05-15","n":1,"kasus":[{"d":"2026-05-15","t":"Konsumen minum DVN 1x1 selama ±5–7 hari, gatal sejak hari ke-2, leher & muka bengkak; dokter menyatakan alergi dan memberi antihistamin + antiinflamasi; sudah stop 2 minggu tetapi kulit leher/muka masih gatal, tebal, kering → kemungkinan faktor lain (tampak seperti eksim)."}],"kw":["alergi","bengkak","muka bengkak","leher bengkak","eksim","eczema","gatal","kulit menebal","komplain","nomor batch"]},{"id":199,"q":"Bagaimana jika rutin minum S-Glow 2x sehari malah jadi berjerawat? Apakah perlu turun dosis?","a":"Turunkan dosis dulu.\n- Minum 2 hari sekali terlebih dahulu agar proses adaptasinya lebih nyaman.\n- Evaluasi lagi setelah 2 minggu: apakah jerawat masih ada atau memberat.\n- Jika masih ada dan memberat, hentikan; bisa saja konsumen intoleran terhadap kandungan S-Glow.","p":["S-Glow"],"k":"efek samping & keluhan","s":"bersyarat","rd":false,"by":["Nutritionist Novrianti","Dr Rizky Nasution"],"d":"2026-05-15","n":1,"kasus":[{"d":"2026-05-15","t":"Konsumen rutin minum S-Glow 2x sehari jadi berjerawat (sebelumnya tidak) → turunkan ke 2 hari sekali, evaluasi 2 minggu."}],"kw":["jerawat","berjerawat","jerawatan","breakout","acne","turun dosis","dosis sglow","intoleran"]},{"id":200,"q":"Apakah konsumen yang pernah operasi tumor rahang (ameloblastoma) dan kini sudah pulih total tanpa obat boleh minum Novia?","a":"Boleh, dengan catatan:\n- Boleh saja dikonsumsi, dengan waktu minum yang dibedakan (saran Nutritionist).\n- Coba mulai dengan dosis rendah dulu.\n- Pastikan sejak awal manfaat yang diharapkan lebih ke kebugaran tubuh dan kesehatan wanita.","p":["Novia"],"k":"pasca operasi & tindakan medis","s":"bersyarat","rd":false,"by":["Nutritionist Novrianti","Dr Rizky Nasution"],"d":"2026-05-15","n":1,"kasus":[{"d":"2026-05-15","t":"Operasi tumor rahang (ameloblastoma) tahun 2013, sekarang sudah pulih total dan tidak minum obat → boleh, mulai dosis rendah."}],"kw":["ameloblastoma","tumor rahang","riwayat tumor","operasi tumor","pasca operasi","dosis rendah","kebugaran"]},{"id":201,"q":"Apakah customer boleh konsultasi langsung dengan tim medis Wellous? Bagaimana caranya?","a":"Boleh, lewat Zoom jika memang sangat perlu.\n- Infokan kapan customer ingin konsultasi, nanti tim Wellous mengirimkan link Zoom-nya.","p":["Umum"],"k":"menjawab customer & lainnya","s":"info","rd":false,"by":["Nutritionist Novrianti"],"d":"2026-05-15","n":1,"kasus":[{"d":"2026-05-15","t":"Customer dengan keluhan alergi setelah minum DVN ingin konsultasi langsung dengan tim medis Wellous → via Zoom."}],"kw":["konsultasi langsung","zoom","tim medis","hotline","nomor hotline","konsul dokter wellous","komplain customer"]},{"id":202,"q":"Apakah S-Glow aman untuk ibu menyusui (busui)?","a":"Tergantung usia bayi yang disusui:\n- Bayi sudah lewat 6 bulan → untuk suplemen dan vitamin sebenarnya tidak ada masalah.\n- Bayi usia 0–6 bulan → harus hati-hati demi keamanan bersama.\n- S-Glow (sama seperti DVN) belum memiliki penelitian khusus pada ibu hamil dan menyusui; secara kandungan tidak ada yang berbahaya, namun keputusan dikembalikan ke konsumen untuk konsultasi ke dokter kandungan.","p":["S-Glow"],"k":"hamil, menyusui & promil","s":"tergantung","rd":true,"by":["Nutritionist Novrianti","Dr Rizky Nasution"],"d":"2026-05-13","n":1,"kasus":[],"kw":["busui","ibu menyusui","menyusui","asi","bayi","laktasi","ibu hamil","dokter kandungan"]},{"id":203,"q":"Kenapa kesehatan konsumen langsung drop (lambung sakit sampai muntah) setelah minum Erojan, dan bagaimana sebaiknya?","a":"Stop Erojan.\n- Dari chat, konsumen tampaknya punya maag kronis dan sedang menjalani pengobatan teratur.\n- Pada maag kronis, efek suplemen maupun vitamin bisa berbeda-beda pada tiap orang.\n- Jika sudah ada keluhan di awal konsumsi, langsung hentikan.","p":["Erojan"],"k":"efek samping & keluhan","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-05-12","n":1,"kasus":[{"d":"2026-05-12","t":"Konsumen dengan sakit lambung kronis (rutin Besanmaag, Montilium, Propepsa, Nexium) memaksakan minum Erojan → lambung sakit, muntah (mengaku sampai masuk RS) → stop Erojan."}],"kw":["maag kronis","maag","lambung","sakit lambung","muntah","gastritis","drop","obat lambung","nexium"]},{"id":204,"q":"Apakah Novia boleh diminum oleh konsumen hampir 50 tahun dengan darah tinggi, kolesterol, pradiabetes, dan asam urat yang sedang minum obat?","a":"Tidak disarankan.\n- Dokter menyarankan jangan konsumsi Novia untuk kondisi ini.","p":["Novia"],"k":"kondisi medis & penyakit","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-05-09","n":1,"kasus":[{"d":"2026-05-09","t":"Konsumen hampir 50 tahun, punya darah tinggi, kolesterol, pradiabetes, dan asam urat, serta minum obat → jangan."}],"kw":["darah tinggi","hipertensi","kolesterol","pradiabetes","prediabetes","asam urat","gout","obat rutin","komorbid"]},{"id":205,"q":"Apakah penderita hipertiroid (termasuk yang hasil labnya sudah normal tetapi masih minum obat dokter) boleh minum Novia?","a":"Jangan dulu / tidak disarankan.\n- Hipertiroid agak sensitif terhadap vitamin dan suplemen lainnya.\n- Fokus ke pengobatan hipertiroidnya dulu sampai selesai, walaupun hasil lab sudah normal tetapi masih minum obat dari dokter.\n- Dikhawatirkan ada kontraindikasi dengan obatnya.","p":["Novia"],"k":"kondisi medis & penyakit","s":"tidak","rd":false,"by":["Nutritionist Novrianti","Dr Rizky Nasution"],"d":"2026-05-08","n":2,"kasus":[{"d":"2026-05-08","t":"Konsumen hipertiroid; hasil sudah normal tetapi masih minum obat dari dokter → jangan dulu."}],"kw":["hipertiroid","hyperthyroid","tiroid","thyroid","kelenjar tiroid","obat tiroid","gondok","kontraindikasi"]},{"id":206,"q":"Apakah konsumen yang masih dalam pengobatan kanker/tumor ganas (mis. kemoterapi termasuk kemo oral, obat kanker, atau tamoxifen) boleh minum Novia?","a":"Jangan dulu / tidak disarankan.\n- Fokus ke pengobatan rutinnya dulu secara teratur.\n- Beberapa obat kanker bereaksi cepat terhadap vitamin ataupun suplemen tambahan.\n- Jika masih minum obat kemo (termasuk kemo oral setelah payudara diangkat), jangan konsumsi Novia; fokus ke kemonya dulu.\n- Selama masih dalam proses penyembuhan (mis. kanker payudara dengan estrogen berlebih/positif progesteron, atau masih rutin minum tamoxifen), stop dan jangan konsumsi Novia dulu; boleh mulai lagi saat sudah dalam kondisi remisi/masa tenang atau masa pemulihan.","p":["Novia"],"k":"kondisi medis & penyakit","s":"tidak","rd":false,"by":["Dr Rizky Nasution","Nutritionist Novrianti"],"d":"2026-05-08","n":5,"kasus":[{"d":"2025-11-28","t":"Cancer survivor yang masih rutin minum Tamofen → jangan minum Novia dulu sampai masa tenang/remisi."},{"d":"2025-12-12","t":"Konsumen 60 tahun, kanker tiroid metastasis ke kelenjar getah bening, masih minum obat kanker, obat radang, dan obat lambung → jangan minum Novia dulu."},{"d":"2026-01-04","t":"Konsumen kanker payudara dengan estrogen berlebih dan positif progesteron, masih proses penyembuhan → stop dulu, mulai lagi saat remisi/pemulihan."},{"d":"2026-05-08","t":"Riwayat kanker payudara, sudah operasi pengangkatan, kemo oral setiap hari sudah 1 tahun (rencana dilanjut hingga 5 tahun) → jangan."}],"kw":["kanker","cancer","tumor ganas","kanker payudara","kanker tiroid","kemoterapi","kemo oral","obat kanker","tamoxifen","estrogen","progesteron","remisi"]},{"id":207,"q":"Vitamin C dalam DVN (dan S-Glow) jenisnya apa — asam askorbat, Ester-C, atau slow release?","a":"Asam askorbat (ascorbic acid), baik di DVN maupun di S-Glow — bukan Ester-C.\n- Vitamin C di DVN: 25 mg per tablet, bukan jenis slow release (yang dipecah perlahan-lahan di lambung).\n- Dengan anjuran 2 tablet per hari, DVN dapat membantu memenuhi kebutuhan harian vitamin C minimal 50 mg.\n- Jika ada gangguan lambung, DVN bisa diminum/dikunyah bersama makanan, terutama protein.","p":["DVN","S-Glow"],"k":"kandungan & keamanan produk","s":"info","rd":false,"by":["Nutritionist Novrianti"],"d":"2026-05-06","n":3,"kasus":[],"kw":["vitamin c","vit c","asam askorbat","ascorbic acid","ester c","ester-c","jenis vitamin c","bentuk vitamin c","slow release","lambung","maag","sglow"]},{"id":208,"q":"Apakah DVN boleh diminum anak/remaja di bawah 18 tahun (mis. usia 14 tahun), dan mulai usia berapa DVN boleh dikonsumsi?","a":"DVN disarankan untuk usia 18 tahun ke atas; untuk anak usia 14 tahun tidak disarankan.\n- Disarankan mulai usia 18–20 tahun; pada usia tersebut dosisnya tetap 2 butir per hari.\n- Target pasar DVN adalah usia 25 tahun ke atas; dari bahan kandungannya aman dikonsumsi usia dewasa.\n- Untuk anak usia 14 tahun (walau hanya 1 tablet sehari) tidak disarankan; sarankan usia 18 tahun ke atas.","p":["DVN"],"k":"usia & kelompok khusus","s":"tidak","rd":false,"by":["Dr Rizky Nasution","Nutritionist Novrianti"],"d":"2026-05-06","n":2,"kasus":[{"d":"2026-05-06","t":"Konsumen ingin memberi DVN 1 tablet/hari untuk anaknya usia 14 tahun → disarankan usia 18 tahun ke atas."}],"kw":["usia minimal","batas usia","umur","usia berapa","anak","anak-anak","remaja","usia 14 tahun","18 tahun","dvn anak","anak muda"]},{"id":209,"q":"Apakah S-Glow aman untuk wanita dengan tumor payudara yang kemoterapinya sudah selesai tetapi masih minum obat lanjutan?","a":"Boleh dicoba dengan evaluasi.\n- Di awal, coba konsumsi S-Glow secara normal sesuai dosis.\n- Evaluasi selama 2–3 minggu; jika muncul kendala atau keluhan, segera konsultasikan kembali.","p":["S-Glow"],"k":"kondisi medis & penyakit","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-05-05","n":1,"kasus":[{"d":"2026-05-05","t":"Wanita 55 tahun, tumor payudara dengan pengobatan 4 tahun (selesai Desember), kemoterapi sudah tuntas dan kini hanya minum obat; dokter sempat menanyakan gangguan hormonal (jawaban via voice note) → boleh coba dosis normal, evaluasi 2–3 minggu."}],"kw":["tumor payudara","kanker payudara","breast cancer","kemoterapi","pasca kemo","survivor","obat lanjutan","evaluasi"]},{"id":210,"q":"Bagaimana jika setelah beberapa hari minum Novia dan DVN bersamaan muncul gatal di area kewanitaan dan keputihan bening?","a":"Jika keluhan masih ada dan terus muncul, jangan konsumsi dulu.\n- Dicurigai ada alergi terhadap salah satu kandungan DVN atau Novia.","p":["DVN","Novia"],"k":"efek samping & keluhan","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-05-02","n":1,"kasus":[{"d":"2026-05-02","t":"Konsumen minum Novia + DVN 6 hari, muncul gatal di vagina & keputihan bening (pertama kali, tanpa riwayat alergi) → bila terus muncul, stop dulu."}],"kw":["gatal vagina","gatal miss v","miss v","gatal kewanitaan","keputihan","keputihan bening","alergi","efek samping"]},{"id":211,"q":"Apakah Novia mengandung bahan yang bisa membuat darah jadi encer?","a":"Tidak signifikan.\n- Dari kandungan dan jumlahnya, Novia tidak akan memengaruhi secara signifikan.\n- Kandungan saffron dan hops memang memberikan efek relaksasi.","p":["Novia"],"k":"kandungan & keamanan produk","s":"info","rd":false,"by":["Nutritionist Novrianti"],"d":"2026-04-29","n":1,"kasus":[],"kw":["pengencer darah","darah encer","pengenceran darah","antikoagulan","saffron","hops","relaksasi","kandungan novia"]},{"id":212,"q":"Berapa lama jeda minum DVN sebelum dan sesudah infus putih (infus whitening)?","a":"Beri jeda 24 jam.\n- Sama seperti aturan vaksin: beri jeda 24 jam sebelum dan sesudah infus putih.","p":["DVN"],"k":"pasca operasi & tindakan medis","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-04-27","n":1,"kasus":[],"kw":["infus putih","infus whitening","infus","whitening","infus glutathione","infus vitamin c","jeda 24 jam"]},{"id":213,"q":"Apakah DVN (dan Novia) boleh diminum sebelum/sesudah vaksin, misalnya vaksin hepatitis atau vaksin HPV?","a":"Boleh, dengan jarak 24 jam (1 hari).\n- Jangan diminum langsung berdekatan dengan vaksin.\n- Beri jarak 24 jam sebelum atau sesudah vaksin; jika baru mau mulai minum DVN setelah vaksin, mulai selang 1 hari.","p":["DVN","Novia"],"k":"pasca operasi & tindakan medis","s":"bersyarat","rd":false,"by":["Nutritionist Novrianti","Dr Rizky Nasution"],"d":"2026-04-27","n":2,"kasus":[],"kw":["vaksin","vaksinasi","imunisasi","suntik vaksin","vaksin hepatitis","vaksin hpv","hpv","hepatitis","kanker serviks","jeda 24 jam","jeda"]},{"id":214,"q":"Apakah penderita autoimun lupus (SLE), termasuk yang juga punya autoimun tiroid, boleh minum DVN atau S-Glow?","a":"Tidak disarankan — saran terbaru dokter: jangan (DVN maupun S-Glow).\n- Kondisi autoimun bisa bereaksi berbeda-beda terhadap vitamin dan suplemen.\n- Catatan: jawaban lama sempat membolehkan — boleh asal jam minum obat SLE dan DVN dibedakan dengan jeda di atas 2 jam (2024-10-02, Dr Rizky Nasution); konsultasikan dulu ke dokter, dan bila tidak ada pantangan/pemicu yang berkaitan dengan bahan DVN bisa mulai 1 kali sehari (2024-06-17, Nutritionist Novrianti); ikuti yang terbaru.","p":["DVN","S-Glow"],"k":"kondisi medis & penyakit","s":"tidak","rd":true,"by":["Dr Rizky Nasution","Nutritionist Novrianti"],"d":"2026-04-26","n":3,"kasus":[],"kw":["lupus","sle","odapus","penyintas lupus","obat lupus","autoimun","autoimmune","tiroid autoimun","hashimoto","graves","thyroid","pemicu"]},{"id":215,"q":"Apakah Novia boleh diminum konsumen yang hasil tes nutrigenomik (berbasis DNA)-nya tidak menyarankan vitamin E dan terapi kesuburan karena berpotensi memicu benjolan?","a":"Ikuti saran hasil tes DNA tersebut (yang tidak menyarankan vitamin E & terapi kesuburan).\n- Jika sudah ada hasil lab terkait DNA, sarannya diikuti saja, karena hasil itu lebih spesifik untuk kondisi konsumen.","p":["Novia"],"k":"kondisi medis & penyakit","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-04-26","n":1,"kasus":[{"d":"2026-04-26","t":"Hasil tes nutrigenomik konsumen tidak menyarankan vitamin E & terapi kesuburan (berpotensi memicu benjolan) → ikuti saran hasil tes tersebut."}],"kw":["tes dna","nutrigenomik","nutrigenomic","tes genetik","hasil lab","vitamin e","terapi kesuburan","benjolan","estrogen"]},{"id":216,"q":"Apakah penderita hepatitis B aman minum Novia?","a":"Tidak disarankan dulu — selesaikan pengobatannya terlebih dahulu.\n- Hepatitis B memengaruhi sistem kerja dan kemampuan organ hati, sehingga pasti banyak pantangannya.\n- Novia tidak sepenuhnya mendukung fungsi hati.\n- Dokter menyetujui penjelasan ini.","p":["Novia"],"k":"kondisi medis & penyakit","s":"tidak","rd":false,"by":["Nutritionist Novrianti","Dr Rizky Nasution"],"d":"2026-04-25","n":1,"kasus":[],"kw":["hepatitis b","hepatitis","hep b","hati","liver","fungsi hati","penyakit hati"]},{"id":217,"q":"Apakah Novia aman diminum oleh konsumen yang rutin minum obat darah tinggi, pengencer darah, dan glukosamin?","a":"Boleh, dengan jarak minum minimal 8 jam.\n- Beri jarak minimal 8 jam antara Novia dan obat-obatannya untuk menghindari interaksi obat dengan suplemen.","p":["Novia"],"k":"minum bersama obat/suplemen","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-04-24","n":1,"kasus":[{"d":"2026-04-24","t":"Konsumen minum obat darah tinggi, pengencer darah, dan glukosamin → Novia diberi jarak minimal 8 jam."}],"kw":["darah tinggi","hipertensi","obat tensi","pengencer darah","antikoagulan","glukosamin","glucosamine","jeda minum","interaksi obat"]},{"id":218,"q":"Apakah wanita yang akhir-akhir ini sering flek di luar jadwal haid boleh mulai minum Novia?","a":"Tunggu fleknya selesai dulu.\n- Mulai Novia setelah flek berhenti, supaya bisa dilacak jika nanti terjadi kendala saat konsumsi Novia.","p":["Novia"],"k":"haid, hormon & menopause","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-04-23","n":1,"kasus":[{"d":"2026-04-23","t":"Konsumen belum pernah minum Novia, akhir-akhir ini kadang flek di luar jadwal haid, tidak sedang dalam pengobatan → mulai setelah flek selesai."}],"kw":["flek","flek di luar haid","spotting","bercak darah","haid tidak teratur","mulai minum","belum konsumsi"]},{"id":219,"q":"Wanita 49 tahun yang haidnya sempat jarang, setelah minum Novia jadi haid 2 kali dalam sebulan (lama dan banyak) — apakah normal dan bagaimana sarannya?","a":"Stop dulu dan evaluasi.\n- Hentikan konsumsi Novia selama 1–2 bulan, lalu evaluasi.\n- Jika masih terkendala dan haid bisa 2–3 kali dalam sebulan, hentikan konsumsi Novia.","p":["Novia"],"k":"haid, hormon & menopause","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-04-22","n":1,"kasus":[{"d":"2026-04-22","t":"Wanita 49 tahun; Januari tidak haid, Februari haid sedikit; setelah minum Novia haid 2x sebulan (9 hari, berhenti 5 hari, lalu haid lagi banyak ≥6 hari) → stop 1–2 bulan & evaluasi."}],"kw":["haid 2 kali sebulan","mens 2x","haid terus","menstruasi tidak teratur","haid banyak","pendarahan","siklus haid","perimenopause"]},{"id":220,"q":"Apakah orang dengan riwayat kanker boleh minum S-Glow? Bagaimana jika masih dalam pengobatan kanker?","a":"Tergantung status pengobatannya:\n- Sudah dinyatakan sembuh oleh dokter yang merawat → silakan, tidak apa-apa.\n- Masih dalam pengobatan kanker → jangan.","p":["S-Glow"],"k":"kondisi medis & penyakit","s":"tergantung","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-04-21","n":1,"kasus":[],"kw":["kanker","riwayat kanker","cancer","penyintas kanker","survivor","pengobatan kanker","kemoterapi","sembuh kanker"]},{"id":221,"q":"Bagaimana jika setelah sekitar seminggu minum DVN 2 tablet per hari, muka dan bibir terasa kering?","a":"Boleh diteruskan dengan catatan:\n- Jika maksudnya 2 tablet per hari, teruskan sampai botol pertama habis.\n- Gunakan perlindungan dari luar (topikal).\n- Tetap perhatikan setiap perubahan kecil yang terjadi.","p":["DVN"],"k":"efek samping & keluhan","s":"bersyarat","rd":false,"by":["Nutritionist Novrianti"],"d":"2026-04-20","n":1,"kasus":[{"d":"2026-04-20","t":"Konsumen minum DVN 2 tablet/hari selama ±1 minggu, muka dan bibir atas kering → teruskan sampai botol pertama habis + perlindungan luar."}],"kw":["kulit kering","muka kering","wajah kering","bibir kering","kering","dry skin","efek samping dvn"]},{"id":222,"q":"Apakah konsumen yang sedang ada gangguan atau peradangan di mulut rahim (serviks) boleh minum Novia?","a":"Tidak disarankan; Novia distop dulu.\n- Dokter menyarankan jangan konsumsi Novia saat sedang ada gangguan di mulut rahim.\n- Selama masih meradang dan masih minum obat-obatan rutin, tidak disarankan minum Novia.\n- Fokus minum obat dulu untuk mengatasi gejala utamanya.","p":["Novia"],"k":"kondisi medis & penyakit","s":"tidak","rd":false,"by":["Dr Rizky Nasution","Nutritionist Novrianti"],"d":"2026-04-17","n":2,"kasus":[{"d":"2026-04-17","t":"Konsumen sedang terkena masalah di mulut rahim (ditulis customer sebagai 'colid') → jangan."}],"kw":["mulut rahim","serviks","leher rahim","cervix","radang mulut rahim","peradangan serviks","servisitis","radang rahim","masalah mulut rahim","gangguan rahim","colid"]},{"id":223,"q":"Apakah EVN boleh dikonsumsi balita/anak kecil? Mulai usia berapa dan berapa dosisnya?","a":"Tidak untuk balita.\n- Rekomendasi Wellous: EVN untuk usia minimal 7 tahun ke atas (walaupun kemasan hanya menulis tidak untuk bayi di bawah 1 tahun).\n- Usia 7–12 tahun: 1 tablet (berat badan normal).\n- Usia 13–17 tahun: 1 tablet bila badannya kecil/mungil, 2 tablet bila berat badan normal.\n- Usia 18 tahun ke atas: 2 tablet.","p":["EVN"],"k":"usia & kelompok khusus","s":"tidak","rd":false,"by":["Nutritionist Novrianti"],"d":"2026-04-16","n":1,"kasus":[{"d":"2026-04-16","t":"Customer menanyakan EVN untuk balita karena kemasan hanya menulis tidak untuk bayi di bawah 1 tahun → tidak; minimal 7 tahun (jawaban awal sempat menyebut minimal 12 tahun, lalu diperjelas dengan tabel dosis di atas)."}],"kw":["balita","anak","anak kecil","bayi","usia minimal","dosis anak","evn anak","umur","kesehatan mata"]},{"id":224,"q":"Apakah DVN dan S-Glow aman untuk penderita autoimun rheumatoid arthritis (RA) yang rutin minum methotrexate dan mengalami fibrosis paru?","a":"Tidak disarankan.\n- Dosis obat rutin konsumen sudah sangat kuat.\n- Untuk berjaga-jaga dari kontraindikasi dengan efek suplemen nantinya.","p":["DVN","S-Glow"],"k":"minum bersama obat/suplemen","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-04-15","n":1,"kasus":[{"d":"2026-04-15","t":"Penderita autoimun RA berstatus remisi, tetapi RA menyerang paru sehingga fibrosis paru sejak 1 tahun (disebut efek methotrexate seminggu sekali dari dokter) → jangan DVN + S-Glow."}],"kw":["autoimun","rheumatoid arthritis","ra","rematik","methotrexate","fibrosis paru","paru-paru","obat autoimun","remisi"]},{"id":225,"q":"Bagaimana jika hasil PSA pria naik tinggi setelah rutin minum Erojan, sementara ia ternyata sedang minum obat prostat?","a":"Jangan konsumsi Erojan dulu.\n- Konsumen sedang minum obat prostat (berarti sedang dalam terapi penyakit prostat), jadi fokus ke terapi obat prostatnya dulu.\n- Untuk kasus serupa, penasihat menanyakan dulu: sudah berapa lama minum Erojan, ada stres/kebiasaan makan baru/gejala lain, usia, kapan terakhir cek PSA, riwayat penyakit organ vital pria, dan obat yang sedang diminum.","p":["Erojan"],"k":"kondisi medis & penyakit","s":"tidak","rd":false,"by":["Dr Rizky Nasution","Nutritionist Novrianti"],"d":"2026-04-13","n":1,"kasus":[{"d":"2026-04-13","t":"Pria 63 tahun, minum Erojan lebih dari 1 tahun, PSA naik menjadi 12 (disebut normalnya 4; cek akhir Maret), ternyata sedang minum obat prostat (silodosin) → stop Erojan, fokus terapi prostat."}],"kw":["psa","psa tinggi","psa naik","prostat","obat prostat","penyakit prostat","silodosin","urief"]},{"id":226,"q":"Apakah wanita dengan perdarahan atau haid berkepanjangan (mis. perdarahan terus-menerus berbulan-bulan, atau haid lama disertai gumpalan darah besar) boleh minum Novia?","a":"Jangan dulu.\n- Jangan minum Novia selama masih ada perdarahan dari area kewanitaan.\n- Konsultasi dan jalani terapi yang teratur dengan dokter terlebih dahulu.\n- Jika keluhan sudah tidak ada, silakan konsumsi Novia secara normal.\n- Pada kasus perdarahan terus-menerus 4 bulan (sudah obat hormon, pil KB, dan IUD tanpa perubahan), dokter menilai konsumen tampaknya mengalami ketidakseimbangan hormon.","p":["Novia"],"k":"haid, hormon & menopause","s":"tidak","rd":true,"by":["Dr Rizky Nasution"],"d":"2026-04-11","n":2,"kasus":[{"d":"2026-01-10","t":"Konsumen perdarahan tidak berhenti 4 bulan (tanpa miom/kista/penebalan, dinding rahim menipis), sudah obat hormon, pil KB, dan IUD tanpa perubahan → jangan minum Novia selama masih perdarahan."},{"d":"2026-04-11","t":"Wanita 38 tahun, ±3 tahun haid berkepanjangan, kadang keluar gumpalan darah sebesar telapak tangan → periksa & terapi ke dokter dulu."}],"kw":["perdarahan","pendarahan","haid berkepanjangan","haid terus-menerus","haid tidak berhenti","mens tidak berhenti","gumpalan darah","darah menggumpal","haid banyak","menorrhagia","ketidakseimbangan hormon","dinding rahim"]},{"id":227,"q":"Apakah DVN bisa menyamarkan bekas luka bakar (misalnya bekas tercelup/tersiram air panas) di tangan?","a":"Sulit diharapkan.\n- Bekas luka bakar seperti pada kasus ini akan sangat susah kembali normal, termasuk untuk menyamarkan warnanya.\n- Alasannya, sel-sel kulit di area tersebut sudah mati dan tidak bisa beregenerasi kembali.","p":["DVN"],"k":"manfaat & hasil","s":"info","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-04-10","n":1,"kasus":[{"d":"2026-04-10","t":"Konsumen dengan bekas luka bakar di tangan akibat tercelup air panas ingin menyamarkannya dengan DVN → sulit kembali normal."}],"kw":["bekas luka","luka bakar","air panas","menyamarkan bekas luka","scar","sel kulit mati","regenerasi kulit"]},{"id":228,"q":"Apakah Erojan aman untuk orang yang punya alergi laktosa?","a":"Aman.\n- Erojan aman dikonsumsi oleh orang dengan alergi laktosa.","p":["Erojan"],"k":"kandungan & keamanan produk","s":"boleh","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-04-09","n":1,"kasus":[],"kw":["alergi laktosa","laktosa","lactose","intoleransi laktosa","susu","kandungan erojan"]},{"id":229,"q":"Apakah Novia punya efek samping negatif untuk penderita fatty liver (perlemakan hati)?","a":"Boleh disarankan; menurut dokter tidak ada efek samping negatif ke arah fatty liver.\n- Minum Novia dengan jeda 1 jam dari obat-obatan atau di waktu makan yang berbeda.\n- Yang mungkin dirasakan: suhu tubuh meningkat atau mual, karena kandungan maca dapat meningkatkan pembakaran energi.","p":["Novia"],"k":"kondisi medis & penyakit","s":"bersyarat","rd":false,"by":["Nutritionist Novrianti","Dr Rizky Nasution"],"d":"2026-04-08","n":1,"kasus":[],"kw":["fatty liver","perlemakan hati","lemak hati","liver","hati","maca","mual","badan panas"]},{"id":230,"q":"Apakah penderita lupus (termasuk yang minum amlodipine dan Ascardia) boleh minum Novia?","a":"Konsultasikan dulu dengan dokter spesialis penyakit dalam (Sp.PD) konsumen.\n- Kondisi tiap pasien lupus berbeda-beda.\n- Penderita lupus harus selektif terhadap konsumsi vitamin dan suplemen.\n- Catatan: jawaban lama (2025-12-08, Dr Rizky Nasution) untuk penderita lupus yang minum amlodipine dan Ascardia sempat menyarankan jangan minum Novia; ikuti yang terbaru.","p":["Novia"],"k":"kondisi medis & penyakit","s":"tergantung","rd":true,"by":["Dr Rizky Nasution"],"d":"2026-04-06","n":2,"kasus":[{"d":"2025-12-08","t":"Penderita lupus, minum amlodipine dan Ascardia → jangan minum Novia."}],"kw":["lupus","sle","autoimun","penyakit autoimun","sp.pd","penyakit dalam","amlodipine","ascardia","aspirin","pengencer darah"]},{"id":231,"q":"Kenapa muncul keluhan seperti jerawat batu di hampir seluruh tubuh setelah 1 minggu minum Novia?","a":"Dari foto, dokter menilai ini lebih ke arah alergi.\n- Alergi bisa terhadap sesuatu hal/bahan/makanan/serangga; bisa jadi terhadap kandungan Novia, dengan catatan keluhan itu pertama kali muncul setelah minum Novia.\n- Jika keluhan makin berat saat minum Novia, boleh distop.\n- Tetap perlu diperiksa dan diobati ke dokter karena kondisi ini memerlukan pengobatan yang benar.\n- Jika memang punya alergi terhadap sesuatu (makanan/cuaca/serangga), keluhan ini berpotensi muncul kembali.","p":["Novia"],"k":"efek samping & keluhan","s":"tergantung","rd":true,"by":["Dr Rizky Nasution"],"d":"2026-04-05","n":1,"kasus":[{"d":"2026-04-05","t":"Konsumen 42 th minum Novia untuk jerawat hormonal; setelah 1 minggu muncul keluhan seperti jerawat batu hampir di seluruh tubuh (pernah dialami sebelum minum Novia) → kemungkinan alergi, periksa ke dokter."}],"kw":["jerawat batu","jerawat","bentol","alergi","jerawat hormonal","ruam","kulit"]},{"id":232,"q":"Apakah penyintas kanker yang sudah menjalani kemoterapi boleh minum Erojan (atau Erojan dan Coffiyy)?","a":"Boleh dicoba dengan catatan:\n- Diminum setelah kemoterapi selesai (setelah efek kemoterapinya hilang) dan di bawah konsultasi dokter.\n- Jika ingin Erojan dan Coffiyy, pilih 1 produk dulu, jangan langsung keduanya.\n- Evaluasi selama 1–2 minggu setelah awal pemakaian.\n- Pastikan kondisi konsumen aman dan nyaman, tidak ada keluhan sakit sebelumnya.\n- Erojan adalah obat tradisional dari tanaman yang bermanfaat menjaga stamina dan mendukung asupan nutrisi sehari-hari, bukan obat yang menyembuhkan secara tiba-tiba.","p":["Erojan","Coffiyy"],"k":"pasca operasi & tindakan medis","s":"bersyarat","rd":true,"by":["Dr Rizky Nasution","Nutritionist Novrianti"],"d":"2026-04-05","n":2,"kasus":[{"d":"2025-08-25","t":"Sudah kemoterapi 12 kali selama 1 tahun → Erojan setelah efek kemoterapi hilang, dengan konsultasi dokter."},{"d":"2026-04-05","t":"Usia 48, riwayat kanker lidah, sudah kemoterapi, tidak ada keluhan lain, ingin Erojan dan Coffiyy → mulai 1 produk dulu, evaluasi 1–2 minggu."}],"kw":["kemoterapi","kemo","pasca kemo","kanker","cancer","survivor kanker","penyintas kanker","kanker lidah","riwayat kanker","konsultasi dokter"]},{"id":233,"q":"Apakah minum Novia bisa menyebabkan anemia?","a":"Tidak.\n- Kalau suatu produk menyebabkan anemia, produk itu sudah tidak boleh diedarkan.","p":["Novia"],"k":"efek samping & keluhan","s":"info","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-04-05","n":1,"kasus":[],"kw":["anemia","kurang darah","hb rendah","hemoglobin","darah rendah","efek samping"]},{"id":234,"q":"Berapa kandungan biotin dalam S-Glow, dan kenapa jumlahnya sebanyak itu?","a":"Biotin di S-Glow berasal dari yeast; totalnya sekitar 1% dari jumlah yeast dalam S-Glow.\n- Yeast adalah sumber vitamin B kompleks, salah satunya biotin.\n- Untuk mendukung kesehatan dan pertumbuhan rambut, bukan hanya biotin yang berperan, tetapi juga kolagen, vitamin C, dan yeast (B kompleks).","p":["S-Glow"],"k":"kandungan & keamanan produk","s":"info","rd":false,"by":["Nutritionist Novrianti"],"d":"2026-04-04","n":1,"kasus":[],"kw":["biotin","vitamin b7","yeast","ragi","vitamin b kompleks","kolagen","kandungan","rambut"]},{"id":235,"q":"Apakah Novia boleh diminum setelah suntik KB?","a":"Boleh, dengan catatan:\n- Beri jeda lebih dari 1 hari setelah suntik KB sebelum minum Novia.","p":["Novia"],"k":"minum bersama obat/suplemen","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-04-03","n":1,"kasus":[],"kw":["suntik kb","kb suntik","kb 3 bulan","kontrasepsi","kb","jeda"]},{"id":236,"q":"Apakah benar Coffiyy menurunkan tekanan darah karena mengandung vasodilator?","a":"Sepertinya itu informasi yang keliru.\n- Kafein dan ginseng (dalam Coffiyy) sifatnya melancarkan peredaran darah.\n- Cari tahu dulu konsumen mendapatkan informasi tersebut dari mana/seperti apa.","p":["Coffiyy"],"k":"kandungan & keamanan produk","s":"info","rd":false,"by":["Nutritionist Novrianti","Dr Rizky Nasution"],"d":"2026-04-02","n":1,"kasus":[],"kw":["vasodilator","menurunkan tekanan darah","tensi turun","kafein","ginseng","peredaran darah","info keliru"]},{"id":237,"q":"Apakah konsumen dengan riwayat kanker usus (minum Diamicron, Forzet, dan pereda nyeri) boleh minum DVN?","a":"Boleh, dengan catatan:\n- Minum DVN tepat setelah makan.\n- Karena ada riwayat masalah lambung, dikhawatirkan sensitif terhadap vitamin C dan antioksidan dalam DVN.\n- Pastikan kondisi asam lambungnya dalam keadaan aman.","p":["DVN"],"k":"kondisi medis & penyakit","s":"bersyarat","rd":false,"by":["Nutritionist Novrianti","Dr Rizky Nasution"],"d":"2026-03-29","n":1,"kasus":[{"d":"2026-03-29","t":"Riwayat kanker usus; minum Diamicron (gula), Forzet (trigliserida), dan pereda nyeri saat perut kambuh → boleh, tepat setelah makan."}],"kw":["kanker usus","kanker kolon","kanker","lambung","asam lambung","diamicron","forzet","diabetes"]},{"id":238,"q":"Kenapa tenggorokan tidak nyaman sampai batuk setelah DVN dan Novia diminum dengan cara dihisap seperti permen?","a":"Kemungkinan karena cara minumnya yang dihisap.\n- Novia disarankan ditelan langsung, sedangkan DVN disarankan dikunyah.\n- Tidak ada interaksi negatif antara DVN dan Novia.\n- Saat dihisap, yang terasa di awal adalah pemanisnya.","p":["DVN","Novia"],"k":"cara minum & dosis","s":"info","rd":false,"by":["Nutritionist Novrianti"],"d":"2026-03-28","n":1,"kasus":[{"d":"2026-03-28","t":"Minum DVN dan Novia dengan cara dihisap selama 4–5 hari, tenggorokan tidak nyaman & batuk."}],"kw":["dihisap","dikunyah","ditelan","cara minum","tenggorokan gatal","batuk","interaksi"]},{"id":239,"q":"Apakah normal air kencing berubah warna (kemerahan) setelah minum Novia?","a":"Lumrah; urine berwarna setelah minum obat atau vitamin adalah hal biasa.\n- Warna itu adalah sisa dari proses tubuh dalam menyerap bahan yang terkandung di dalamnya.\n- Jangan lupa tetap minum air putih yang banyak setelah minum suplemen.","p":["Novia"],"k":"efek samping & keluhan","s":"info","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-03-25","n":1,"kasus":[{"d":"2026-03-25","t":"Konsumen Novia (tanpa riwayat penyakit lain, hanya minum obat kolesterol) mengeluh air kencing berubah merah setelah minum Novia → lumrah, perbanyak air putih."}],"kw":["urine merah","air kencing merah","warna urine","kencing berwarna","urine berubah warna","air putih"]},{"id":240,"q":"Apakah kapsul Erojan mengandung gelatin hewani?","a":"Tidak, kapsul Erojan adalah kapsul vegan.\n- Seperti Novia, Erojan juga memakai vegan capsule.","p":["Erojan"],"k":"kandungan & keamanan produk","s":"info","rd":false,"by":["Nutritionist Novrianti"],"d":"2026-03-25","n":1,"kasus":[],"kw":["gelatin","gelatin hewani","kapsul vegan","kapsul nabati","vegan","vegetarian"]},{"id":241,"q":"Apakah bau tidak sedap saat buang air kecil disebabkan oleh Novia, dan bagaimana sarannya?","a":"Hal yang biasa; bisa diatasi dengan banyak minum air putih.\n- Sama seperti saat minum vitamin C dan beberapa jenis obat.\n- Perbanyak minum air putih setelah minum Novia.\n- Jika konsumen merasa tidak nyaman, boleh distop.","p":["Novia"],"k":"efek samping & keluhan","s":"tergantung","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-03-24","n":1,"kasus":[{"d":"2026-03-24","t":"±2 minggu minum Novia jam 19.30; 3–4 jam kemudian urine berbau tidak sedap setiap hari (tetap ada walau sudah tidak puasa) → hal biasa, perbanyak air putih."}],"kw":["bau urine","air kencing bau","bau pesing","bak bau","buang air kecil","air putih"]},{"id":242,"q":"Apakah aman tiba-tiba mengganti jam minum Novia (mis. dari setelah buka puasa ke setelah makan biasa)?","a":"Aman, tidak ada masalah.\n- Perubahan jam ini hanya butuh adaptasi 1 hari.","p":["Novia"],"k":"cara minum & dosis","s":"boleh","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-03-24","n":1,"kasus":[{"d":"2026-03-24","t":"Saat puasa diminum setelah berbuka, ingin pindah ke setelah makan; khawatir hormon harus adaptasi lagi → tidak masalah."}],"kw":["ganti jam minum","jam minum","waktu minum","puasa","buka puasa","adaptasi hormon"]},{"id":243,"q":"Apakah S-Glow bisa menyebabkan haid tidak berhenti dan rambut makin rontok?","a":"Sarankan stop S-Glow.\n- Seharusnya nutrisi S-Glow justru membantu mencegah kerontokan rambut; menurut bacaan nutritionist, kolagen dan sistein dapat membantu meregulasi siklus menstruasi.\n- Jika yang terjadi sebaliknya, dokter curiga konsumen punya riwayat alergi terhadap salah satu kandungan S-Glow.\n- Efek sebaliknya ini jarang terjadi; bisa juga terkait riwayat genetik atau riwayat penyakit yang tidak disadari konsumen.","p":["S-Glow"],"k":"efek samping & keluhan","s":"tidak","rd":false,"by":["Dr Rizky Nasution","Nutritionist Novrianti"],"d":"2026-03-17","n":1,"kasus":[{"d":"2026-03-17","t":"Seminggu minum S-Glow: haid tidak berhenti & rambut makin rontok; saat distop haid berhenti, diminum lagi keluar lagi → stop."}],"kw":["haid tidak berhenti","haid terus","haid berkepanjangan","menstruasi","rambut rontok","alergi","kolagen","sistein"]},{"id":244,"q":"Apakah minum Novia bisa membuat urine dikerubungi semut?","a":"Tidak ada korelasinya dengan minum Novia.\n- Novia juga tidak berkaitan dengan penyakit lain seputar saluran kencing.\n- Perlu dicek hal lain: apakah toilet tidak dibilas, setelah dipakai orang lain tidak dibilas, atau toiletnya kurang bersih.","p":["Novia"],"k":"efek samping & keluhan","s":"info","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-03-13","n":1,"kasus":[{"d":"2026-03-13","t":"Konsumen 62 th melihat banyak semut di toilet/urine setelah minum Novia → tidak ada hubungannya dengan Novia."}],"kw":["semut","kencing dikerubungi semut","air kencing","urine","toilet","saluran kencing"]},{"id":245,"q":"Apakah Novia memengaruhi tekanan darah atau menyebabkan pusing/kliyengan pada penderita hipertensi (usia 62)?","a":"Menurut dokter, Novia tidak berefek ke tekanan darah.\n- Kecuali tekanan darah konsumen sehari-hari memang tidak stabil dan sering naik-turun, sehingga terasa seolah-olah efek dari Novia.\n- Pastikan juga makanan dan minuman konsumen setiap hari sudah sesuai anjuran untuk pasien hipertensi.","p":["Novia"],"k":"efek samping & keluhan","s":"info","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-03-13","n":1,"kasus":[{"d":"2026-03-13","t":"Konsumen 62 th dengan hipertensi ringan sejak Covid (obat sering diganti), minum Novia untuk stamina & sulit tidur, mengeluh pusing/kliyengan → dokter: Novia tidak berefek ke tensi."}],"kw":["hipertensi","darah tinggi","tensi","pusing","kliyengan","tekanan darah","lansia"]},{"id":246,"q":"Apakah Novia bisa dikonsumsi vegan — kapsulnya terbuat dari apa?","a":"Kapsul Novia terbuat dari tumbuhan (vegetarian friendly).\n- Ini salah satu nilai plus Novia.","p":["Novia"],"k":"kandungan & keamanan produk","s":"info","rd":false,"by":["Nutritionist Novrianti"],"d":"2026-03-12","n":1,"kasus":[],"kw":["vegan","vegetarian","kapsul","kapsul nabati","kapsul tumbuhan","gelatin"]},{"id":247,"q":"Kenapa rambut terasa makin rontok saat disisir setelah minum S-Glow?","a":"Kemungkinan ada faktor lain, terutama proses penuaan.\n- Kemungkinan terbesar akar rambut sudah tidak kuat dan masa pelepasan rambut lebih panjang akibat proses aging; rambut basah lebih lemah, jadi jangan disisir kasar.\n- Kalau rontok terjadi saat rambut kering, perlu dicek kondisi akar rambutnya dan perlu treatment lain untuk masalah akar rambut.\n- Kekurangan keratin terjadi secara fisiologis sejak usia 45 tahun; pada sebagian orang kerontokan bisa terjadi signifikan pada satu waktu sehingga membuat syok, dan hal ini tidak bisa dipastikan sama untuk semua orang.\n- Jika curiga keluhannya akibat S-Glow, silakan distop dulu.","p":["S-Glow"],"k":"efek samping & keluhan","s":"tergantung","rd":false,"by":["Dr Rizky Nasution","Nutritionist Novrianti"],"d":"2026-03-09","n":1,"kasus":[{"d":"2026-03-09","t":"Usia 55 th, tanpa riwayat alergi, rambut makin rontok saat disisir (rambut kering) setelah minum S-Glow → faktor aging; stop bila curiga dari S-Glow."}],"kw":["rambut rontok","rontok","disisir","akar rambut","keratin","penuaan","aging"]},{"id":248,"q":"Apakah S-Glow aman untuk pria autis usia 23 tahun yang rambutnya mulai rontok di bagian tengah kepala?","a":"Boleh.\n- Minum sesuai dosis.","p":["S-Glow"],"k":"usia & kelompok khusus","s":"boleh","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-03-08","n":1,"kasus":[{"d":"2026-03-08","t":"Pria 23 th dengan autisme, rambut di tengah kepala mulai rontok → boleh sesuai dosis."}],"kw":["autis","autisme","berkebutuhan khusus","rambut rontok","rontok","kebotakan","pria"]},{"id":249,"q":"Kenapa setelah 3 minggu minum Novia (usia 48) payudara kadang terasa keras dan muncul jerawat, sementara haid belum lancar — lanjut atau stop?","a":"Bisa karena proses adaptasi tubuh; lanjutkan jika konsumen nyaman, stop jika tidak.\n- Payudara keras & jerawat: ada proses adaptasi tubuh terhadap penyerapan suplemen kewanitaan karena berhubungan dengan reaksi hormonal; lamanya berbeda tiap orang, bisa 4 minggu atau lebih.\n- Haid tidak teratur, cairan Miss V berkurang, dan gejala kulit wajah adalah gejala umum masa menopause; di usia 48 ini proses alami yang tidak bisa dihentikan, jadi wajar.\n- Novia adalah suplemen tambahan, bukan obat untuk keluhan-keluhan tersebut.\n- Boleh dilanjutkan jika konsumen merasa nyaman dengan efeknya; jika tidak, boleh distop.","p":["Novia"],"k":"efek samping & keluhan","s":"tergantung","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-03-07","n":1,"kasus":[{"d":"2026-03-07","t":"Wanita 48 th, 3 minggu minum Novia untuk siklus tidak teratur & Miss V kering; Miss V membaik tapi payudara kadang keras, muncul jerawat, haid belum lancar → adaptasi hormonal, lanjut bila nyaman."}],"kw":["payudara keras","payudara kencang","jerawat","jerawatan","menopause","haid tidak teratur","miss v kering","adaptasi hormon"]},{"id":250,"q":"Apakah penderita hipertensi (darah tinggi) boleh minum Coffiyy?","a":"Tidak disarankan.\n- Coffiyy harus dikonsumsi secara bijak.\n- Untuk penderita hipertensi, dokter menyarankan jangan minum Coffiyy karena dikhawatirkan menambah tekanan darah.\n- Catatan: jawaban lama (2025-12-02, Nutritionist Novrianti; 2026-01-22, Dr Rizky Nasution) sempat menyarankan boleh asal diminum sesuai kebutuhan (tidak rutin) dan konsumen dijelaskan gejala yang mungkin muncul (pusing, deg-degan, mual); ikuti yang terbaru.","p":["Coffiyy"],"k":"kondisi medis & penyakit","s":"tidak","rd":false,"by":["Dr Rizky Nasution","Nutritionist Novrianti"],"d":"2026-03-06","n":3,"kasus":[{"d":"2025-12-02","t":"Konsumen 73 tahun dengan hipertensi, asam urat, kolesterol, rutin amlodipine → Coffiyy sesekali saja dan jelaskan kemungkinan pusing/deg-degan/mual."},{"d":"2026-01-22","t":"Usia 54 th, hipertensi, hanya minum susu Cadio Sure → boleh asal tidak rutin dan konsumen paham gejala yang mungkin muncul."}],"kw":["hipertensi","darah tinggi","asam urat","kolesterol","amlodipine","lansia","deg-degan","pusing","tensi tinggi","tekanan darah","kopi","kafein"]},{"id":251,"q":"Apakah customer epilepsi (kambuh tiap sesudah haid & masa subur) yang minum carbamazepine, clobazam, dan levetiracetam 3x sehari aman minum Novia?","a":"Aman.\n- Menurut dokter, tidak ada kontraindikasi terhadap kondisinya.","p":["Novia"],"k":"kondisi medis & penyakit","s":"boleh","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-03-01","n":1,"kasus":[{"d":"2026-03-01","t":"Epilepsi yang kambuh setiap sesudah haid & masa subur (kata dokternya karena hormon naik), minum carbamazepine, clobazam, levetiracetam 3x/hari → aman."}],"kw":["epilepsi","ayan","kejang","carbamazepine","clobazam","levetiracetam","obat epilepsi"]},{"id":252,"q":"Kenapa flek hitam di wajah muncul atau justru bertambah setelah rutin minum DVN, dan apa sarannya?","a":"Bisa karena banyak faktor; sarannya tergantung riwayat konsumen:\n- Flek yang muncul tiba-tiba dan berlebih bisa disebabkan gangguan hormon, penggunaan skincare yang salah, alergi, atau kondisi luka yang muncul kembali.\n- Jika sebelumnya memakai skincare/krim pemutih atau treatment pemudar flek yang menahan melanin secara agresif lalu dihentikan → melanin muncul kembali/lebih agresif sehingga flek bertambah; memperbaikinya butuh waktu lama.\n- Pada kondisi itu: tetap lanjutkan DVN, tetap pakai perlindungan luar seperti biasa (sunscreen, pelembap, dll.), dan pemakaian krim pemutih dilepas perlahan.\n- Jika tidak ada riwayat di atas → stop dulu sekitar 2
