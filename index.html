minggu untuk detoks dari semua suplemen dan produk yang digunakan.","p":["DVN"],"k":"efek samping & keluhan","s":"tergantung","rd":false,"by":["Nutritionist Novrianti"],"d":"2026-02-27","n":3,"kasus":[{"d":"2024-12-29","t":"Konsumen merasa sebelumnya tidak ada flek, setelah minum DVN muncul flek, jerawat masih muncul dan warna kulit belum berubah → kemungkinan efek berhenti dari skincare yang menahan melanin; tetap pakai sunscreen dan pelembap."},{"d":"2025-12-08","t":"Konsumen 33 tahun, sehat, tidak KB, tanpa treatment flek, 3 bulan minum DVN: minyak wajah berkurang tapi flek bertambah → stop semua suplemen dan produk ±2 minggu."},{"d":"2026-02-27","t":"Wanita 40 th, 2 bulan rutin DVN + sunscreen; bulan 1 flek tipis & kulit cerah, bulan 2 flek parah → kemungkinan efek berhenti krim pemutih."}],"kw":["flek","flek hitam","flek bertambah","flek makin parah","melasma","hiperpigmentasi","melanin","krim pemutih","berhenti skincare","skincare","sunscreen","rebound"]},{"id":253,"q":"Kenapa tablet DVN berubah warna padahal penyimpanan sudah benar, masih ada silica gel, dan belum expired?","a":"Kemungkinan besar karena faktor penyimpanan:\n- Suhu penyimpanan yang berubah-ubah.\n- Tutup botol tidak tertutup rapat sehingga udara masuk dan menyebabkan oksidasi.\n- Area penyimpanan basah dan lembap.\n- Atau terjadi kontaminasi.","p":["DVN"],"k":"kandungan & keamanan produk","s":"info","rd":false,"by":["Nutritionist Novrianti"],"d":"2026-02-23","n":1,"kasus":[{"d":"2026-02-23","t":"Tablet DVN tampak berubah warna (merah kecokelatan) padahal exp masih 2027 dan masih ada silica gel di dalam botol."}],"kw":["berubah warna","tablet berubah","oksidasi","penyimpanan","lembap","silica gel","kualitas produk"]},{"id":254,"q":"Apakah pasien TBC boleh minum Novia?","a":"Tidak disarankan selama masih dalam pengobatan rutin.\n- Novia jangan dikonsumsi dulu selama pasien masih menjalani pengobatan rutin.\n- Disampaikan nutritionist saat dokter sedang training, berdasarkan hal yang sudah dibahas sebelumnya.","p":["Novia"],"k":"kondisi medis & penyakit","s":"tidak","rd":false,"by":["Nutritionist Novrianti"],"d":"2026-02-19","n":1,"kasus":[],"kw":["tbc","tb","tuberkulosis","flek paru","paru-paru","obat tbc","oat"]},{"id":255,"q":"Apakah DVN bisa menyebabkan gusi bengkak?","a":"DVN sebenarnya tidak berefek ke pembengkakan gusi.\n- Penyebab gusi bengkak bisa bermacam-macam: infeksi gigi (virus, bakteri, jamur), efek makanan dan minuman, penumpukan plak, kekurangan vitamin C dan B, serta perubahan hormonal.\n- Pastikan dulu ke konsumen: apakah memang setiap kali minum DVN gusinya bengkak, atau ada faktor lain yang terjadi bersamaan.","p":["DVN"],"k":"efek samping & keluhan","s":"info","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-02-17","n":1,"kasus":[],"kw":["gusi bengkak","radang gusi","gusi","gigi","plak","infeksi gigi","efek samping"]},{"id":256,"q":"Kenapa kulit satu badan jadi kusam dan bercak setelah minum DVN bersama S-Glow?","a":"Stop DVN dulu.\n- Dokter mencurigai alergi terhadap salah satu bahan (ingredients) DVN.\n- Pada kasus ini kulit membaik setelah DVN & S-Glow dihentikan.\n- Dokter hanya menyebut DVN; S-Glow tidak dibahas terpisah.","p":["DVN","S-Glow"],"k":"efek samping & keluhan","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-02-14","n":1,"kasus":[{"d":"2026-02-14","t":"Wanita 46 th, ±2 minggu minum DVN + S-Glow, badan kusam & bercak; membaik setelah stop → stop DVN, curiga alergi."}],"kw":["kusam","bercak","alergi","kulit gelap","flek","iritasi","efek samping"]},{"id":257,"q":"Apakah Novia boleh diminum terus-menerus jangka panjang, atau perlu dijeda?","a":"Bisa dijeda; Novia diminum seperlunya, tidak rutin terus-menerus.\n- Novia adalah suplemen, bukan obat rutin.\n- Prinsip konsumsinya: tidak dikonsumsi rutin, namun seperlunya.\n- Dokter tidak memberi patokan lama jeda tertentu (mis. 3 bulan minum lalu jeda 1–2 minggu seperti info dari internet).","p":["Novia"],"k":"cara minum & dosis","s":"info","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-02-13","n":1,"kasus":[],"kw":["jangka panjang","jeda","minum terus","berhenti sementara","rutin","lama konsumsi","hormonal"]},{"id":258,"q":"Apakah konsumen dengan masalah prostat boleh minum Erojan yang mengandung Tribulus terrestris — apakah bisa memperparah prostatnya?","a":"Tergantung sudah terdiagnosa kanker prostat atau belum:\n- Belum terdiagnosa kanker prostat (tujuan menjaga/pencegahan) → silakan minum Erojan.\n- Sudah terdiagnosa kanker prostat → ikuti anjuran dokter yang menangani konsumen, karena dokter melihat langsung kondisi pasien saat memeriksa.\n- Menurut penelitian klinis, Tribulus terrestris berefek mengurangi risiko kanker prostat; efeknya pada yang sudah terdiagnosa kanker prostat belum ada penelitian klinisnya.\n- Tribulus terrestris punya efek antiinflamasi dan diuretik, sehingga berperan mengurangi gejala ke arah kanker prostat.","p":["Erojan"],"k":"kondisi medis & penyakit","s":"tergantung","rd":true,"by":["Dr Rizky Nasution"],"d":"2026-02-12","n":1,"kasus":[{"d":"2026-02-12","t":"Calon konsumen khawatir Erojan memperparah prostatnya (katanya bila sudah ada pembesaran prostat tidak boleh produk ber-Tribulus) → dokter membedakan pencegahan vs sudah terdiagnosa kanker prostat; pembesaran prostat tidak dibahas khusus."}],"kw":["prostat","kanker prostat","pembesaran prostat","bph","tribulus terrestris","tribulus","diuretik"]},{"id":259,"q":"Apakah penderita pengentalan darah (termasuk yang juga punya hipertensi) boleh minum DVN?","a":"Boleh/aman, dengan catatan:\n- Mulai dari 1 butir per hari dulu, untuk memastikan tidak ada efek samping.\n- Jam minum DVN dibedakan (tidak bersamaan) dengan obat-obatannya.","p":["DVN"],"k":"kondisi medis & penyakit","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-02-11","n":2,"kasus":[],"kw":["pengentalan darah","darah kental","kekentalan darah","pembekuan darah","trombosis","hiperkoagulasi","hipertensi","darah tinggi","sakit lutut","nyeri lutut","jeda minum obat"]},{"id":260,"q":"Kenapa muncul mual dan pusing setelah 2 hari minum Novia (diminum setelah makan siang)?","a":"Bisa jadi efek samping Novia; sebaiknya distop.\n- Kemungkinan dari salah satu bahan (ingredients) Novia.\n- Mungkin bereaksi dengan asam lambung konsumen sehingga muncul mual dan pusing.\n- Kalau keluhan tetap ada, berarti konsumen tidak bisa minum Novia; saran dokter distop saja supaya efeknya tidak berkepanjangan.","p":["Novia"],"k":"efek samping & keluhan","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-02-10","n":1,"kasus":[{"d":"2026-02-10","t":"Baru 2 hari minum Novia setelah makan siang jam 2, muncul mual lalu pusing → stop."}],"kw":["mual","pusing","eneg","asam lambung","maag","sakit kepala","efek samping"]},{"id":261,"q":"Obat rutin apa yang tidak cocok diminum bersama Coffiyy?","a":"Obat untuk melancarkan peredaran darah.\n- Konsumen yang rutin minum obat jenis ini tidak cocok minum Coffiyy.","p":["Coffiyy"],"k":"minum bersama obat/suplemen","s":"info","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-02-09","n":1,"kasus":[],"kw":["obat peredaran darah","melancarkan peredaran darah","pengencer darah","interaksi obat","obat rutin","kopi"]},{"id":262,"q":"Apakah pria yang baru berhenti injeksi testosteron boleh langsung minum Erojan?","a":"Boleh, tidak ada masalah.\n- Silakan langsung dilanjutkan dengan Erojan.","p":["Erojan"],"k":"minum bersama obat/suplemen","s":"boleh","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-02-09","n":1,"kasus":[],"kw":["testosteron","injeksi testosteron","suntik testosteron","terapi hormon pria","hormon pria","trt"]},{"id":263,"q":"Apakah Coffiyy aman untuk penderita diabetes (gula darah tinggi), dan berapa kandungan gulanya?","a":"Aman, selama konsumen tidak sedang minum obat rutin.\n- Dokter memastikan dulu bahwa konsumen tidak mengonsumsi obat-obatan rutin.\n- Jika minum obat rutin: obat yang tidak cocok dengan Coffiyy adalah obat untuk melancarkan peredaran darah.\n- Kadar gula Coffiyy tidak berlebihan dan hanya sebagai penambah rasa: sekitar 10% dari 3 gram, yaitu ±300 mg.","p":["Coffiyy"],"k":"kondisi medis & penyakit","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution","Nutritionist Novrianti"],"d":"2026-02-09","n":2,"kasus":[],"kw":["diabetes","gula darah","kencing manis","dm","kandungan gula","kadar gula","pemanis","gula tinggi","kopi","obat rutin"]},{"id":264,"q":"Apakah customer dengan hiperagregasi trombosit (darah kental) boleh minum Novia?","a":"Boleh, dengan catatan:\n- Konsumen tetap minum obat-obatannya secara teratur.\n- Beri jarak 3–5 jam antara Novia dan obat rutin untuk menghindari efek samping interaksi obat (jawaban awal nutritionist menyebut jeda 1–2 jam, lalu dokter memberi patokan 3–5 jam).\n- Tetap di bawah kontrol dan pengawasan.","p":["Novia"],"k":"kondisi medis & penyakit","s":"bersyarat","rd":false,"by":["Nutritionist Novrianti","Dr Rizky Nasution"],"d":"2026-02-06","n":1,"kasus":[{"d":"2026-02-06","t":"Customer hiperagregasi trombosit (darah kental) dengan obat rutin → boleh, jeda 3–5 jam dari obat."}],"kw":["hiperagregasi trombosit","darah kental","pengentalan darah","trombosit","pengencer darah","jeda obat","interaksi obat"]},{"id":265,"q":"Apakah penderita penyakit tiroid (hipertiroid, hipotiroid, atau yang rutin minum obat tiroid seperti levotiroksin) boleh minum DVN?","a":"Tidak disarankan — saran terbaru dokter: penderita tiroid jangan minum DVN.\n- Untuk penderita tiroid ada kontraindikasinya.\n- Fokuskan dulu ke konsumsi obat hormonal untuk tiroidnya.\n- Kondisi hipertiroid sangat sensitif terhadap obat-obatan maupun vitamin.\n- Catatan: jawaban lama sempat lebih longgar — boleh selama tidak ada pantangan/makanan yang dibatasi, atau untuk mendukung perawatan wajah (2024-03-16 & 2024-05-03, Nutritionist Novrianti); boleh 2x sehari bagi pengguna levotiroksin dengan pantangan kol/kubis, selada, kembang kol, sawi, pakcoy, keju (2024-07-30, Nutritionist Novrianti); boleh dengan jeda di atas 2 jam dari obat rutin (2024-10-08, Dr Rizky Nasution, kasus autoimun radang sendi + hipertiroid) atau setidaknya 6 jam dari obat hipotiroid asal tidak alergi bahan DVN (2025-07-13, Dr Rizky Nasution); konsultasi dulu ke dokter yang merawat (2024-10-16, Dr Rizky Nasution); penasihat juga sempat belum menemukan literatur soal hipertiroid (2024-03-25, Nutritionist Novrianti); ikuti yang terbaru.","p":["DVN"],"k":"kondisi medis & penyakit","s":"tidak","rd":true,"by":["Dr Rizky Nasution","Nutritionist Novrianti"],"d":"2026-01-31","n":9,"kasus":[{"d":"2024-05-03","t":"Konsumen dengan tiroid (26 tahun) dan hipokalemia (9 tahun), berobat ke dokter dan perawatan wajah; penyakit belum sembuh, beruntusan sudah berkurang → boleh untuk mendukung perawatan wajah."},{"d":"2024-07-30","t":"Konsumen sakit tiroid, rutin minum levotiroksin, pantangan kol/kubis dan sejenisnya serta keju → DVN boleh 2x sehari."},{"d":"2024-10-08","t":"Konsumen autoimun dengan radang persendian dan hipertiroid → boleh, tetap dalam pengawasan obat rutin dan beri jeda di atas 2 jam."},{"d":"2026-01-31","t":"Konsumen punya penyakit tiroid dan vertigo → jangan minum DVN (kontraindikasi untuk tiroid)."}],"kw":["tiroid","thyroid","tyroid","teroid","hipertiroid","hyperthyroid","hipotiroid","hypothyroid","gondok","kelenjar tiroid","obat tiroid","levotiroksin"]},{"id":266,"q":"Berapa lama setelah kuret konsumen boleh minum Novia lagi?","a":"Tunggu sampai haid berikutnya datang, baru minum Novia.\n- Dokter menanyakan dulu apakah setelah kuret konsumen mendapat obat dari dokter dan untuk berapa lama (pada kasus ini obat untuk 4 minggu).","p":["Novia"],"k":"pasca operasi & tindakan medis","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-01-29","n":1,"kasus":[{"d":"2026-01-29","t":"Pasca kuret, mendapat obat dari dokter untuk 4 minggu → minum Novia setelah haid berikutnya datang."}],"kw":["kuret","kuretase","pasca kuret","habis kuret","haid berikutnya","tindakan rahim"]},{"id":267,"q":"Apakah customer yang minum obat darah tinggi (candesartan), kolesterol (atorvastatin), dan pengencer darah (aspilet) boleh minum Novia?","a":"Tergantung tekanan darahnya:\n- Tensi 140/85 ke bawah → silakan, tidak apa-apa minum Novia.\n- Tensi di atas angka itu → jangan.","p":["Novia"],"k":"minum bersama obat/suplemen","s":"tergantung","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-01-27","n":1,"kasus":[{"d":"2026-01-27","t":"Rutin minum candesartan, atorvastatin, dan aspilet; tensi terbaru belum diukur → patokan 140/85."}],"kw":["pengencer darah","darah tinggi","hipertensi","kolesterol","candesartan","atorvastatin","aspilet","tensi"]},{"id":268,"q":"Kenapa pria usia 62 tahun belum merasakan efek Coffiyy pada Mr. P setelah minum 1 sachet?","a":"Coffiyy adalah suplemen, bukan obat.\n- Cara kerjanya hanya sebagai penopang, bukan yang utama untuk mengurangi keluhan konsumen.\n- Di usia 62 tahun, fisiologi tubuh sudah tidak bisa merespons suplemen tertentu secara cepat dan baik.","p":["Coffiyy"],"k":"manfaat & hasil","s":"info","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-01-24","n":1,"kasus":[{"d":"2026-01-24","t":"Pria 62 th, setelah 1 sachet Coffiyy belum terasa efek ke Mr. P, hanya pundak terasa berat."}],"kw":["tidak ada efek","belum terasa","mr p","stamina pria","vitalitas","lansia","usia 62"]},{"id":269,"q":"Kenapa haid jadi telat setelah baru 3 hari minum Novia (usia 45 tahun, biasanya siklus maju)?","a":"Bisa saja efek dari Novia.\n- Tetap perlu dipastikan dulu dengan pola siklus haid rutin konsumen.\n- Jika dirasa mengganggu siklusnya, Novia boleh distop dulu supaya siklus kembali normal seperti biasanya.","p":["Novia"],"k":"efek samping & keluhan","s":"tergantung","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-01-24","n":1,"kasus":[{"d":"2026-01-24","t":"Wanita 45 th, siklus biasanya maju; setelah 3 kapsul (3 hari) Novia haid jadi telat → boleh stop dulu bila mengganggu."}],"kw":["haid telat","telat haid","telat bulan","mens telat","siklus haid","menstruasi"]},{"id":270,"q":"Apakah wajar pundak terasa berat setelah minum Coffiyy?","a":"Perlu dicek tekanan darahnya dulu.\n- Pastikan tekanan darah konsumen setelah minum Coffiyy, karena dikhawatirkan tensinya naik setelah minum Coffiyy.","p":["Coffiyy"],"k":"efek samping & keluhan","s":"info","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-01-24","n":1,"kasus":[{"d":"2026-01-24","t":"Pria 62 th merasa pundak berat setelah 1 sachet Coffiyy → cek tensi setelah minum."}],"kw":["pundak berat","tengkuk berat","tensi naik","tekanan darah","darah tinggi","efek samping kopi"]},{"id":271,"q":"Apakah dosis Coffiyy boleh ditambah kalau efeknya belum terasa?","a":"Tidak disarankan menambah dosis.\n- Harus dilihat dulu kondisi umum konsumen, seperti usia, riwayat penyakit sebelumnya, dan aktivitas sehari-hari.","p":["Coffiyy"],"k":"cara minum & dosis","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-01-24","n":1,"kasus":[{"d":"2026-01-24","t":"Pria 62 th belum merasakan efek setelah 1 sachet → dosis tidak disarankan ditambah."}],"kw":["tambah dosis","dosis","2 sachet","belum terasa","aturan minum","dosis berlebih"]},{"id":272,"q":"Apakah konsumen yang sedang promil (program hamil) boleh minum DVN?","a":"Konsultasikan langsung dulu dengan dokter Sp.OG yang membantu promil konsumen.\n- Supaya disesuaikan dengan kondisi konsumen dan batasan kebutuhan obat serta suplemennya.\n- Demi kelancaran program hamilnya.","p":["DVN"],"k":"hamil, menyusui & promil","s":"tergantung","rd":true,"by":["Dr Rizky Nasution"],"d":"2026-01-21","n":1,"kasus":[],"kw":["promil","program hamil","ingin hamil","hamil","sp.og","dokter kandungan","kesuburan"]},{"id":273,"q":"Apakah customer yang masih rutin suntik steroid boleh minum Novia?","a":"Tidak disarankan selama suntik steroid masih rutin (jangan dulu).\n- Dokter terlebih dulu memastikan apakah suntik steroidnya masih rutin atau sudah selesai.\n- Alasannya: steroid yang terlalu sering dan terlalu banyak dapat menimbulkan reaksi yang berbeda dengan berbagai kandungan obat dan suplemen.","p":["Novia"],"k":"minum bersama obat/suplemen","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-01-19","n":1,"kasus":[{"d":"2026-01-19","t":"Customer pernah suntik steroid (kemungkinan sudah selesai); dokter menegaskan bila masih rutin sebaiknya jangan minum Novia dulu."}],"kw":["steroid","suntik steroid","injeksi steroid","kortikosteroid","obat steroid","interaksi obat"]},{"id":274,"q":"Apakah customer dengan benjolan di belakang mulut rahim yang minum Visanne (dienogest 2 mg) saat haid boleh minum Novia?","a":"Tidak disarankan, jangan dulu.\n- Fokus ke konsumsi obat rutinnya dulu.","p":["Novia"],"k":"kondisi medis & penyakit","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-01-19","n":1,"kasus":[{"d":"2026-01-19","t":"Ada benjolan di belakang mulut rahim dan minum Visanne (dienogest 2 mg) saat haid → jangan minum Novia dulu."}],"kw":["benjolan","benjolan rahim","mulut rahim","serviks","visanne","dienogest","obat hormon"]},{"id":275,"q":"Apakah keluhan kulit setelah melahirkan (kulit kaki pecah-pecah, banyak bekas luka di kaki, flek hitam di wajah) bisa diatasi dengan DVN?","a":"Boleh minum DVN, tetapi keluhannya tetap perlu penanganan lain.\n- Semua keluhan tersebut masih memerlukan penanganan dari luar (perawatan luar) secara teratur dan berkala.\n- Juga memerlukan penanganan medis secara teratur.\n- Kalau konsumen ingin minum DVN, tidak ada masalah.","p":["DVN"],"k":"manfaat & hasil","s":"bersyarat","rd":true,"by":["Dr Rizky Nasution"],"d":"2026-01-18","n":1,"kasus":[{"d":"2026-01-18","t":"Ibu 37 th pasca melahirkan dengan kulit kaki pecah-pecah, banyak bekas luka di kaki, dan flek hitam di wajah (saat hamil disebut dokter karena pengaruh hormon) → DVN boleh, tapi tetap perlu perawatan luar & penanganan medis rutin."}],"kw":["habis melahirkan","pasca melahirkan","flek hitam","bekas luka","kulit pecah-pecah","hormon kehamilan","perawatan kulit"]},{"id":276,"q":"Apakah ibu hamil 8 bulan yang muncul flek boleh minum DVN?","a":"Tidak disarankan, jangan minum DVN dulu.\n- Di usia kehamilan 8 bulan, bayi seharusnya sudah dalam keadaan kuat dan hormon ibu sudah stabil.\n- Tujuannya menjaga kestabilan kondisi ibu sampai melahirkan.","p":["DVN"],"k":"hamil, menyusui & promil","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-01-16","n":1,"kasus":[{"d":"2026-01-16","t":"Ibu hamil 8 bulan yang muncul flek → jangan minum DVN dulu sampai melahirkan."}],"kw":["hamil","ibu hamil","bumil","hamil 8 bulan","hamil tua","trimester 3","flek"]},{"id":277,"q":"Apakah customer yang punya penyakit autoimun kulit boleh minum Novia?","a":"Konsultasikan dulu ke dokter spesialis yang merawat konsumen.\n- Alasannya: kondisi medis tiap pasien autoimun berbeda-beda.","p":["Novia"],"k":"kondisi medis & penyakit","s":"tergantung","rd":true,"by":["Dr Rizky Nasution"],"d":"2026-01-15","n":1,"kasus":[],"kw":["autoimun","autoimun kulit","penyakit autoimun","penyakit kulit","imun","dokter spesialis"]},{"id":278,"q":"Apakah konsumen dengan riwayat kanker payudara stadium 0 yang masih minum obat penekan hormon boleh minum Novia?","a":"Jangan.\n- Novia bertolak belakang dengan obat (penekan hormon) yang sedang dikonsumsi.","p":["Novia"],"k":"minum bersama obat/suplemen","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-01-08","n":1,"kasus":[{"d":"2026-01-08","t":"Riwayat kanker payudara stadium 0 (2022), masih minum obat penekan hormon → jangan minum Novia."}],"kw":["kanker payudara","ca payudara","breast cancer","obat penekan hormon","terapi hormon","survivor kanker","hormon"]},{"id":279,"q":"Apakah DVN bisa membantu flek hitam/hiperpigmentasi — termasuk melasma, hipermelanosis, lentigo, atau flek karena faktor genetik?","a":"Bisa membantu, terutama untuk mencegah, dan boleh dicoba sesuai dosis — tetapi perlu dikombinasikan dengan perawatan kulit dari luar serta perlindungan dari sinar matahari/UV.\n- DVN lebih powerful untuk mencegah melanin menjadi aktif akibat paparan sinar matahari (penyebab kulit kusam/menggelap): L-glutathione, vitamin C, dan pomegranate sebagai antioksidan menahan reaksi oksidatif yang membuat melanin gelap aktif, dan DVN membantu regenerasi sel-sel kulit.\n- Melasma/hiperpigmentasi (biasanya bercak gelap di wajah) sering terjadi akibat paparan luar (sinar UV, bekas jerawat), penuaan, perubahan hormonal, dan penggunaan pil kontrasepsi; tidak ada salahnya tetap minum DVN sambil rutin melakukan perawatan kulit wajah setiap hari.\n- Hipermelanosis bisa menghilang dengan perawatan kulit rutin dan teratur setiap hari serta menghindari paparan sinar matahari; DVN boleh dicoba sesuai dosis normal per hari sebagai salah satu upaya (saat ditanya DVN atau S-Glow, dokter hanya menjawab untuk DVN).\n- Lentigo (flek tebal & bulat; disebabkan bertambahnya usia, genetik, dan sinar UV): boleh dicoba — minum DVN sesuai dosis sambil tetap menghindari/memakai perlindungan dari paparan sinar UV.\n- Faktor genetik tidak bisa diubah dan faktor usia sulit dihindari (pada beberapa orang, hipermelanosis susah dihilangkan karena faktor genetik); yang bisa dilakukan adalah pencegahan terhadap pemicu lain, seperti sinar matahari.","p":["DVN"],"k":"manfaat & hasil","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution","Nutritionist Novrianti"],"d":"2026-01-08","n":5,"kasus":[],"kw":["flek","flek hitam","hiperpigmentasi","hipermelanosis","melasma","lentigo","pigmentasi","melanin","kulit gelap","kusam","genetik","sinar matahari"]},{"id":280,"q":"Apakah penderita autoimun myasthenia gravis yang rutin minum banyak obat, termasuk obat hipertensi dan pengencer darah, aman minum Erojan?","a":"Jangan dulu.\n- Konsumen masih minum obat hipertensi dan pengencer darah sekaligus.","p":["Erojan"],"k":"kondisi medis & penyakit","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-01-07","n":1,"kasus":[{"d":"2026-01-07","t":"Konsumen myasthenia gravis rutin minum Mestinon, obat saraf (NeuroAid, Neulin), Norvask 5 mg, Plavix dan Ascardia, obat diabetes (Janumet, Dafoxa), Mucosta, dan ezetimibe → jangan minum Erojan dulu."}],"kw":["myasthenia gravis","autoimun","pengencer darah","hipertensi","plavix","ascardia","norvask","mestinon"]},{"id":281,"q":"Apakah konsumen yang sedang minum obat darah tinggi boleh minum BLZ Pro, dan berapa jam jedanya?","a":"Tergantung masih minum obat atau tidak:\n- Jika masih minum obat darah tinggi: jangan minum BLZ Pro dulu.\n- Jika sudah tidak minum obatnya: silakan minum BLZ Pro, dimulai dengan dosis ringan dulu.","p":["BLZ Pro"],"k":"minum bersama obat/suplemen","s":"tergantung","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-01-07","n":1,"kasus":[],"kw":["darah tinggi","hipertensi","obat tensi","tekanan darah","jeda obat","dosis ringan","blz"]},{"id":282,"q":"Berapa aturan pakai Novia yang benar: 1 atau 2 kapsul per hari (di video e-learning disebut 2 kapsul)?","a":"1 kapsul per hari, setelah makan.\n- Ikuti aturan pakai yang tertera pada label.\n- Penyebutan 2 kapsul di video e-learning adalah kekeliruan dan akan diperbaiki.","p":["Novia"],"k":"cara minum & dosis","s":"info","rd":false,"by":["Nutritionist Novrianti","Dr Rizky Nasution"],"d":"2026-01-05","n":1,"kasus":[],"kw":["aturan pakai","dosis","dosis novia","berapa kapsul","1 kapsul","cara minum","e-learning"]},{"id":283,"q":"Apakah DVN yang kondisinya berbeda dari pembelian sebelumnya (tablet berserbuk, atau rasanya kurang manis/lebih asam) masih aman dikonsumsi?","a":"Masih bisa dikonsumsi selama kondisi tablet baik:\n- Tidak berubah warna.\n- Tidak berbau (tidak sedap).\n- Tidak lembap atau lembek, dan belum melewati masa expired.\n- Jika rasanya berbeda, mintakan batch number produknya agar bisa dicatat dan dicek.","p":["DVN"],"k":"kandungan & keamanan produk","s":"bersyarat","rd":false,"by":["Nutritionist Novrianti"],"d":"2025-12-28","n":2,"kasus":[{"d":"2025-12-23","t":"Customer menerima DVN berserbuk (pembelian sebelumnya tidak) → masih aman selama warna dan bau tidak berubah."},{"d":"2025-12-28","t":"Customer merasa DVN kedua kurang manis dan lebih asam dibanding sebelumnya → kirim batch number untuk dicek; aman selama kondisi tablet baik."}],"kw":["berserbuk","serbuk","bubuk","tablet rapuh","rasa berbeda","rasa asam","kurang manis","batch number","kualitas produk","kondisi produk","rusak","expired"]},{"id":284,"q":"Kenapa nama dan alamat pendaftar di dokumen persetujuan pendaftaran BPOM DVN kosong?","a":"Memang sengaja dikosongkan.\n- Datanya bisa dicek di web BPOM (seharusnya tercantum di sana).\n- Jawaban ini disampaikan anggota tim, lalu diterima (diberi ucapan terima kasih) oleh Nutritionist.","p":["DVN"],"k":"menjawab customer & lainnya","s":"info","rd":false,"by":["Nutritionist Novrianti"],"d":"2025-12-23","n":1,"kasus":[],"kw":["bpom","izin edar","nama pendaftar","alamat pendaftar","legalitas","sertifikat bpom","registrasi"]},{"id":285,"q":"Apakah calon customer yang sudah pasang 3 ring/stent jantung dan minum clopidogrel bisulfate serta Nosfrinal aman minum S-Glow?","a":"Boleh dengan catatan:\n- Konsumsi sesuai anjuran pakai.\n- Bedakan waktu minumnya dengan obat-obatan.","p":["S-Glow"],"k":"minum bersama obat/suplemen","s":"bersyarat","rd":false,"by":["Nutritionist Novrianti"],"d":"2025-12-22","n":1,"kasus":[{"d":"2025-12-22","t":"Calon customer pasang 3 stent, minum clopidogrel bisulfate dan Nosfrinal → S-Glow sesuai anjuran, beda waktu dengan obat."}],"kw":["ring jantung","stent","pasang ring","clopidogrel","pengencer darah","jantung","jeda obat"]},{"id":286,"q":"Apakah wanita 48 tahun dengan gangguan panik, hipertensi, dan fatty liver (terkontrol dengan obat) boleh minum Novia?","a":"Jangan dulu sebelum konsultasi ke dokter.\n- Konsultasikan dulu dengan dokter Sp.PD yang merawat terkait kondisi fatty liver-nya.\n- Jika diperbolehkan dokter, silakan minum Novia.","p":["Novia"],"k":"kondisi medis & penyakit","s":"tidak","rd":true,"by":["Dr Rizky Nasution"],"d":"2025-12-17","n":1,"kasus":[{"d":"2025-12-17","t":"Konsumen 48 tahun dengan gangguan panik (sertraline, alprazolam), hipertensi (amlodipine 2,5 mg), dan fatty liver, terkontrol → jangan dulu, konsultasi ke dokter Sp.PD."}],"kw":["fatty liver","perlemakan hati","liver","hipertensi","gangguan panik","anxiety","sertraline","alprazolam","amlodipine"]},{"id":287,"q":"Berapa kadar vitamin C dalam Coffiyy per sachet, dan apakah aman untuk lambung?","a":"Vitamin C sekitar 0,1% dari total bahan per sachet (tidak lebih dari 2 mg).\n- Untuk kondisi lambung, yang lebih perlu diperhatikan justru kopinya, karena lambung seharusnya lebih sensitif terhadap kopi.","p":["Coffiyy"],"k":"kandungan & keamanan produk","s":"info","rd":false,"by":["Nutritionist Novrianti"],"d":"2025-12-13","n":1,"kasus":[],"kw":["vitamin c","asam askorbat","lambung","maag","gerd","komposisi","kandungan","kopi"]},{"id":288,"q":"Apakah Novia sudah melalui uji klinis (ada hasil lab sebelum dan sesudah konsumsi)?","a":"Uji klinis untuk Novia sendiri belum dilakukan.\n- Namun sudah banyak uji klinis pada manusia yang mengonsumsi bahan-bahan yang sama dengan yang terkandung di dalam Novia.","p":["Novia"],"k":"kandungan & keamanan produk","s":"info","rd":false,"by":["Nutritionist Novrianti"],"d":"2025-12-12","n":1,"kasus":[],"kw":["uji klinis","clinical trial","penelitian","riset","hasil lab","bukti ilmiah","studi"]},{"id":289,"q":"Apakah customer yang minum Progynova boleh minum Novia?","a":"Boleh, dengan jeda waktu.\n- Progynova tampaknya juga bermanfaat untuk mengontrol siklus menstruasi dan mengurangi gejala pra-menopause.\n- Minum Novia di waktu makan yang berbeda dengan obat tersebut, misalnya Progynova pagi hari dan Novia malam hari.","p":["Novia"],"k":"minum bersama obat/suplemen","s":"bersyarat","rd":false,"by":["Nutritionist Novrianti"],"d":"2025-12-11","n":1,"kasus":[],"kw":["progynova","estradiol","obat hormon","terapi hormon","pre menopause","siklus haid","jeda obat"]},{"id":290,"q":"Apakah Coffiyy aman untuk konsumen dengan riwayat stroke?","a":"Boleh dengan catatan:\n- Pastikan konsumen mengetahui kondisinya saat itu dan memahami gejala yang mungkin muncul seperti berdebar, pusing, dan mual.\n- Jika diminum malam hari, minum 3–4 jam sebelum tidur; atau minum 1–2 jam sebelum beraktivitas.","p":["Coffiyy"],"k":"kondisi medis & penyakit","s":"bersyarat","rd":false,"by":["Nutritionist Novrianti"],"d":"2025-12-11","n":1,"kasus":[],"kw":["stroke","riwayat stroke","pasca stroke","berdebar","pusing","kopi","mual"]},{"id":291,"q":"Apakah wanita pre-menopause dengan riwayat darah tinggi (pernah tidak dibolehkan tambah estrogen) yang kini hanya minum vitamin boleh minum Novia?","a":"Boleh.\n- Selama tekanan darahnya stabil dan tidak naik di atas 140/80 mmHg.","p":["Novia"],"k":"kondisi medis & penyakit","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2025-12-06","n":1,"kasus":[{"d":"2025-12-06","t":"Konsumen pre-menopause dengan riwayat hipertensi, kini hanya minum Asthin Force 4 mg, D3K2, kolagen 6000 mg, dan magnesium glycinate → boleh Novia selama tensi stabil tidak di atas 140/80."}],"kw":["darah tinggi","hipertensi","tensi","pre menopause","estrogen","vitamin","astaxanthin","kolagen"]},{"id":292,"q":"Apakah customer autoimun yang rutin minum sulfasalazine boleh minum DVN?","a":"Jangan dulu.\n- Obat rutinnya termasuk obat keras.\n- Dikhawatirkan ada efek sampingnya.","p":["DVN"],"k":"minum bersama obat/suplemen","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2025-12-06","n":1,"kasus":[{"d":"2025-12-06","t":"Konsumen autoimun yang rutin minum sulfasalazine → jangan minum DVN dulu."}],"kw":["autoimun","autoimmune","sulfasalazine","obat keras","interaksi obat","efek samping"]},{"id":293,"q":"Apakah penderita batu empedu kronis yang minum Urdafalk boleh minum Erojan?","a":"Boleh dicoba dengan catatan:\n- Mulai dengan dosis 1x1 dulu, sesudah makan.\n- Evaluasi selama 1 minggu apakah ada keluhan.\n- Jika tidak ada keluhan, boleh lanjut Erojan dengan dosis normal.","p":["Erojan"],"k":"kondisi medis & penyakit","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2025-12-04","n":1,"kasus":[{"d":"2025-12-04","t":"Konsumen batu empedu kronis, minum Urdafalk, kadang nyeri perut kanan → Erojan 1x1 sesudah makan, evaluasi 1 minggu."}],"kw":["batu empedu","empedu","kantong empedu","urdafalk","nyeri perut kanan","gallstone","kolelitiasis"]},{"id":294,"q":"Apakah Erojan boleh diminum konsumen dengan tekanan darah tinggi yang belum (baru akan) minum obat darah tinggi?","a":"Belum sekarang; turunkan tekanan darahnya dulu.\n- Minum obat penurun tekanan darah dulu secara teratur, lalu periksa ulang (follow up) 2 minggu ke depan.\n- Jika tekanan darah sudah turun ke sekitar 140–150/80–90, silakan minum Erojan dengan dosis 1 kapsul per hari.\n- Beri jarak 6 jam setelah minum obat penurun tekanan darah.\n- Jika tekanan darah naik lagi di atas angka tersebut, stop Erojan dulu.","p":["Erojan"],"k":"kondisi medis & penyakit","s":"tergantung","rd":true,"by":["Dr Rizky Nasution"],"d":"2025-12-04","n":1,"kasus":[{"d":"2025-12-04","t":"Konsumen dengan tekanan darah sangat tinggi dan belum minum obat → obat dulu; Erojan 1 kapsul/hari setelah tensi turun ke ±140–150/80–90, jeda 6 jam dari obat."}],"kw":["darah tinggi","hipertensi","tensi","tekanan darah","obat darah tinggi","jeda obat","dosis erojan"]},{"id":295,"q":"Apakah DVN bisa mengatasi atau memperbaiki bopeng (bekas jerawat)?","a":"Beda fungsinya — bopeng tetap harus mendapat perawatan kulit yang optimal dari luar.\n- Untuk menghilangkan dan memperbaiki bopeng tetap harus ada perawatan kulit dari luar, karena ada faktor eksternal yang menyebabkan timbulnya bopeng.\n- Apalagi jika sudah berlangsung lama, perlu treatment tersendiri.\n- DVN berperan sebagai stimulan dan pencegahan dari sisi internal tubuh.","p":["DVN"],"k":"manfaat & hasil","s":"info","rd":false,"by":["Dr Rizky Nasution"],"d":"2025-12-04","n":2,"kasus":[],"kw":["bopeng","bekas jerawat","acne scar","jerawat","perawatan kulit","treatment kulit","treatment"]},{"id":296,"q":"Apakah penderita autoimun myasthenia gravis boleh minum DVN?","a":"Konsultasikan dulu ke dokter yang merawat konsumen.\n- Myasthenia gravis termasuk penyakit autoimun kronis.\n- Respons tiap pasien autoimun terhadap efek vitamin maupun obat-obatan yang dikonsumsi berbeda-beda.\n- Catatan: jawaban lama (2025-10-08, Nutritionist Novrianti) hanya memberi info bahwa sepemahamannya kandungan DVN tidak memengaruhi otot; ikuti yang terbaru.","p":["DVN"],"k":"kondisi medis & penyakit","s":"tergantung","rd":true,"by":["Dr Rizky Nasution","Nutritionist Novrianti"],"d":"2025-12-03","n":2,"kasus":[],"kw":["myasthenia gravis","miastenia gravis","mg","autoimun","autoimun kronis","lemah otot","otot"]},{"id":297,"q":"Apakah penderita autoimun (tanpa gejala) yang masih minum obat autoimun dan aspirin sebagai pengencer darah aman minum Novia?","a":"Konsultasikan dulu ke dokter yang merawat konsumen.\n- Konsumen juga sedang minum aspirin.\n- Dikhawatirkan berefek panjang terhadap pengencer darahnya.","p":["Novia"],"k":"kondisi medis & penyakit","s":"tergantung","rd":true,"by":["Dr Rizky Nasution"],"d":"2025-11-29","n":1,"kasus":[{"d":"2025-11-29","t":"Penderita autoimun tanpa gejala, rutin minum obat autoimun + aspirin → konsultasi dulu ke dokter yang merawat."}],"kw":["autoimun","autoimmune","aspirin","pengencer darah","obat autoimun","konsultasi dokter"]},{"id":298,"q":"Apakah calon customer yang minum clopidogrel (pengencer darah) boleh minum Coffiyy?","a":"Berisiko jantung berdebar; kalau tetap mau, beri jarak minimal 8 jam dari obat.\n- Clopidogrel adalah obat pengencer darah, sehingga kemungkinan besar bisa menimbulkan jantung berdebar dan gejala lainnya bila minum Coffiyy.\n- Jika tetap mau minum Coffiyy, bedakan waktunya dengan obat, minimal berjarak 8 jam.\n- Tujuannya mengantisipasi efek keduanya saling bersinggungan.","p":["Coffiyy"],"k":"minum bersama obat/suplemen","s":"bersyarat","rd":false,"by":["Nutritionist Novrianti","Dr Rizky Nasution"],"d":"2025-11-28","n":1,"kasus":[{"d":"2025-11-28","t":"Calon customer minum clopidogrel → Coffiyy berisiko jantung berdebar; kalau tetap mau, beri jarak minimal 8 jam dari obat."}],"kw":["clopidogrel","cpg","plavix","pengencer darah","jantung berdebar","deg-degan","jeda obat","kopi"]},{"id":299,"q":"Apakah Erojan yang sudah dibuka sejak 5 bulan lalu dan belum habis masih aman dikonsumsi?","a":"Masih bisa dikonsumsi selama:\n- Belum expired.\n- Kapsul tidak berubah warna dan bentuk.","p":["Erojan"],"k":"kandungan & keamanan produk","s":"bersyarat","rd":false,"by":["Nutritionist Novrianti"],"d":"2025-11-25","n":1,"kasus":[],"kw":["kedaluwarsa","kadaluarsa","expired","sudah dibuka","masa simpan","penyimpanan","kapsul"]},{"id":300,"q":"Kenapa konsumen merasa pusing dan perut seperti kram setelah minum Novia (biasanya juga pusing bila mengonsumsi safron)?","a":"Sesuai dengan efek samping safron pada orang yang sensitif; kurangi dosisnya.\n- Safron memiliki kandungan antioksidan yang cukup kuat; beberapa orang sensitif terhadap herbal ini, dengan efek seperti rasa tidak nyaman di kepala sampai leher dan kontraksi otot.\n- Kurangi dosis: yang biasanya 1x sehari menjadi 2 hari sekali.\n- Pastikan diminum setelah makan.\n- Jika masih ada keluhan, berarti konsumen memang memiliki reaksi sensitivitas berlebih terhadap kandungan herbal tersebut.","p":["Novia"],"k":"efek samping & keluhan","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2025-11-21","n":1,"kasus":[{"d":"2025-11-21","t":"Konsumen pusing dan perut kram setelah minum Novia, memang sering pusing bila konsumsi safron → kurangi jadi 2 hari sekali, setelah makan."}],"kw":["pusing","kram perut","safron","saffron","sakit kepala","efek samping","sensitif herbal","kontraksi otot"]},{"id":301,"q":"Apa saran untuk konsumen yang muncul memar setelah minum Erojan?","a":"Stop Erojan dulu, lalu evaluasi apakah keluhannya hilang.\n- Dari foto, keluhannya tampak seperti memar. Memar yang muncul tiba-tiba sering akibat cedera; bila tanpa sebab, biasanya karena kelainan/penyakit seperti kelainan darah atau kekurangan vitamin C, vitamin K, dan zat besi.\n- Bisa juga karena konsumen sedang minum obat antiinflamasi.\n- Pada usia 61 tahun, memar tiba-tiba sering terjadi secara alami karena pembuluh darah kapiler sudah tidak sekuat dan seelastis usia yang lebih muda; tetap stop Erojan dulu untuk berjaga-jaga ada faktor lain.\n- Jika memar hilang setelah stop, bisa jadi konsumen mengalami reaksi alergi spesifik terhadap salah satu bahan alami di produk.","p":["Erojan"],"k":"efek samping & keluhan","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2025-11-19","n":1,"kasus":[{"d":"2025-11-19","t":"Konsumen 61 tahun muncul memar (sebelumnya tidak ada) setelah minum Erojan → stop dulu dan evaluasi."}],"kw":["memar","lebam","biru-biru","kulit biru","efek samping","lansia","alergi","pembuluh darah"]},{"id":302,"q":"Apakah konsumen yang minum pengencer darah CPG 75 (clopidogrel), obat tensi, obat kolesterol, dan obat gula boleh minum Novia?","a":"Tidak masalah.\n- Asal jam minum Novia dibedakan dengan obat-obatnya.","p":["Novia"],"k":"minum bersama obat/suplemen","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2025-11-16","n":1,"kasus":[{"d":"2025-11-16","t":"Konsumen minum CPG 75, obat tensi, obat kolesterol, dan obat gula → boleh Novia dengan jam minum berbeda."}],"kw":["pengencer darah","clopidogrel","cpg","obat tensi","hipertensi","kolesterol","diabetes","obat gula","jeda obat"]},{"id":303,"q":"Apakah konsumen dengan miom yang sedang minum obat hormon (Nelandoz) boleh minum S-Glow?","a":"Boleh.\n- Bedakan jam minumnya dengan obat Nelandoz.","p":["S-Glow"],"k":"minum bersama obat/suplemen","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2025-11-12","n":1,"kasus":[{"d":"2025-11-12","t":"Konsumen miom sedang minum obat hormon Nelandoz → boleh S-Glow dengan jam minum berbeda."}],"kw":["miom","mioma","obat hormon","nelandos","nelandoz","jeda obat","rahim"]},{"id":304,"q":"Apakah Novia boleh dikonsumsi wanita yang sudah menopause atau sedang pra-menopause?","a":"Boleh.\n- Hormon estrogen sebenarnya masih ada setelah menopause, meski menurun drastis dibandingkan usia produktif.\n- Pada kondisi menopause, bukan berarti sistem hormonal tidak bekerja lagi, sehingga tubuh tetap membutuhkan zat gizi yang baik untuk mempertahankan kinerjanya.\n- Bahan utama Novia memang banyak digunakan untuk meredakan gejala pra-menstruasi dan pra-menopause.","p":["Novia"],"k":"haid, hormon & menopause","s":"boleh","rd":false,"by":["Nutritionist Novrianti"],"d":"2025-11-04","n":2,"kasus":[],"kw":["menopause","monopause","pasca menopause","pre menopause","pra menopause","perimenopause","mati haid","estrogen","hormon","pms","lansia"]},{"id":305,"q":"Apakah konsumen yang rutin minum banyak obat (tensi, jantung, asam urat, kolesterol, plus vitamin penunjang) aman minum DVN dan S-Glow sekaligus?","a":"Cukup pilih salah satu saja, DVN atau S-Glow.\n- Supaya kandungan vitamin yang dikonsumsi tidak bertambah banyak atau melebihi dosis asupan harian.\n- Minum di siang hari saja, bersamaan dengan Megabal 500 mg.","p":["DVN","S-Glow"],"k":"minum bersama obat/suplemen","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2025-11-02","n":1,"kasus":[{"d":"2025-11-02","t":"Konsumen minum Tanapres 10 mg & V-Bloc 25 mg (pagi), Megabal 500 mg (siang), allopurinol 300 mg (sore), Adalat Oros 30 mg & V-Bloc 25 mg (malam), atorvastatin 20 mg (sebelum tidur) → pilih DVN atau S-Glow saja, minum siang bersama Megabal."}],"kw":["obat tensi","hipertensi","asam urat","kolesterol","jantung","allopurinol","atorvastatin","megabal","dosis vitamin","dvn dan sglow"]},{"id":306,"q":"Apakah penderita hipertiroid boleh minum Erojan?","a":"Boleh dengan catatan:\n- Selama tidak sedang minum obat yang mempengaruhi pelebaran pembuluh darah.","p":["Erojan"],"k":"kondisi medis & penyakit","s":"bersyarat","rd":false,"by":["Nutritionist Novrianti"],"d":"2025-10-20","n":1,"kasus":[],"kw":["hipertiroid","hyperthyroid","tiroid","thyroid","pembuluh darah","pelebaran pembuluh darah"]},{"id":307,"q":"Jika konsumen pernah sakit kepala setelah minum glutathione merek lain, apakah DVN yang juga mengandung glutathione bisa menimbulkan efek yang sama?","a":"Bandingkan kadar glutathione-nya:\n- Lihat jumlah mg glutathione pada kedua produk.\n- Jika jumlahnya sama, kemungkinan akan menimbulkan rasa (keluhan) yang sama.","p":["DVN"],"k":"efek samping & keluhan","s":"info","rd":false,"by":["Nutritionist Novrianti"],"d":"2025-10-17","n":1,"kasus":[{"d":"2025-10-17","t":"Konsumen sakit kepala setelah minum glutathione merek lain → bandingkan kadar mg glutathione-nya dengan DVN."}],"kw":["glutathione","glutation","sakit kepala","pusing","merek lain","efek samping","pemutih"]},{"id":308,"q":"Apakah penderita gangguan ginjal yang 2 bulan lalu operasi pasang DJ stent dan kini nyerinya muncul lagi boleh minum DVN?","a":"Tidak disarankan dulu.\n- Kondisi konsumen masih sangat riskan karena keluhan yang sama muncul lagi begitu cepat meski sudah operasi.\n- Mencerna dan menyerap vitamin, mineral, dan konsentrat membutuhkan kemampuan ginjal serta asupan air minum yang cukup.\n- Jangan konsumsi dulu sampai konsumen dalam kondisi maintenance (sudah stabil).","p":["DVN"],"k":"kondisi medis & penyakit","s":"tidak","rd":false,"by":["Nutritionist Novrianti"],"d":"2025-10-07","n":1,"kasus":[{"d":"2025-10-07","t":"Konsumen operasi pasang DJ stent karena penyempitan ureter (ginjal bengkak), 2 bulan kemudian nyeri perut kanan atas-bawah muncul lagi → jangan minum DVN sampai kondisi maintenance."}],"kw":["ginjal","disfungsi ginjal","gangguan ginjal","dj stent","ureter","ginjal bengkak","hidronefrosis","operasi ginjal"]},{"id":309,"q":"Apakah pasien gagal ginjal yang menjalani cuci darah (hemodialisis) boleh minum DVN?","a":"Jangan — tidak disarankan.\n- Ada potensi memberatkan fungsi ginjalnya.\n- Catatan: jawaban lama (2024-06-29, Nutritionist Novrianti) sempat menyarankan boleh dicoba mulai 1 kali sehari dengan asupan air putih yang cukup, setelah kandungan DVN dan asupan air dikonsultasikan ke dokter yang merawat; ikuti yang terbaru.","p":["DVN"],"k":"kondisi medis & penyakit","s":"tidak","rd":true,"by":["Dr Rizky Nasution","Nutritionist Novrianti"],"d":"2025-09-19","n":2,"kasus":[{"d":"2024-06-29","t":"Konsumen cuci darah 3 kali seminggu, fungsi ginjal 8% → mulai 1x sehari, konsultasikan kandungan dan asupan air ke dokter."},{"d":"2025-09-19","t":"Pasien gagal ginjal stadium 5 yang masih hemodialisis → jangan minum DVN."}],"kw":["cuci darah","hemodialisis","hemodialisa","hd","dialisis","gagal ginjal","ginjal","fungsi ginjal","ckd","stadium 5","asupan air"]},{"id":310,"q":"Kenapa konsumen merasa seperti masuk angin setiap minum DVN padahal sudah diminum setelah makan, dan apa solusinya?","a":"Boleh dicoba dengan cara minum yang berbeda:\n- Minum DVN di tengah-tengah waktu makan (bukan sesudah makan).\n- Jika masih merasakan hal yang sama, stop dulu selama 1 minggu.","p":["DVN"],"k":"efek samping & keluhan","s":"bersyarat","rd":false,"by":["Nutritionist Novrianti"],"d":"2025-09-13","n":1,"kasus":[{"d":"2025-09-13","t":"Konsumen selalu minum DVN setelah makan tapi merasa seperti masuk angin (bukan mual) → coba minum di tengah makan; kalau tetap, stop 1 minggu."}],"kw":["masuk angin","kembung","mual","tidak enak badan","perut tidak nyaman","cara minum","efek samping"]},{"id":311,"q":"Apakah DVN bisa menyebabkan kantuk?","a":"Seharusnya DVN tidak mempengaruhi rasa kantuk.\n- Kemungkinan konsumen banyak mengonsumsi makanan tinggi karbohidrat sehingga terjadi penumpukan gula di dalam tubuh.\n- Pada beberapa orang, kondisi ini bisa menyebabkan kantuk jika energinya tidak digunakan untuk beraktivitas.","p":["DVN"],"k":"efek samping & keluhan","s":"info","rd":false,"by":["Nutritionist Novrianti"],"d":"2025-09-12","n":1,"kasus":[{"d":"2025-09-12","t":"Konsumen merasa sangat mengantuk selama minum DVN dan berkurang setelah berhenti → seharusnya bukan karena DVN; kemungkinan karena asupan tinggi karbohidrat."}],"kw":["ngantuk","kantuk","mengantuk","lemas","karbohidrat","gula","efek samping"]},{"id":312,"q":"Apakah konsumen yang alergi vitamin E dan omega 3 boleh minum DVN?","a":"Ada kemungkinan muncul gejala alergi; kalau tetap mau, boleh dicoba dengan catatan:\n- Omega 3 dan kolagen sama-sama komponen gizi dari ikan laut, jadi setelah minum DVN bisa saja timbul gejala alergi; tingkat keparahannya berbeda-beda sesuai kondisi konsumen.\n- Jika tetap mau minum DVN, konsumsi di pagi hari dan jangan bersamaan dengan protein ikan lainnya.\n- Dengan cara ini bisa terlihat apakah konsumsi DVN 2 kali sehari aman atau tidak untuk konsumen.","p":["DVN"],"k":"kandungan & keamanan produk","s":"bersyarat","rd":false,"by":["Nutritionist Novrianti"],"d":"2025-09-01","n":1,"kasus":[{"d":"2025-09-01","t":"Konsumen alergi vitamin E dan omega 3 → berisiko alergi; kalau tetap mau, coba minum DVN pagi hari tanpa protein ikan lain lalu amati reaksinya."}],"kw":["alergi","alergi ikan","omega 3","vitamin e","kolagen ikan","collagen","gatal","seafood"]},{"id":313,"q":"Kenapa ada customer yang gatal-gatal setelah minum DVN padahal tidak punya alergi? Apakah karena pewarna karmoisin, dan bisakah karmoisin tidak digunakan?","a":"Karmoisin di DVN sesuai anjuran BPOM; usulan penggantian akan didiskusikan.\n- Penggunaan karmoisin sesuai anjuran BPOM dan sudah umum dipakai di makanan maupun suplemen.\n- Usulan agar karmoisin tidak digunakan akan dicoba didiskusikan.\n- Menurut pengalaman penasihat, reaksi hipersensitif kemungkinan besar terjadi karena orang tersebut punya pemicu (trigger) yang tidak aktif; saat imun tubuh menurun disertai gaya hidup dan cuaca yang mengganggu, pemicu itu tiba-tiba aktif dan menimbulkan gatal dan gejala lain.","p":["DVN"],"k":"kandungan & keamanan produk","s":"info","rd":false,"by":["Nutritionist Novrianti"],"d":"2025-08-31","n":1,"kasus":[],"kw":["karmoisin","carmoisine","pewarna","pewarna makanan","gatal","alergi","hipersensitif","bpom"]},{"id":314,"q":"Apakah Erojan harus dihentikan saat akan/sesudah operasi, dan apakah Erojan punya efek mengencerkan darah?","a":"Stop dulu selama luka belum sembuh dan masih minum pengencer darah.\n- Efek langsung Erojan: pembakaran energi dan melancarkan peredaran darah, biasanya disertai rasa panas di tubuh, berenergi, dan bersemangat.\n- Hentikan konsumsi Erojan dulu selama luka belum sembuh dan masih minum obat pengencer darah.","p":["Erojan"],"k":"pasca operasi & tindakan medis","s":"tidak","rd":false,"by":["Nutritionist Novrianti"],"d":"2025-08-31","n":1,"kasus":[{"d":"2025-08-31","t":"Customer baru operasi lutut → stop Erojan selama luka belum sembuh dan masih minum pengencer darah."}],"kw":["operasi","pasca operasi","operasi lutut","pengencer darah","peredaran darah","luka operasi","stop"]},{"id":315,"q":"Apakah DVN bisa memicu batu ginjal pada konsumen yang juga minum obat darah tinggi?","a":"Kemungkinan batu ginjalnya sudah ada sejak lama.\n- Pembentukan batu ginjal tidak cepat; butuh proses berbulan-bulan untuk 1 batu saja.\n- Pada pasien yang sedang minum obat darah tinggi, kemungkinan batu ginjalnya sudah ada lama.\n- Gali juga usia konsumen dan sudah berapa lama minum DVN.","p":["DVN"],"k":"efek samping & keluhan","s":"info","rd":false,"by":["Dr Rizky Nasution"],"d":"2025-08-28","n":1,"kasus":[{"d":"2025-08-28","t":"Konsumen usia 40-an, minum DVN sejak akhir 2024 dan minum obat darah tinggi, ditemukan batu ginjal → kemungkinan batu sudah lama terbentuk."}],"kw":["batu ginjal","ginjal","kidney stone","darah tinggi","hipertensi","obat tensi","efek samping"]},{"id":316,"q":"Kenapa tenggorokan customer terasa kurang nyaman setelah minum DVN (menelan tidak sakit, tidak ada alergi)?","a":"Kemungkinan gejala adaptasi.\n- Kondisi tubuh mungkin sedang kurang fit, sehingga saat mengonsumsi DVN yang tinggi vitamin C dan mengandung pemanis timbul gejala adaptasi.","p":["DVN"],"k":"efek samping & keluhan","s":"info","rd":false,"by":["Nutritionist Novrianti"],"d":"2025-08-25","n":1,"kasus":[],"kw":["tenggorokan","tenggorokan tidak enak","tidak nyaman menelan","adaptasi","vitamin c","pemanis","efek samping"]},{"id":317,"q":"Dari mana sumber kolagen DVN (ikan jenis apa/jenis kolagennya), apakah S-Glow juga memakai kolagen ikan laut, dan apakah DVN halal?","a":"Dari ikan (marine collagen/kolagen ikan laut), dan DVN sudah bersertifikat halal.\n- Info dari manufaktur: Tripeptide Collagen dari ikan tilapia (nila); Hydrolyzed Collagen dari ikan tilapia (nila) & pangasius (patin).\n- S-Glow juga menggunakan marine collagen (kolagen ikan laut), sama seperti DVN.\n- Sertifikasi halal DVN sesuai prosedur penilaian halal, termasuk bahan dan prosesnya.\n- Tipe kolagen spesifik (mis. COL18A1/COL26A1) tidak disebutkan penasihat; yang dijelaskan hanya sumber ikannya.","p":["DVN","S-Glow"],"k":"kandungan & keamanan produk","s":"info","rd":false,"by":["Nutritionist Novrianti","Dr Rizky Nasution"],"d":"2025-08-25","n":5,"kasus":[{"d":"2025-04-20","t":"Pertanyaan lanjutan dari kasus customer yang alergi ikan laut: apakah S-Glow juga memakai kolagen ikan laut → ya."},{"d":"2025-05-26","t":"Konsumen alergi beberapa jenis ikan (mis. salmon), tidak semua ikan → menanyakan jenis ikan sumber kolagen DVN (dijawab dengan info jenis ikannya saja)."}],"kw":["sumber kolagen","kolagen ikan","marine collagen","jenis ikan","tilapia","nila","pangasius","patin","jenis kolagen","col18a1","halal","babi"]},{"id":318,"q":"Apa saran jika customer mengalami keluhan saat minum Erojan dan Coffiyy bersamaan?","a":"Konsultasikan ke dokter dan hentikan pemakaian bersamaan.\n- Stop penggunaan Erojan + Coffiyy secara bersamaan.\n- Konsumsi di hari yang berbeda, lalu lihat apakah ada perubahan.\n- Konsultasikan kondisinya ke dokter.","p":["Erojan","Coffiyy"],"k":"efek samping & keluhan","s":"bersyarat","rd":true,"by":["Nutritionist Novrianti"],"d":"2025-08-24","n":1,"kasus":[{"d":"2025-08-24","t":"Detail keluhan dikirim lewat gambar (tidak terbaca) → stop pemakaian bersamaan, coba di hari berbeda, konsultasi dokter."}],"kw":["erojan dan coffiy","coffiy","kombinasi produk","bersamaan","hari berbeda","keluhan","efek samping"]},{"id":319,"q":"Bagaimana jika customer muncul ruam di tangan setelah minum Erojan?","a":"Stop Erojan dulu selama 1 minggu.\n- Pastikan dulu apakah ada riwayat alergi terhadap obat, makanan, debu, atau cuaca.\n- Hentikan konsumsi Erojan selama 1 minggu.\n- Dokter curiga ruamnya bukan karena Erojan (konsumen punya alergi debu dan cuaca).","p":["Erojan"],"k":"efek samping & keluhan","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2025-08-23","n":1,"kasus":[{"d":"2025-08-23","t":"Ruam di tangan, konsumen punya alergi debu dan cuaca → stop Erojan 1 minggu; dicurigai bukan karena Erojan."}],"kw":["ruam","alergi","gatal","bintik merah","kemerahan","alergi debu","alergi cuaca","stop"]},{"id":320,"q":"Apakah DVN boleh untuk customer yang gatal-gatal sebadan (berbekas) dan masih dalam pengobatan dokter dengan Histapan & Loratadine?","a":"Boleh.\n- Syaratnya, pastikan konsumen tidak alergi terhadap bahan-bahan yang tertera di DVN.","p":["DVN"],"k":"minum bersama obat/suplemen","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2025-08-21","n":1,"kasus":[{"d":"2025-08-21","t":"Gatal sebadan hingga berbekas, masih pengobatan dokter dengan Histapan & Loratadine → boleh asal tidak alergi bahan DVN."}],"kw":["gatal","gatal-gatal","alergi","histapan","loratadine","antihistamin","bekas gatal","kulit"]},{"id":321,"q":"Apakah Erojan boleh diminum saat sedang minum Brilinta 90 mg dan Crestor 10 mg?","a":"Boleh, dengan beda waktu makan.\n- Konsumsi Erojan di waktu makan yang berbeda dengan obat.\n- Contoh: obat diminum saat makan malam, Erojan saat makan pagi.","p":["Erojan"],"k":"minum bersama obat/suplemen","s":"bersyarat","rd":false,"by":["Nutritionist Novrianti"],"d":"2025-08-16","n":1,"kasus":[],"kw":["brilinta","ticagrelor","crestor","rosuvastatin","pengencer darah","kolesterol","jeda obat"]},{"id":322,"q":"Apakah customer yang perutnya kembung dan haidnya terlambat setelah kurang dari 2 minggu minum DVN sebaiknya lanjut minum?","a":"Periksakan ke dokter dulu.\n- Kembung dan haid tidak teratur bisa disebabkan banyak hal.\n- Kemungkinan ada faktor lain dari konsumen yang menyebabkan keluhan tersebut (Dr Rizky).","p":["DVN"],"k":"efek samping & keluhan","s":"tergantung","rd":true,"by":["Nutritionist Novrianti","Dr Rizky Nasution"],"d":"2025-08-13","n":1,"kasus":[{"d":"2025-08-13","t":"Kembung + haid belum datang setelah <2 minggu minum DVN → periksa ke dokter."}],"kw":["kembung","haid terlambat","telat haid","haid tidak teratur","menstruasi","perut kembung","efek samping"]},{"id":323,"q":"Apakah Erojan boleh untuk customer dengan gula darah tinggi dan hipertensi yang minum banyak obat?","a":"Boleh dengan catatan:\n- Obat yang diminum sudah cukup banyak, dengan kondisi gula darah tinggi dan hipertensi.\n- Jika tetap ingin minum Erojan, minum pagi hari dan jauh sebelum minum obat.\n- Kondisi seperti ini sangat sensitif terhadap tambahan asupan dari luar; jika terasa pusing atau jantung berdebar, hentikan pemakaian.","p":["Erojan"],"k":"minum bersama obat/suplemen","s":"bersyarat","rd":false,"by":["Nutritionist Novrianti"],"d":"2025-08-12","n":1,"kasus":[{"d":"2025-08-12","t":"Daftar obat (gambar) menunjukkan gula darah tinggi + hipertensi → Erojan pagi jauh sebelum obat; stop jika pusing/berdebar."}],"kw":["diabetes","gula darah tinggi","hipertensi","darah tinggi","banyak obat","jantung berdebar","pusing","dm"]},{"id":324,"q":"Apakah Erojan bisa memengaruhi atau memperparah wasir?","a":"Belum tentu karena Erojan; cek faktor lain dulu.\n- Efek Erojan yang mungkin berkaitan: peningkatan pembakaran energi dan melancarkan peredaran darah.\n- Pada wasir, yang perlu dicegah adalah perdarahan; hindari aktivitas berlebihan serta makanan keras dan pedas.\n- Pastikan faktor penyebab lain: pekerjaan mengangkat/menarik/mendorong, makanan keras atau berlemak, BAB keras, duduk terlalu lama, kegemukan.\n- Jadi tidak serta-merta konsumsi Erojan yang membuat wasir makin membesar.","p":["Erojan"],"k":"efek samping & keluhan","s":"info","rd":false,"by":["Nutritionist Novrianti","Dr Rizky Nasution"],"d":"2025-08-12","n":1,"kasus":[],"kw":["wasir","ambeien","hemoroid","bab keras","perdarahan","peredaran darah","efek samping"]},{"id":325,"q":"Apakah DVN aman untuk penderita gula darah tinggi (diabetes)? Apakah DVN mengandung gula?","a":"DVN mengandung pemanis dan karbohidrat, tetapi tidak akan menaikkan gula darah secara drastis.\n- Informasi kandungan ini tercantum di kemasan.","p":["DVN"],"k":"kandungan & keamanan produk","s":"info","rd":false,"by":["Nutritionist Novrianti"],"d":"2025-08-11","n":1,"kasus":[],"kw":["diabetes","gula darah","kencing manis","dm","gula tinggi","pemanis","karbohidrat"]},{"id":326,"q":"Apakah DVN bisa menyebabkan nyeri sendi/tulang yang disertai dada tidak nyaman atau napas terasa tidak normal?","a":"Bisa saja terjadi bila konsumen punya alergi (mis. terhadap kolagen atau vitamin C); sarankan tes kesehatan lebih lanjut.\n- Jika konsumen punya indikasi alergi terhadap kolagen ataupun vitamin C, keluhan seperti itu bisa saja muncul.\n- Gali dulu: apakah ada indikasi alergi vitamin C/kolagen, dan berapa usia konsumen.\n- Perlu tes kesehatan lebih lanjut untuk mengetahui kondisinya: apakah ada alergi, kontraindikasi, atau reaksi akibat menurunnya kemampuan tubuh dalam menyerap kandungan DVN.","p":["DVN"],"k":"efek samping & keluhan","s":"tergantung","rd":true,"by":["Nutritionist Novrianti","Dr Rizky Nasution"],"d":"2025-08-09","n":2,"kasus":[{"d":"2024-06-12","t":"Konsumen 59 tahun, 4 hari minum DVN: nyeri semua sendi, badan nyeri seperti mau demam, dada kiri tidak enak; dulu saat minum suplemen zinc merek lain dada juga terasa tidak enak → perlu tes kesehatan."},{"d":"2025-08-09","t":"Nyeri tulang/sendi dan napas tidak normal setelah minum 5 butir; konsumen sudah berhenti dan ke dokter → bisa terkait alergi kolagen/vitamin C."}],"kw":["nyeri sendi","sakit sendi","nyeri tulang","badan pegal","demam","nyeri dada","dada tidak enak","sesak napas","napas","alergi","vitamin c","tes kesehatan"]},{"id":327,"q":"Apakah DVN punya pantangan dengan obat lain?","a":"Sebenarnya tidak ada.\n- Namun tetap pastikan dulu apakah konsumen punya alergi terhadap obat-obatan tertentu atau terhadap salah satu bahan DVN.","p":["DVN"],"k":"minum bersama obat/suplemen","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2025-08-08","n":1,"kasus":[],"kw":["pantangan","interaksi obat","kontraindikasi","obat lain","alergi obat","minum bersama obat"]},{"id":328,"q":"Apakah DVN bisa menghilangkan atau mengatasi milia (dan syringoma)?","a":"Kurang tepat jika DVN diharapkan untuk menghilangkan/mengobati milia — perannya lebih ke pencegahan.\n- Milia disebabkan sel kulit mati yang menumpuk dan membentuk benjolan kecil di bawah permukaan kulit; salah satu penyebabnya paparan sinar matahari.\n- DVN berfungsi sebagai suplemen untuk pencegahan kerusakan kulit secara bertahap.\n- Untuk milia dan syringoma, DVN lebih berperan sebagai antioksidan dan antiinflamasi untuk mencegah timbul lebih banyak, bukan mengobati atau menghilangkan.","p":["DVN"],"k":"manfaat & hasil","s":"info","rd":false,"by":["Dr Rizky Nasution","Nutritionist Novrianti"],"d":"2025-08-08","n":2,"kasus":[],"kw":["milia","syringoma","siringoma","bintil","bintik putih","benjolan kecil","sel kulit mati","antioksidan","antiinflamasi","sinar matahari"]},{"id":329,"q":"Apakah Erojan boleh untuk orang yang setahun lalu pasang ring jantung dan rutin minum 2 macam pengencer darah serta obat jantung lain di pagi, siang, dan sore?","a":"Jangan dulu.\n- Utamakan obat rutin untuk jantungnya.\n- Jadwal minum obat rutinnya sudah ada di pagi, siang, dan sore.","p":["Erojan"],"k":"kondisi medis & penyakit","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2025-08-03","n":1,"kasus":[{"d":"2025-08-03","t":"Pasang ring jantung setahun lalu, minum Bricolt, Nospirinal, dan Angintriz pagi–siang–sore → jangan minum Erojan dulu."}],"kw":["ring jantung","stent","pengencer darah","jantung","obat jantung","bricolt","nospirinal","angintriz"]},{"id":330,"q":"Apakah Erojan boleh untuk customer yang minum obat pengencer darah/pencegah gumpalan dan obat darah tinggi dengan jadwal pagi dan siang?","a":"Boleh, di jam yang berbeda dari obat.\n- Obatnya tampak berupa pengencer darah dan pencegah penggumpalan (clot), serta magnesium dan sodium untuk kontrol darah tinggi.\n- Minum Erojan di waktu makan yang berbeda dengan obat.\n- Saran awal Nutritionist Novrianti: bisa pagi hari sebelum obat.\n- Tambahan Dr Rizky: karena pagi dan siang sudah ada jadwal obat rutin, Erojan bisa diminum sore hari setelah makan.","p":["Erojan"],"k":"minum bersama obat/suplemen","s":"bersyarat","rd":false,"by":["Nutritionist Novrianti","Dr Rizky Nasution"],"d":"2025-08-03","n":1,"kasus":[{"d":"2025-08-03","t":"Obat diminum pagi sebelum sarapan (2 macam) dan sekitar pukul 11 setelah makan → Erojan sore hari setelah makan."}],"kw":["pengencer darah","antiplatelet","pencegah gumpalan","darah tinggi","hipertensi","jadwal minum","sore hari","obat rutin"]},{"id":331,"q":"Apakah penderita penyakit jantung bawaan VSD (lubang antar bilik/ventrikel jantung) boleh minum DVN?","a":"Boleh, dengan jeda dari obat dan evaluasi.\n- Jika sedang dalam pengobatan, beri jarak minimal beda waktu makan atau 8 jam dari obat.\n- Evaluasi setelah konsumsi selama 2 minggu pertama (tambahan Dr Rizky).","p":["DVN"],"k":"kondisi medis & penyakit","s":"bersyarat","rd":false,"by":["Nutritionist Novrianti","Dr Rizky Nasution"],"d":"2025-07-30","n":1,"kasus":[],"kw":["vsd","jantung bawaan","kelainan jantung","jantung bocor","ventrikel","jeda 8 jam","evaluasi 2 minggu"]},{"id":332,"q":"Apakah Erojan boleh untuk pasien jantung yang minum Nitrokaf Retard dan obat penurun tensi (tanpa riwayat diabetes)?","a":"Boleh, dengan jeda panjang dari obat.\n- Minum Erojan di waktu makan yang berbeda dengan obat.\n- Tambahan Dr Rizky: beri jarak antara obat rutin dan Erojan lebih dari 8 jam.","p":["Erojan"],"k":"minum bersama obat/suplemen","s":"bersyarat","rd":false,"by":["Nutritionist Novrianti","Dr Rizky Nasution"],"d":"2025-07-30","n":1,"kasus":[{"d":"2025-07-30","t":"Pasien jantung minum Nitrokaf Retard + obat penurun tensi, tanpa diabetes → jeda >8 jam dari obat rutin."}],"kw":["jantung","nitrokaf","nitrokaf retard","hipertensi","darah tinggi","obat tensi","jeda 8 jam"]},{"id":333,"q":"Berapa dosis DVN per hari — bolehkah diminum lebih, misalnya 4 butir sehari?","a":"2 butir (tablet) per hari — ikuti dosis anjuran ini.\n- Dosis 2 butir per hari dikonfirmasi Nutritionist Novrianti saat ditanya soal porsi konsumsi.\n- Jangan diminum 4 butir dalam sehari, karena tidak sesuai dengan dosis konsumsi yang dianjurkan (Dr Rizky Nasution).","p":["DVN"],"k":"cara minum & dosis","s":"info","rd":false,"by":["Dr Rizky Nasution","Nutritionist Novrianti"],"d":"2025-07-27","n":2,"kasus":[],"kw":["dosis","aturan minum","berapa tablet","berapa butir","2 butir","4 butir","sehari berapa","porsi","takaran","dosis berlebih","overdosis"]},{"id":334,"q":"Bagaimana mekanisme/patomekanisme cara kerja DVN (ditanyakan customer yang berprofesi dokter)?","a":"DVN tidak bekerja pada patofisiologi penyakit tertentu.\n- Suplemen seperti DVN bersifat pendukung dan pencegahan.\n- DVN memberikan zat gizi pada kulit untuk mempertahankan struktur kulit.\n- Membantu mencegah timbulnya gejala akibat paparan radikal bebas dari luar maupun dalam.","p":["DVN"],"k":"manfaat & hasil","s":"info","rd":false,"by":["Nutritionist Novrianti"],"d":"2025-07-26","n":1,"kasus":[],"kw":["mekanisme kerja","cara kerja","patomekanisme","patofisiologi","radikal bebas","struktur kulit","dokter"]},{"id":335,"q":"Apakah aman minum DVN saat masih masa pemulihan infeksi saluran kemih (ISK)?","a":"Boleh, dengan jeda dari obat.\n- Jika masih minum obat-obatan, beri jarak sekitar 6 jam dari konsumsi obat.","p":["DVN"],"k":"kondisi medis & penyakit","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2025-07-23","n":1,"kasus":[],"kw":["infeksi saluran kemih","isk","anyang-anyangan","saluran kencing","kencing","pemulihan","jeda 6 jam"]},{"id":336,"q":"Kenapa customer yang punya maag merasa nyeri seperti ditusuk di pinggang kanan setelah mulai minum DVN (diminum setelah makan)?","a":"Kemungkinan karena maag sedang kambuh.\n- Tanyakan dulu apakah ada konsumsi obat dan riwayat penyakit lain, serta pastikan DVN diminum dengan cukup air.\n- Nyeri kemungkinan karena maag kambuh dan asam lambung meningkat, ditambah asupan yang tinggi asam.\n- Redakan maag-nya terlebih dahulu.\n- Jika ingin minum DVN lagi, konsumsi di tengah-tengah makan.","p":["DVN"],"k":"efek samping & keluhan","s":"bersyarat","rd":false,"by":["Nutritionist Novrianti"],"d":"2025-07-22","n":1,"kasus":[{"d":"2025-07-22","t":"Customer dengan maag, tanpa obat/riwayat penyakit lain, nyeri pinggang kanan setelah minum DVN → redakan maag dulu, lalu minum DVN di tengah makan."}],"kw":["nyeri pinggang","sakit pinggang","maag","asam lambung","lambung","nyeri","di tengah makan","air minum"]},{"id":337,"q":"Apakah DVN mengandung bahan yang melancarkan peredaran darah, dan bagaimana cara minumnya bagi customer yang sedang minum obat?","a":"DVN tidak memiliki kandungan yang dapat meningkatkan atau melancarkan peredaran darah.\n- Jika customer ingin konsumsi, bedakan waktu makan antara obat dan DVN.\n- Contoh: siang minum obat, malam minum DVN.","p":["DVN"],"k":"minum bersama obat/suplemen","s":"bersyarat","rd":false,"by":["Nutritionist Novrianti"],"d":"2025-07-22","n":1,"kasus":[{"d":"2025-07-22","t":"Kondisi dan obat customer dikirim lewat gambar (tidak terbaca) → DVN boleh dengan beda waktu makan dari obat."}],"kw":["peredaran darah","sirkulasi darah","pengencer darah","obat rutin","jeda obat","beda waktu makan"]},{"id":338,"q":"Apakah penderita infeksi ginjal atau orang dengan riwayat infeksi ginjal boleh minum DVN?","a":"Boleh, dengan catatan:\n- Selama tidak ada pembatasan asupan vitamin dan mineral, masih bisa minum DVN.\n- Jika sudah sembuh dan berhenti minum obat, seharusnya tidak ada kontraindikasi terhadap DVN.\n- Minum DVN pada pagi atau siang hari.\n- Mulai 1 butir per hari dulu dan evaluasi selama 3 minggu; jika tidak ada keluhan dan kendala, boleh dinaikkan ke dosis normal DVN, 2 butir.","p":["DVN"],"k":"kondisi medis & penyakit","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution","Nutritionist Novrianti"],"d":"2025-07-19","n":2,"kasus":[{"d":"2025-07-19","t":"Infeksi ginjal tahun 2023 hanya diterapi obat, stop obat sejak Sep 2024 karena sudah sehat → DVN 1 butir/hari, evaluasi 3 minggu, lalu 2 butir."}],"kw":["infeksi ginjal","ginjal","riwayat ginjal","sakit ginjal","penyakit ginjal","pembatasan vitamin","pembatasan mineral","diet ginjal","dosis rendah","1 butir","evaluasi 3 minggu","kidney"]},{"id":339,"q":"Apakah Erojan boleh untuk penderita stroke ringan dengan hipertensi yang minum obat penenang? Perlukah penyesuaian dosis?","a":"Boleh dengan catatan:\n- Minum Erojan di waktu makan yang berbeda dengan obat.\n- Cek apakah konsumen juga minum obat pengencer darah; jika ya, cukup 1 kali sehari.\n- Alasannya, bahan seperti Tribulus terrestris bermanfaat melancarkan peredaran darah.","p":["Erojan"],"k":"kondisi medis & penyakit","s":"bersyarat","rd":false,"by":["Nutritionist Novrianti"],"d":"2025-07-18","n":1,"kasus":[{"d":"2025-07-18","t":"Stroke ringan + hipertensi + obat penenang → beda waktu makan; jika juga minum pengencer darah, 1x sehari."}],"kw":["stroke","stroke ringan","hipertensi","darah tinggi","obat penenang","pengencer darah","tribulus","dosis"]},{"id":340,"q":"Bagaimana jika konsumen (terutama yang punya riwayat maag) mengalami keluhan lambung setelah minum DVN — asam lambung naik, nyeri lambung, mual, kembung, atau diare?","a":"Minum DVN di tengah-tengah makan (bukan sesudah makan) atau dikunyah bersama makanan, mulai 1 tablet dulu.\n- Kemungkinan dipicu vitamin C dan pomegranate di DVN yang bersifat asam: bisa memicu asam lambung berlebih bila lambung kosong/luka atau sensitif, terutama pada riwayat maag aktif atau saat kondisi tubuh sedang menurun.\n- Gali dulu: makanan yang dimakan hari itu, sedang diet atau tidak, obat yang diminum, dan riwayat maag.\n- Mulai 1 tablet saja di pagi/siang hari; jika perlu boleh diminum bersamaan dengan obat maagnya.\n- Cara: makan dulu sedikit (mis. nasi + lauk 2 sendok makan), kunyah DVN, lalu lanjutkan makan; makanan tinggi protein membantu menahan rasa asam dari vitamin C.\n- Selama gangguan lambung kambuh, jaga asupan makanan: batasi tepung, susu, dan ragi.\n- Jika masih ada keluhan, berarti ambang toleransi asam lambung konsumen sudah sangat tipis dan DVN harus dihentikan.\n- Catatan: jawaban lama (2024-10-28, Dr Rizky Nasution) sempat menyarankan DVN diminum setelah makan; jawaban yang lebih baru (2025, Nutritionist Novrianti) menegaskan di tengah-tengah makan, bukan sesudah makan; ikuti yang terbaru.","p":["DVN"],"k":"efek samping & keluhan","s":"bersyarat","rd":false,"by":["Nutritionist Novrianti","Dr Rizky Nasution"],"d":"2025-07-16","n":4,"kasus":[{"d":"2024-05-21","t":"Konsumen 44 tahun, makan sehat dan tidak diet, tidak minum obat, riwayat maag tapi 4 tahun terkontrol; minum 1 butir/hari setelah makan, hari ke-2 mual, hari ke-3 diare dan maag kambuh → kunyah DVN di sela makan."},{"d":"2025-04-10","t":"Konsumen punya gangguan lambung (selama ini aman, makan teratur), beberapa hari minum DVN 1x pagi & 1x malam lalu muncul keluhan lambung & pusing → minum di tengah makan."}],"kw":["asam lambung","maag","gerd","lambung","nyeri lambung","lambung perih","mual","kembung","diare","vitamin c","di tengah makan","kunyah bersama makanan"]},{"id":341,"q":"Apakah Novia bisa menaikkan hormon progesteron?","a":"Novia lebih berkaitan dengan hormon estrogen, bukan difokuskan ke progesteron.\n- Fungsinya lebih untuk menjaga agar estrogen tidak berkurang drastis (di luar penyebab lain seperti penyakit kronis dan usia tua).\n- Novia untuk menjaga kesehatan wanita dan menyegarkan badan: meredakan gejala PMS atau menopause, kontrol menstruasi, dan menjaga daerah kewanitaan.\n- Saat ini fokusnya mengurangi gejala PMS dan menopause yang dipengaruhi hormon estrogen.","p":["Novia"],"k":"haid, hormon & menopause","s":"info","rd":false,"by":["Dr Rizky Nasution","Nutritionist Novrianti"],"d":"2025-07-13","n":1,"kasus":[],"kw":["progesteron","estrogen","hormon wanita","pms","menopause","haid","menstruasi"]},{"id":342,"q":"Apakah penderita autoimun rheumatoid arthritis (RA/radang sendi) boleh minum DVN?","a":"Boleh — tidak ada kontraindikasi DVN untuk RA, dengan catatan:\n- Beri jeda waktu antara DVN dan obat-obatan yang sedang diminum.\n- Bila rutin minum obat (mis. prednisolon) dan tidak ada pantangan, mulai 1 kali sehari dulu.\n- Kolagen memang bisa membantu pembentukan cairan sendi, tetapi jenisnya berbeda dengan kolagen di DVN; fokus manfaat DVN tetap untuk kesehatan kulit.\n- Tetap disarankan konsultasi ke dokter yang merawat bila ada informasi kondisi autoimunnya yang belum tersampaikan dengan jelas.","p":["DVN"],"k":"kondisi medis & penyakit","s":"bersyarat","rd":true,"by":["Dr Rizky Nasution","Nutritionist Novrianti"],"d":"2025-07-12","n":4,"kasus":[{"d":"2024-07-20","t":"Konsumen dengan rheumatoid arthritis, minum prednisolon tiap 2 hari sekali, ingin memperbaiki flek, kusam, dan kerutan → boleh mulai 1x sehari bila tidak ada pantangan."},{"d":"2024-10-22","t":"Konsumen terdiagnosis rheumatoid arthritis sejak 5 tahun → seharusnya aman, tetap konsultasi dokter yang merawat."},{"d":"2025-06-06","t":"Penderita RA yang sedang minum obat → boleh dengan jeda waktu dari obat; manfaat DVN tetap untuk kulit."}],"kw":["rheumatoid arthritis","ra","rematik","reumatik","radang sendi","autoimun","sendi","cairan sendi","prednisolon","steroid","jeda obat"]},{"id":343,"q":"Apakah DVN bisa membantu menghilangkan stretch mark (misalnya setelah melahirkan atau akibat kelebihan berat badan)?","a":"Perlu dikombinasikan dengan perawatan dari luar (DVN saja tidak cukup).\n- Stretch mark butuh lebih banyak waktu dan proses perawatan karena dermis kulit sudah mengalami peregangan sehingga timbul bekas.\n- Salah satu penyebabnya, dermis kulit kekurangan kolagen dan elastin.\n- Selain minum DVN, perlu perawatan dari luar agar tampilan stretch mark memudar.\n- Catatan: jawaban lama (2025-02-19, Dr Rizky Nasution) sempat menyebut DVN sepertinya tidak bisa membantu stretch mark, karena penanganannya berbeda dan ada krim tersendiri untuk perawatannya; ikuti yang terbaru.","p":["DVN"],"k":"manfaat & hasil","s":"info","rd":false,"by":["Nutritionist Novrianti","Dr Rizky Nasution"],"d":"2025-07-11","n":2,"kasus":[],"kw":["stretch mark","strechmark","guratan kulit","setelah melahirkan","pasca melahirkan","bekas hamil","kelebihan berat badan","krim stretch mark","elastin","kolagen","perawatan luar"]},{"id":344,"q":"Apakah DVN bisa membantu menghilangkan keloid?","a":"Tidak bisa menghilangkan keloid.\n- Yang mungkin dibantu DVN lebih ke meredakan kulit kering dan gatalnya.\n- Keloid punya pengobatan tersendiri yang harus dilakukan secara teratur dan berkelanjutan (Dr Rizky).","p":["DVN"],"k":"manfaat & hasil","s":"info","rd":false,"by":["Nutritionist Novrianti","Dr Rizky Nasution"],"d":"2025-07-11","n":1,"kasus":[{"d":"2025-07-11","t":"Keloid di punggung berawal dari jerawat yang digaruk → DVN tidak menghilangkan keloid."}],"kw":["keloid","bekas luka","benjolan kulit","jerawat","gatal","kulit kering","scar"]},{"id":345,"q":"Kenapa hasil tes testosteron customer bisa turun setelah rutin minum Erojan (padahal badan terasa makin prima), dan bagaimana menjawab serta menyarankannya?","a":"Banyak faktor yang memengaruhi kadar dan hasil tes testosteron, termasuk faktor usia yang merupakan proses alami.\n- Usia: seiring bertambahnya usia testosteron tetap akan menurun (di usia 60 tahun ini faktor alami tubuh yang tidak bisa dilawan); penurunan makin signifikan bila ada perubahan aktivitas yang ekstrem, olahraga berlebihan, atau asupan makan yang kurang (minimal cukup protein, zat besi, zinc).\n- Hasil tes juga dipengaruhi waktu tes (kadar berfluktuasi, puncaknya pagi hari), obat-obatan (mis. kortikosteroid, antikonvulsan), kondisi kronis (obesitas, diabetes, penyakit hati), dan gaya hidup (stres, kurang tidur, pola makan).\n- Cara merespons: jelaskan dengan tenang dan jelas bahwa faktor usia adalah proses alami kehidupan yang tidak bisa dilawan.\n- Sarankan pola olahraga yang baik dan sesuai kondisi tubuh, jangan tiba-tiba berlebihan atau terlalu berat (overtraining).\n- Jika tetap ingin minum Erojan secara teratur, gunakan sesuai dosis normal yang dianjurkan; manfaat Erojan bagi tubuh pria bukan semata-mata angka testosteron, tetapi juga daya tahan tubuh, stamina, dan kesegaran fisik.","p":["Erojan"],"k":"manfaat & hasil","s":"info","rd":false,"by":["Dr Rizky Nasution","Nutritionist Novrianti"],"d":"2025-07-07","n":2,"kasus":[{"d":"2025-06-30","t":"Pria 60 tahun, rutin minum Erojan (9 botol) dan rajin olahraga, hasil testosteron turun → jelaskan faktor usia; lanjut dosis normal bila mau."},{"d":"2025-07-07","t":"Badan terasa makin prima tetapi hasil tes testosteron turun → jelaskan faktor usia, olahraga berlebih, asupan, waktu tes, obat, dan gaya hidup."}],"kw":["testosteron turun","testosteron","tes testosteron","hasil lab","hormon pria","usia 60","lansia","overtraining","olahraga berlebihan","waktu tes","zinc","stamina"]},{"id":346,"q":"Apakah ibu hamil (atau menyusui) boleh minum DVN?","a":"Hanya boleh di bawah konsultasi dokter (kandungan).\n- Belum ada kajian langsung DVN pada ibu hamil, meskipun banyak kajian ilmiah menyatakan kolagen (dan glutathione) baik/aman untuk kehamilan, mis. membantu mencegah stretch mark.\n- Jika tidak ada keluhan, alergi, atau penyakit bawaan, DVN bisa dikonsumsi tetapi harus di bawah konsultasi dokter.\n- Perhatikan juga asupan vitamin, makanan, dan alergi, karena kondisi tubuh saat hamil unik dan berbeda.\n- Untuk ibu menyusui: kandungan DVN disebut aman selama tidak ada alergi atau penyakit bawaan, tetap konsultasi dulu ke dokter (jawaban 2024-03-17).\n- Catatan: jawaban lama (2024-12-21, Nutritionist Novrianti) sempat menyatakan tidak disarankan untuk ibu hamil karena DVN memakai Japanese knotweed (mengandung resveratrol) yang belum banyak didukung penelitian untuk ibu hamil; ikuti yang terbaru.","p":["DVN"],"k":"hamil, menyusui & promil","s":"bersyarat","rd":true,"by":["Nutritionist Novrianti"],"d":"2025-07-07","n":4,"kasus":[{"d":"2025-07-07","t":"Hamil 2 bulan → hanya dengan konsultasi dokter."}],"kw":["hamil","ibu hamil","bumil","kehamilan","menyusui","busui","asi","dokter kandungan","trimester 1","stretch mark","resveratrol","japanese knotweed"]},{"id":347,"q":"Apakah penderita stroke (sedang stroke ringan atau punya riwayat stroke) boleh minum DVN?","a":"Tergantung kondisinya:\n- Jika sedang mengalami stroke ringan (disertai hipertensi; minum obat hipertensi, vitamin otak, vitamin B12, kadang pengencer darah) → jangan dulu; konsumsi obat utamanya dulu untuk menghindari interaksi suplemen dengan obat yang sedang diminum (Dr Rizky, 2025-07).\n- Jika punya riwayat stroke dengan kadar D-dimer masih tinggi → boleh dengan catatan: bila masih minum obat-obatan, mulai DVN 1 kali sehari (Nutritionist Novrianti, 2025-03).","p":["DVN"],"k":"kondisi medis & penyakit","s":"tergantung","rd":false,"by":["Dr Rizky Nasution","Nutritionist Novrianti"],"d":"2025-07-03","n":2,"kasus":[{"d":"2025-03-22","t":"Konsumen pernah stroke, D-dimer masih tinggi → jika masih minum obat, mulai DVN 1x sehari."},{"d":"2025-07-03","t":"Hipertensi + stroke ringan di tangan kiri, minum obat hipertensi, vitamin otak, B12, kadang pengencer darah → utamakan obat."}],"kw":["stroke","stroke ringan","riwayat stroke","d-dimer","d dimer","pembekuan darah","hipertensi","darah tinggi","pengencer darah","vitamin b12","interaksi obat","obat rutin"]},{"id":348,"q":"Apakah BLZ Pro (BioLingzhi Pro) boleh diminum orang yang baru 2 minggu selesai operasi?","a":"Tergantung obat yang sedang diminum:\n- Jika sedang minum obat pengencer darah → jangan konsumsi BLZ Pro dulu.\n- Setelah obat pengencer darah dihentikan dan tidak ada keluhan nyeri maupun perdarahan → silakan konsumsi BLZ Pro, cukup 2 kali sehari.","p":["BLZ Pro"],"k":"pasca operasi & tindakan medis","s":"tergantung","rd":false,"by":["Nutritionist Novrianti"],"d":"2025-06-29","n":1,"kasus":[{"d":"2025-06-29","t":"Pasca operasi 2 minggu → tunda jika masih minum pengencer darah; setelah stop dan tanpa nyeri/perdarahan, 2x sehari."}],"kw":["operasi","pasca operasi","habis operasi","pengencer darah","perdarahan","biolingzhi","lingzhi","blz"]},{"id":349,"q":"Bagaimana jika customer Novia sakit kepala setelah 5 hari minum (dosis 1 kapsul/hari, di luar masa haid)?","a":"Stop dulu, lalu evaluasi.\n- Gali dulu: apakah ada riwayat hipotensi atau hipertensi, dan apakah pola makan teratur (pagi–siang–malam) selama minum Novia.\n- Hentikan konsumsi dulu agar keluhan tidak berkepanjangan.\n- Pantau apakah sakit kepala masih muncul saat tidak minum Novia.\n- Jika setelah berhenti keluhan hilang, boleh dicoba lagi dengan dosis 1 kapsul per 2 atau 3 hari.","p":["Novia"],"k":"efek samping & keluhan","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2025-06-24","n":1,"kasus":[{"d":"2025-06-24","t":"Tanpa riwayat hipo/hipertensi, pola makan teratur; sakit kepala hilang setelah berhenti → coba lagi 1 kapsul per 2–3 hari."}],"kw":["sakit kepala","pusing","pening","efek samping","dosis rendah","1 kapsul per 2 hari","hipertensi","hipotensi"]},{"id":350,"q":"Apakah wanita dengan FAM (fibroadenoma mammae/tumor jinak payudara) boleh minum DVN? Apakah DVN memengaruhi hormon estrogen?","a":"Tergantung kondisi hormonnya:\n- FAM bisa disebabkan hormon estrogen yang tinggi; jika kadar estrogen konsumen sedang tinggi, jangan minum DVN (dikhawatirkan memicu kadar estrogennya).\n- Ketidakseimbangan hormon memang dapat memengaruhi produksi kolagen di kulit, tetapi tidak berlaku sebaliknya; kabar bahwa kolagen memicu perkembangan sel kanker merujuk pada kolagen tipe VII, yang berbeda dari kolagen di DVN.\n- Sebaiknya konsultasikan dulu bahan-bahan DVN dengan dokter yang merawat.\n- Jika konsumsi (terutama bila sedang dalam pengobatan rutin), mulai dosis rendah 1 kali sehari dulu dan tetap di bawah pengawasan.\n- Catatan: jawaban lama (2024-12-18, Dr Rizky Nasution) membolehkan FAM minum DVN dengan dosis rendah 1x sehari tanpa membahas kadar estrogen; ikuti yang terbaru.","p":["DVN"],"k":"kondisi medis & penyakit","s":"tergantung","rd":true,"by":["Dr Rizky Nasution","Nutritionist Novrianti"],"d":"2025-06-19","n":3,"kasus":[{"d":"2025-06-19","t":"Wanita dengan FAM jinak ±10 tahun → hindari jika estrogen sedang tinggi; jika dalam pengobatan rutin, mulai 1x sehari."}],"kw":["fam","fibroadenoma","fibroadenoma mammae","tumor jinak payudara","tumor jinak","tumor payudara","benjolan payudara","payudara","estrogen","hormon","kolagen tipe vii","kanker"]},{"id":351,"q":"Apakah penyintas kanker yang sudah selesai pengobatan (selesai kemoterapi dan tidak minum obat lagi) atau punya riwayat kanker boleh minum DVN?","a":"Boleh dicoba, dengan catatan:\n- Syaratnya sudah sembuh, tidak ada pengobatan lanjutan, dan tidak ada pantangan dari dokternya.\n- Jika masih dalam konsultasi dan pengawasan dokter, tanyakan dulu apakah ada asupan makanan yang harus dihindari atau dibatasi.\n- Jika pantangan tersebut berbeda atau tidak terkandung di dalam DVN, mulai konsumsi 1 kali sehari dulu.\n- Untuk kondisi khusus seperti riwayat kanker kelenjar parotis, tanyakan dulu ke dokter yang merawat.","p":["DVN"],"k":"kondisi medis & penyakit","s":"bersyarat","rd":true,"by":["Nutritionist Novrianti"],"d":"2025-06-14","n":3,"kasus":[{"d":"2024-06-02","t":"Konsumen pernah kanker kelenjar parotis pada 2019 → tanyakan ke dokter yang merawat."},{"d":"2025-06-14","t":"Pasien kanker selesai kemo, sudah tidak minum obat → cek pantangan ke dokter, mulai DVN 1x sehari."}],"kw":["penyintas kanker","riwayat kanker","sembuh kanker","selesai kemo","kanker","cancer","kemoterapi","kanker rahim"
