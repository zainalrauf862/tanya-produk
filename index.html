:false,"by":["Nutritionist Novrianti"],"d":"2024-03-09","n":1,"kasus":[{"d":"2024-03-09","t":"Konsumen sedang pemulihan pasca operasi lutut dan masih minum obat dari dokter ortopedi → boleh."}],"kw":["operasi lutut","pasca operasi","pemulihan","ortopedi","penyembuhan luka","kolagen","obat dokter"]}];

}

function lev(a,b,max){

function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function hl(text, want){
  text=String(text||'');
  if (!want || !want.size) return esc(text);
  const re=/[\p{L}\p{N}]+(?:[.\-'][\p{L}\p{N}]+)*/gu; const words=[]; let m;
  while ((m=re.exec(text))) words.push({s:m.index,e:m.index+m[0].length,w:m[0]});
  const mark=new Array(words.length).fill(false);
  const nt=words.map(x=>{ const t=toks(x.w); return t.length===1?t[0]:t.join(''); });
  words.forEach((x,i)=>{
    const t=nt[i]; if(!t || STOP.has(t)) return;
    if (want.has(t) || want.has(stem(t)) || want.has(synOf(t)||'#')) mark[i]=true;
  });
  for (const h of findPhrases(nt)) if (want.has(h.canon)) for(let j=h.i;j<h.i+h.L;j++) mark[j]=true;
  let out='', pos=0, i=0;
  while (i<words.length){
    if (!mark[i]){ i++; continue; }
    let j=i; while (j+1<words.length && mark[j+1] && /^[\s,/-]*$/.test(text.slice(words[j].e,words[j+1].s))) j++;
    out+=esc(text.slice(pos,words[i].s))+'<mark>'+esc(text.slice(words[i].s,words[j].e))+'</mark>';
    pos=words[j].e; i=j+1;
  }
  return out+esc(text.slice(pos));
}

  $('lead').textContent = `📚 TANYA PRODUK — ${n} jawaban Medical Advisor Wellous Indonesia · update ${META.updated||''}`;
  $('src').textContent = `Sumber: Grup WhatsApp "Indo - Product Q & A" (${fmtD(META.from)} – ${fmtD(META.to)}) · jawaban ${META.experts||'Medical Advisor Wellous Indonesia'}. `+
    `Ini pegangan internal tim — ke customer pakai bahasa sendiri & patuhi aturan klaim BPOM (tanpa klaim menyembuhkan / awet muda / memutihkan). Kalau ragu atau kasusnya berat, tanya lagi ke grup.`;
  $('foot').textContent = `Dirangkum dari ekspor chat grup "Indo - Product Q & A" · ${n} entri · bukan pengganti pemeriksaan dokter.`;
  const quick=['novia menyusui','dvn diabetes','s-glow bareng obat','erojan darah tinggi','novia kista / miom','haid tidak teratur','efek samping dvn','cara minum novia'];
  $('quick').innerHTML = '<span>Contoh:</span>'+quick.map(x=>`<button type="button">${esc(x)}</button>`).join('');
  $('quick').querySelectorAll('button').forEach(b=>b.onclick=()=>{ $('q').value=b.textContent+' '; onInput(true); $('q').focus(); });
  const cats=[...new Set(QA.map(e=>e.k).filter(Boolean))].sort();
  $('cat').innerHTML='<option value="">Semua kategori</option>'+cats.map(c=>`<option>${esc(c)}</option>`).join('');
  $('st').innerHTML='<option value="">Semua status</option>'+Object.entries(STATUS).map(([k,v])=>`<option value="${k}">${v[0]} ${v[1]}</option>`).join('')+'<option value="rd">🩺 Rujuk dokter</option>';
  $('sort').innerHTML='<option value="auto">Urutan: paling cocok / terbaru</option><option value="new">Terbaru dulu</option><option value="old">Terlama dulu</option><option value="freq">Paling sering ditanya</option>';
}
function baseList(){
  if (state.q.trim()){
    lastRes=search(state.q);
    want=new Set(); for (const c of lastRes.A.concepts) for (const k of c.alts.keys()) want.add(k);
    return lastRes.hits.map(h=>({e:h.d.e, sc:h.sc, rel:h.sc/(lastRes.top||1)}));
  }
  lastRes=null; want=new Set();
  return QA.map(e=>({e,sc:0,rel:0}));
}
function passFilters(x, ignoreProd){
  const e=x.e;
  if (!ignoreProd && state.prod!=='Semua' && !(e.p||[]).includes(state.prod)) return false;
  if (state.cat && e.k!==state.cat) return false;
  if (state.st==='rd'){ if(!e.rd) return false; }
  else if (state.st && e.s!==state.st) return false;
  return true;
}
function sortList(arr){
  const byNew=(a,b)=>(b.e.d||'').localeCompare(a.e.d||'');
  const s=state.sort;
  if (s==='new') arr.sort(byNew);
  else if (s==='old') arr.sort((a,b)=>(a.e.d||'').localeCompare(b.e.d||''));
  else if (s==='freq') arr.sort((a,b)=>(b.e.n||1)-(a.e.n||1)||byNew(a,b));
  else if (!state.q.trim()) arr.sort(byNew);
  return arr;
}
function renderChips(base){
  const counts={Semua:0}; for (const p of PRODUCTS) counts[p]=0;
  for (const x of base){ if(!passFilters(x,true)) continue; counts.Semua++; for (const p of (x.e.p||[])) if(p in counts) counts[p]++; }
  const order=['Semua',...PRODUCTS.filter(p=>PROD_COUNT[p]).sort((a,b)=>(PROD_COUNT[b]||0)-(PROD_COUNT[a]||0))];
  $('chips').innerHTML = order.map(p=>`<button type="button" class="chip${state.prod===p?' on':''}" data-p="${esc(p)}"${counts[p]||state.prod===p?'':' disabled'}>${esc(p)}<span class="n">${counts[p]}</span></button>`).join('');
  $('chips').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{ state.prod=b.dataset.p; state.shown=PAGE; render(); syncURL(); });
}
function relLabel(r){ return r>=.66?'paling cocok':r>=.33?'cocok':'mungkin terkait'; }
function cardHTML(x, idx){
  const e=x.e, st=STATUS[e.s];
  const prods=(e.p||[]).map(p=>`<span class="tag">${esc(p)}</span>`).join('');
  const by=(e.by||[]).join(', ');
  const ks=(e.kasus||[]).filter(k=>k.t);
  const kasus = ks.length ? `<div class="kasus">📚 Kasus: ${ks.map(k=>hl(k.t,want)+(k.d?` (${esc(k.d)})`:'')).join('; ')}</div>` : '';
  return `<article class="card" id="qa-${e.id}">
    <h3 class="q">${hl(e.q,want)}</h3>
    <div class="a">${answerHTML(e.a,want)}</div>
    <div class="meta">${prods}${e.k?`<span>${esc(e.k)}</span>`:''}<span>·</span><span class="who">${esc(by)}</span><span>· ${esc(e.d||'')}</span>
      ${st?`<span class="badge ${st[2]}">${st[0]} ${st[1]}</span>`:''}${e.rd?'<span class="badge rd">🩺 rujuk dokter</span>':''}${(e.n||1)>1?`<span class="badge cnt">ditanya ${e.n}×</span>`:''}${(e.d||'')<'2025-01-01'?'<span class="badge old" title="Dijawab tahun 2024 — kalau ragu, konfirmasi ulang ke grup">jawaban lama</span>':''}
      ${state.q.trim()&&x.rel?`<span class="rel">${relLabel(x.rel)}</span>`:''}
      <span class="sp"></span><button type="button" class="copy" data-i="${idx}">Salin</button></div>
    ${kasus}
    <details class="relbox" data-id="${e.id}"><summary>Pertanyaan terkait</summary><div class="relc"></div></details>
  </article>`;
}
function answerHTML(a,w){
  return String(a||'').split('\n').map(line=>{
    if (/^-\s*Catatan:/i.test(line)) return `<div class="note">🕘 ${hl(line.replace(/^-\s*/,''),w)}</div>`;
    if (/^-\s*⚠️/.test(line)) return `<div class="warn">${hl(line.replace(/^-\s*/,''),w)}</div>`;
    return `<div>${hl(line,w)}</div>`;
  }).join('');
}
const BYID=new Map(QA.map(e=>[String(e.id),e]));
function related(e){
  const r=search(e.q+' '+(e.kw||[]).slice(0,4).join(' '));
  const top=r.hits.find(h=>h.d.e.id!==e.id); if(!top) return [];
  return r.hits.filter(h=>h.d.e.id!==e.id && h.sc>=top.sc*.4).slice(0,3).map(h=>h.d.e);
}
function relatedHTML(e){
  const rs=related(e);
  if(!rs.length) return '<div class="rm">Belum ada pertanyaan lain yang mirip.</div>';
  return rs.map(x=>{const st=STATUS[x.s];return `<div class="ri"><div class="rq">${esc(x.q)}</div><div class="ra">${answerHTML(x.a,null)}</div><div class="rm">${esc((x.p||[]).join(', '))}${st?' · '+st[0]+' '+st[1]:''} · ${esc((x.by||[]).join(', '))} · ${esc(x.d||'')}</div></div>`;}).join('');
}
function render(){
  const base=baseList();
  renderChips(base);
  current=sortList(base.filter(x=>passFilters(x,false)));
  const q=state.q.trim();
  const fix=$('fix');
  if (lastRes && lastRes.A.fixes.length){ fix.hidden=false; fix.textContent='🔎 Salah ketik? Dicari juga: '+lastRes.A.fixes.map(([a,b])=>`${a} → ${b}`).join(', '); }
  else fix.hidden=true;
  const total=current.length, shown=Math.min(state.shown,total);
  if (q) $('status').innerHTML = total ? `<b>${total}</b> jawaban relevan untuk “${esc(q)}” — ${state.sort==='auto'?'diurutkan dari yang paling cocok':'urutan dipilih manual'}.` : '';
  else $('status').innerHTML = `Jawaban terbaru dulu. Ketik pertanyaan di atas untuk mencari. <span style="color:var(--faint)">(${total} entri)</span>`;
  if (!total){
    $('list').innerHTML = `<div class="empty"><b>Belum ada jawaban yang cocok.</b><br>Coba kata lain (nama penyakit / obat / keluhan), kurangi filter, atau tanyakan ke grup Q&amp;A.</div>`;
  } else {
    $('list').innerHTML = current.slice(0,shown).map((x,i)=>cardHTML(x,i)).join('');
  }
  $('more').hidden = shown>=total;
  $('more').textContent = `Tampilkan lebih banyak (${total-shown} lagi)`;
}
function renderSugg(){
  const box=$('sugg'), q=state.q.trim();
  if (!q || document.activeElement!==$('q')){ box.classList.remove('on'); $('q').setAttribute('aria-expanded','false'); return; }
  const top=current.slice(0,6);
  if (!top.length){ box.innerHTML='<div class="hd">Tidak ada yang cocok — coba kata lain</div>'; box.classList.add('on'); return; }
  box.innerHTML = '<div class="hd">Pertanyaan paling mirip</div>'+top.map((x,i)=>{
    const st=STATUS[x.e.s];
    return `<button type="button" class="opt${i===state.sel?' act':''}" role="option" id="opt${i}" data-id="${x.e.id}">${hl(x.e.q,want)}<small>${esc((x.e.p||[]).join(', '))}${st?' · '+st[0]+' '+st[1]:''} · ${esc(x.e.d||'')}</small></button>`;
  }).join('') + (current.length>6?`<button type="button" class="more">Lihat semua ${current.length} hasil ↓</button>`:'');
  box.classList.add('on'); $('q').setAttribute('aria-expanded','true');
  box.querySelectorAll('.opt').forEach(b=>b.onmousedown=ev=>{ ev.preventDefault(); openCard(b.dataset.id); });
  const mo=box.querySelector('.more'); if (mo) mo.onmousedown=ev=>{ ev.preventDefault(); closeSugg(); $('list').scrollIntoView({behavior:'smooth'}); };
}
function closeSugg(){ state.sel=-1; $('sugg').classList.remove('on'); $('q').setAttribute('aria-expanded','false'); }
function openCard(id){
  closeSugg(); $('q').blur();
  const idx=current.findIndex(x=>String(x.e.id)===String(id));
  if (idx>=state.shown){ state.shown=idx+1; render(); }
  const el=$('qa-'+id); if(!el) return;
  el.scrollIntoView({behavior:'smooth',block:'start'});
  el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
}
let tmr=null, urlTmr=null;
function onInput(now){
  state.q=$('q').value; state.shown=PAGE; state.sel=-1;
  $('clr').classList.toggle('on', !!state.q);
  clearTimeout(tmr);
  tmr=setTimeout(()=>{ render(); renderSugg(); }, now?0:110);
  clearTimeout(urlTmr); urlTmr=setTimeout(syncURL,600);
}
function syncURL(){
  try{
    const u=new URL(location.href);
    state.q.trim()?u.searchParams.set('q',state.q.trim()):u.searchParams.delete('q');
    state.prod!=='Semua'?u.searchParams.set('p',state.prod):u.searchParams.delete('p');
    history.replaceState(null,'',u);
  }catch(e){}
}
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),1600); }
function copyText(s){
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(s);
  const ta=document.createElement('textarea'); ta.value=s; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }finally{ ta.remove(); }
  return Promise.resolve();
}
function setTheme(t){
  if (t) document.documentElement.setAttribute('data-theme',t); else document.documentElement.removeAttribute('data-theme');
  const dark = t ? t==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  $('theme').textContent = dark?'☀️ Light':'🌙 Dark';
}
function init(){
  initHeader();
  let saved=null; try{ saved=localStorage.getItem('tp-theme'); }catch(e){}
  setTheme(saved);
  $('theme').onclick=()=>{ const dark=document.documentElement.getAttribute('data-theme')==='dark' || (!document.documentElement.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
    const t=dark?'light':'dark'; setTheme(t); try{ localStorage.setItem('tp-theme',t); }catch(e){} };
  const q=$('q');
  q.addEventListener('input',()=>onInput(false));
  q.addEventListener('focus',()=>renderSugg());
  q.addEventListener('blur',()=>setTimeout(closeSugg,120));
  q.addEventListener('keydown',ev=>{
    const opts=[...$('sugg').querySelectorAll('.opt')];
    if (ev.key==='ArrowDown'&&opts.length){ ev.preventDefault(); state.sel=(state.sel+1)%opts.length; renderSugg(); q.setAttribute('aria-activedescendant','opt'+state.sel); }
    else if (ev.key==='ArrowUp'&&opts.length){ ev.preventDefault(); state.sel=(state.sel-1+opts.length)%opts.length; renderSugg(); q.setAttribute('aria-activedescendant','opt'+state.sel); }
    else if (ev.key==='Enter'){ ev.preventDefault(); if (state.sel>=0&&opts[state.sel]) openCard(opts[state.sel].dataset.id); else { clearTimeout(tmr); render(); closeSugg(); q.blur(); } }
    else if (ev.key==='Escape'){ closeSugg(); }
  });
  $('clr').onclick=()=>{ q.value=''; onInput(true); q.focus(); };
  $('go').onclick=()=>{ clearTimeout(tmr); state.q=q.value; render(); closeSugg(); q.blur(); if(state.q.trim()) $('status').scrollIntoView({behavior:'smooth',block:'start'}); };
  $('cat').onchange=e=>{ state.cat=e.target.value; state.shown=PAGE; render(); };
  $('st').onchange=e=>{ state.st=e.target.value; state.shown=PAGE; render(); };
  $('sort').onchange=e=>{ state.sort=e.target.value; state.shown=PAGE; render(); };
  $('more').onclick=()=>{ state.shown+=PAGE; render(); };
  $('list').addEventListener('toggle',ev=>{
    const d=ev.target; if(!d.classList||!d.classList.contains('relbox')||!d.open) return;
    const box=d.querySelector('.relc'); if(box.dataset.done) return;
    const e=BYID.get(d.dataset.id); if(!e) return;
    box.innerHTML=relatedHTML(e); box.dataset.done='1';
  },true);
  $('list').addEventListener('click',ev=>{
    const b=ev.target.closest('.copy'); if(!b) return;
    const e=current[+b.dataset.i]?.e; if(!e) return;
    copyText(`❓ ${e.q}\n${e.a}\n— ${(e.by||[]).join(', ')} (${e.d})`).then(()=>toast('Jawaban disalin'),()=>toast('Gagal menyalin'));
  });
  try{
    const u=new URL(location.href);
    const p=u.searchParams.get('p'); if (p && PRODUCTS.includes(p)) state.prod=p;
    const qq=u.searchParams.get('q'); if (qq){ q.value=qq; state.q=qq; $('clr').classList.add('on'); }
  }catch(e){}
  render();
}
init();
</script>
</body>
</html>
