,"kanker parotis","kelenjar parotis","pantangan makanan","onkologi"]},{"id":352,"q":"Apakah lansia (di atas 60 tahun) yang sudah pasang ring jantung dan rutin minum obat pengencer darah serta obat jantung, kolesterol, atau hipertensi lainnya boleh minum Erojan?","a":"Boleh, tapi cukup 1 kapsul per hari dan reaksinya harus benar-benar diperhatikan.\n- Cukup 1 kapsul per hari supaya tidak memberatkan fungsi jantung; dosis ini untuk seterusnya karena usia sudah di atas 60 tahun dan obat seumur hidupnya adalah prioritas yang harus diutamakan.\n- Minum setelah makan pagi atau siang; jangan diminum malam hari.\n- Jeda dengan obat: setelah makan minum obat dulu, lalu 1–2 jam kemudian baru Erojan.\n- Asupan obat pengencer darahnya cukup banyak dan riwayat kesehatannya cukup berisiko, jadi perhatikan benar reaksinya — dikhawatirkan nanti Erojan yang disalahkan bila muncul rasa tidak nyaman.","p":["Erojan"],"k":"kondisi medis & penyakit","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution","Nutritionist Novrianti"],"d":"2025-06-10","n":2,"kasus":[{"d":"2024-07-10","t":"Konsumen 67 tahun, pasang 4 ring jantung sejak 3,5 tahun lalu, minum Aspilet (pengencer darah), obat nyeri (nitrocap), atorvastatin (kolesterol), dan bisoprolol → boleh dicoba 1 kapsul di pagi hari sambil dipantau reaksinya."},{"d":"2025-06-10","t":"Usia 63 tahun, riwayat pasang ring jantung, minum Xarelto + obat kolesterol/hipertensi/diabetes seumur hidup → Erojan 1 kapsul/hari seterusnya, pagi/siang setelah makan, 1–2 jam setelah obat."}],"kw":["ring jantung","stent","pengencer darah","xarelto","aspilet","atorvastatin","bisoprolol","jantung","lansia","obat seumur hidup","kolesterol","dosis erojan"]},{"id":353,"q":"Bolehkah Erojan diminum tanpa makan bagi yang menjalani intermittent fasting (tidak sarapan)?","a":"Sebaiknya diminum setelah makan.\n- Konsumsi Erojan dalam keadaan sudah makan, jangan saat perut kosong.\n- Tujuannya mengurangi potensi efek samping suplemen ke lambung.","p":["Erojan"],"k":"cara minum & dosis","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2025-06-09","n":1,"kasus":[{"d":"2025-06-09","t":"Menjalani intermittent fasting tanpa sarapan → Erojan diminum setelah makan."}],"kw":["intermittent fasting","puasa","perut kosong","setelah makan","jadwal minum","lambung","tanpa makan"]},{"id":354,"q":"Kenapa DVN terasa manis — berapa kandungan gula/sukralosanya, dan apakah pemanis buatan (sukralosa) di DVN aman?","a":"Aman. Pemanis DVN adalah sukralosa (sucralose, pemanis buatan) dengan kadar di bawah batas yang diperbolehkan BPOM.\n- Penggunaannya di bawah batas yang diperbolehkan BPOM untuk produk (< 2.400 mg/kg).\n- Produk sudah melewati review BPOM sehingga terbukti aman dikonsumsi.\n- Sukralosa tidak akan menaikkan gula darah secara drastis.\n- Catatan: jawaban lama sempat menyebut angka batas yang berbeda — '< 2,4 mg' (2024-03-18, Nutritionist Novrianti) dan 'batas maksimal 60 mg/kg dihitung terhadap produk siap konsumsi; kadar DVN jauh dari batas maksimum' (2025-02-11, Nutritionist Novrianti; referensi BPOM: https://standarpangan.pom.go.id/component/fabrik/details/47/626); ikuti yang terbaru.","p":["DVN"],"k":"kandungan & keamanan produk","s":"boleh","rd":false,"by":["Nutritionist Novrianti"],"d":"2025-06-05","n":4,"kasus":[{"d":"2024-04-21","t":"Konsumen bertanya kenapa DVN terasa manis, berbeda dengan D'Vine yang terasa segar seperti jeruk → pemanisnya sukralosa, masih di bawah batas aman."},{"d":"2025-02-11","t":"Konsumen ragu minum DVN karena ada sukralosa → kadarnya jauh di bawah batas maksimum & sudah lolos review BPOM."}],"kw":["sukralosa","sucralose","pemanis buatan","pemanis","kadar sukralosa","gula","kandungan gula","rasa manis","gula darah","bpom","batas aman","d'vine"]},{"id":355,"q":"Berapa batas normal konsumsi gula per hari untuk orang dewasa (sering ditanyakan bersamaan dengan kandungan gula DVN)?","a":"Sekitar 35–50 gram per hari.\n- Berlaku untuk pria dewasa maupun perempuan dewasa.","p":["Umum"],"k":"menjawab customer & lainnya","s":"info","rd":false,"by":["Dr Rizky Nasution"],"d":"2025-06-05","n":1,"kasus":[],"kw":["gula","batas gula","konsumsi gula harian","asupan gula","gram gula","kesehatan umum"]},{"id":356,"q":"Apakah penderita lupus (autoimun) yang sedang minum obat methil boleh minum DVN, dan berapa lama jedanya dengan obat?","a":"Boleh dengan jeda 6 jam, tetapi pastikan dulu ke dokter yang merawat.\n- Tanyakan apakah konsumen sudah pernah berkonsultasi ke dokternya soal minum DVN bersamaan dengan methil.\n- Dari sisi penasihat, beri jeda 6 jam antara minum methil dan DVN.\n- Tetap pastikan dengan dokter yang langsung memeriksa pasien, karena mungkin ada kondisi yang tidak kita ketahui dari detail pemeriksaannya.","p":["DVN"],"k":"minum bersama obat/suplemen","s":"bersyarat","rd":true,"by":["Dr Rizky Nasution"],"d":"2025-06-04","n":1,"kasus":[{"d":"2025-06-04","t":"Penderita lupus yang minum methil → jeda 6 jam dari DVN dan konfirmasi ke dokter yang merawat."}],"kw":["lupus","sle","autoimun","methil","methylprednisolone","steroid","jeda obat","6 jam"]},{"id":357,"q":"Apakah DVN bisa membantu kulit alergi (gatal, ruam kemerahan, sampai kulit menghitam)?","a":"Pastikan dulu diagnosisnya ke dokter (dokter kulit/Sp.KK) sebelum memutuskan minum DVN.\n- Dikhawatirkan ini bukan penyakit kulit biasa dan bisa mengarah ke autoimun, apalagi bila belum pernah diperiksa dokter.\n- Perlu tahu dari diagnosis dokter apa pemicu alerginya dan apakah ada eksim (eczema) atau tidak.\n- Fungsi DVN lebih kepada memberikan gizi yang sesuai untuk menjaga kesehatan.","p":["DVN"],"k":"kondisi medis & penyakit","s":"tergantung","rd":true,"by":["Dr Rizky Nasution","Nutritionist Novrianti"],"d":"2025-06-02","n":2,"kasus":[{"d":"2024-06-29","t":"Konsumen gatal dan ruam merah meradang (makin digaruk makin gatal), sudah minum Dextafen dan pakai salep Pi Kang Shuang tapi belum membaik."},{"d":"2025-06-02","t":"Kulit awalnya alergi gatal lalu menghitam (gosong), belum pernah diperiksa dokter → periksa ke Sp.KK dulu."}],"kw":["alergi kulit","gatal","ruam","kulit merah","kulit menghitam","gosong","eksim","eczema","dermatitis","autoimun","dokter kulit","sp.kk"]},{"id":358,"q":"Apakah ada bahan di Novia yang bisa memicu GERD kambuh?","a":"Pastikan konsumen sudah makan sebelum minum Novia.\n- Saran ini untuk kondisi GERD yang sedang kambuh: jangan minum Novia saat perut kosong.","p":["Novia"],"k":"efek samping & keluhan","s":"bersyarat","rd":false,"by":["Nutritionist Novrianti"],"d":"2025-05-28","n":1,"kasus":[{"d":"2025-05-28","t":"Customer Novia dengan GERD yang kambuh → pastikan makan dulu sebelum minum Novia."}],"kw":["gerd","asam lambung","maag","lambung","perut kosong","setelah makan","kambuh"]},{"id":359,"q":"Apakah Novia bisa untuk mengatasi anxiety (gangguan kecemasan)?","a":"Bukan untuk itu.\n- Fokus utama Novia adalah meredakan gejala PMS, seperti rasa cemas atau gelisah dan mood swing.\n- Novia bukan untuk masalah psikologis seperti anxiety.","p":["Novia"],"k":"manfaat & hasil","s":"info","rd":false,"by":["Nutritionist Novrianti"],"d":"2025-05-28","n":1,"kasus":[],"kw":["anxiety","cemas","gelisah","kecemasan","mood swing","pms","psikologis","mental"]},{"id":360,"q":"Apakah bahan-bahan Erojan bisa meningkatkan DHT (yang dikhawatirkan memicu rambut rontok)?","a":"Erojan tidak untuk menambah atau mengurangi hormon.\n- Bahan-bahan Erojan membantu menjaga stamina dan menjaga kesehatan hormon seksual, yaitu testosteron.\n- Fungsinya menjaga, bukan menambahkan atau mengurangi kadar hormon.","p":["Erojan"],"k":"haid, hormon & menopause","s":"info","rd":false,"by":["Nutritionist Novrianti"],"d":"2025-05-27","n":1,"kasus":[{"d":"2025-05-27","t":"Customer khawatir rambut rontok dan sedang minum DHT blocker Finasteride 5 mg → dijelaskan Erojan tidak menambah/mengurangi hormon (interaksi dengan Finasteride tidak dibahas khusus)."}],"kw":["dht","testosteron","rambut rontok","botak","finasteride","dht blocker","hormon pria"]},{"id":361,"q":"Apakah Erojan bisa menyebabkan air liur jadi sangat banyak?","a":"Bahan Erojan tidak ada yang memengaruhi produksi air liur.\n- Nutritionist sudah mengecek semua bahan Erojan: tidak ada yang memengaruhi produksi saliva (air liur).","p":["Erojan"],"k":"efek samping & keluhan","s":"info","rd":false,"by":["Nutritionist Novrianti"],"d":"2025-05-22","n":1,"kasus":[{"d":"2025-05-22","t":"Konsumen Erojan (tanpa obat lain) mengeluh air liur jadi sangat banyak setelah minum."}],"kw":["air liur","saliva","ludah","liur banyak","hipersalivasi","efek samping"]},{"id":362,"q":"Kenapa customer sakit kepala dan hidung terasa tidak nyaman setelah minum Coffiyy (½ sachet ditaruh di bawah lidah tanpa air)?","a":"Minum sesuai anjuran; pusing dan badan panas bisa timbul dari kandungan kopi & guarana.\n- Anjuran minum Coffiyy: 1 sachet dilarutkan dalam 50 ml air.\n- Disarankan beraktivitas setelah minum.\n- Coffiyy mengandung kopi dan guarana yang dapat meningkatkan aliran darah secara cepat dan pembakaran energi; efek yang bisa timbul adalah badan terasa panas dan pusing.","p":["Coffiyy"],"k":"efek samping & keluhan","s":"info","rd":false,"by":["Nutritionist Novrianti"],"d":"2025-05-13","n":1,"kasus":[{"d":"2025-05-13","t":"Konsumen minum ½ sachet Coffiyy ditaruh di bawah lidah tanpa air, tidak biasa minum kopi/teh → sakit kepala."}],"kw":["coffiyy","coffiy","sakit kepala","pusing","cara minum","guarana","kafein","kopi"]},{"id":363,"q":"Apakah Erojan bisa memecah lemak dada pada pria?","a":"Setahu dokter, tidak.\n- Karena fungsi Erojan berbeda.","p":["Erojan"],"k":"manfaat & hasil","s":"info","rd":false,"by":["Dr Rizky Nasution"],"d":"2025-05-13","n":1,"kasus":[],"kw":["lemak dada","ginekomastia","gynecomastia","dada pria","membakar lemak","fungsi erojan"]},{"id":364,"q":"Apakah orang yang sudah bypass jantung dan minum 5 macam obat (2 pagi, 3 sore) boleh minum Erojan 1x sehari?","a":"Boleh, 1x sehari saja.\n- Dosis Erojan cukup 1x sehari.\n- Minum setelah makan siang.","p":["Erojan"],"k":"kondisi medis & penyakit","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2025-05-09","n":1,"kasus":[{"d":"2025-05-09","t":"Konsumen pasca bypass jantung, minum 5 obat (2 pagi, 3 sore) → Erojan 1x sehari setelah makan siang."}],"kw":["bypass jantung","operasi jantung","jantung","obat jantung","1x sehari","makan siang"]},{"id":365,"q":"Apakah pasien kanker lidah yang lidahnya sudah tidak ada (diangkat) boleh minum DVN dengan cara ditelan bersama air?","a":"Boleh dicoba dengan setengah dosis dulu.\n- Mulai dengan dosis setengah.\n- Pertimbangannya: cara penyerapan DVN seharusnya bukan dengan ditelan.","p":["DVN"],"k":"kondisi medis & penyakit","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2025-05-02","n":1,"kasus":[{"d":"2025-05-02","t":"Konsumen kanker lidah, lidah sudah tidak ada, akan minum DVN dengan ditelan langsung bersama air putih → coba setengah dosis."}],"kw":["kanker lidah","lidah diangkat","tanpa lidah","ditelan","cara minum dvn","setengah dosis","cancer"]},{"id":366,"q":"Apakah customer dengan riwayat ITP (sudah tidak minum obat dan tanpa keluhan) boleh minum DVN?","a":"Boleh, mulai dosis rendah (1 tablet sehari).\n- ITP adalah penyakit autoimun yang menyerang sel darah (trombosit), sehingga sering menyebabkan memar dan perdarahan; pasien ITP seharusnya rutin minum obat ataupun multivitamin tambahan.\n- Pastikan dulu pengobatan ITP-nya sudah selesai dan saat ini tidak ada keluhan.\n- Jika sudah selesai pengobatan dan tanpa keluhan: mulai DVN dosis rendah, 1 tablet per hari.","p":["DVN"],"k":"kondisi medis & penyakit","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2025-05-01","n":1,"kasus":[{"d":"2025-05-01","t":"Konsumen riwayat ITP, sudah tidak minum obat, trombosit terakhir drop 10 tahun lalu, kini tanpa keluhan → DVN 1 tablet/hari."}],"kw":["itp","trombosit rendah","trombositopenia","autoimun","memar","perdarahan","dosis rendah"]},{"id":367,"q":"Apakah penderita ginjal polikistik yang masih rutin minum obat boleh minum DVN?","a":"Tidak disarankan selama masih minum obat rutin.\n- Utamakan obatnya dulu, karena fungsi ginjal masih dalam keadaan terganggu.\n- Jangan diberikan multivitamin yang memperberat kerja ginjal.\n- Untuk yang sudah tidak minum obat, belum ada jawaban di diskusi ini.","p":["DVN"],"k":"kondisi medis & penyakit","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2025-04-23","n":1,"kasus":[],"kw":["ginjal polikistik","polycystic kidney","pkd","ginjal","fungsi ginjal","multivitamin","obat rutin"]},{"id":368,"q":"Apakah Novia bisa mengatasi kekeringan pada organ kewanitaan (vagina) pada wanita menopause?","a":"Tidak bisa mengatasi keluhan tersebut secara langsung.\n- Kekeringan organ kewanitaan memang salah satu keluhan menopause.\n- Menopause berhubungan dengan berkurangnya produksi hormon normal di tubuh, sehingga Novia tidak bisa berefek langsung untuk mengatasinya.","p":["Novia"],"k":"haid, hormon & menopause","s":"info","rd":false,"by":["Dr Rizky Nasution"],"d":"2025-04-23","n":1,"kasus":[],"kw":["menopause","vagina kering","kekeringan vagina","miss v kering","hormon","keluhan menopause"]},{"id":369,"q":"Apakah konsumen dengan benjolan/tumor di payudara yang belum jelas jenisnya atau belum diangkat (termasuk benjolan di puting atau kelenjar payudara) boleh minum DVN?","a":"Periksakan dulu benjolannya sebelum minum DVN.\n- Lebih disarankan melakukan pengecekan dan perawatan terlebih dahulu; pastikan dulu benjolannya mengarah ke apa (misalnya kanker atau pembengkakan).\n- Jika ada infeksi dan perlu minum obat, sebaiknya selesaikan dulu pengobatannya.\n- Jika masih dalam masa pengobatan, konsultasikan dulu ke dokter yang merawat.\n- Catatan: jawaban lama (2024-03-12, Nutritionist Novrianti) sempat menyatakan boleh untuk tumor payudara yang belum diangkat, dengan alasan antioksidan dalam DVN seharusnya cukup tinggi untuk mencegah tumor tumbuh; ikuti yang terbaru.","p":["DVN"],"k":"kondisi medis & penyakit","s":"tidak","rd":true,"by":["Nutritionist Novrianti","Dr Rizky Nasution"],"d":"2025-04-17","n":3,"kasus":[{"d":"2024-03-12","t":"Konsumen 39 tahun, tumor payudara belum diangkat, sedang minum herbal Zymuno dan suplemen SOP Daily → boleh menurut penasihat."},{"d":"2025-04-17","t":"Konsumen punya benjolan di puting payudara dan takut makin besar → cek & rawat dulu."}],"kw":["benjolan payudara","benjolan","tumor payudara","tumor","payudara","kelenjar payudara","puting","pembengkakan","belum diangkat","kanker payudara","infeksi","konsultasi dokter"]},{"id":370,"q":"Berapa ukuran scarf hadiah promo Ramadan 2025?","a":"120 cm x 120 cm.\n- Ukuran scarf promo Ramadan (dikonfirmasi ke tim marketing) adalah 120 cm x 120 cm.","p":["Umum"],"k":"menjawab customer & lainnya","s":"info","rd":false,"by":["Nutritionist Novrianti"],"d":"2025-04-16","n":1,"kasus":[],"kw":["scarf","syal","hijab","hadiah","promo ramadan","merchandise","ukuran"]},{"id":371,"q":"Apakah normal jadi sering buang air kecil setelah mengunyah DVN?","a":"Masih normal selama tidak lebih dari 3 kali dalam 1 jam.\n- Pastikan tidak mengonsumsi makanan atau obat lain yang bersifat diuretik (memperbanyak kencing) bersamaan dengan DVN.\n- Selama buang air kecil tidak lebih dari 3 kali dalam 1 jam, masih tergolong normal.","p":["DVN"],"k":"efek samping & keluhan","s":"info","rd":false,"by":["Nutritionist Novrianti"],"d":"2025-04-14","n":1,"kasus":[{"d":"2025-04-14","t":"Konsumen merasa kulit agak cerah, tetapi setelah mengunyah DVN jadi sering buang air kecil."}],"kw":["sering kencing","buang air kecil","pipis","beser","diuretik","detoks"]},{"id":372,"q":"Customer dan anaknya (17 tahun) sakit kepala dan pusing tidak lama setelah minum 1 butir DVN sesudah makan malam, apa yang harus dilakukan?","a":"Stop dulu sampai keluhan hilang.\n- Hentikan konsumsi DVN terlebih dahulu sampai rasa pusing dan mual hilang.\n- Setelah keluhan hilang, boleh kembali konsumsi.","p":["DVN"],"k":"efek samping & keluhan","s":"tidak","rd":false,"by":["Nutritionist Novrianti"],"d":"2025-04-10","n":1,"kasus":[{"d":"2025-04-10","t":"Ibu dan anak usia 17 tahun (keduanya punya maag) pusing setelah 1 butir DVN sesudah makan malam → stop dulu, lanjut lagi setelah pusing/mual hilang."}],"kw":["pusing","sakit kepala","mual","maag","remaja","17 tahun","stop sementara"]},{"id":373,"q":"Customer jadi sering buang air kecil, dada tidak nyaman seperti masuk angin, mual, dan kembung setelah mulai minum DVN (juga minum obat flu Rhinos), apa penyebabnya?","a":"Belum bisa dipastikan; perlu dibandingkan dulu.\n- Keluhan seperti ini termasuk hal baru; reaksi bila alergi/tidak cocok biasanya lebih ke kulit.\n- Tanyakan apakah ada faktor kesehatan lain, kondisi badan sedang tidak fit, atau konsumsi makanan, obat, atau suplemen lain secara bersamaan.\n- Obat flu Rhinos memang bisa punya efek samping gangguan cerna (mual, muntah, sakit perut), tetapi sangat jarang, hanya pada sebagian pasien yang hipersensitif.\n- Coba bandingkan: satu hari hanya minum obatnya saja, dan satu hari hanya minum DVN saja, lalu lihat apakah keluhan tetap muncul.","p":["DVN"],"k":"efek samping & keluhan","s":"info","rd":false,"by":["Nutritionist Novrianti","Dr Rizky Nasution"],"d":"2025-04-08","n":1,"kasus":[{"d":"2025-04-08","t":"Konsumen baru beberapa hari minum DVN setelah makan, malamnya juga minum obat flu Rhinos (beda jam); sering kencing, susah tidur, mual & kembung."}],"kw":["sering kencing","buang air kecil","mual","kembung","masuk angin","rhinos","obat flu","nyeri dada"]},{"id":374,"q":"Apakah glutathione dalam DVN berbentuk liposomal?","a":"Bukan.\n- Glutathione dalam DVN bukan bentuk liposomal, melainkan reduced L-glutathione.","p":["DVN"],"k":"kandungan & keamanan produk","s":"info","rd":false,"by":["Nutritionist Novrianti"],"d":"2025-04-08","n":1,"kasus":[],"kw":["glutathione","glutation","liposomal","reduced l-glutathione","l-glutathione","bentuk glutathione"]},{"id":375,"q":"Apakah penderita autoimun (secara umum, termasuk yang sedang minum obat autoimun) boleh minum DVN?","a":"Tergantung pemicu kondisi autoimunnya:\n- Cari tahu dulu apa pemicu/penyebab kondisi autoimunnya memburuk.\n- Jika pemicunya bukan makanan (misalnya protein), DVN bisa dikonsumsi.\n- Jika sedang minum obat-obatan, minum DVN dengan jeda 1 jam dari obat yang dikonsumsi, atau dibedakan waktu makannya.","p":["DVN"],"k":"kondisi medis & penyakit","s":"tergantung","rd":false,"by":["Nutritionist Novrianti"],"d":"2025-04-03","n":2,"kasus":[],"kw":["autoimun","auto imun","autoimmune","pemicu","kambuh","protein","imun","obat autoimun","obat rutin","jeda obat","beda waktu makan"]},{"id":376,"q":"Apakah penderita jantung, hipertensi, dan diabetes melitus (rutin minum obat jantung, obat hipertensi, obat DM, dan insulin) boleh minum DVN?","a":"Boleh dengan catatan:\n- Minum 1 tablet saja dulu.\n- Beri jarak 1 jam dengan obat rutinnya.\n- Disarankan minum DVN di pagi hari saja.","p":["DVN"],"k":"kondisi medis & penyakit","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2025-03-28","n":1,"kasus":[{"d":"2025-03-28","t":"Konsumen penyakit jantung, hipertensi & DM; obat jantung pagi, obat hipertensi pagi/malam, obat DM 3x & insulin 2x sehari → DVN 1 tablet pagi, jarak 1 jam dari obat."}],"kw":["jantung","hipertensi","darah tinggi","diabetes","dm","insulin","obat rutin","jarak minum obat"]},{"id":377,"q":"Apakah penderita jantung yang sudah pasang ring jantung (termasuk yang juga punya riwayat stroke) boleh minum Erojan?","a":"Boleh, dengan perhatian khusus.\n- Salah satu bahan Erojan berefek melancarkan peredaran darah, jadi penderita jantung perlu perhatian khusus saat konsumsi Erojan.\n- Minum Erojan di waktu makan yang berbeda dari obat pengencer darahnya.","p":["Erojan"],"k":"kondisi medis & penyakit","s":"bersyarat","rd":false,"by":["Nutritionist Novrianti"],"d":"2025-03-25","n":2,"kasus":[],"kw":["jantung","ring jantung","stent","pasang ring","stroke","pengencer darah","obat pengencer darah","peredaran darah","jeda obat"]},{"id":378,"q":"Apakah orang yang sedang memakai insulin boleh minum Erojan?","a":"Boleh, dengan beda waktu makan.\n- Erojan boleh dikonsumsi, tetap diminum di waktu makan yang berbeda (dengan obat/insulinnya).\n- Sebenarnya lebih disarankan BLZ Pro (Bio-Lingzhi Pro), karena lebih tepat sasaran ke peredaran darah dan efektivitas kerja insulin.","p":["Erojan","BLZ Pro"],"k":"minum bersama obat/suplemen","s":"bersyarat","rd":false,"by":["Nutritionist Novrianti"],"d":"2025-03-25","n":1,"kasus":[],"kw":["insulin","diabetes","dm","kencing manis","gula darah","bio lingzhi","blz pro"]},{"id":379,"q":"Apakah Erojan aman untuk orang yang kantong empedunya sudah diangkat (pasca operasi empedu)?","a":"Boleh, dimulai bertahap.\n- Mulai 1 kapsul per hari terlebih dahulu (jika sudah tidak ada obat yang dikonsumsi).\n- Setelah 2 minggu boleh dinaikkan menjadi 2 kapsul per hari; perhatikan reaksinya — kalau ada yang tidak nyaman, tetap 1 kapsul.\n- Jaga pola makan: tetap konsumsi lemak sehat.\n- Cukupi kebutuhan air putih.","p":["Erojan"],"k":"pasca operasi & tindakan medis","s":"bersyarat","rd":false,"by":["Nutritionist Novrianti"],"d":"2025-03-23","n":2,"kasus":[{"d":"2025-02-15","t":"Konsumen operasi pengangkatan kantong empedu 2 tahun lalu → mulai 1 kapsul/hari, jaga pola makan & air putih."},{"d":"2025-03-23","t":"Konsumen pasca operasi pengangkatan empedu, sudah tidak minum obat → mulai 1 kapsul/hari, naik ke 2 setelah 2 minggu bila nyaman."}],"kw":["empedu","kantong empedu","operasi empedu","angkat empedu","kolesistektomi","pasca operasi","dosis bertahap","lemak sehat"]},{"id":380,"q":"Kenapa setelah minum DVN muncul bulu-bulu di wajah?","a":"Kemungkinan karena kebiasaan mencukur bulu wajah.\n- Jika konsumen sering mencukur bulu wajah, kolagen dapat menstimulasi pertumbuhan bulu menjadi lebih cepat.","p":["DVN"],"k":"efek samping & keluhan","s":"info","rd":false,"by":["Nutritionist Novrianti"],"d":"2025-03-22","n":1,"kasus":[{"d":"2025-03-22","t":"Konsumen tanpa riwayat alergi, muncul bulu di wajah setelah minum DVN."}],"kw":["bulu wajah","bulu halus","rambut wajah","kumis","mencukur","kolagen"]},{"id":381,"q":"Kenapa kulit makin sulit cerah padahal di awal minum DVN cepat terlihat putih?","a":"Kemungkinan efek lepas dari skincare/perawatan sebelumnya.\n- Jika sebelumnya memakai skincare dan perawatan dokter, melanin sudah terlalu lama ditahan.\n- Begitu pemakaiannya dilepas, melanin muncul secara berlebihan sehingga kulit lebih cepat kusam dan gelap.\n- Karena itu, butuh waktu cukup lama untuk terlihat lebih cerah jika hanya mengandalkan DVN.","p":["DVN"],"k":"manfaat & hasil","s":"info","rd":false,"by":["Nutritionist Novrianti"],"d":"2025-03-22","n":1,"kasus":[],"kw":["tidak cerah","susah putih","kulit kusam","melanin","skincare","perawatan dokter","hasil lambat"]},{"id":382,"q":"Apakah Erojan bisa diberikan untuk anjing/hewan peliharaan?","a":"Tidak ada data pendukungnya.\n- Hewan yang biasa digunakan untuk uji praklinis adalah tikus atau mencit.\n- Jadi tidak ada jurnal yang menyebutkan efeknya pada hewan lain.","p":["Erojan"],"k":"menjawab customer & lainnya","s":"info","rd":false,"by":["Nutritionist Novrianti"],"d":"2025-03-20","n":1,"kasus":[],"kw":["anjing","hewan","hewan peliharaan","pet","binatang","uji praklinis"]},{"id":383,"q":"Apakah konsumen dengan benjolan atau gondok di leher boleh minum DVN? Apakah kolagen bisa membuat benjolannya membesar?","a":"Tergantung jenis benjolannya:\n- Cari tahu dulu benjolan itu kondisi apa; jika kondisinya diperbolehkan konsumsi kolagen, DVN bisa disarankan.\n- Jika berupa gondok yang menonjol di leher (bukan tumor), masih bisa disarankan minum DVN; bila mengunyah terlalu keras terasa nyeri, DVN bisa juga diisap.","p":["DVN"],"k":"kondisi medis & penyakit","s":"tergantung","rd":false,"by":["Nutritionist Novrianti"],"d":"2025-03-19","n":2,"kasus":[],"kw":["benjolan leher","benjolan","leher","leher bengkak","gondok","goiter","tiroid","membesar","kolagen","dihisap"]},{"id":384,"q":"Apakah pria yang baru mengalami hematuria terkait prostat dan masih minum obat dokter boleh minum Erojan, atau harus menunggu sembuh?","a":"Tunggu dulu, fokus ke pengobatan.\n- Utamakan minum obat pengobatannya dulu.\n- Jika pengobatan sudah selesai, boleh mulai konsumsi Erojan sesuai dosisnya.","p":["Erojan"],"k":"kondisi medis & penyakit","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2025-03-17","n":1,"kasus":[{"d":"2025-03-17","t":"Konsumen pria, ±17 hari lalu mengalami hematuria pada permukaan prostat, masih masa pemulihan & masih ada sedikit darah saat kencing, masih minum obat dokter → selesaikan pengobatan dulu."}],"kw":["hematuria","kencing berdarah","darah di urine","prostat","obat dokter","masa pemulihan"]},{"id":385,"q":"Apakah penderita trombositosis (trombosit tinggi) dengan HbA1c tinggi boleh minum DVN?","a":"Seharusnya aman, tetapi konsultasikan dulu ke dokter.\n- Konsultasikan lebih detail ke dokter yang menangani konsumen, untuk menghindari efek samping.","p":["DVN"],"k":"kondisi medis & penyakit","s":"bersyarat","rd":true,"by":["Dr Rizky Nasution"],"d":"2025-03-11","n":1,"kasus":[{"d":"2025-03-11","t":"Konsumen trombositosis (trombosit tinggi) dan HbA1c tinggi → seharusnya aman, konsultasi detail ke dokternya."}],"kw":["trombositosis","trombosit tinggi","platelet","hba1c","gula darah","diabetes","kelainan darah"]},{"id":386,"q":"Apakah Erojan aman untuk orang yang baru menjalani operasi bariatrik?","a":"Boleh, tidak ada masalah.\n- Erojan boleh dikonsumsi setelah operasi bariatrik.","p":["Erojan"],"k":"pasca operasi & tindakan medis","s":"boleh","rd":false,"by":["Dr Rizky Nasution"],"d":"2025-03-08","n":1,"kasus":[],"kw":["operasi bariatrik","bariatric","operasi lambung","pengecilan lambung","bedah obesitas","pasca operasi"]},{"id":387,"q":"Apakah DVN punya jurnal/penelitian, uji klinis, atau uji toksisitas jangka panjang (misalnya untuk membuktikan keamanan jangka panjang atau kesesuaian kandungannya)?","a":"Belum/tidak diwajibkan BPOM untuk produk seperti DVN:\n- Kandungan DVN telah disesuaikan dengan batas aman yang dianjurkan BPOM; karena bahan-bahannya masih dalam kategori pangan, BPOM belum mengharuskan penelitian khusus terhadap produk jadi (finished product).\n- Uji klinis tidak diharuskan BPOM pada saat mendaftarkan produk; normalnya uji klinis memerlukan waktu yang lama untuk mendapatkan hasilnya.\n- Uji toksisitas (subkronik/kronik): sebatas yang diketahui penasihat, DVN tidak termasuk produk yang dianjurkan/diwajibkan. Uji ini dianjurkan BPOM untuk produk dengan dosis tinggi atau kadar bahan baku di atas rekomendasi BPOM, dan biasanya diwajibkan untuk obat atau obat tradisional; DVN masuk kategori suplemen dan kadar bahan bakunya di bawah rekomendasi.\n- Soal bukti uji lab kesesuaian kandungan, penasihat tidak menjawab secara khusus (jawabannya fokus pada uji klinis).","p":["DVN"],"k":"kandungan & keamanan produk","s":"info","rd":false,"by":["Nutritionist Novrianti"],"d":"2025-03-05","n":3,"kasus":[{"d":"2025-03-05","t":"Banyak customer bertanya soal uji klinis/uji lab DVN setelah ramai isu ketidaksesuaian kandungan/klaim skincare dengan data BPOM (isu 'doktif')."}],"kw":["jurnal","penelitian","riset","uji klinis","uji lab","uji toksisitas","toksisitas","efek jangka panjang","efek samping","keamanan","bpom","doktif"]},{"id":388,"q":"Di mana sertifikat halal Erojan yang terbaru (versi lama berlaku sampai Desember 2024)?","a":"Sertifikat halal terbaru sudah tersedia.\n- Ada di Google Drive marketing tools EROJAN, folder Product info (link dibagikan di grup Product Q&A).","p":["Erojan"],"k":"kandungan & keamanan produk","s":"info","rd":false,"by":["Nutritionist Novrianti"],"d":"2025-03-03","n":1,"kasus":[],"kw":["halal","sertifikat halal","mui","bpjph","expired","marketing tools"]},{"id":389,"q":"Novia rasanya seperti apa?","a":"Novia berbentuk kapsul.\n- Jika dikonsumsi tanpa kapsulnya, rasanya seperti jamu.","p":["Novia"],"k":"kandungan & keamanan produk","s":"info","rd":false,"by":["Nutritionist Novrianti"],"d":"2025-02-27","n":1,"kasus":[],"kw":["rasa novia","rasa","kapsul","jamu","bentuk produk"]},{"id":390,"q":"Bagaimana jika ada kapsul Erojan yang mengeras/menggumpal, apakah rusak dan apa yang harus dilakukan?","a":"Laporkan lewat e-ticket dengan data lengkap agar dicek tim.\n- Siapkan data: batch number (pada Erojan ada di bagian samping label botol), nomor order, tanggal terima barang, sudah berapa lama dikonsumsi/dibuka, tempat penyimpanan botol, dan apakah selalu tertutup rapat.\n- Videokan kondisi seluruh botol, bagian dalam, dan kapsul lainnya; kapsul tidak perlu dibuka, cukup disusun sebentar di atas tisu/kotak bersih lalu difoto atau divideokan.\n- Jika ditemukan kapsul lain yang menggumpal, cukup kapsul itu yang dibuka dan dihitung jumlahnya.\n- Kabari tim setelah e-ticket dibuat agar bisa didiskusikan dengan bagian inventory dan Quality Control.\n- Catatan: sejauh ini kasus seperti ini belum pernah ditemukan; uji membiarkan kapsul & serbuk Erojan semalaman di ruang terbuka hasilnya tetap baik dan tidak menggumpal.","p":["Erojan"],"k":"kandungan & keamanan produk","s":"info","rd":false,"by":["Nutritionist Novrianti"],"d":"2025-02-24","n":1,"kasus":[{"d":"2025-02-24","t":"Customer menemukan 1 kapsul Erojan keras/menggumpal (botol disimpan di meja kamar & selalu tertutup rapat) → buat e-ticket untuk dicek QC."}],"kw":["kapsul keras","menggumpal","produk rusak","komplain produk","e-ticket","batch number","quality control","penyimpanan"]},{"id":391,"q":"Apakah DVN boleh untuk customer dengan kista dan mioma yang punya pantangan gula, mengingat DVN mengandung sukralosa?","a":"Informasikan kandungannya, lalu kembalikan keputusan ke konsumen.\n- Sukralosa adalah pemanis buatan dan kadarnya di bawah batas yang diperbolehkan BPOM dalam produk (< 2400 mg/kg).\n- Sampaikan dulu ke konsumen tentang kandungan sukralosa ini.\n- Keputusan dikembalikan ke konsumen, karena beliau yang tahu kondisinya dan batasan yang dianjurkan dokternya.","p":["DVN"],"k":"kandungan & keamanan produk","s":"tergantung","rd":false,"by":["Nutritionist Novrianti"],"d":"2025-02-24","n":1,"kasus":[{"d":"2025-02-24","t":"Konsumen kista & mioma dengan pantangan gula → beri info kadar sukralosa, keputusan sesuai batasan dari dokternya."}],"kw":["kista","mioma","miom","pantangan gula","sukralosa","pemanis buatan","diet gula"]},{"id":392,"q":"Apakah pasien HIV (B20) dengan masalah kulit (jerawat, flek, kulit kasar/bekas ruam) boleh minum DVN?","a":"Boleh dicoba, dengan jeda sekitar 5 jam dari obat rutin, lalu dievaluasi hasilnya.\n- Pasien HIV wajib minum obat rutin setiap hari seumur hidup.\n- Efek ke kulit seperti jerawat dan flek memang bisa terjadi karena kondisi tubuh yang sedang sakit dan dosis obat yang sangat tinggi.\n- Catatan: jawaban lama (2024-09-02, Nutritionist Novrianti) menyebut kasus ini cukup serius, perubahan kondisi kulit terjadi karena banyak faktor dan tidak dapat pulih selama masih dalam proses pengobatan/konsumsi obat (tanpa menyatakan tegas boleh/tidaknya); ikuti yang terbaru.","p":["DVN"],"k":"kondisi medis & penyakit","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution","Nutritionist Novrianti"],"d":"2025-02-23","n":2,"kasus":[{"d":"2024-09-02","t":"Pasien HIV (B20) dengan keluhan kulit kasar dan bekas ruam akibat infeksi → kulit tidak bisa diharapkan pulih selama masih dalam pengobatan."},{"d":"2025-02-23","t":"Pasien HIV dengan jerawat & flek setelah minum obat HIV → DVN boleh dicoba, jeda ±5 jam dari obat, lalu evaluasi."}],"kw":["hiv","b20","odha","arv","obat hiv","jerawat","flek","kulit kasar","bekas ruam","jeda obat","efek samping obat","pengobatan"]},{"id":393,"q":"Kenapa lidah customer menghitam/menguning atau muncul bercak merah di lengan setelah minum DVN, dan apa yang harus dilakukan?","a":"Stop dulu semua suplemen, lalu gali penyebabnya.\n- Untuk sementara hentikan semua produk suplemen, khawatir ada asupan yang berlebihan.\n- Tanyakan apa saja yang dikonsumsi (termasuk mereknya): obat atau suplemen lain, makanan, atau adanya infeksi, apalagi keluhan lidah muncul setelah konsumsi yang masih singkat.\n- Tanyakan apakah ada rasa gatal.\n- DVN berwarna pink, jadi perlu dicari tahu kenapa muncul bercak pink di lidah.\n- Tanyakan juga berapa banyak DVN yang diminum, adakah produk lain yang mengandung kolagen, dan apakah punya riwayat alergi.","p":["DVN"],"k":"efek samping & keluhan","s":"tidak","rd":false,"by":["Nutritionist Novrianti"],"d":"2025-02-15","n":1,"kasus":[{"d":"2025-02-15","t":"Laporan beberapa customer: lidah hitam di hari pertama (juga minum zat besi), lidah kuning di botol kedua, bercak merah di lengan yang bertambah di botol kedua → stop semua suplemen & telusuri penyebab."}],"kw":["lidah hitam","lidah kuning","bercak lidah","bercak merah","ruam","zat besi","alergi","efek samping"]},{"id":394,"q":"Apakah DVN bisa menyebabkan tekanan darah naik (mis. dari biasanya 120–130 menjadi 180)?","a":"Belum ada jurnal yang menyebut bahan DVN menaikkan tekanan darah; cari faktor lain.\n- Dari bahan-bahan DVN, belum ada jurnal yang menyebutkan dapat memengaruhi sirkulasi darah ataupun menaikkan tekanan darah.\n- Bisa jadi kenaikan tensi merupakan reaksi alergi; tanyakan apakah konsumen punya alergi terhadap zat tertentu.\n- Bisa juga dipengaruhi konsumsi makanan yang banyak mengandung garam/natrium atau minuman berkafein.","p":["DVN"],"k":"efek samping & keluhan","s":"info","rd":false,"by":["Nutritionist Novrianti","Dr Rizky Nasution"],"d":"2025-02-11","n":1,"kasus":[{"d":"2025-02-11","t":"Konsumen sedang minum DVN, tensi naik ke 180 padahal biasanya 120–130 → cek kemungkinan alergi, asupan garam & kafein."}],"kw":["tekanan darah naik","darah tinggi","hipertensi","tensi","alergi","garam","natrium","kafein"]},{"id":395,"q":"Apakah DVN aman untuk orang yang baru selesai pengobatan TB kelenjar dan sudah tidak minum obat TB?","a":"Boleh, tidak ada masalah.\n- Kandungan DVN aman untuk pasien pasca-pengobatan TB.","p":["DVN"],"k":"kondisi medis & penyakit","s":"boleh","rd":false,"by":["Dr Rizky Nasution"],"d":"2025-02-11","n":1,"kasus":[{"d":"2025-02-11","t":"Konsumen baru selesai pengobatan & pemulihan TB kelenjar, sudah tidak minum obat TB → aman minum DVN."}],"kw":["tb kelenjar","tbc","tuberkulosis","pasca tb","selesai pengobatan tb","obat tb"]},{"id":396,"q":"Apakah penderita glaukoma dengan riwayat jantung koroner dan kebocoran bilik kiri jantung boleh minum DVN?","a":"Boleh dicoba dengan catatan:\n- Minum DVN 1x sehari.\n- Beri jarak 6 jam dari obat rutinnya.","p":["DVN"],"k":"kondisi medis & penyakit","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2025-02-07","n":1,"kasus":[{"d":"2025-02-07","t":"Konsumen glaukoma + riwayat jantung koroner & bilik kiri 'rembes', minum obat jantung hanya saat nyeri → DVN 1x sehari, jarak 6 jam dari obat."}],"kw":["glaukoma","jantung koroner","penyakit jantung","bilik kiri","kelainan jantung","obat jantung","jarak minum obat"]},{"id":397,"q":"Apakah Erojan aman untuk penderita prostatitis (radang prostat) atau pria yang pernah mengalaminya, termasuk yang tidak toleran kafein, makanan pedas/jahe, asam, dan alkohol?","a":"Aman.\n- Tidak ada kendala untuk riwayat prostatitis maupun gejala intoleransi yang disebutkan.\n- Dosis tetap normal, 2 kapsul sehari.\n- Perlu diingat: Erojan adalah suplemen, bukan obat.","p":["Erojan"],"k":"kondisi medis & penyakit","s":"boleh","rd":false,"by":["Dr Rizky Nasution"],"d":"2025-01-24","n":2,"kasus":[{"d":"2024-10-14","t":"Penderita prostatitis yang tidak toleran kafein, pedas/jahe, asam, dan alkohol → Erojan aman dengan dosis normal 2 kapsul sehari."},{"d":"2025-01-24","t":"Konsumen punya riwayat prostatitis (radang prostat) → aman minum Erojan."}],"kw":["prostatitis","radang prostat","prostat","riwayat prostat","kafein","jahe","pedas","alkohol","suplemen bukan obat"]},{"id":398,"q":"Apakah penderita radang kronis sumsum tulang belakang yang rutin minum mecobalamin serta obat tidur/penenang boleh minum Erojan atau Coffiyy?","a":"Pilih Erojan saja (tidak Coffiyy), dimulai dosis rendah.\n- Dokter menyarankan konsumsi Erojan saja.\n- Awali dengan dosis rendah dulu.","p":["Erojan","Coffiyy"],"k":"kondisi medis & penyakit","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2025-01-16","n":1,"kasus":[{"d":"2025-01-16","t":"Konsumen radang kronis sumsum tulang belakang, minum mecobalamin + obat tidur & penenang 1x sehari → Erojan saja dengan dosis rendah."}],"kw":["radang sumsum tulang belakang","tulang belakang","saraf","mecobalamin","mekobalamin","obat tidur","obat penenang","dosis rendah"]},{"id":399,"q":"Apakah Erojan aman diminum bersamaan dengan suplemen gym Hydroxicut?","a":"Jangan diminum bersamaan, pisahkan waktunya.\n- Atur jadwal: satu diminum pagi, satu lagi malam.\n- Tujuannya untuk menghindari interaksi antar-kandungan suplemen.\n- Nutritionist meminta info jenis Hydroxicut yang dikonsumsi (untuk weight loss, muscle gain, atau boost energy; bentuk powder atau kapsul), karena macamnya banyak.","p":["Erojan"],"k":"minum bersama obat/suplemen","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution","Nutritionist Novrianti"],"d":"2025-01-16","n":1,"kasus":[{"d":"2025-01-16","t":"Konsumen rutin minum Hydroxicut untuk gym → Erojan dan Hydroxicut dipisah waktu minumnya (pagi/malam)."}],"kw":["hydroxicut","suplemen gym","fitness","weight loss","interaksi suplemen","jeda minum"]},{"id":400,"q":"Apakah orang dengan riwayat stroke (murni karena stres, tensi normal) yang masih minum obat dari dokter boleh minum Erojan?","a":"Boleh, dengan dosis bertahap.\n- Mulai dengan setengah dosis dulu.\n- Evaluasi selama 1 minggu.\n- Jika tidak ada kendala, boleh dinaikkan ke dosis normal.","p":["Erojan"],"k":"kondisi medis & penyakit","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2025-01-14","n":1,"kasus":[{"d":"2025-01-14","t":"Konsumen pernah stroke (murni dari otak karena stres; hipertensi dll. normal), masih minum obat dokter agar kondisi tidak drop → setengah dosis, evaluasi 1 minggu."}],"kw":["stroke","riwayat stroke","pasca stroke","obat stroke","setengah dosis","stres"]},{"id":401,"q":"Apakah lansia yang 2 tahun lalu menjalani operasi tumor di selaput jantung dan paru-paru boleh minum DVN?","a":"Boleh.\n- Sesuai dosis normal saja.\n- Kalau ada kendala, segera konsultasi ke dokter.","p":["DVN"],"k":"pasca operasi & tindakan medis","s":"boleh","rd":true,"by":["Dr Rizky Nasution"],"d":"2025-01-02","n":1,"kasus":[{"d":"2025-01-02","t":"Wanita 62 tahun, 2 tahun lalu operasi tumor di selaput jantung dan paru-paru → boleh dosis normal, segera ke dokter bila ada kendala."}],"kw":["tumor","operasi tumor","selaput jantung","paru-paru","lansia","pasca operasi","riwayat tumor"]},{"id":402,"q":"Kenapa di sertifikat BPOM DVN tertulis “reduced” L-glutathione — apakah glutathione-nya dikurangi?","a":"Bukan dikurangi — “reduced” (tereduksi) adalah nama zatnya.\n- Reduced L-glutathione adalah zat yang secara alami dibentuk tubuh dari asam amino glutamic acid, cysteine, dan glycine.\n- Zat ini bersifat antioksidan yang mencegah reaksi oksidatif pada sel (paparan radikal bebas).\n- Karena DVN memakai bahan yang juga dibentuk oleh tubuh, tubuh lebih mudah mengenali dan menyerap manfaatnya.","p":["DVN"],"k":"kandungan & keamanan produk","s":"info","rd":false,"by":["Nutritionist Novrianti"],"d":"2024-12-19","n":1,"kasus":[],"kw":["reduced","l-glutathione tereduksi","glutathione","glutation","bpom","sertifikat bpom","antioksidan"]},{"id":403,"q":"Apakah konsumen yang sedang minum obat endometriosis boleh minum DVN juga?","a":"Tidak ada masalah, dengan catatan:\n- Mulai DVN dengan dosis 1x sehari dulu.\n- Evaluasi selama 4 minggu; kalau tidak ada keluhan, berarti aman dikonsumsi.","p":["DVN"],"k":"minum bersama obat/suplemen","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2024-12-16","n":1,"kasus":[],"kw":["endometriosis","obat endometriosis","hormon","nyeri haid","evaluasi 4 minggu","obat rutin"]},{"id":404,"q":"Apakah konsumen yang sedang menjalani perawatan skin booster dan “infus mochi” boleh minum DVN bersamaan?","a":"Jangan konsumsi DVN dulu.\n- Kandungan terapi dari treatment yang sedang dijalani hampir sama dengan kandungan DVN.\n- Konsumen juga masih menjalani “infus mochi”.","p":["DVN"],"k":"pasca operasi & tindakan medis","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2024-12-16","n":1,"kasus":[{"d":"2024-12-16","t":"Konsumen masih program skin booster dan infus mochi, khawatir overdosis → jangan minum DVN dulu."}],"kw":["skin booster","infus mochi","infus","overdosis","treatment kecantikan","klinik kecantikan"]},{"id":405,"q":"Apakah penderita penyakit jantung yang sudah pasang ring dan rutin minum banyak obat dokter aman minum DVN?","a":"Jangan konsumsi DVN.\n- Kondisi jantungnya lumayan berat.\n- Konsumen masih dalam perawatan dokter jantung, dokter penyakit dalam, dan dokter saraf.","p":["DVN"],"k":"kondisi medis & penyakit","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2024-12-14","n":1,"kasus":[{"d":"2024-12-14","t":"Konsumen pasang ring jantung, kontrol ke RS 3x sebulan ke 3 dokter, minum hampir 20 butir obat per hari → jangan minum DVN."}],"kw":["ring jantung","jantung","stent","banyak obat","obat rutin","dokter saraf","penyakit dalam"]},{"id":406,"q":"Apakah boleh minum DVN saat kista Bartholin sedang kambuh?","a":"Jangan konsumsi dulu.\n- Fokus ke terapi kistanya dulu.\n- Setelah sembuh, baru boleh mulai konsumsi DVN.","p":["DVN"],"k":"kondisi medis & penyakit","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2024-12-13","n":1,"kasus":[{"d":"2024-12-13","t":"Kista Bartholin sedang kambuh → jangan dulu, fokus terapi; setelah sembuh baru boleh mulai."}],"kw":["kista bartholin","bartholin","kista","benjolan vagina","kambuh","miss v"]},{"id":407,"q":"Apakah Novia tetap dilanjutkan bila konsumen jadi berjerawat setelah mulai minum Novia (bersamaan dengan DVN)?","a":"Coba lanjutkan dengan dosis 1x sehari dulu, lalu evaluasi.\n- Dokter memastikan dulu: sudah berapa lama minum DVN, apakah sebelumnya ada riwayat jerawat, dan apakah sedang minum obat/menjalani perawatan kecantikan (pada kasus ini tidak).\n- Lanjutkan dengan dosis 1x sehari dan evaluasi lagi selama 4–5 hari.\n- Jika jerawat bertambah banyak dan mulai mengganggu, hentikan saja.","p":["DVN","Novia"],"k":"efek samping & keluhan","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2024-12-06","n":1,"kasus":[{"d":"2024-12-06","t":"Konsumen minum DVN 2 butir sekaligus di pagi hari selama ±1 minggu tanpa jerawat, lalu ditambah Novia dan mulai berjerawat; tidak ada riwayat jerawat dan tidak sedang perawatan kecantikan → Novia lanjut 1x sehari, evaluasi 4–5 hari."}],"kw":["jerawat","jerawatan","breakout","muncul jerawat","novia","evaluasi","stop"]},{"id":408,"q":"Kenapa di kemasan DVN tidak ada keterangan berapa IU-nya?","a":"Satuan IU memang tidak biasa dipakai untuk kandungan seperti di DVN.\n- IU adalah satuan ukuran jumlah kandungan dalam produk, sama halnya dengan mg atau gram yang lebih umum dipakai pada informasi kemasan.\n- Satuan IU biasanya hanya dipakai untuk beberapa zat seperti vitamin A dan vitamin D, tidak biasa untuk kolagen atau ekstrak tanaman.","p":["DVN"],"k":"kandungan & keamanan produk","s":"info","rd":false,"by":["Nutritionist Novrianti"],"d":"2024-11-25","n":1,"kasus":[],"kw":["iu","international unit","satuan","mg","kemasan","label","takaran"]},{"id":409,"q":"Apakah boleh minum DVN setelah operasi batu empedu atau setelah kantung empedu diangkat?","a":"Tergantung masih minum obat dokter atau tidak:\n- Jika masih minum obat dari dokter dan masih ada jadwal kontrol → tunda dulu DVN.\n- Jika sudah tidak minum obat dari dokter → boleh dicoba mulai 1 butir (1 kali sehari) dulu, sambil dilihat dan dievaluasi ada keluhan atau tidak.\n- Konsultasikan kandungan DVN ke dokter yang merawat dan pastikan ada pantangan atau tidak.\n- Jika minum DVN, cukupi asupan air dan serat.","p":["DVN"],"k":"pasca operasi & tindakan medis","s":"tergantung","rd":true,"by":["Dr Rizky Nasution","Nutritionist Novrianti"],"d":"2024-11-16","n":2,"kasus":[{"d":"2024-09-01","t":"Konsumen sudah tidak punya kantung empedu (diangkat karena batu empedu) → konsultasi dokter, cukupi air dan serat, mulai 1x sehari."}],"kw":["kantung empedu","angkat empedu","batu empedu","empedu","gallstone","kolesistektomi","operasi empedu","pasca operasi","kontrol dokter"]},{"id":410,"q":"Apakah DVN aman untuk konsumen yang memakai KB (implan, suntik, dll.), dan apakah DVN bisa melunturkan efek KB?","a":"Boleh, tidak ada kontraindikasi dengan KB.\n- DVN tidak memiliki kontraindikasi dengan KB suntik (jawaban atas pertanyaan apakah DVN bisa melunturkan KB).\n- Kandungan DVN tidak memengaruhi hormon, sehingga seharusnya tidak berbahaya untuk pemakai KB, termasuk KB implan.\n- Jika ingin minum, bisa mulai 1 kali sehari dulu dan perhatikan kondisi tubuh.","p":["DVN"],"k":"haid, hormon & menopause","s":"boleh","rd":false,"by":["Dr Rizky Nasution","Nutritionist Novrianti"],"d":"2024-11-12","n":2,"kasus":[],"kw":["kb","kb implan","kb suntik","susuk kb","suntik kb","pil kb","kontrasepsi","hormon","hormonal","kb luntur"]},{"id":411,"q":"Kenapa wajah terasa perih seperti iritasi sejak minum DVN, dan apa yang disarankan?","a":"Kurangi dulu dosisnya sampai mereda.\n- Penasihat menanyakan dulu apakah konsumen punya alergi, atau memakai skincare/perawatan dokter yang baru.\n- Untuk sementara minum DVN 1 kali sehari atau 2 hari sekali hingga keluhan mereda (dikonfirmasi: 1 butir dulu).","p":["DVN"],"k":"efek samping & keluhan","s":"bersyarat","rd":false,"by":["Nutritionist Novrianti"],"d":"2024-11-10","n":1,"kasus":[{"d":"2024-11-10","t":"Setelah 28 hari minum DVN, flek masih ada, wajah sedikit lebih cerah tapi sering perih seperti iritasi; tidak ada alergi dan skincare sebelumnya aman → turunkan jadi 1x sehari atau 2 hari sekali sampai mereda."}],"kw":["wajah perih","perih","iritasi","kulit sensitif","flek","efek samping","kurangi dosis"]},{"id":412,"q":"Apakah DVN mengandung DHA atau zat antikoagulan (pengencer darah)?","a":"Tidak.\n- DVN tidak mengandung DHA maupun zat berefek antikoagulan.\n- DHA dan efek antikoagulan biasanya ada pada suplemen untuk kesehatan jantung dan otak.","p":["DVN"],"k":"kandungan & keamanan produk","s":"info","rd":false,"by":["Nutritionist Novrianti"],"d":"2024-11-07","n":1,"kasus":[],"kw":["dha","antikoagulan","pengencer darah","omega 3","kandungan","jantung"]},{"id":413,"q":"Apakah pasien pasca bypass jantung dengan banyak keluhan (diabetes, iritasi kandung kemih, riwayat batu ginjal, kreatinin tinggi) boleh minum Erojan?","a":"Jangan konsumsi dulu.\n- Kondisi kesehatannya tidak stabil.\n- Lebih disarankan fokus pada obat-obatan terapi utamanya dulu.","p":["Erojan"],"k":"kondisi medis & penyakit","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2024-10-30","n":1,"kasus":[{"d":"2024-10-30","t":"Pria 64 tahun pasca bypass jantung dengan banyak keluhan, DM terkontrol (HbA1c 5,6), iritasi kandung kemih akibat kateter (sering kencing), pernah operasi batu ginjal, kreatinin 3,6 → jangan dulu."}],"kw":["bypass jantung","jantung","diabetes","kreatinin","batu ginjal","kandung kemih","kateter","sering kencing"]},{"id":414,"q":"Apakah DVN aman untuk konsumen dengan gangguan kandung kemih (sempat pipis mampet setelah minum 2 tablet)?","a":"Sebenarnya aman.\n- DVN bentuknya hanya tablet kunyah; berbeda dengan suplemen yang bentuknya diminum, yang efeknya mungkin lebih berbeda-beda pada tiap orang.\n- Namun konsumen yang sudah punya riwayat sakit tertentu memang bisa bereaksi berbeda terhadap suplemen jenis apa pun.","p":["DVN"],"k":"kondisi medis & penyakit","s":"boleh","rd":false,"by":["Dr Rizky Nasution"],"d":"2024-10-29","n":1,"kasus":[{"d":"2024-10-29","t":"Konsumen dengan gangguan kandung kemih; saat mencoba 2 tablet pipis jadi mampet padahal banyak minum, lalu turun ke 1 tablet → dokter: sebenarnya aman, tapi reaksi tiap orang dengan riwayat penyakit bisa berbeda."}],"kw":["kandung kemih","kantung kemih","pipis mampet","susah kencing","saluran kemih","kencing"]},{"id":415,"q":"Apakah DVN bisa membantu atau mencegah vitiligo?","a":"Tidak.\n- DVN hanya suplemen, bukan obat vitiligo, karena vitiligo termasuk penyakit autoimun.\n- Tidak ada khasiat mencegah atau membantu vitiligo, karena DVN bukan obat-obatan.","p":["DVN"],"k":"manfaat & hasil","s":"info","rd":false,"by":["Dr Rizky Nasution"],"d":"2024-10-26","n":1,"kasus":[],"kw":["vitiligo","belang","kulit belang","bercak putih","autoimun","obat kulit"]},{"id":416,"q":"Kolagen DVN hanya 200 mg per tablet — apa keunggulannya dibanding produk kolagen lain yang kadarnya lebih besar, dan bagaimana menjawab customer yang bilang suplemen kolagen harus minimal 2,5 gram (2.500 mg)?","a":"Betul, kolagen DVN 200 mg per tablet; jelaskan bahwa DVN tidak hanya mengandalkan kolagen, tetapi kombinasi zat gizi untuk kulit.\n- Saat membandingkan dengan produk lain, perhatikan persentase komposisi kolagen pada label; DVN juga mengandung jenis kolagen yang berbeda dari produk pembanding tersebut.\n- Kulit butuh banyak zat gizi: selain kolagen tripeptida, DVN mengandung peptida ikan terhidrolisis, L-glutathione tereduksi, ekstrak buah delima Viqua, vitamin C, natrium hialuronat, dan ekstrak akar knotweed Jepang; glutathione, sodium hyaluronate, dan vitamin C mendukung kinerja kolagen untuk menjaga kesehatan kulit. Jika isinya hanya kolagen tripeptida, mungkin perlu dosis tinggi dan konsumsi lebih lama untuk terlihat hasilnya.\n- Analogi skincare (Nutritionist Novrianti & Pak Ardi): merawat kulit tidak cukup dengan sabun cuci muka saja, tetapi dengan rangkaian (toner, serum, pelembap, sampai sunscreen); begitu pula suplemen — tubuh butuh lebih dari sekadar kolagen.\n- Sudut marketing (Pak Ardi): L-glutathione untuk mencerahkan, ekstrak delima untuk melawan radikal bebas, vitamin C untuk meningkatkan produksi kolagen, dan natrium hialuronat untuk menjaga kelembapan kulit — meski jumlah kolagennya tidak banyak, DVN memberi perlindungan menyeluruh layaknya rangkaian skincare lengkap.\n- Dr Rizky: standar “tidak kurang dari 2,5 gram kolagen terhidrolisis” memang begitu, namun 1 butir obat/vitamin/suplemen tidak selalu 100% pas kandungannya, apalagi bila diproduksi dalam jumlah besar dan ada campuran lain; yang membedakan DVN adalah campurannya dengan bahan aktif lain yang sesuai dengan kekhususan produknya (ada suplemen lain yang bercampur bahan tambahan yang tidak sesuai).","p":["DVN"],"k":"kandungan & keamanan produk","s":"info","rd":false,"by":["Nutritionist Novrianti","Pak Ardi (Wellous)","Dr Rizky Nasution"],"d":"2024-10-25","n":2,"kasus":[],"kw":["kolagen 200 mg","kandungan kolagen","dosis kolagen","kolagen sedikit","kolagen 2500 mg","2,5 gram kolagen","standar kolagen","perbandingan kolagen","produk kolagen lain","keunggulan dvn","kolagen tripeptida","cara menjawab customer"]},{"id":417,"q":"Apakah penderita sakit jantung (masih terasa nyeri saat kecapekan) boleh minum Erojan?","a":"Boleh dengan catatan:\n- Mulai 1 kaplet Erojan per hari dulu.\n- Beri jarak 2 jam setelah minum obat rutin (jika masih minum obat).\n- Segera stop Erojan bila muncul gejala seperti detak jantung menjadi cepat, mual, atau pusing.","p":["Erojan"],"k":"kondisi medis & penyakit","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2024-10-19","n":1,"kasus":[{"d":"2024-10-19","t":"Calon konsumen sakit jantung sejak 3 tahun, masih nyeri bila kecapekan, juga minum susu kambing etawa, teh detoks, dan suplemen “bio insulin” → mulai 1 kaplet/hari, jeda 2 jam dari obat, stop bila muncul gejala."}],"kw":["jantung","sakit jantung","nyeri dada","detak jantung cepat","berdebar","mual","pusing"]},{"id":418,"q":"Apakah konsumen yang alergi obat analgetik (pereda nyeri) aman minum DVN?","a":"Aman.\n- Tidak ada kontraindikasi DVN dengan analgetik.","p":["DVN"],"k":"kondisi medis & penyakit","s":"boleh","rd":false,"by":["Dr Rizky Nasution"],"d":"2024-10-14","n":1,"kasus":[],"kw":["alergi obat","analgetik","analgesik","pereda nyeri","painkiller","alergi pereda nyeri"]},{"id":419,"q":"Apakah konsumen yang alergi ikan tongkol saja (bukan semua ikan) boleh minum DVN?","a":"Sebaiknya jangan.\n- DVN mengandung fish collagen, sehingga bisa saja memicu reaksi alergi.","p":["DVN"],"k":"kondisi medis & penyakit","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2024-10-07","n":1,"kasus":[{"d":"2024-10-07","t":"Konsumen hanya alergi ikan tongkol (tidak semua jenis ikan) → tetap sebaiknya jangan."}],"kw":["alergi ikan","alergi tongkol","ikan tongkol","fish collagen","kolagen ikan","alergi seafood"]},{"id":420,"q":"Apakah kolagen dalam DVN bisa membantu menumbuhkan/menebalkan dinding rahim yang tipis?","a":"Tidak.\n- Menurut dokter, kandungan DVN bukan untuk itu.","p":["DVN"],"k":"manfaat & hasil","s":"info","rd":false,"by":["Dr Rizky Nasution"],"d":"2024-10-03","n":1,"kasus":[],"kw":["dinding rahim tipis","rahim tipis","endometrium tipis","endometrium","promil","kolagen"]},{"id":421,"q":"Apakah konsumen yang sedang menjalani pengobatan/penanganan khusus dokter untuk kista, miom, atau tumor jinak rahim boleh minum DVN?","a":"Jangan dikonsumsi dulu, atau konsultasikan dulu ke dokter yang menangani.\n- Tujuannya supaya tidak ada efek kontra terhadap pengobatan utamanya.\n- Tanyakan ke dokter soal kandungan DVN dan apakah ada pantangan atau batasan asupan makanan.","p":["DVN"],"k":"kondisi medis & penyakit","s":"tidak","rd":true,"by":["Dr Rizky Nasution","Nutritionist Novrianti"],"d":"2024-09-26","n":2,"kasus":[{"d":"2024-09-26","t":"Konsumen sedang ditangani dokter untuk kista dan miom → jangan dulu, atau konsultasikan ke dokter yang menangani."}],"kw":["kista","miom","mioma","myoma","tumor jinak","tumor rahim","rahim","pengobatan","pengobatan dokter","pantangan","konsultasi dokter"]},{"id":422,"q":"Apakah penderita cacar boleh minum DVN?","a":"Sebaiknya diminum saat fase penyembuhan atau setelah sembuh.\n- Kandungan Japanese knotweed, vitamin C, dan Viqua pomegranate di DVN membantu mengurangi kemerahan dan mencegah hiperpigmentasi.\n- Jika customer tetap ingin minum, harus di bawah pengawasan.","p":["DVN"],"k":"kondisi medis & penyakit","s":"bersyarat","rd":false,"by":["Nutritionist Novrianti"],"d":"2024-09-19","n":1,"kasus":[],"kw":["cacar","cacar air","varicella","bekas cacar","kemerahan","hiperpigmentasi"]},{"id":423,"q":"Apakah ibu menyusui yang anaknya alergi protein boleh minum DVN?","a":"Kemungkinan besar berpengaruh sama seperti makanan berprotein.\n- DVN mengandung fish collagen, yang mengandung asam amino (bentuk sederhana dari protein).\n- Jika saat ibu makan makanan berprotein anak timbul alergi, kemungkinan besar konsumsi DVN akan berpengaruh sama.","p":["DVN"],"k":"hamil, menyusui & promil","s":"tergantung","rd":false,"by":["Nutritionist Novrianti"],"d":"2024-09-15","n":1,"kasus":[{"d":"2024-09-15","t":"Ibu menyusui, anaknya punya alergi protein → bila anak bereaksi saat ibu makan protein, DVN kemungkinan besar berefek sama."}],"kw":["busui","menyusui","asi","alergi protein","alergi anak","bayi alergi","kolagen ikan"]},{"id":424,"q":"Bagaimana aturan minum DVN dan S-Glow, termasuk bila ingin minum keduanya?","a":"Anjurannya 2 tablet per hari.\n- Jika ingin mengonsumsi keduanya: S-Glow di pagi hari dan DVN di malam hari.","p":["DVN","S-Glow"],"k":"cara minum & dosis","s":"info","rd":false,"by":["Nutritionist Novrianti"],"d":"2024-08-29","n":1,"kasus":[],"kw":["aturan minum","cara minum","dosis","sglow","s-glow","pagi malam","kombinasi","diminum bersamaan"]},{"id":425,"q":"Apakah DVN cocok untuk vegetarian?","a":"Tidak.\n- DVN mengandung fish collagen (kolagen dari ikan).","p":["DVN"],"k":"usia & kelompok khusus","s":"tidak","rd":false,"by":["Nutritionist Novrianti"],"d":"2024-08-22","n":1,"kasus":[],"kw":["vegetarian","vegan","kolagen ikan","fish collagen","bahan hewani","nabati"]},{"id":426,"q":"Kenapa konsumen jadi sering buang air kecil (kadang disertai perih) setelah minum Erojan, dan apa yang harus dilakukan?","a":"Bisa terkait efek detoksifikasi, tapi bila tetap sering walau dosis sudah 1 kapsul sehari, sebaiknya cek kesehatan lebih lanjut.\n- Cuscuta chinensis di Erojan membantu proses detoksifikasi (pengeluaran racun lewat keringat, urin, atau feses), jadi cukupi air minum dan serat agar lebih optimal.\n- Tanyakan riwayat kesehatannya: apakah ada diabetes atau gangguan saluran kemih.\n- Saran awal penasihat (dari tangkapan layar jawaban sebelumnya): cukup air minum; bila lebih dari 2 minggu makin tidak nyaman, konsumsi 1x sehari.\n- Bila sudah 1 kapsul sehari tetap sering buang air kecil: cek apakah ada gangguan kesehatan lain atau obat yang bersifat diuretik/sekresi. Menurut penasihat seharusnya tidak seperti itu, jadi lebih baik cek kesehatan lebih lanjut.\n- Patokan: normalnya buang air kecil rata-rata 6–10 kali per hari, tergantung aktivitas dan asupan.\n- Pak Yota (Country Manager) menyampaikan, secara pribadi ia tidak terlalu merasakan efek pada intensitas buang air kecil.","p":["Erojan"],"k":"efek samping & keluhan","s":"info","rd":true,"by":["Nutritionist Novrianti","Pak Yota (Country Manager)"],"d":"2024-08-20","n":2,"kasus":[{"d":"2024-07-29","t":"Konsumen Erojan sudah menurunkan dosis jadi 1x sehari sesuai saran awal, tapi tetap sering buang air kecil → cek gangguan kesehatan lain/obat diuretik dan periksa kesehatan lebih lanjut."},{"d":"2024-08-20","t":"Setelah 1 minggu minum Erojan, konsumen jadi sering pipis, perih saat pipis, area kelamin terasa pegal, dan berhenti minum sementara → cek riwayat diabetes/gangguan saluran kemih, cukupi air dan serat."}],"kw":["sering kencing","sering pipis","buang air kecil","bak","pipis perih","nyeri kencing","anyang-anyangan","saluran kemih","diabetes","detoks","cuscuta","diuretik"]},{"id":427,"q":"Kenapa setelah rutin minum DVN muncul bintik-bintik hitam kecil di kulit tangan, dan apa yang disarankan?","a":"Disarankan ubah cara minumnya:\n- Penasihat menanyakan dulu sudah berapa lama minum DVN dan apakah ada perawatan luar yang dipakai atau berubah.\n- Ubah konsumsi DVN menjadi sehari sekali di malam hari.\n- Tetap pakai sunscreen.","p":["DVN"],"k":"efek samping & keluhan","s":"bersyarat","rd":false,"by":["Nutritionist Novrianti"],"d":"2024-08-10","n":1,"kasus":[{"d":"2024-08-10","t":"Sudah minum 5 botol DVN, badan belum terlihat berubah, 2 minggu terakhir muncul bintik hitam kecil di tangan; tanpa riwayat alergi dan hanya memakai lotion → minum 1x sehari di malam hari dan tetap pakai sunscreen."}],"kw":["bintik hitam","noda hitam","flek","kulit tangan","hiperpigmentasi","sunscreen","efek samping"]},{"id":428,"q":"Selama minum DVN, apakah customer sebaiknya berhenti memakai krim dari dokter atau boleh dibarengi?","a":"Lebih baik dibarengi.\n- Skincare/krim adalah perlindungan dari luar, sedangkan DVN untuk memenuhi asupan sesuai kebutuhan.","p":["DVN"],"k":"minum bersama obat/suplemen","s":"boleh","rd":false,"by":["Nutritionist Novrianti"],"d":"2024-08-06","n":1,"kasus":[],"kw":["krim dokter","cream dokter","skincare","perawatan dokter","dibarengi","krim wajah","topikal"]},{"id":429,"q":"Apakah DVN bisa membantu membuat pipi chubby (tembem) menjadi lebih tirus?","a":"Belum bisa.\n- Untuk keinginan pipi chubby menjadi tirus, DVN belum bisa membantu.","p":["DVN"],"k":"manfaat & hasil","s":"info","rd":false,"by":["Nutritionist Novrianti"],"d":"2024-07-20","n":1,"kasus":[],"kw":["pipi chubby","pipi tembem","cabi","tirus","wajah tirus","pipi tirus","pelangsing wajah"]},{"id":430,"q":"Apakah orang yang sudah terdiagnosis alergi vitamin C boleh minum DVN?","a":"Tidak disarankan.\n- DVN mengandung vitamin C, jadi tidak bisa disarankan bila sudah terdiagnosis alergi vitamin C.\n- Reaksi alergi dari bahan topikal (pemakaian luar) memang lebih cepat terlihat dibanding konsumsi oral (ditelan), tetapi untuk menghindari rasa tidak nyaman pada konsumen, lebih baik tidak disarankan.","p":["DVN"],"k":"kondisi medis & penyakit","s":"tidak","rd":false,"by":["Nutritionist Novrianti"],"d":"2024-07-16","n":1,"kasus":[{"d":"2024-07-16","t":"Konsumen dengan flek sedang menjalani perawatan dokter; wajahnya pernah alergi vitamin C (gatal parah setelah memakai skincare) → DVN tidak disarankan."}],"kw":["alergi vitamin c","vitamin c","alergi","gatal","flek","skincare","iritasi"]},{"id":431,"q":"Apakah penderita autoimun Sjögren's syndrome dan ankylosing spondylitis boleh minum DVN?","a":"Belum bisa dipastikan — konsultasikan dulu ke dokter dan ketahui pemicunya.\n- Kondisi khusus seperti ini harus dikonsultasikan dulu: apakah ada bahan yang bisa memicu alergi atau memicu gejala yang mengganggu kesehatan.\n- Klien perlu bertanya ke dokternya dan mengetahui pemicu gejalanya terlebih dahulu; setelah itu baru bisa disarankan boleh atau tidak minum DVN.\n- Perlu dicek apakah pemicu masalah kulit dan nyeri otot/sendinya dari makanan atau bukan. Biasanya pemicunya seperti stres, kecapekan, kurang tidur, atau asupan protein/gula yang tinggi.\n- Daftar kandungan lengkap DVN ada di kemasan.","p":["DVN"],"k":"kondisi medis & penyakit","s":"tergantung","rd":true,"by":["Nutritionist Novrianti"],"d":"2024-07-04","n":1,"kasus":[{"d":"2024-07-04","t":"Konsumen autoimun (Sjögren's syndrome & ankylosing spondylitis) dengan masalah kulit ringan, nyeri dan kaku otot/sendi, terapi rutin ke dokter reumatologi → konsultasi dokter dan cari tahu pemicunya dulu."}],"kw":["autoimun","sjogren","sjögren's syndrome","ankylosing spondylitis","spondilitis","nyeri sendi","kaku otot","reumatologi","rematik"]},{"id":432,"q":"Apa saja kandungan lengkap DVN?","a":"Kandungan lengkap tercantum di kemasan. Per tablet kunyah (sesuai foto kemasan yang dibagikan penasihat):\n- Kolagen ikan terhidrolisis 150 mg dan kolagen tripeptida 50 mg.\n- L-glutathione tereduksi 25 mg, ekstrak buah delima (Viqua) 25 mg, dan vitamin C 25 mg.\n- Natrium hialuronat 15 mg dan ekstrak akar knotweed Jepang (Polygonum cuspidatum) 10 mg.\n- Bahan tambahan: manitol, sukralosa, perisa yuzu, karmoisin.\n- Kegunaan yang tertulis di kemasan: untuk membantu memelihara kesehatan kulit.","p":["DVN"],"k":"kandungan & keamanan produk","s":"info","rd":false,"by":["Nutritionist Novrianti"],"d":"2024-07-04","n":1,"kasus":[],"kw":["kandungan","komposisi","ingredients","kolagen","glutathione","vitamin c","delima","knotweed","natrium hialuronat","bahan tambahan"]},{"id":433,"q":"Bagaimana menjawab konsumen yang khawatir kandungan manitol dan pewarna karmoisin di DVN (dianggap haram dan berbahaya jangka panjang)?","a":"DVN sudah memiliki sertifikat halal MUI dan BPJPH.\n- Untuk klaim manitol 'meningkatkan tekanan otak', penasihat meminta klarifikasi maksudnya dulu (belum ada jawaban lanjutan di chat).","p":["DVN"],"k":"kandungan & keamanan produk","s":"info","rd":false,"by":["Nutritionist Novrianti"],"d":"2024-07-01","n":1,"kasus":[{"d":"2024-07-01","t":"Konsumen menganggap manitol bisa meningkatkan tekanan otak dan pewarna karmoisin berasal dari hewan sehingga haram."}],"kw":["manitol","mannitol","karmoisin","carmoisine","pewarna","halal","haram","bahan tambahan"]},{"id":434,"q":"Kenapa nilai PSA konsumen tidak turun (dari 4 menjadi 4,01) setelah menghabiskan 3 botol Erojan?","a":"Sarankan konsultasi ke dokter untuk diagnosis dan tes lanjutan.\n- Tanyakan: apakah sebelumnya sudah didiagnosis radang prostat atau BPH, dan apakah obat-obatan masih diminum. Jika masih dalam proses penyembuhan, suplemen diminum sebagai pendukung menjaga kesehatan.\n- Tes PSA adalah tes awal untuk mengidentifikasi adanya peradangan, infeksi, atau ketidakseimbangan kelenjar prostat.\n- Nilai PSA bisa dipengaruhi usia, penggunaan obat, ISK, gangguan ejakulasi, dan lainnya, jadi perlu diagnosis dan tes lanjutan.","p":["Erojan"],"k":"manfaat & hasil","s":"info","rd":true,"by":["Nutritionist Novrianti"],"d":"2024-06-26","n":1,"kasus":[{"d":"2024-06-26","t":"PSA konsumen 4 sebelum minum Erojan dan 4,01 setelah menghabiskan 3 botol → konsultasi dokter untuk diagnosis dan tes lanjutan."}],"kw":["psa","prostat","bph","pembesaran prostat","radang prostat","hasil lab","tes psa"]},{"id":435,"q":"Apakah penderita batu empedu atau batu ginjal boleh minum DVN?","a":"Boleh/aman, dengan catatan:\n- Di dalam DVN tidak ada lemak ataupun mineral.\n- Untuk batu empedu: beri jarak waktu minum DVN dari obat-obatan, cukupi air minum, dan tetap dalam pengawasan dokter.","p":["DVN"],"k":"kondisi medis & penyakit","s":"bersyarat","rd":true,"by":["Nutritionist Novrianti"],"d":"2024-06-12","n":2,"kasus":[],"kw":["batu ginjal","batu empedu","ginjal","empedu","kantong empedu","kencing batu","mineral","lemak","jeda obat","air minum","pengawasan dokter"]},{"id":436,"q":"Apakah konsumen dengan riwayat gondok beracun boleh minum suplemen Wellous (produk tidak disebutkan)?","a":"Boleh, selama sudah sembuh.\n- Menurut penasihat, kondisi ini sepertinya bukan penyakit menahun (disebut terjadi tiba-tiba karena virus), jadi selama sudah sembuh bisa konsumsi suplemen.","p":["Umum"],"k":"kondisi medis & penyakit","s":"bersyarat","rd":false,"by":["Nutritionist Novrianti"],"d":"2024-06-06","n":1,"kasus":[],"kw":["gondok beracun","gondok","struma","tiroid","hipertiroid","riwayat penyakit","sudah sembuh"]},{"id":437,"q":"Berapa kandungan kalsium per tablet DVN?","a":"Tidak ada.\n- DVN tidak mengandung kalsium.","p":["DVN"],"k":"kandungan & keamanan produk","s":"info","rd":false,"by":["Nutritionist Novrianti"],"d":"2024-06-02","n":1,"kasus":[],"kw":["kalsium","kandungan kalsium","calcium","mineral","batu ginjal","komposisi"]},{"id":438,"q":"Bagaimana jika setelah minum 2 tablet DVN sekaligus muncul sakit pinggang-punggung, urine cokelat pekat, dan kelopak mata bengkak?","a":"Jika tetap ingin minum, turunkan ke 1 kali sehari dulu dan perbanyak air putih:\n- Tanyakan dulu: apakah ada makanan atau suplemen lain yang dikonsumsi, dan apakah ada riwayat alergi.\n- Saat konsumsi suplemen, minum air lebih banyak dari biasanya.","p":["DVN"],"k":"efek samping & keluhan","s":"bersyarat","rd":false,"by":["Nutritionist Novrianti"],"d":"2024-06-02","n":1,"kasus":[{"d":"2024-06-02","t":"Konsumen beberapa hari minum 2 tablet sekaligus (sering lupa minum pagi), lalu pinggang-punggung sakit, urine cokelat lebih pekat, kelopak mata bengkak → 1x sehari dulu + perbanyak air."}],"kw":["sakit pinggang","urine coklat","kencing pekat","mata bengkak","2 tablet sekaligus","lupa minum","air putih","efek samping"]},{"id":439,"q":"Apakah DVN aman untuk ginjal?","a":"Disesuaikan dengan kondisi konsumen:\n- DVN tidak mengandung kalsium.\n- Konsumsi suplemen perlu asupan air yang cukup untuk membantu penyerapannya, jadi harus disesuaikan dengan kondisi masing-masing konsumen.","p":["DVN"],"k":"kondisi medis & penyakit","s":"tergantung","rd":false,"by":["Nutritionist Novrianti"],"d":"2024-06-02","n":1,"kasus":[],"kw":["ginjal","aman untuk ginjal","fungsi ginjal","air putih","kalsium","penyakit ginjal","batu ginjal"]},{"id":440,"q":"Kenapa logo halal MUI belum tercantum di kemasan DVN?","a":"Karena perubahan (variasi) kemasan masih dalam proses pendaftaran ke BPOM dan belum disetujui, sehingga logo halal belum dicetak di kemasan.\n- Penasihat sempat menyebut sertifikat baru didapat bulan itu, lalu meralatnya; alasan yang benar adalah persetujuan variasi kemasan dari BPOM.","p":["DVN"],"k":"kandungan & keamanan produk","s":"info","rd":false,"by":["Nutritionist Novrianti"],"d":"2024-05-27","n":1,"kasus":[],"kw":["logo halal","halal mui","kemasan","label halal","bpom","sertifikat halal","halal"]},{"id":441,"q":"Bagaimana cara mengecek sertifikat/status halal DVN (misalnya di situs BPJPH atau LPPOM MUI)?","a":"Sertifikat halal DVN ada dan bisa dicek dengan cara berikut:\n- Di situs BPJPH (https://bpjph.halal.go.id, menu Cek Produk Halal): cukup isi kolom nama produk (di contoh penasihat ditulis 'D.v.n'); kolom lain tidak perlu diisi. BPJPH adalah lembaga penerbit sertifikat halal DVN.\n- Sejak update 30 Mei 2024, DVN juga sudah terdaftar dan bisa dicari di situs LPPOM MUI (halalmui.org). Di tangkapan layar penasihat: sertifikat LPPOM-00280117710421, produsen PT Setia Kawan Abadi, berlaku sampai 21 November 2027.\n- File sertifikat halal ada di folder sertifikat (link Google Drive di grup Telegram tim); barcode di kiri bawah sertifikat bisa di-scan untuk cek keasliannya.\n- Panduan cek status sertifikasi halal di halal.go.id: https://kemenag.go.id/pers-rilis/cek-status-sertifikasi-halal-produk-di-halalgoid-ini-caranya-boolu7","p":["DVN"],"k":"kandungan & keamanan produk","s":"info","rd":false,"by":["Nutritionist Novrianti"],"d":"2024-05-27","n":2,"kasus":[{"d":"2024-03-17","t":"Konsumen mencari di situs halal MUI dan muncul keterangan 'belum memiliki Ketetapan Halal MUI atau produk tidak dipublish' → dicek lewat BPJPH/sertifikat; sejak 30 Mei 2024 DVN juga sudah bisa dicari di situs LPPOM MUI."}],"kw":["halal","sertifikat halal","cek halal","bpjph","mui","lppom mui","halal mui","nomor halal","barcode","label halal"]},{"id":442,"q":"Apakah penderita PPOK (penyakit paru obstruktif kronis) boleh minum Erojan?","a":"Bisa, dengan catatan:\n- Erojan utamanya bukan untuk membantu proses pemulihan penyakit yang sedang diderita.\n- Bedakan waktu minumnya dengan obat-obat yang sedang dikonsumsi.","p":["Erojan"],"k":"kondisi medis & penyakit","s":"bersyarat","rd":false,"by":["Nutritionist Novrianti"],"d":"2024-05-22","n":1,"kasus":[],"kw":["ppok","copd","paru","paru-paru","penyakit paru","sesak","jeda obat"]},{"id":443,"q":"Apakah Erojan boleh diminum konsumen dengan komorbid (diabetes, jantung 2 ring, prostatitis) yang rutin minum obat resep dokter?","a":"Erojan hanya bisa sebagai pendukung, dan hasilnya butuh waktu sangat lama.\n- Kemungkinan besar obat-obatan yang diminum akan memengaruhi kualitas hormonal, sehingga Erojan hanya berperan sebagai pendukung (supporting).","p":["Erojan"],"k":"minum bersama obat/suplemen","s":"bersyarat","rd":false,"by":["Nutritionist Novrianti"],"d":"2024-05-21","n":1,"kasus":[{"d":"2024-05-21","t":"Konsumen dengan diabetes, jantung terpasang 2 ring, dan prostatitis, khawatir interaksi dengan obat resep → Erojan hanya pendukung, hasil sangat lama."}],"kw":["komorbid","diabetes","ring jantung","prostatitis","prostat","interaksi obat","obat resep","hormon"]},{"id":444,"q":"Apakah DVN aman untuk konsumen dengan riwayat kista yang sudah berkali-kali dioperasi?","a":"Bisa, tetap di bawah kontrol dokter.\n- Jika tujuannya untuk mengobati atau mencegah kista, jelas DVN tidak bisa.\n- Bahan dalam DVN tidak ada yang bersifat karsinogenik ataupun memicu kista timbul kembali.\n- Tetap sarankan menjaga asupan makan dan gaya hidup.","p":["DVN"],"k":"kondisi medis & penyakit","s":"bersyarat","rd":true,"by":["Nutritionist Novrianti"],"d":"2024-05-21","n":1,"kasus":[{"d":"2024-05-21","t":"Konsumen dengan riwayat kista di dagu, sudah 7 kali operasi (dagu memakai titanium) → boleh, tetap di bawah kontrol dokter."}],"kw":["kista","operasi kista","kista dagu","kista kambuh","pasca operasi","karsinogenik","titanium"]},{"id":445,"q":"Apakah DVN boleh diminum saat sedang minum antibiotik untuk infeksi pencernaan, dan perlu jeda berapa jam?","a":"Jika DVN terasa terlalu asam, minum bersamaan dengan makanan.\n- Penasihat tidak menyebutkan jeda jam tertentu dengan antibiotik.","p":["DVN"],"k":"minum bersama obat/suplemen","s":"bersyarat","rd":false,"by":["Nutritionist Novrianti"],"d":"2024-05-12","n":1,"kasus":[],"kw":["antibiotik","infeksi pencernaan","infeksi lambung","asam","lambung","jeda minum","makanan"]},{"id":446,"q":"Bagaimana menanggapi keluhan warna kapsul BLZ Pro yang berbeda (cokelat vs lebih muda/abu-abu) antar botol?","a":"Belum ada kesimpulan di chat; penasihat meminta data untuk pengecekan:\n- Pastikan apakah kapsul berasal dari botol yang sama atau berbeda.\n- Minta foto/video unboxing, nomor batch, tanggal kedaluwarsa, dan nomor order.\n- Catatan penasihat: kapsul yang warnanya lebih muda terlihat tidak ada stamp logo pada kapsulnya.","p":["BLZ Pro"],"k":"kandungan & keamanan produk","s":"info","rd":false,"by":["Nutritionist Novrianti"],"d":"2024-04-29","n":1,"kasus":[{"d":"2024-04-29","t":"Konsumen punya dua botol BLZ Pro (lama dan baru) dengan warna kapsul berbeda: cokelat dan abu-abu/lebih muda."}],"kw":["warna kapsul","kapsul beda","bio lingzhi","blz","batch","keaslian","produk palsu","unboxing"]},{"id":447,"q":"Apakah DVN punya sertifikat GMP dan ISO?","a":"Pabrik DVN tersertifikasi GMP.\n- Untuk salinan sertifikat yang bisa ditunjukkan ke konsumen, penasihat masih harus menanyakan dulu (belum ada jawaban lanjutan di chat).\n- Pertanyaan soal ISO tidak dijawab.","p":["DVN"],"k":"kandungan & keamanan produk","s":"info","rd":false,"by":["Nutritionist Novrianti"],"d":"2024-04-27","n":1,"kasus":[],"kw":["gmp","cpob","iso","sertifikat","pabrik","sertifikasi","legalitas"]},{"id":448,"q":"Apakah penderita penyakit liver (hati) boleh minum DVN?","a":"Tergantung kondisinya:\n- Jika masih dalam masa pengobatan dan ada pembatasan asupan makanan → tidak disarankan; dalam kondisi itu penasihat menyarankan tidak mengonsumsi produk suplemen yang umum (general).\n- Jika tidak dalam kondisi tersebut → boleh dicoba, mulai 1 tablet per hari dulu; bila diminum bersama obat, terus pantau kondisinya.","p":["DVN"],"k":"kondisi medis & penyakit","s":"tergantung","rd":false,"by":["Nutritionist Novrianti"],"d":"2024-04-19","n":2,"kasus":[],"kw":["liver","hati","penyakit hati","fungsi hati","lever","obat liver","pengobatan liver","pembatasan makanan","suplemen","1 tablet"]},{"id":449,"q":"Apakah DVN boleh diminum setelah operasi benjolan di payudara?","a":"Belum, selesaikan pengobatannya dulu.\n- Penasihat menyarankan menyelesaikan pengobatannya terlebih dahulu sebelum minum DVN.","p":["DVN"],"k":"pasca operasi & tindakan medis","s":"tidak","rd":false,"by":["Nutritionist Novrianti"],"d":"2024-04-16","n":1,"kasus":[],"kw":["operasi payudara","benjolan payudara","pasca operasi","tumor payudara","payudara","pengobatan"]},{"id":450,"q":"Apakah DVN bisa memengaruhi tekanan darah atau menyebabkan pusing/kliyengan?","a":"Reaksi tiap tubuh bisa berbeda; pastikan cara minumnya benar dan cek penyebab lain:\n- DVN adalah pangan fungsional/suplemen yang mengandung banyak bahan tumbuhan dan bahan tambahan seperti L-glutathione untuk kesehatan kulit, sehingga efeknya bisa berbeda pada tiap orang.\n- Pastikan tidak diminum bersamaan dengan obat, cukup air putih, dan diminum setelah makan.\n- Perhatikan penyebab lain pusing/kliyengan: kelelahan, kurang tidur, bangun dari tidur atau duduk secara tiba-tiba, penggunaan obat, sedang diet atau asupan kalori turun.","p":["DVN"],"k":"efek samping & keluhan","s":"info","rd":false,"by":["Nutritionist Novrianti"],"d":"2024-04-15","n":1,"kasus":[{"d":"2024-04-15","t":"Konsumen mengeluh tekanan darah drop dan kliyengan setelah minum DVN (sebelumnya minum kolagen lain tidak begitu); pola makan aman."}],"kw":["tekanan darah","darah rendah","hipotensi","tensi drop","pusing","kliyengan","sakit kepala","efek samping"]},{"id":451,"q":"Apakah efek glutathione di DVN hilang dan kulit kembali ke warna asal jika berhenti minum?","a":"Lama-tidaknya efek bertahan dipengaruhi kebiasaan makan dan aktivitas yang terpapar sinar matahari.\n- Sarankan membaca artikel yang ditulis ahli (dokter, nutritionist, terapis, apoteker, dan sejenisnya).\n- Suplemen glutathione berfungsi sebagai pendukung untuk mempercepat proses pemulihan dan menahan reaksi oksidasi, bukan menghilangkan sel melanin (terutama pigmen gelap).\n- Bahkan suntik putih, vitamin C, dan glutathione dosis tinggi yang mahal pun efeknya sebentar dan harus diulang pada periode tertentu.","p":["DVN"],"k":"manfaat & hasil","s":"info","rd":false,"by":["Nutritionist Novrianti"],"d":"2024-04-09","n":1,"kasus":[],"kw":["glutathione","glutation","berhenti minum","kulit kembali gelap","pemutih","mencerahkan","melanin","efek sementara"]},{"id":452,"q":"Apakah DVN bisa memicu kanker? Bagaimana dengan penyintas kanker?","a":"Kanker dipicu banyak faktor; yang bisa dilakukan adalah konsumsi tinggi antioksidan.\n- Asupan antioksidan tinggi membantu agar sel kanker tidak aktif dan imun tubuh kuat melawan sel tersebut.\n- Penyintas kanker yang ingin minum DVN: bisa, selama di bawah konsultasi dan pengawasan dokter, dengan dosis sesuai anjuran.","p":["DVN"],"k":"kandungan & keamanan produk","s":"info","rd":true,"by":["Nutritionist Novrianti"],"d":"2024-03-28","n":1,"kasus":[],"kw":["kanker","memicu kanker","karsinogenik","penyintas kanker","cancer","antioksidan","tumor"]},{"id":453,"q":"Bagaimana menjawab konsumen yang meragukan izin BPOM DVN karena tidak bisa dicek secara manual?","a":"Yakinkan konsumen bahwa DVN aman dikonsumsi bila:\n- Produk diterima dalam keadaan tersegel.\n- Tidak berbau.\n- Tabletnya berlogo W.\n- Penasihat juga meminta foto kasusnya untuk dicek.","p":["DVN"],"k":"kandungan & keamanan produk","s":"info","rd":false,"by":["Nutritionist Novrianti"],"d":"2024-03-25","n":1,"kasus":[{"d":"2024-03-25","t":"Konsumen menemukan DVN di situs Cek Produk BPOM tetapi detailnya error, dan barcode di botol malah mengarah ke web halal."}],"kw":["bpom","cek bpom","izin edar","nomor bpom","barcode","keaslian","asli","segel"]},{"id":454,"q":"Apakah DVN bisa membantu bercak/kelainan kulit pada konsumen yang didiagnosis autoimun dengan gejala mirip psoriasis/eksim?","a":"Kalau masih dalam perawatan, tanyakan dulu ke dokternya.\n- Bercak seperti di foto bisa karena bekas luka lama yang dalam atau hiperpigmentasi karena penuaan; tanyakan awal mulanya.\n- L-glutathione bisa membantu menahan hiperpigmentasi berlebih.\n- Penasihat juga menyebut: dari pengalamannya dengan produk sebelumnya pernah timbul gatal; produk yang sekarang belum ia coba.","p":["DVN"],"k":"kondisi medis & penyakit","s":"tergantung","rd":true,"by":["Nutritionist Novrianti"],"d":"2024-03-23","n":1,"kasus":[{"d":"2024-03-23","t":"Konsumen dengan bercak-bercak di kulit; menurut dokter autoimun dengan gejala mirip psoriasis/eksim → tanyakan ke dokter yang merawat."}],"kw":["psoriasis","eksim","eczema","autoimun","bercak kulit","hiperpigmentasi","flek","glutathione"]},{"id":455,"q":"Apakah konsumen dengan riwayat VES (ventrikel ekstrasistol) yang sudah lepas obat boleh minum DVN?","a":"Boleh.\n- Kondisinya seharusnya sudah di fase sembuh (sudah lepas obat), jadi sudah bisa minum DVN.","p":["DVN"],"k":"kondisi medis & penyakit","s":"boleh","rd":false,"by":["Nutritionist Novrianti"],"d":"2024-03-16","n":1,"kasus":[{"d":"2024-03-16","t":"Konsumen dengan VES yang diketahui sejak 1996, sekarang sudah lepas obat → boleh."}],"kw":["ves","ventrikel ekstrasistol","extrasistol","jantung","irama jantung","jantung berdebar","lepas obat"]},{"id":456,"q":"Apakah BLZ Pro bisa membantu menurunkan kolesterol?","a":"Bisa membantu kontrol kadar kolesterol, dengan catatan:\n- Kolesterol tidak otomatis turun seperti saat minum obat.","p":["BLZ Pro"],"k":"manfaat & hasil","s":"bersyarat","rd":false,"by":["Nutritionist Novrianti"],"d":"2024-03-11","n":1,"kasus":[],"kw":["kolesterol","kolestrol","lemak darah","menurunkan kolesterol","blz","bio lingzhi","lingzhi"]},{"id":457,"q":"Apakah BLZ Pro bisa membantu mengatasi batu empedu?","a":"Tergantung penyebabnya:\n- Kalau batu empedunya disebabkan kolesterol → bisa.\n- Ingat: BLZ Pro membantu kontrol kadar kolesterol, tetapi tidak otomatis menurunkannya seperti obat.","p":["BLZ Pro"],"k":"manfaat & hasil","s":"tergantung","rd":false,"by":["Nutritionist Novrianti"],"d":"2024-03-11","n":1,"kasus":[],"kw":["batu empedu","empedu","kantong empedu","kolesterol","blz","bio lingzhi","lingzhi"]},{"id":458,"q":"Kopi di Coffiyy jenis arabika atau robusta?","a":"Campuran Arabika dan Robusta (sudah dikonfirmasi penasihat).\n- Bentuk produknya kopi instan.","p":["Coffiyy"],"k":"kandungan & keamanan produk","s":"info","rd":false,"by":["Nutritionist Novrianti"],"d":"2024-03-10","n":1,"kasus":[],"kw":["arabika","robusta","jenis kopi","biji kopi","kopi instan","coffiyy","coffiy"]},{"id":459,"q":"Apakah DVN boleh diminum saat masa pemulihan pasca operasi lutut dan masih minum obat dari dokter ortopedi?","a":"Boleh.\n- Protein, kolagen, dan vitamin C membantu proses penyembuhan luka.","p":["DVN"],"k":"pasca operasi & tindakan medis","s":"boleh","rd"
