<style>
:root{
  --bg:#f4f5f7; --card:#fff; --text:#1d2129; --muted:#667085; --faint:#98a2b3; --line:#e4e7ec; --soft:#f2f4f7;
  --accent:#2f6fde; --accent-ink:#fff; --accent-soft:#e9f0fd; --mark:#fff0a8; --mark-ink:#1d2129;
  --ok:#137a3d; --ok-bg:#e5f5eb; --warn:#9a5b00; --warn-bg:#fff3dc; --bad:#b42318; --bad-bg:#fdeceb;
  --info:#1d5fa8; --info-bg:#e8f1fb; --doc:#b45309; --doc-bg:#fff0de; --shadow:0 1px 2px rgba(16,24,40,.06);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111418; --card:#1a1e24; --text:#e6e8eb; --muted:#a0a8b4; --faint:#7a8390; --line:#2b313a; --soft:#232830;
    --accent:#5b8ff0; --accent-ink:#0d1117; --accent-soft:#1f2b40; --mark:#5c4c0a; --mark-ink:#fff6cc;
    --ok:#5fd18b; --ok-bg:#163223; --warn:#f2b04a; --warn-bg:#3a2a10; --bad:#ff8a80; --bad-bg:#3d1a18;
    --info:#7fb2f0; --info-bg:#172a42; --doc:#f5a35c; --doc-bg:#3b2410; --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111418; --card:#1a1e24; --text:#e6e8eb; --muted:#a0a8b4; --faint:#7a8390; --line:#2b313a; --soft:#232830;
  --accent:#5b8ff0; --accent-ink:#0d1117; --accent-soft:#1f2b40; --mark:#5c4c0a; --mark-ink:#fff6cc;
  --ok:#5fd18b; --ok-bg:#163223; --warn:#f2b04a; --warn-bg:#3a2a10; --bad:#ff8a80; --bad-bg:#3d1a18;
  --info:#7fb2f0; --info-bg:#172a42; --doc:#f5a35c; --doc-bg:#3b2410; --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:18px 16px 60px}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:14px}
h1{font-size:21px;line-height:1.25;margin:0 0 4px}
.sub{font-size:13px;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#22a861;margin-right:6px;vertical-align:1px}
.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:6px 11px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.lead{font-size:13px;font-weight:600;margin:4px 0 6px}
.src{font-size:12px;color:var(--muted);margin:0 0 12px}
.searchbox{position:relative;margin-bottom:12px}
.searchrow{display:flex;gap:8px}
.inputwrap{position:relative;flex:1;min-width:0}
#q{width:100%;font:inherit;font-size:16px;padding:12px 38px 12px 40px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);outline:none;box-shadow:var(--shadow)}
#q:focus{border-color:var(--accent)}
#q::placeholder{color:var(--faint)}
#q::-webkit-search-cancel-button,#q::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none}
.ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--faint);pointer-events:none}
#clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--faint);font-size:20px;line-height:1;padding:4px 6px;cursor:pointer;display:none}
#clr.on{display:block}
#go{border-radius:12px;padding:0 16px;font-weight:600;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:20;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(16,24,40,.14);overflow:hidden;display:none}
.sugg.on{display:block}
.sugg .hd{font-size:11.5px;color:var(--muted);padding:8px 12px 4px;text-transform:uppercase;letter-spacing:.04em}
.sugg .opt{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--text);font:inherit;font-size:14px;padding:9px 12px;cursor:pointer;border-top:1px solid var(--soft)}
.sugg .opt:first-of-type{border-top:0}
.sugg .opt.act,.sugg .opt:hover{background:var(--accent-soft)}
.sugg .opt small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.sugg .more{font-size:12.5px;color:var(--accent);padding:8px 12px;border-top:1px solid var(--line);cursor:pointer;background:transparent;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;font-family:inherit}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin:-2px 0 12px;font-size:12.5px;color:var(--muted);align-items:center}
.quick button{font:inherit;font-size:12.5px;border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:3px 10px;cursor:pointer}
.quick button:hover{color:var(--accent);border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:5px 12px;cursor:pointer}
.chip .n{color:var(--faint);margin-left:4px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.on .n{color:inherit;opacity:.8}
.chip:disabled{opacity:.45;cursor:default}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
select{flex:1 1 150px;font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:7px 10px;max-width:100%}
.status{font-size:12.5px;color:var(--muted);margin:2px 0 12px}
.status b{color:var(--text)}
.fix{font-size:12.5px;color:var(--info);margin:-6px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow);scroll-margin-top:12px}
.card.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.q{font-size:15.5px;font-weight:700;margin:0 0 6px;line-height:1.4}
.a{white-space:pre-line;margin:0 0 10px;font-size:14.5px}
.a .note{font-size:12.5px;color:var(--muted);margin-top:6px}
.a .warn{font-size:13px;background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:6px 9px;margin-top:6px}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.tag{background:var(--soft);color:var(--text);border-radius:6px;padding:2px 8px;font-weight:600;font-size:12px}
.badge{border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600}
.st-ok{background:var(--ok-bg);color:var(--ok)} .st-warn{background:var(--warn-bg);color:var(--warn)}
.st-bad{background:var(--bad-bg);color:var(--bad)} .st-info{background:var(--info-bg);color:var(--info)}
.rd{background:var(--doc-bg);color:var(--doc)} .cnt,.old{background:var(--soft);color:var(--muted);font-weight:500}
.who{color:var(--text);font-weight:600}
.sp{flex:1}
.copy{font:inherit;font-size:12px;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:6px;padding:2px 9px;cursor:pointer}
.copy:hover{color:var(--accent);border-color:var(--accent)}
.kasus{font-size:12.5px;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
details.relbox{margin-top:8px;font-size:12.5px}
details.relbox summary{cursor:pointer;color:var(--accent);list-style:none;display:inline-block}
details.relbox summary::-webkit-details-marker{display:none}
details.relbox summary::before{content:'▸ ';}
details.relbox[open] summary::before{content:'▾ ';}
.ri{border-left:3px solid var(--line);padding:6px 0 6px 10px;margin:8px 0 0}
.ri .rq{font-weight:600;color:var(--text);font-size:13.5px}
.ri .ra{white-space:pre-line;color:var(--text);font-size:13px;margin-top:3px}
.ri .rm{color:var(--muted);font-size:12px;margin-top:3px}
.rel{font-size:11.5px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 7px}
mark{background:var(--mark);color:var(--mark-ink);border-radius:3px;padding:0 1px}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:22px 18px;text-align:center;color:var(--muted)}
.empty b{color:var(--text)}
#more{display:block;margin:6px auto 0}
footer{margin-top:26px;font-size:12px;color:var(--faint);text-align:center}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);font-size:13px;padding:8px 14px;border-radius:999px;opacity:0;transition:.2s;pointer-events:none;z-index:50}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:560px){
  .wrap{padding:14px 12px 50px}
  h1{font-size:18px}
  #go{padding:0 13px}
  .card{padding:12px 13px}
  .q{font-size:15px}
  .quick{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  .quick::-webkit-scrollbar{display:none}
  .quick button,.quick span{flex:none}
  .filters select{flex:1 1 45%}
  .filters select#cat{flex-basis:100%}
}
</style>

<body>
<div class="wrap">

    <div class="searchrow">
      <div class="inputwrap">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search"
          placeholder="Ketik pertanyaan customer di sini…"
          role="combobox" aria-expanded="false" aria-controls="sugg" aria-autocomplete="list" aria-label="Cari pertanyaan">

<script>
const QA = [{"id":1,"q":"Apakah konsumen yang masih punya benjolan di payudara (kista payudara, FAM/fibroadenoma mammae, atau benjolan kecil) boleh minum Novia?","a":"Jangan dulu / tidak disarankan — benjolannya perlu diterapi secara medis terlebih dahulu.\n- FAM: tidak boleh, khawatir memicu sel FAM menjadi aktif; sebaiknya disarankan terapi medis untuk FAM-nya dulu.\n- Kista payudara: kistanya perlu diterapi secara benar dan secara medis terlebih dahulu.\n- Benjolan kecil yang sudah dicek ke dokter tetapi tidak sedang berobat: tetap tidak disarankan karena dokter khawatir Novia memicu kondisi hormonalnya yang sekarang; konsultasikan ke dokter yang merawat — keputusan akhir kembali ke penilaian langsung dokter tersebut.\n- Catatan: jawaban lama (2026-03-26, Dr Rizky Nasution) sempat membolehkan kista payudara dengan catatan diminum jauh dari waktu minum obat, mulai 1 kali per hari, dan selalu di bawah pengawasan; ikuti yang terbaru.","p":["Novia"],"k":"kondisi medis & penyakit","s":"tidak","rd":true,"by":["Dr Rizky Nasution"],"d":"2026-10-17","n":4,"kasus":[{"d":"2026-09-20","t":"Benjolan kecil di payudara (ukuran 0,sekian), sudah dicek ke dokter, tidak sedang berobat; sudah beli Novia tapi belum berani minum → tidak disarankan, konsultasi ke dokter yang merawat."}],"kw":["benjolan payudara","benjolan di payudara","kista payudara","fam","fibroadenoma","fibroadenoma mammae","tumor jinak payudara","payudara","kista","breast cyst","breast lump","hormonal"]},{"id":2,"q":"Apakah konsumen 59 tahun dengan robekan meniskus lutut yang rutin minum vitamin D3+K2, Artrodar 50 mg, dan glucosamine boleh minum Novia?","a":"Boleh saja, tidak apa-apa.\n- Beri jarak konsumsi di atas 6 jam dari obat/suplemen rutinnya.","p":["Novia"],"k":"minum bersama obat/suplemen","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-10-15","n":1,"kasus":[{"d":"2026-10-15","t":"Usia 59 tahun, kedua lutut sakit karena meniskus robek; rutin vitamin D3+K2, Artrodar 50 mg 2x sehari, glucosamine 250 mg → boleh, jarak di atas 6 jam."}],"kw":["meniskus","lutut","sendi","artrodar","glucosamine","vitamin d3","jeda 6 jam"]},{"id":3,"q":"Apakah konsumen yang baru (sekitar 1–2 bulan) operasi angkat rahim — mis. sekaligus angkat miom atau ovarium — boleh minum Novia?","a":"Boleh, dengan penjelasan ke konsumen.\n- Jelaskan bahwa respon tubuh terhadap suplemen akan berbeda dan mungkin lebih lama, dan efeknya butuh proses — misalnya pada konsumen yang mengalami menopause akibat operasi angkat rahim dan ovarium.\n- Untuk yang baru (kurang dari 1 bulan) operasi angkat miom sekaligus rahim: boleh dicoba dengan setengah dosis dulu setiap harinya, dan evaluasi keluhan atau gejala yang muncul selama minum Novia.\n- Jika tujuannya agar haid lancar setelah histerektomi total: haid yang tidak lancar adalah salah satu efek operasi histerektomi, jadi bantu jelaskan supaya konsumen tidak berekspektasi berlebihan.\n- Catatan: jawaban lama (2026-06-08, Dr Rizky Nasution) sempat menyarankan konsultasi dulu ke dokter yang merawat karena konsumen baru pascaoperasi (kondisi riilnya harus dicek atas sepengetahuan dokter); ikuti yang terbaru.","p":["Novia"],"k":"pasca operasi & tindakan medis","s":"bersyarat","rd":true,"by":["Dr Rizky Nasution"],"d":"2026-10-13","n":4,"kasus":[{"d":"2026-06-08","t":"Baru operasi angkat miom sekaligus rahim, sudah tidak haid → konsultasi dulu ke dokter yang merawat."},{"d":"2026-08-12","t":"Konsumen 49 th, operasi angkat miom + rahim <1 bulan lalu, masih minum probiotik dari dokter serta suplemen royal jelly & propolis → boleh dicoba setengah dosis, evaluasi keluhan."},{"d":"2026-08-30","t":"Konsumen hampir 53 th, 2 bulan lalu histerektomi total karena miom, tidak minum obat, ingin haid lancar → jelaskan bahwa haid tidak lancar adalah efek histerektomi, jangan berharap berlebihan pada Novia."},{"d":"2026-10-13","t":"Usia 50 tahun, angkat rahim dan ovarium 1 bulan lalu (surgical menopause), tidak minum obat → boleh, jelaskan respon tubuh mungkin lebih lama."}],"kw":["angkat rahim","histerektomi","histerektomi total","baru operasi","pasca operasi","operasi miom","miom","angkat ovarium","surgical menopause","menopause","setengah dosis","haid tidak lancar"]},{"id":4,"q":"Apakah konsumen dengan riwayat hipotiroid atau gangguan tiroid yang masih minum obat tiroid (mis. Euthyrox) boleh minum Novia?","a":"Tergantung kondisinya:\n- Riwayat hipotiroid yang pengobatannya sudah selesai dan dinyatakan kembali sehat oleh dokter → silakan dikonsumsi.\n- Jika belum sehat, masih ada keluhan seperti saat sakit hipotiroid, atau masih minum obat-obatannya (mis. gangguan tiroid yang masih minum Euthyrox setiap hari) → jangan dulu; kondisi tiroidnya diterapi dulu.\n- Respon tubuh orang dengan gangguan tiroid akan berbeda dari biasanya.","p":["Novia"],"k":"kondisi medis & penyakit","s":"tergantung","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-10-13","n":2,"kasus":[{"d":"2026-10-13","t":"Usia 52 tahun, tiroid ringan (belum perlu operasi), minum Euthyrox 50 dan 25 bergantian setiap hari → jangan dulu, terapi tiroid dulu."}],"kw":["hipotiroid","hypothyroid","tiroid","gangguan tiroid","riwayat tiroid","kelenjar tiroid","obat tiroid","euthyrox","levothyroxine","gondok","hipertiroid"]},{"id":5,"q":"Apakah pengguna KB (spiral/IUD, IUD hormonal, implan, suntik, atau pil KB) boleh minum Novia? Kenapa?","a":"Tidak disarankan untuk KB jenis apa pun — KB dan Novia tidak bisa digabung.\n- KB berfungsi menekan hormonal normal wanita (supaya tidak haid secara reguler), sedangkan Novia membantu menormalkan kembali hormonal dan siklus haid; fungsi keduanya bertolak belakang.\n- Jika dipakai bersamaan, efeknya malah bisa menimbulkan ketidakseimbangan hormonal di tubuh.\n- Berlaku untuk KB spiral/IUD (termasuk IUD hormonal), KB implan, KB suntik, maupun pil KB (mis. Andalan, Diane).\n- Jika tujuannya tetap tidak hamil: lanjutkan KB-nya, Novia tidak dianjurkan (memakai KB sambil minum Novia agar haid tetap lancar tidak bisa).\n- Jika ingin minum Novia: stop dan sudahi dulu KB-nya (disampaikan dokter untuk kasus IUD hormonal).\n- Keluhan kram perut, cepat lelah, dan sulit tidur setelah pindah dari KB suntik ke implan adalah respons tubuh yang sedang beradaptasi; memakai Novia justru bertentangan dengan tujuan KB.","p":["Novia"],"k":"haid, hormon & menopause","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-10-10","n":8,"kasus":[{"d":"2026-09-19","t":"Usia 44 tahun, pindah dari KB suntik ke KB implan lalu tidak haid; sebulan ini kram perut, cepat capek, sulit tidur → tidak disarankan Novia."},{"d":"2026-09-30","t":"Usia 39 tahun, masih KB suntik, tidak haid, cepat lelah, kulit kusam, BB naik; ingin tetap tidak hamil tapi haid lancar → tidak bisa, lanjutkan KB, Novia tidak dianjurkan."},{"d":"2026-10-09","t":"Usia 48 tahun, tidak haid karena IUD hormonal, ada penebalan rahim, minum obat darah tinggi, kolesterol, asam urat, vitamin D3, omega 3 → dokter menjawab dari sisi KB saja (penebalan rahim dan obat lain tidak dibahas)."}],"kw":["kb","kontrasepsi","kb spiral","iud","akdr","mirena","kb implan","susuk kb","kb suntik","pil kb","andalan","diane"]},{"id":6,"q":"Novia boleh dikonsumsi mulai usia berapa? Apakah remaja (mis. 15–16 tahun) boleh minum Novia?","a":"Sebenarnya boleh, tetapi dokter menyarankan Novia untuk usia di atas 25 tahun.\n- Untuk remaja (kasus usia 15 tahun yang telat haid ±4 bulan), sarankan juga menjaga pola makan dan jenis makanannya.\n- Semuanya harus berimbang.\n- Catatan: jawaban lama (2025-12-17, Dr Rizky Nasution) sempat menyebut Novia lebih disarankan untuk perempuan usia 30–40-an tahun, sehingga usia 16 tahun berada di luar rentang yang disarankan; ikuti yang terbaru.\n- ⚠️ Perhatikan: label resmi Novia (BPOM) menulis \"Tidak digunakan pada anak-anak, wanita hamil dan menyusui.\" Kalau saran di atas lebih longgar, konfirmasi ulang ke grup sebelum menyarankan ke customer.","p":["Novia"],"k":"usia & kelompok khusus","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-10-09","n":2,"kasus":[{"d":"2026-10-09","t":"Remaja 15 tahun telat haid ±4 bulan → sebenarnya boleh, tapi disarankan usia di atas 25 tahun; jaga pola dan jenis makanan."}],"kw":["usia minimal","batas usia","umur","remaja","anak","abg","usia muda","15 tahun","usia 16","usia 25","telat haid","pola makan"]},{"id":7,"q":"Apakah konsumen dengan gangguan fungsi ginjal (termasuk penurunan ringan, ginjal polikistik, kreatinin tinggi, atau cuci darah) boleh minum Erojan?","a":"Tidak disarankan (jangan).\n- Erojan dikhawatirkan memberatkan fungsi ginjal konsumen; fokus ke pengobatan dulu.\n- Berlaku juga untuk penurunan fungsi ginjal yang masih ringan (mis. eLFG 75 pada usia 26 tahun).\n- Terlebih bila kondisinya kompleks dan obat rutinnya sudah terlalu banyak.\n- Kondisi ginjal seperti ini biasanya disertai pembatasan jumlah air minum, padahal suplemen dan herbal butuh air yang cukup agar penyerapannya baik.\n- Catatan: jawaban lama (2025-06-29, Nutritionist Novrianti) sempat menyarankan pasien cuci darah boleh mencoba Erojan (setelah dialisis dan setelah minum obat, mulai 1x sehari, selalu dipantau), dan jawaban lama (2024-07-03 & 2025-08-01, Nutritionist Novrianti) menyebut jangan dulu sampai pengobatan selesai/kondisi maintenance atau sampai obatnya berkurang; ikuti yang terbaru.","p":["Erojan"],"k":"kondisi medis & penyakit","s":"tidak","rd":false,"by":["Dr Rizky Nasution","Nutritionist Novrianti"],"d":"2026-10-09","n":6,"kasus":[{"d":"2024-07-03","t":"Konsumen dengan ginjal bermasalah dan memakai insulin (diabetes) → saat itu disarankan selesaikan pengobatan sampai kondisi maintenance dulu."},{"d":"2025-06-29","t":"Pria yang menjalani cuci darah → saat itu disarankan boleh dicoba setelah dialisis dan setelah obat, mulai 1x sehari, selalu dipantau (jawaban lama)."},{"d":"2025-08-01","t":"Fungsi ginjal tidak diukur 9 tahun, kreatinin 2, ureum 35, asam urat 10, minum Kethocid, Genalsik, Livitor, Harnal (prostat) → jangan dulu sampai obat berkurang."},{"d":"2026-08-26","t":"Pasien ginjal polikistik (gangguan fungsi ginjal) → jangan Erojan, fokus pengobatan."},{"d":"2026-10-05","t":"Pria 89 tahun, pasca operasi tumor ginjal 3,5 tahun lalu dan kemoterapi (sudah berhenti), sejak itu tidak bisa berhubungan suami-istri; kreatinin 2,17; obat rutin Carvilol, Canderin, atorvastatin, Ibion, Folafit, Ketosteril, vitamin D → tidak disarankan."},{"d":"2026-10-09","t":"Usia 26 tahun, hasil eLFG 75 (penurunan fungsi ginjal ringan/stadium 2) → jangan."}],"kw":["ginjal","gangguan ginjal","fungsi ginjal","gagal ginjal","cuci darah","hemodialisis","ginjal polikistik","kreatinin","elfg","egfr","ureum","sakit ginjal"]},{"id":8,"q":"Apakah konsumen 58 tahun dengan vaginitis atrofi yang harus memakai krim estrogen boleh minum Novia?","a":"Boleh, dengan penjelasan ke konsumen:\n- Kondisinya sudah dipengaruhi usia 58 tahun.\n- Pengobatan utamanya tetap obat-obatan estrogen.\n- Novia hanya sebatas suplemen.","p":["Novia"],"k":"haid, hormon & menopause","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-10-09","n":1,"kasus":[{"d":"2026-10-09","t":"Usia 58 tahun, didiagnosis vaginitis atrofi dan diberi krim estrogen → boleh Novia sebagai suplemen, obat estrogen tetap utama."}],"kw":["vaginitis atrofi","atrophic vaginitis","atrofi vagina","vagina kering","krim estrogen","estrogen","menopause","usia 58"]},{"id":9,"q":"Apakah Novia boleh diminum saat program hamil (promil) — misalnya sambil minum vitamin promil, obat pembesar sel telur, atau sedang IVF?","a":"Tergantung jenis programnya:\n- Sedang terapi promil (IVF/bayi tabung, obat pembesar sel telur) → jangan; fokus ke program/terapinya dulu. Efeknya nanti malah berbeda, dan pada IVF hormon sedang di-setting dalam kondisi tertentu agar sel telur terbentuk.\n- Promil dengan vitamin promil biasa (kasus suami-istri minum Elevit/Menevit pagi, lalu Novia untuk istri dan Erojan untuk suami di malam hari) → jawaban terbaru (2026-10-06, Dr Rizky Nasution): boleh saja, tidak apa-apa.\n- Alasan kehati-hatian dari dokter: Novia membantu menyeimbangkan hormon wanita, tetapi saat hamil dapat mengganggu kestabilan hormon alami tubuh, yang nantinya berefek ke kehamilan dan janin; Nutritionist juga menyebut belum ada penelitian khusus penggunaan DVN pada ibu hamil.\n- Catatan: jawaban lama (2025-11-21, Nutritionist Novrianti; 2026-04-23 dan 2026-06-18, Dr Rizky Nasution) sempat menyarankan jangan minum Novia selama promil — terutama di masa subur, termasuk yang hanya minum vitamin promil bukan dari dokter atau vitamin kehamilan (Queenvit, vitamin D3 5000 IU, asam folat 5 mg); ikuti yang terbaru.","p":["Novia","Erojan"],"k":"hamil, menyusui & promil","s":"tergantung","rd":false,"by":["Nutritionist Novrianti","Dr Rizky Nasution"],"d":"2026-10-09","n":7,"kasus":[{"d":"2025-12-04","t":"Konsumen promil IVF, embrio transfer ditunda karena hormon tidak seimbang → jangan minum Novia dulu, fokus ke program hamil."},{"d":"2026-04-23","t":"Konsumen minum Queenvit, L-Vit D3 5000 IU, dan asam folat 5 mg (diduga sedang promil) → saat itu dijawab jangan minum Novia dulu (saran lama, lihat Catatan)."},{"d":"2026-06-18","t":"Sedang promil mandiri dengan vitamin promil non-resep → saat itu dijawab jangan (saran lama, lihat Catatan)."},{"d":"2026-10-06","t":"Suami-istri promil minum Elevit/Menevit pagi, malamnya Novia (istri) dan Erojan (suami) → boleh."}],"kw":["promil","program hamil","ingin hamil","ivf","bayi tabung","vitamin promil","elevit","menevit","pembesar sel telur","obat kesuburan","masa subur","asam folat"]},{"id":10,"q":"Apakah penyintas kanker (mis. kanker payudara atau kanker serviks) yang pengobatannya sudah selesai boleh minum Novia?","a":"Boleh, dengan catatan:\n- Saat ini konsumen sudah tidak ada keluhan dan sudah tidak minum obat-obatan/terapi apa pun.\n- Pastikan kondisi kesehatannya sudah benar-benar sehat dan kankernya sudah tidak ada lagi.\n- Boleh dicoba dengan dosis normal; evaluasi setelah pemakaian, hati-hati dan perhatikan efek samping yang dirasakan, serta tetap follow up apa pun keluhannya.\n- Jelaskan ke konsumen bahwa respon tubuh penyintas kanker (apalagi di usia ±50 tahun) terhadap suplemen mungkin berbeda dari biasanya.","p":["Novia"],"k":"kondisi medis & penyakit","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-10-06","n":5,"kasus":[{"d":"2026-05-21","t":"Penyintas kanker payudara, mastektomi 13 tahun lalu, sudah pulih total, tanpa obat/terapi → boleh."},{"d":"2026-08-25","t":"Kanker payudara 2024 (sudah pengangkatan & kemo 8x, selesai), kontrol rutin tiap 6 bulan, tidak ada obat dari dokter onkologi, hanya suplemen → boleh dicoba dosis normal, evaluasi & follow up."},{"d":"2026-09-17","t":"Pernah kanker serviks tahun 2023, tidak minum obat rutin, hanya kontrol, kata dokter sudah bagus."},{"d":"2026-10-04","t":"Usia 50 tahun, penyintas kanker payudara, rangkaian pengobatan (kemo dll.) selesai sejak usia 47, sudah tidak haid → boleh, jelaskan respon tubuh bisa berbeda."}],"kw":["penyintas kanker","survivor kanker","cancer survivor","breast cancer survivor","riwayat kanker","pasca kanker","sembuh kanker","kanker payudara","kanker serviks","mastektomi","kemoterapi","perimenopause"]},{"id":11,"q":"Apakah konsumen yang sedang minum obat darah tinggi (juga obat kolesterol atau omega) dengan kondisi baik dan tensi tidak terlalu tinggi boleh minum Erojan?","a":"Boleh, dengan jarak 6 jam dari obatnya.\n- Pastikan kondisi konsumen dalam keadaan baik; pada kasus yang dilampirkan, tekanan darahnya menurut dokter tidak terlalu tinggi, jadi tidak apa-apa minum Erojan.\n- Beri jarak minum 6 jam antara obat (darah tinggi, kolesterol, omega) dan Erojan, karena respon tubuh tiap orang berbeda-beda.","p":["Erojan"],"k":"minum bersama obat/suplemen","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-10-06","n":2,"kasus":[{"d":"2026-01-19","t":"Hasil cek darah: tensi sekitar 130-an/87 mmHg, gula darah sewaktu 145, asam urat 5,2; sedang minum obat darah tinggi → Erojan boleh, jeda 6 jam dari obat."},{"d":"2026-10-06","t":"Pertanyaan lanjutan untuk konsumen yang sama dengan kasus Clopidogrel (Clopidogrel dinyatakan tidak boleh dengan Erojan): obat darah tinggi, kolesterol, dan omega → boleh, jarak 6 jam."}],"kw":["darah tinggi","hipertensi","darting","tensi","obat darah tinggi","obat tensi","kolesterol","obat kolesterol","omega 3","jeda 6 jam","cek darah"]},{"id":12,"q":"Apakah Erojan boleh diminum bersama obat pengencer darah Clopidogrel?","a":"Tidak boleh.\n- Clopidogrel adalah obat pengencer darah dan akan berefek double dengan Erojan.\n- Catatan: jawaban lama (2025-08-06, Nutritionist Novrianti, disetujui Dr Rizky Nasution) untuk konsumen yang rutin minum Clopidogrel 75 mg bersama Atorvastatin, Candesartan, dan Allopurinol sempat menyarankan boleh dengan membedakan waktu minum Erojan dan obatnya; ikuti yang terbaru.","p":["Erojan"],"k":"minum bersama obat/suplemen","s":"tidak","rd":false,"by":["Dr Rizky Nasution","Nutritionist Novrianti"],"d":"2026-10-06","n":2,"kasus":[{"d":"2025-08-06","t":"Rutin minum Clopidogrel 75 mg, Atorvastatin 10 mg, Candesartan 16 mg, dan Allopurinol 300 mg → saat itu disarankan beda waktu minum dengan obat (jawaban lama)."},{"d":"2026-10-06","t":"Konsumen minum Clopidogrel 75 mg (pengencer darah) → tidak boleh dengan Erojan."}],"kw":["clopidogrel","plavix","pengencer darah","obat pengencer darah","antiplatelet","darah encer","efek double","atorvastatin","candesartan","allopurinol"]},{"id":13,"q":"Apakah konsumen yang minum candesartan 8 mg dan obat jantung racikan boleh minum Novia di siang hari?","a":"Konsultasikan dulu ke dokter jantungnya.\n- Karena ada obat racikan, dokter khawatir ada salah satu kandungannya yang bereaksi dengan Novia.","p":["Novia"],"k":"minum bersama obat/suplemen","s":"tergantung","rd":true,"by":["Dr Rizky Nasution"],"d":"2026-10-03","n":1,"kasus":[{"d":"2026-10-03","t":"Darah tinggi (candesartan 8 mg) dan obat jantung racikan, tanpa obat rutin lain; obat lain diminum pagi/malam → konsultasi ke dokter jantung dulu."}],"kw":["candesartan","obat jantung","obat racikan","jantung","dokter jantung","darah tinggi","hipertensi"]},{"id":14,"q":"Apakah S-Glow aman untuk penderita diabetes?","a":"Aman.\n- Tidak ada kontraindikasi S-Glow dengan pasien DM (diabetes).","p":["S-Glow"],"k":"kondisi medis & penyakit","s":"boleh","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-10-03","n":1,"kasus":[],"kw":["diabetes","dm","kencing manis","gula darah","sglow diabetes","kontraindikasi"]},{"id":15,"q":"Apakah konsumen yang sudah angkat rahim (histerektomi) — termasuk yang ovarium/serviksnya ikut diangkat, atau angkat rahim karena kanker yang pengobatannya sudah selesai — boleh minum Novia?","a":"Boleh, tetapi jelaskan batasannya ke konsumen.\n- Efek yang diharapkan tidak akan maksimal karena organnya sudah diangkat (juga karena faktor usia, mis. 50 tahun); Novia tidak bisa menggantikan fungsi rahim, ovarium, atau serviks.\n- Jika rahim dan ovarium sudah diangkat, kondisi hormonnya sudah sangat berubah dibanding perempuan lain pada umumnya; harapan terhadap Novia jangan disamakan dengan pemakaian obat-obatan hormonal — jelaskan supaya tidak salah paham tentang fungsi suplemen Novia.\n- Dosis normal, selama setelah histerektomi tidak ada keluhan terkait operasinya — berlaku juga untuk angkat rahim karena kanker yang kemoterapinya sudah selesai.\n- Jika minum obat hipertensi, bedakan waktu minum Novia 6 jam dari obat hipertensinya.\n- Catatan: jawaban lama (2025-12-15, Dr Rizky Nasution) sempat menyarankan konsultasi dulu ke dokter yang menangani, lalu silakan minum jika tidak ada kontraindikasi terhadap kondisi kesehatan konsumen; ikuti yang terbaru.","p":["Novia"],"k":"pasca operasi & tindakan medis","s":"bersyarat","rd":true,"by":["Dr Rizky Nasution"],"d":"2026-10-01","n":7,"kasus":[{"d":"2025-12-09","t":"Konsumen sudah histerektomi karena kanker → boleh dosis normal bila tidak ada keluhan pascaoperasi."},{"d":"2026-03-27","t":"Wanita 50 th, rahim sudah diangkat, tidak minum obat lain → boleh, tapi hasilnya mungkin tidak maksimal."},{"d":"2026-08-22","t":"Konsumen 53 th, angkat rahim di usia 43, hormon progesteron & estrogen terganggu (badan kadang panas, mudah capek), kini hipertensi & minum obatnya → boleh dosis normal, jeda 6 jam."},{"d":"2026-08-24","t":"Rahim & ovarium diangkat 4 tahun lalu; keluhan berat badan naik, payudara kendur, vitalitas & gairah turun, mudah lelah → boleh, tapi kelola ekspektasi."},{"d":"2026-10-01","t":"Angkat kandungan karena kanker rahim, kemoterapi selesai, kontrol tiap 3 bulan → boleh, dengan penjelasan soal ekspektasi."}],"kw":["angkat rahim","angkat kandungan","histerektomi","histerektomi total","angkat ovarium","angkat serviks","operasi rahim","pasca operasi","kanker rahim","hasil tidak maksimal","ekspektasi","hipertensi"]},{"id":16,"q":"Apakah konsumen yang rutin minum obat pengencer darah (mis. Thrombo Aspilet, Ascardia, Proxime) boleh minum DVN atau kolagen?","a":"Tidak disarankan (saran terbaru Dr Rizky Nasution, Sep–Okt 2026).\n- Untuk orang yang setiap hari minum obat pengencer darah, dokter menyarankan jangan minum DVN atau kolagen.\n- Alasannya: kolagen dan obat pengencer darah tidak boleh dikonsumsi berbarengan.\n- Catatan: jawaban lama (2024-05-02, 2025-04-21 & 2025-08-29, Nutritionist Novrianti; 2025-06-04 & 2025-12-17, Dr Rizky Nasution — termasuk kasus autoimun dan kasus pasang ring jantung) sempat menyarankan boleh asal diberi jeda: tidak ditelan bersamaan, jeda 1–2 jam, 1 jam setelah obat, beda waktu makan, hingga jeda 6–8 jam; ikuti yang terbaru.","p":["DVN"],"k":"minum bersama obat/suplemen","s":"tidak","rd":false,"by":["Dr Rizky Nasution","Nutritionist Novrianti"],"d":"2026-10-01","n":7,"kasus":[{"d":"2025-06-04","t":"Kondisi autoimun + obat pengencer darah → (saran lama) DVN dijeda ±6 jam dari obat."},{"d":"2025-12-17","t":"Konsumen pasang ring jantung, rutin 3 obat (darah tinggi, pengencer darah, bisoprolol) → (saran lama) DVN diminum 6–8 jam setelah obat."},{"d":"2026-09-08","t":"Rutin setiap hari minum obat pengencer darah (Proxime) → jangan."},{"d":"2026-10-01","t":"Konsumen memakai obat pengencer darah dan ingin minum DVN (detail kasus via voice note) → tidak disarankan."}],"kw":["pengencer darah","obat pengencer darah","darah encer","antikoagulan","antiplatelet","aspirin","aspilet","ascardia","proxime","warfarin","kolagen","ring jantung"]},{"id":17,"q":"Apakah konsumen dengan hormon estrogen atau prolaktin tinggi boleh minum Novia — apakah Novia tidak membuat hormonnya makin tinggi?","a":"Tergantung kondisinya saat ini:\n- Estrogen/prolaktin sedang tinggi → jangan; hormonnya sudah tinggi, dan Novia bisa menstimulasi kenaikan hormonalnya.\n- Hiperprolaktinemia yang sedang minum cabergoline → jangan dulu; prolaktinnya sedang tinggi dan dikhawatirkan Novia justru menetralkan efek obat utama yang sedang dikonsumsi.\n- Dulu pernah estrogen tinggi (sempat diberi obat progesteron), tetapi sekarang sudah tidak minum obat, tidak ada kendala, dan tidak terkait penyakit tertentu → boleh, tidak apa-apa; Novia membantu meregulasi hormon, tetapi tidak secara berlebihan karena bukan obat.\n- Catatan: jawaban lama (2025-11-16, Dr Rizky Nasution), untuk kekhawatiran miom/kista yang dikaitkan dengan estrogen berlebih, sempat menjawab Novia membantu meregulasi hormon dan kerja otot rahim namun efeknya tidak berlebihan karena bukan obat; untuk hormon yang sedang tinggi, ikuti yang terbaru (jangan).","p":["Novia"],"k":"haid, hormon & menopause","s":"tergantung","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-09-30","n":4,"kasus":[{"d":"2026-01-22","t":"Dulu estrogen tinggi dan pernah diberi obat progesteron oleh dokter; kini sudah tidak minum obat dan tidak ada kendala → boleh."},{"d":"2026-09-07","t":"Prolaktin tinggi bila terus-menerus makan kacang-kacangan dan estrogen kadang tinggi → jangan."},{"d":"2026-09-30","t":"Hiperprolaktinemia, minum cabergoline → jangan dulu."}],"kw":["estrogen tinggi","estrogen berlebih","prolaktin tinggi","hiperprolaktinemia","prolaktin","estrogen","cabergoline","progesteron","hormon tinggi","miom","kista","kacang-kacangan"]},{"id":18,"q":"Bagaimana cara minum DVN, S-Glow, dan Novia untuk konsumen yang pagi minum amlodipin + Neurobion dan malam minum candesartan + obat kolesterol?","a":"Minum DVN dan Novia saja dulu (S-Glow belum).\n- Interaksi obatnya dengan suplemen cukup banyak; dokter khawatir efek sampingnya dengan amlodipin dan candesartan.\n- DVN diminum pagi jam 9.\n- Novia diminum siang jam 2.","p":["DVN","Novia","S-Glow"],"k":"minum bersama obat/suplemen","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-09-29","n":1,"kasus":[{"d":"2026-09-29","t":"Pagi amlodipin + Neurobion, malam candesartan + obat kolesterol → DVN jam 9 pagi, Novia jam 2 siang, S-Glow belum dulu."}],"kw":["amlodipin","candesartan","neurobion","obat kolesterol","darah tinggi","hipertensi","jadwal minum","jeda minum"]},{"id":19,"q":"Apakah penderita batu empedu (yang baru ketahuan atau sedang menjalani pengobatan) boleh minum Novia?","a":"Tergantung kondisi dan rencana pengobatannya:\n- Tanyakan rencana berikutnya: hanya minum obat untuk batu empedunya, atau ada rencana operasi?\n- Jika sedang menjalani terapi/pengobatan batu empedu → jangan dulu; tuntaskan dulu terapinya.\n- Jika batu empedu membuat badan tidak nyaman atau sering nyeri → jangan konsumsi Novia dulu.\n- Boleh nanti jika kondisinya sudah aman dan nyaman, dan batu empedu tidak menimbulkan keluhan apa pun.\n- Batu empedu dan Novia sebenarnya dua hal yang berbeda, namun tanyakan ke dokter yang merawat apakah ada kontraindikasi antara kondisi konsumen dan obat rutinnya dengan multivitamin/suplemen lain.","p":["Novia"],"k":"kondisi medis & penyakit","s":"tergantung","rd":true,"by":["Dr Rizky Nasution"],"d":"2026-09-29","n":3,"kasus":[{"d":"2026-07-16","t":"Pengobatan batu empedu 6 bulan, saat ini baru bulan ke-2 → jangan dulu sampai terapi tuntas."},{"d":"2026-09-29","t":"Usia 43 tahun, batu empedu sekecil pasir dari USG, minum obat nyeri perut dan kembung, akan cek ulang → tunggu hasil pemeriksaan."}],"kw":["batu empedu","empedu","kantung empedu","kantong empedu","gallstone","kolelitiasis","obat batu empedu","operasi","nyeri perut","kembung","kontraindikasi","usg"]},{"id":20,"q":"Kenapa tulang terasa pegal dan nyeri setelah 2 hari minum Erojan (dan hilang saat berhenti)?","a":"Kasusnya agak rancu; kemungkinan ada faktor lain:\n- Sepertinya tidak ada kandungan Erojan yang menyebabkan keluhan ini.\n- Cek apakah konsumen habis strength training atau latihan lari sebelumnya — khawatir ada faktor lain penyebab keluhan.\n- Faktor lain: konsumen alergi terhadap salah satu kandungan Erojan; jika memang iya, jangan diteruskan konsumsinya.","p":["Erojan"],"k":"efek samping & keluhan","s":"tergantung","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-09-28","n":1,"kasus":[{"d":"2026-09-28","t":"Baru 2 hari minum Erojan sesuai aturan, tulang pegal dan nyeri; rutin jogging bertahun-tahun, cukup minum air dan tidur, tanpa riwayat pegal; saat berhenti keluhan hilang."}],"kw":["pegal","nyeri tulang","tulang sakit","linu","efek samping erojan","alergi","olahraga","jogging"]},{"id":21,"q":"Apakah konsumen yang masih rutin minum obat tiroid (mis. Euthyrox/levothyroxine, Thyrozol/thiamazole) boleh minum Novia?","a":"Tidak disarankan (jangan) selama masih minum obat tiroid; utamakan dan fokus ke obat tiroidnya dulu.\n- Semua obat tiroid tergolong obat keras, sehingga dikhawatirkan muncul efek samping yang berbeda-beda pada tiap konsumen.\n- Akan memicu interaksi antara obat dan kandungan Novia; dikhawatirkan hormon jadi tidak seimbang dan tumpang tindih (overlap).\n- Pasca operasi angkat tiroid dengan Euthyrox 100 sekali sehari: dosis obat tiroidnya sudah lumayan besar, jadi dokter tidak menyarankan dibarengi Novia.\n- Jawaban sama (jangan) juga untuk konsumen yang selain obat tiroid minum obat lain, mis. vitamin D, obat lambung/GERD, obat cemas, propranolol, atau furosemide (Uresix).","p":["Novia"],"k":"minum bersama obat/suplemen","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-09-28","n":7,"kasus":[{"d":"2026-04-14","t":"Konsumen minum Euthyrox (hormon tiroid), vitamin D, serta obat gastritis & GERD → jangan minum Novia dulu."},{"d":"2026-07-21","t":"Konsumen dengan nyeri haid & mudah capek, rutin minum obat cemas/gelisah (akibat GERD) dan obat tiroid Thyrozol → jangan."},{"d":"2026-08-28","t":"Konsumen dengan gangguan tiroid, masih minum obat tiroid → tidak disarankan."},{"d":"2026-09-02","t":"Konsumen minum obat dokter karena tiroid (thiamazole & propranolol), juga obat lain untuk keluhan sakit perut/sakit kepala/susah tidur (foto: lansoprazole, Neurosanbe Plus, alprazolam) dan kolagen → jangan; fokus ke obat tiroid."},{"d":"2026-09-15","t":"Konsumen minum Uresix (furosemide 40 mg) dan Euthyrox 100 mcg → jangan."},{"d":"2026-09-23","t":"Keluhan jerawat, operasi angkat tiroid 3 tahun lalu, rutin Euthyrox 100 sekali sehari → jangan."},{"d":"2026-09-28","t":"Konsumen rutin minum Euthyrox 100 mcg (levothyroxine) → tidak disarankan."}],"kw":["tiroid","obat tiroid","hormon tiroid","thyroid","euthyrox","levothyroxine","thyrozol","thiamazole","hipotiroid","hipertiroid","angkat tiroid","interaksi obat"]},{"id":22,"q":"Apa efeknya jika Coffiyy dikonsumsi wanita?","a":"Efek yang mungkin dirasakan: tubuh lebih aktif, energi naik, dan lebih fokus.\n- Efek yang dirasakan bisa berbeda untuk tiap orang, jadi harus hati-hati.\n- Pastikan konsumen tidak punya penyakit jantung, tekanan darah tinggi, atau autoimun, dan tidak sedang hamil atau menyusui.","p":["Coffiyy"],"k":"manfaat & hasil","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-09-28","n":1,"kasus":[],"kw":["coffiyy wanita","kopi wanita","efek coffiyy","perempuan","energi","fokus","hamil","darah tinggi"]},{"id":23,"q":"Apakah penderita diabetes yang sedang minum obat diabetes (mis. glimepiride dan metformin) boleh minum Erojan?","a":"Boleh dikonsumsi.\n- Beri jarak 6 jam antara Erojan dan obat diabetes rutinnya.\n- Catatan: jawaban lama (2026-09-08, Dr Rizky Nasution) sempat menyarankan jeda 8 jam; ikuti yang terbaru.","p":["Erojan"],"k":"minum bersama obat/suplemen","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-09-26","n":2,"kasus":[{"d":"2026-09-26","t":"Calon customer diabetes dengan obat rutin glimepiride dan metformin → boleh, jarak 6 jam."}],"kw":["diabetes","dm","kencing manis","gula darah","obat diabetes","glimepiride","metformin","jeda 6 jam","jeda 8 jam"]},{"id":24,"q":"Apakah konsumen premenopause dengan perdarahan lebih dari 3 minggu, penebalan rahim, nyeri sendi, dan kaki bengkak (penyebab belum jelas) boleh minum Novia?","a":"Jangan konsumsi Novia dulu.\n- Kondisinya belum jelas seperti apa.","p":["Novia"],"k":"kondisi medis & penyakit","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-09-26","n":1,"kasus":[{"d":"2026-09-26","t":"Premenopause dengan perdarahan >3 minggu, penebalan rahim, sendi sakit, kaki bengkak dan nyeri ±3 minggu (jantung & ginjal normal, LDL tinggi, vitamin E rendah) → jangan dulu karena kondisinya belum jelas."}],"kw":["premenopause","perdarahan lama","haid 3 minggu","penebalan rahim","kaki bengkak","nyeri sendi","ldl tinggi","kondisi belum jelas"]},{"id":25,"q":"Apakah S-Glow bisa menggantikan terapi PRP untuk rambut setelah PRP dihentikan?","a":"Tidak bisa.\n- S-Glow dan PRP adalah hal yang berbeda, prosedurnya juga berbeda, jadi S-Glow tidak bisa menggantikan PRP.","p":["S-Glow"],"k":"manfaat & hasil","s":"info","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-09-26","n":1,"kasus":[{"d":"2026-09-26","t":"Perempuan 55 tahun (menopause usia 53) yang berhenti terapi PRP rambut."}],"kw":["prp","platelet rich plasma","terapi rambut","rambut rontok","rambut","pengganti prp","menopause"]},{"id":26,"q":"Apakah wajar haid jadi tidak teratur (datang lagi beberapa kali dalam sebulan) setelah mulai minum Novia pada usia 45 tahun?","a":"Masih dalam batas normal, karena tubuh sedang beradaptasi dengan kandungan Novia.\n- Yang harus distop: jika haidnya menjadi banyak dan tidak berhenti-berhenti.\n- Jika konsumen merasa tidak nyaman, kurangi dulu dosisnya menjadi 1 tablet Novia per 3 hari.","p":["Novia"],"k":"efek samping & keluhan","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-09-25","n":1,"kasus":[{"d":"2026-09-25","t":"Dua laporan serupa pada konsumen usia 45 tahun: setelah mulai Novia (distop saat haid) haid datang lagi beberapa kali dalam September, salah satunya sampai 10 hari → masih normal (adaptasi); keluhan susah tidur di salah satu laporan tidak dibahas dokter."}],"kw":["haid tidak teratur","siklus berantakan","haid berulang","haid dua kali sebulan","menstruasi","adaptasi","kurangi dosis","usia 45"]},{"id":27,"q":"Apakah konsumen dengan polip rahim atau riwayat polip boleh minum Novia?","a":"Tergantung kondisinya:\n- Jika masih ada polip rahim, walau kecil (±0,7 cm) dan dokter belum menyarankan diangkat → konsultasikan dulu dengan dokter obgyn.\n- Alasannya: dikhawatirkan terjadi kenaikan hormonal tiba-tiba atau ketidakseimbangan hormonal saat konsumsi Novia; potensi reaksi berbeda dari tubuh pasti ada.\n- Jika hanya riwayat polip dan saat ini tidak sedang dalam pengobatan apa pun → boleh konsumsi Novia.","p":["Novia"],"k":"kondisi medis & penyakit","s":"tergantung","rd":true,"by":["Dr Rizky Nasution"],"d":"2026-09-24","n":2,"kasus":[{"d":"2026-09-24","t":"Polip rahim 0,7 cm (USG Agustus 2026), dokter belum menyarankan diangkat karena tidak urgent → konsultasi dulu ke dokter obgyn."}],"kw":["polip","polip rahim","riwayat polip","polyp","polip endometrium","polip serviks","rahim","obgyn","sp.og","hormonal"]},{"id":28,"q":"Apakah konsumen dengan diabetes, asam lambung, darah tinggi, dan vertigo yang hanya minum obat saat kambuh boleh minum Novia?","a":"Boleh, dengan catatan:\n- Pastikan konsumen makan bergizi dan teratur pagi, siang, dan malam.\n- Jika diperlukan, pastikan juga minum obat lambung saat konsumsi Novia.","p":["Novia"],"k":"kondisi medis & penyakit","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-09-24","n":1,"kasus":[{"d":"2026-09-24","t":"Diabetes, asam lambung, tensi, vertigo; minum obat hanya jika kambuh → boleh asal makan teratur dan pakai obat lambung bila perlu."}],"kw":["diabetes","asam lambung","maag","darah tinggi","tensi","vertigo","obat saat kambuh","makan teratur"]},{"id":29,"q":"Apakah konsumen dengan autoimun otot jenis Scl-70 yang rutin minum Rheutrex dan Volavit 1000 boleh minum Novia?","a":"Sebaiknya jangan.\n- Ada indikasi interaksi obat dengan Novia yang justru akan membebani kondisi autoimunnya.","p":["Novia"],"k":"kondisi medis & penyakit","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-09-24","n":1,"kasus":[{"d":"2026-09-24","t":"Autoimun otot jenis Scl-70, minum Rheutrex seminggu sekali dan Volavit 1000 → jangan."}],"kw":["autoimun","autoimun otot","scl-70","scl70","rheutrex","methotrexate","volavit","interaksi obat"]},{"id":30,"q":"Apakah konsumen yang sedang masa penyembuhan stroke ringan dan minum obat dari dokter saraf boleh minum Novia?","a":"Sebaiknya jangan digabung.\n- Utamakan obat sarafnya dulu.\n- Setelah pengobatan selesai, baru boleh konsumsi Novia.","p":["Novia"],"k":"minum bersama obat/suplemen","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-09-23","n":1,"kasus":[{"d":"2026-09-23","t":"Stroke ringan dalam masa penyembuhan; obat: Nulyn-75 (pregabalin), Neurochol, Lancolin 500, candesartan 16 mg → jangan digabung, tunggu pengobatan selesai."}],"kw":["stroke","stroke ringan","obat saraf","dokter saraf","pregabalin","nulyn","neurochol","candesartan"]},{"id":31,"q":"Apakah Erojan dan Coffiyy bisa membantu pria penderita diabetes lama (gula darah terkontrol dengan obat) yang susah ereksi?","a":"Bukan obat untuk kondisi tersebut, tapi boleh dicoba.\n- Diabetes yang sudah lama terdiagnosis memang akan berefek ke area organ kelamin pria.\n- Erojan dan Coffiyy bukan obat untuk mengatasi kondisi tersebut; jika diabetesnya sudah lama akan susah, karena sudah termasuk kategori metabolik.\n- Jika customer ingin mencoba, silakan — secara bertahap, mulai dengan Erojan dulu.","p":["Erojan","Coffiyy"],"k":"kondisi medis & penyakit","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-09-23","n":1,"kasus":[{"d":"2026-09-23","t":"Diabetes lama, kini gula normal karena rutin minum obat dokter tiap pagi, tapi susah ereksi → bukan obat, boleh dicoba bertahap mulai Erojan."}],"kw":["disfungsi ereksi","susah ereksi","impoten","lemah syahwat","burung susah berdiri","diabetes","dm","kencing manis"]},{"id":32,"q":"Apakah penderita Hepatitis C boleh minum DVN?","a":"Boleh.\n- Tidak apa-apa untuk penderita Hepatitis C.","p":["DVN"],"k":"kondisi medis & penyakit","s":"boleh","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-09-22","n":1,"kasus":[],"kw":["hepatitis c","hepatitis","hcv","hati","liver","penyakit hati"]},{"id":33,"q":"Apakah Novia bisa membuat haid datang (lagi) pada wanita usia ±48 tahun yang sudah menopause atau belum juga haid setelah minum Novia?","a":"Ada faktor usia, dan Novia bukan obat hormonal — bila sudah menopause, kembalinya haid kemungkinan sulit.\n- Siklus haid tiap wanita berbeda, namun rata-rata wanita mengalami menopause di usia 48–55 tahun.\n- Menopause adalah proses alami tubuh yang tidak bisa dilawan, jadi kembalinya siklus haid kemungkinan akan sulit.\n- Hormonal usia 48 tahun tidak bisa disamakan dengan usia 20–30 tahun; jika kendala siklus haid terasa lebih berat, bisa disebabkan faktor usia juga.\n- Novia bukan obat hormonal, isinya berbeda dengan obat.\n- Jika dirasa perlu bantuan obat hormonal, boleh konsultasi dan periksa langsung ke dokter.","p":["Novia"],"k":"haid, hormon & menopause","s":"info","rd":true,"by":["Dr Rizky Nasution"],"d":"2026-09-22","n":2,"kasus":[{"d":"2025-11-21","t":"Konsumen 48 tahun sudah menopause, berharap haid kembali setelah minum Novia → kemungkinan sulit."},{"d":"2026-09-22","t":"Usia 48 tahun, terakhir haid Juli (2x) lalu mulai Novia; sejak Agustus belum haid walau 1 box habis; badan lebih segar dan tidur lebih nyenyak; sudah jaga pola makan dan olahraga ringan."}],"kw":["menopause","haid lagi","mens kembali","belum haid","tidak haid","telat haid","mati haid","usia 48","perimenopause","obat hormonal","melancarkan haid","siklus haid"]},{"id":34,"q":"Apakah konsumen dengan riwayat kista (kini sudah tidak ada), tidak haid 1,5 tahun, dan kadar AMH 0,01 boleh minum Novia?","a":"Bisa dikonsumsi, tapi harapannya jangan seperti obat.\n- Salah satu faktor besar dan utama penyebab tidak haid adalah kadar hormon AMH konsumen yang 0,01.\n- Cara mengatasi kondisi ini sudah di luar jangkauan Novia.\n- Jika minum Novia, fungsinya hanya sebatas memberi kenyamanan di tubuh.","p":["Novia"],"k":"haid, hormon & menopause","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-09-21","n":1,"kasus":[{"d":"2026-09-21","t":"Riwayat kista tahun 2013 dan 2018 (USG terakhir sudah tidak ada), tidak haid 1,5 tahun, AMH 0,01."}],"kw":["amh","amh rendah","hormon amh","cadangan sel telur","kista","tidak haid","amenore","ekspektasi"]},{"id":35,"q":"Apakah Novia bisa menaikkan gula darah pada penderita diabetes?","a":"Tidak.\n- Novia tidak berpengaruh ke kenaikan gula darah.","p":["Novia"],"k":"kondisi medis & penyakit","s":"info","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-09-21","n":1,"kasus":[],"kw":["gula darah","diabetes","dm","kencing manis","kadar gula","glukosa","gula naik"]},{"id":36,"q":"Jerawat makin banyak setelah minum Novia (sebelumnya sudah berjerawat hormonal) — apakah itu bagian dari detoks?","a":"Evaluasi dulu selama 2 minggu.\n- Jika jerawat menghilang, memang efek detoks dan adaptasi.\n- Jika sebelum 2 minggu jerawat makin banyak dan makin mengganggu, stop saja.\n- Ada kemungkinan alergi terhadap salah satu kandungan Novia.","p":["Novia"],"k":"efek samping & keluhan","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-09-20","n":1,"kasus":[{"d":"2026-09-20","t":"Sebelumnya sudah jerawat hormonal, setelah minum Novia jerawat bertambah."}],"kw":["jerawat","jerawat hormonal","purging","detoks","detox","breakout","alergi","evaluasi 2 minggu"]},{"id":37,"q":"Apakah konsumen 58 tahun dengan diabetes dan darah tinggi yang rutin memakai insulin, candesartan, dan simvastatin boleh minum Novia?","a":"Sebaiknya jangan.\n- Konsumen sudah rutin memakai obat insulin.\n- Fokus ke obat rutinnya saja.","p":["Novia"],"k":"minum bersama obat/suplemen","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-09-19","n":1,"kasus":[{"d":"2026-09-19","t":"Usia 58 tahun, riwayat DM dan darah tinggi, obat rutin insulin, candesartan dan simvastatin → jangan."}],"kw":["insulin","diabetes","dm","kencing manis","darah tinggi","hipertensi","candesartan","simvastatin"]},{"id":38,"q":"Bagaimana jika area kewanitaan (Miss V) terasa gatal setelah minum Novia — perlu stop atau cukup dikurangi?","a":"Coba stop dulu Novianya, lalu evaluasi.\n- Setelah distop, lihat apakah masih tetap gatal atau tidak.\n- Jika masih gatal, kemungkinan ada reaksi alergi terhadap kandungan Novia.\n- Salah satu kemungkinannya alergi ikan, karena Novia mengandung fish collagen; reaksinya bisa muncul belakangan karena respons tubuh tiap orang berbeda-beda.\n- Tidak usah dilanjutkan jika memang mengganggu konsumen.\n- Catatan: jawaban lama (2026-08-20, Dr Rizky Nasution) untuk kasus gatal setelah hampir 1 box sempat membolehkan konsumsi diubah menjadi 1x seminggu supaya konsumen nyaman; ikuti yang terbaru.","p":["Novia"],"k":"efek samping & keluhan","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-09-18","n":2,"kasus":[{"d":"2026-08-20","t":"Miss V gatal setelah hampir 1 box Novia (minggu pertama bagus), kini minum 1x seminggu → kemungkinan alergi fish collagen; 1x seminggu tidak apa-apa."}],"kw":["gatal","miss v gatal","gatal miss v","gatal kewanitaan","gatal kemaluan","vagina gatal","alergi","reaksi alergi","alergi ikan","fish collagen","kolagen ikan","seminggu sekali"]},{"id":39,"q":"Apakah penderita diabetes tipe 2 (minum metformin dan herbal Diabetafit) yang juga penyintas kanker (dinyatakan sembuh 2 bulan lalu) boleh minum DVN?","a":"Konsultasikan langsung dengan dokter yang merawat konsumen.\n- Supaya kondisi terbarunya bisa dicek langsung dan disesuaikan dengan hasil pemeriksaan dokternya.","p":["DVN"],"k":"kondisi medis & penyakit","s":"tergantung","rd":true,"by":["Dr Rizky Nasution"],"d":"2026-09-18","n":1,"kasus":[{"d":"2026-09-18","t":"Diabetes tipe 2, minum metformin dan Diabetafit (herbal), penyintas kanker yang dinyatakan sembuh 2 bulan lalu → konsultasi ke dokter yang merawat."}],"kw":["diabetes tipe 2","dm","kencing manis","metformin","diabetafit","penyintas kanker","kanker","gula darah"]},{"id":40,"q":"Apakah wajar haid jadi lama/tidak berhenti-berhenti (mis. sudah 1 minggu sampai 12 hari) setelah minum Novia, dan apakah Novia dilanjutkan atau dihentikan dulu?","a":"Masih dalam batas wajar (adaptasi awal tubuh terhadap Novia); stop Novia selama haid, lalu boleh lanjut lagi setelah haid selesai.\n- Haid yang memanjang terkait adaptasi awal tubuh terhadap Novia yang berbeda-beda tiap orang; harusnya kembali normal setelah masa adaptasi selesai.\n- Efek Novia membantu melancarkan siklus haid lagi dan membantu menyamankan hormonal kembali (mis. haid kembali setelah 3 bulan tidak haid).\n- Boleh lanjut konsumsi lagi setelah haid atau bercak/spot darahnya selesai.","p":["Novia"],"k":"efek samping & keluhan","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-09-17","n":2,"kasus":[{"d":"2026-09-10","t":"Usia 49 tahun, pernah kuret (hasil baik) lalu 3 bulan tidak haid; setelah minum Novia haid lagi (sedikit) dan sudah 1 minggu belum berhenti → masih wajar."},{"d":"2026-09-17","t":"Usia 41 tahun, siklus haid normal 7 hari, setelah minum Novia haid sudah 12 hari dan masih banyak (teman lain yang minum Novia haid 15 hari tapi sedikit)."}],"kw":["haid lama","haid tidak berhenti","haid 12 hari","haid banyak","haid kembali","haid sedikit","menstruasi panjang","kuret","kuretase","adaptasi","stop saat haid","melancarkan haid"]},{"id":41,"q":"Apakah penderita adenomiosis boleh minum Novia?","a":"Tidak boleh / jangan dulu selama masih ada adenomiosis.\n- Selama masih ada adenomiosis, Novia cukup berisiko terhadap respons hormonnya.\n- Untuk adenomiosis yang bisa berkembang bila ada pemicu hormon, dokter menyatakan kondisi medisnya sudah tidak memungkinkan untuk minum Novia.\n- Berlaku juga untuk adenomiosis ±3 cm di rahim, dan untuk konsumen dengan riwayat operasi miom yang masih ada adenomiosisnya.\n- Catatan: jawaban lama sempat berbeda — (2024-12-11, Nutritionist Novrianti) belum ada jawaban pasti, dikhawatirkan bahan Novia melancarkan peredaran darah sehingga berisiko perdarahan; (2025-12-28, Nutritionist Novrianti) sempat membolehkan dengan waktu minum berbeda dari obat dan obat tetap diminum (Novia sebagai pendukung untuk mengurangi gejala); (2026-06-20, Dr Rizky Nasution) sempat membolehkan adenomiosis yang tidak minum obat dicoba dosis normal dengan monitor 2 minggu pertama (waspadai perdarahan, haid lama, nyeri panggul, kram); ikuti yang terbaru.","p":["Novia"],"k":"kondisi medis & penyakit","s":"tidak","rd":false,"by":["Dr Rizky Nasution","Nutritionist Novrianti"],"d":"2026-09-17","n":6,"kasus":[{"d":"2026-08-12","t":"Pernah operasi miom 19 tahun lalu; 18 bulan lalu dinyatakan bersih namun masih ada adenomiosis → jangan dulu."},{"d":"2026-09-02","t":"Konsumen dengan adenomiosis yang bisa berkembang bila ada obat pemicu hormon → jangan."},{"d":"2026-09-17","t":"Adenomiosis ±3 cm di rahim kanan → tidak boleh."}],"kw":["adenomiosis","adenomyosis","adeno","rahim","hormon","pemicu hormon","perdarahan","haid lama","nyeri haid","nyeri panggul","miom","operasi miom"]},{"id":42,"q":"Apakah Novia boleh tetap diminum saat konsumen sedang minum obat lambung dari dokter (3x2 sehari), dan berapa jaraknya?","a":"Boleh diminum bersamaan dengan obat lambungnya.\n- Dahulukan minum obat lambung.\n- 30 menit kemudian baru minum Novia.","p":["Novia"],"k":"minum bersama obat/suplemen","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-09-17","n":1,"kasus":[{"d":"2026-09-17","t":"Minum Novia untuk susah tidur dan cocok; lambung kambuh dan diberi obat lambung 3x2 sehari → boleh lanjut, obat lambung dulu, Novia 30 menit kemudian."}],"kw":["obat lambung","maag","asam lambung","lambung kambuh","jeda 30 menit","susah tidur","insomnia"]},{"id":43,"q":"Apakah Novia boleh diminum saat tidak sedang haid tapi keluar darah (mungkin darah penyakit atau lainnya)?","a":"Boleh, dengan syarat:\n- Pastikan dulu darah yang keluar benar-benar bukan darah haid.\n- Curigai kemungkinan ada penyakit lain dan jangan sampai terlewat — tetap sarankan periksa langsung ke dokter untuk kondisi ini.","p":["Novia"],"k":"haid, hormon & menopause","s":"bersyarat","rd":true,"by":["Dr Rizky Nasution"],"d":"2026-09-17","n":1,"kasus":[],"kw":["perdarahan","pendarahan","darah keluar","bukan haid","flek","spotting","darah penyakit","periksa dokter"]},{"id":44,"q":"Apakah DVN dan Novia perlu distop saat lambung konsumen sedang kurang sehat (minum lansoprazole/ranitidin saat mual)?","a":"Tergantung pemicunya:\n- Jika Novia dan DVN yang menjadi pemicu sakit lambungnya, stop dulu.\n- Boleh konsumsi lagi setelah kondisi lambungnya sehat dan aman.","p":["DVN","Novia"],"k":"efek samping & keluhan","s":"tergantung","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-09-17","n":1,"kasus":[{"d":"2026-09-17","t":"Minum DVN dan Novia, lambung sedang kurang sehat; minum lansoprazole dan kadang ranitidin hanya saat mual."}],"kw":["lambung","sakit lambung","maag","mual","lansoprazole","ranitidin","asam lambung","stop dulu"]},{"id":45,"q":"Apakah penderita endometriosis (termasuk kista endometriosis) atau yang punya riwayat endometriosis boleh minum Novia?","a":"Tergantung kondisinya saat ini:\n- Jika masih menderita endometriosis → sebaiknya jangan; jalani pengobatan dulu sampai endometriosisnya selesai.\n- Endometriosis yang sudah terdiagnosa harus berobat ke dokter dan perlu segera ditangani dengan obat-obatan hormonal yang disesuaikan dengan hasil pemeriksaan dokter, supaya kondisinya tidak semakin berat; jangan mengandalkan Novia (dikhawatirkan terjadi salah persepsi tentang fungsi suplemen Novia).\n- Jika hanya riwayat endometriosis → boleh, dengan syarat saat ini sudah tidak ada keluhan dan tidak sedang minum obat-obatan hormonal.\n- Catatan: jawaban lama sempat membolehkan endometriosis yang masih ada — (2025-05-10, Nutritionist Novrianti) untuk kista endometriosis: dicoba mulai 1x/hari, berjauhan dari obat, dan selalu di bawah pengawasan (beberapa bahan Novia merangsang kerja otot rahim dan meregulasi hormon); (2026-02-18, Dr Rizky Nasution) untuk endometriosis yang minum obat penghenti haid: boleh dengan jeda setidaknya 6–8 jam dari obat; ikuti yang terbaru.","p":["Novia"],"k":"kondisi medis & penyakit","s":"tergantung","rd":true,"by":["Dr Rizky Nasution","Nutritionist Novrianti"],"d":"2026-09-15","n":5,"kasus":[{"d":"2026-02-18","t":"Endometriosis, minum obat penghenti haid karena haid berkepanjangan → boleh, jeda 6–8 jam dari obat."},{"d":"2026-08-10","t":"Konsumen dengan endometriosis, minum teh rimpang/teh bunga dan memakai KB suntik → harus berobat ke dokter."}],"kw":["endometriosis","riwayat endometriosis","kista endometriosis","kista coklat","endo","obat hormonal","obat penghenti haid","haid berkepanjangan","kb suntik","nyeri haid","otot rahim","berobat ke dokter"]},{"id":46,"q":"Apakah konsumen yang punya alergi dan 'nyaris autoimun' boleh minum Novia?","a":"Sebaiknya jangan.\n- Imunitas tubuh konsumen sudah menurun.\n- Khawatir jika diberi suplemen lagi justru memperberat kondisi sakitnya.","p":["Novia"],"k":"kondisi medis & penyakit","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-09-15","n":1,"kasus":[{"d":"2026-09-15","t":"Konsumen mengaku punya alergi dan nyaris autoimun → jangan."}],"kw":["alergi","autoimun","autoimmune","imunitas menurun","daya tahan tubuh","imun"]},{"id":47,"q":"Apakah konsumen yang minum Microgest 200 mg (progesteron), Coten 100 (koenzim Q10), dan Interxanthin (astaxanthin) boleh minum Novia?","a":"Jangan.\n- Dikhawatirkan malah meningkatkan efek obatnya dan berbahaya bagi tubuh konsumen.","p":["Novia"],"k":"minum bersama obat/suplemen","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-09-15","n":1,"kasus":[{"d":"2026-09-15","t":"Konsumen minum Microgest 200 mg (progesteron), Coten 100 (CoQ10) dan Interxanthin (astaxanthin 4 mg) → jangan, khawatir meningkatkan efek obat."}],"kw":["microgest","progesteron","progesterone","obat hormon","coq10","coten","astaxanthin","interxanthin"]},{"id":48,"q":"Apakah Novia bisa membantu konsumen 29 tahun yang tidak haid 6 bulan sejak operasi kehamilan di luar kandungan agar haid lagi?","a":"Boleh dicoba.\n- Namun dokter khawatir ada faktor lain yang menyebabkan kondisi ini.\n- Tanyakan apakah konsumen sebelumnya sudah pernah konsultasi ke dokter Sp.OG terkait kondisinya.","p":["Novia"],"k":"pasca operasi & tindakan medis","s":"bersyarat","rd":true,"by":["Dr Rizky Nasution"],"d":"2026-09-15","n":1,"kasus":[{"d":"2026-09-15","t":"Usia 29 tahun, tidak haid 6 bulan sejak operasi hamil di luar kandungan → boleh dicoba, cek apakah sudah konsultasi ke Sp.OG."}],"kw":["hamil di luar kandungan","kehamilan ektopik","ektopik","tidak haid","pasca operasi","haid lagi","sp.og","obgyn"]},{"id":49,"q":"Apakah penderita aritmia jantung (gangguan irama jantung) boleh minum Erojan?","a":"Tidak disarankan.\n- Untuk aritmia jantung, dokter tidak menyarankan konsumsi Erojan.","p":["Erojan"],"k":"kondisi medis & penyakit","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-09-14","n":1,"kasus":[{"d":"2026-09-14","t":"Ditanyakan bersamaan dengan GERD; untuk GERD boleh asal tetap minum obat GERD."}],"kw":["aritmia","arrhythmia","irama jantung","jantung berdebar","gangguan jantung","penyakit jantung","jantung"]},{"id":50,"q":"Apakah penderita GERD boleh minum Erojan?","a":"Bisa, asalkan tetap minum obat GERD-nya.\n- Khawatir ada reaksi berbeda dari lambung konsumen.","p":["Erojan"],"k":"kondisi medis & penyakit","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-09-14","n":1,"kasus":[{"d":"2026-09-14","t":"Ditanyakan bersamaan dengan aritmia jantung; untuk aritmia, dokter tidak menyarankan Erojan."}],"kw":["gerd","asam lambung","refluks","maag","lambung","obat gerd","heartburn"]},{"id":51,"q":"Bagaimana aturan minum Erojan untuk konsumen yang punya asam lambung atau lambung sensitif (misalnya selalu sakit lambung setelah minum Erojan)?","a":"Boleh dengan catatan:\n- Minum Erojan setelah makan, dan pastikan setiap hari makan nasi dan lauk secara teratur pagi–siang–malam. Jika makan belum teratur, keluhan asam lambung pasti akan selalu ada.\n- Opsi kedua: setiap minum Erojan selalu dibarengi obat lambungnya.\n- Jika selalu sakit/tidak nyaman di lambung setelah minum Erojan: boleh dicoba bersama obat Ranitidin dosis 2x sehari; Ranitidin diminum 30 menit sebelum Erojan.\n- Kembali lagi disesuaikan dengan kemampuan fisik dan kondisi kesehatan konsumen.","p":["Erojan"],"k":"kondisi medis & penyakit","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-09-13","n":2,"kasus":[{"d":"2026-09-03","t":"Konsumen lambung sensitif, selalu tidak nyaman/sakit lambung setelah minum Erojan → coba Ranitidin 2x sehari, diminum 30 menit sebelum Erojan."},{"d":"2026-09-13","t":"Calon konsumen dengan asam lambung dan lambung agak sensitif, biasa minum lansoprazole saat kambuh → Erojan setelah makan dan makan teratur, atau setiap minum Erojan dibarengi obat lambungnya."}],"kw":["asam lambung","lambung sensitif","sakit lambung","maag","gastritis","perut perih","ranitidin","lansoprazole","obat lambung","setelah makan"]},{"id":52,"q":"Apakah konsumen dengan penyakit ginjal atau penurunan fungsi ginjal (termasuk gagal ginjal kronis/CKD yang rutin cuci darah) yang rutin minum obat boleh minum Novia?","a":"Tidak disarankan / tidak boleh.\n- Dengan diagnosis CKD (gagal ginjal kronis), dokter tidak menyarankan konsumsi Novia.\n- Dikhawatirkan akan memberatkan fungsi ginjalnya; fokus ke obat-obatan yang disarankan dokter dulu.\n- Jika hasil lab menunjukkan fungsi ginjal masih rendah, berarti ginjalnya masih tidak dalam keadaan baik-baik saja — tetap tidak disarankan walaupun sudah dalam pengawasan dokter dan minum obat rutin.\n- Catatan: jawaban lama (2026-01-15, Dr Rizky Nasution) untuk konsumen dengan komplikasi jantung, lambung, liver, dan ginjal yang rutin minum obat sempat membolehkan dicoba dengan jarak 4–6 jam dari waktu minum obat rutin; ikuti yang terbaru.","p":["Novia"],"k":"kondisi medis & penyakit","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-09-13","n":4,"kasus":[{"d":"2026-01-15","t":"Konsumen 45 tahun dengan komplikasi jantung, lambung, liver, dan ginjal, rutin minum obat dan kontrol dokter tiap bulan → boleh dicoba, jarak 4–6 jam dari obat."},{"d":"2026-05-03","t":"Konsumen dengan penurunan fungsi ginjal, rutin minum obat jantung, kolesterol, dan vitamin B → jangan."},{"d":"2026-07-28","t":"Konsumen 52 th, sakit ginjal sudah 21 tahun, dalam pengawasan dokter & minum obat rutin; hasil lab fungsi ginjal masih rendah → jangan."},{"d":"2026-09-13","t":"CKD, rutin cuci darah dan kontrol bulanan; suntik insulin 3–4x/hari (DM tipe 1), obat tensi Herbesser 200 + asam folat + albumin pagi, obat tensi malam, candesartan 16 mg → tidak boleh."}],"kw":["ginjal","fungsi ginjal","penyakit ginjal","gangguan ginjal","gagal ginjal","ckd","ginjal kronis","cuci darah","hemodialisa","komplikasi","obat rutin","hasil lab"]},{"id":53,"q":"Apakah Novia boleh diminum ibu hamil dan ibu menyusui?","a":"Ibu hamil: tidak disarankan. Ibu menyusui: menurut jawaban terbaru, sebenarnya tidak ada masalah asal konsumen sehat.\n- Ibu hamil → tidak disarankan minum Novia (kehamilan termasuk kondisi yang harus dihindari).\n- Ibu menyusui → sebenarnya tidak ada masalah (jawaban terbaru 2026-09-13, Dr Rizky Nasution; kasus menyusui anak usia 21 bulan).\n- Syarat untuk ibu menyusui: pastikan konsumen benar-benar dalam keadaan sehat.\n- Pastikan juga tidak ada kendala/keluhan alergi atau sensitif terhadap kandungan Novia.\n- Catatan: jawaban lama (2025-07-28 dan 2025-11-21, Nutritionist Novrianti) sempat menyebut ibu menyusui tidak disarankan / termasuk kondisi yang harus dihindari (bersama hamil dan program hamil); ikuti yang terbaru.\n- ⚠️ Perhatikan: label resmi Novia (BPOM) menulis \"Tidak digunakan pada anak-anak, wanita hamil dan menyusui.\" Kalau saran di atas lebih longgar, konfirmasi ulang ke grup sebelum menyarankan ke customer.","p":["Novia"],"k":"hamil, menyusui & promil","s":"tergantung","rd":false,"by":["Nutritionist Novrianti","Dr Rizky Nasution"],"d":"2026-09-13","n":3,"kasus":[{"d":"2026-09-13","t":"Sedang menyusui anak usia 21 bulan sambil minum Novia → tidak masalah asal sehat dan tidak alergi/sensitif."}],"kw":["hamil","ibu hamil","bumil","kehamilan","menyusui","busui","ibu menyusui","asi","laktasi","breastfeeding","kontraindikasi","pantangan"]},{"id":54,"q":"Apakah normal keluar flek/bercak darah setelah beberapa hari minum Novia, padahal haid baru selesai sekitar seminggu sebelumnya?","a":"Normal bila hanya flek/bercak; Novia boleh diteruskan sambil dipantau.\n- Selama yang keluar hanya flek/bercak (bukan siklus haid lagi), itu reaksi normal tubuh terhadap efek kandungan Novia.\n- Jika yang keluar lebih dari flek, atau ternyata siklus haid lagi → segera stop dulu Novianya.","p":["Novia"],"k":"efek samping & keluhan","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-09-12","n":2,"kasus":[{"d":"2026-05-13","t":"Konsumen baru ±9 hari minum Novia (sempat stop saat haid lalu lanjut), seminggu setelah haid keluar flek sedikit (baru hari itu) → teruskan, stop bila lebih dari flek."},{"d":"2026-09-12","t":"Haid 29 Agustus–4 September, baru 3 hari minum Novia keluar bercak darah; sebelumnya tidak pernah haid lagi seminggu setelah selesai haid."}],"kw":["flek","spotting","bercak darah","flek setelah haid","flek novia","haid lagi","darah haid","baru minum novia","efek novia","reaksi tubuh","adaptasi"]},{"id":55,"q":"Apakah konsumen yang baru operasi bariatrik sebulan lalu (sekarang hanya minum vitamin bariatrik) boleh minum Novia?","a":"Konsultasikan dulu ke dokter yang merawat.\n- Sebelum minum Novia, konsumen disarankan konsultasi dulu dengan dokter yang merawatnya.","p":["Novia"],"k":"pasca operasi & tindakan medis","s":"tergantung","rd":true,"by":["Dr Rizky Nasution"],"d":"2026-09-12","n":1,"kasus":[{"d":"2026-09-12","t":"Operasi bariatrik 1 bulan lalu, sekarang hanya minum vitamin bariatrik → konsultasi dulu ke dokter yang merawat."}],"kw":["bariatrik","operasi bariatrik","bedah obesitas","operasi pengecilan lambung","pasca operasi","vitamin bariatrik"]},{"id":56,"q":"Apakah penderita rheumatoid arthritis atau autoimun sejenis rematik boleh minum Novia (atau S-Glow)?","a":"Tidak disarankan / jangan.\n- Dokter tidak menyarankan konsumsi Novia untuk konsumen dengan rheumatoid arthritis.\n- Untuk autoimun sejenis rematik, walaupun sedang tidak minum obat apa pun, jangan minum Novia maupun S-Glow — khawatir memicu gejala lain di tubuh konsumen yang sudah memiliki autoimun.\n- Catatan: jawaban lama (2025-06-16, Dr Rizky Nasution & Nutritionist Novrianti) sempat membolehkan penderita RA yang minum obat rutin harian, dengan jeda sekitar 6 jam setelah obat autoimunnya dan asalkan tidak sedang minum obat hormon; ikuti yang terbaru.","p":["Novia","S-Glow"],"k":"kondisi medis & penyakit","s":"tidak","rd":false,"by":["Dr Rizky Nasution","Nutritionist Novrianti"],"d":"2026-09-09","n":3,"kasus":[{"d":"2025-06-16","t":"Penderita RA dengan obat rutin harian → Novia boleh, dijeda ±6 jam setelah obat, asalkan tidak sedang minum obat hormon."},{"d":"2026-09-09","t":"Autoimun sejenis rematik, tidak minum obat apa pun saat ini → jangan."}],"kw":["rheumatoid arthritis","ra","rematik","reumatik","rheumatoid","autoimun","autoimmune","radang sendi","sendi","obat autoimun","jeda obat","s-glow"]},{"id":57,"q":"Kenapa kulit kering konsumen belum berubah setelah minum DVN 2 botol?","a":"Bisa disebabkan banyak faktor:\n- Usia konsumen.\n- Konsumsi air putih setiap hari.\n- Lingkungan dan perawatan kulit dari luar.\n- Respon tubuh tiap orang berbeda-beda untuk setiap jenis suplemen.","p":["DVN"],"k":"manfaat & hasil","s":"info","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-09-08","n":1,"kasus":[{"d":"2026-09-08","t":"Sudah habis 2 botol DVN, keluhan kulit kering belum berubah."}],"kw":["kulit kering","belum ada hasil","tidak ada perubahan","kecewa","hasil dvn","air putih","perawatan kulit"]},{"id":58,"q":"Apakah remaja (kelas 3 SMA) dengan PCOS yang tidak haid sejak haid pertama dan sudah tidak minum obat dokter boleh minum Novia? Berapa dosisnya?","a":"Boleh dicoba dengan dosis normal.\n- Dosis: 1 butir per hari (dikonfirmasi dokter untuk remaja kelas 3 SMA).\n- Sarankan konsumen berhenti mengonsumsi semua makanan dan minuman yang banyak mengandung tepung.\n- Sarankan juga olahraga secara rutin.\n- ⚠️ Perhatikan: label resmi Novia (BPOM) menulis \"Tidak digunakan pada anak-anak, wanita hamil dan menyusui.\" Kalau saran di atas lebih longgar, konfirmasi ulang ke grup sebelum menyarankan ke customer.","p":["Novia"],"k":"haid, hormon & menopause","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-09-08","n":1,"kasus":[{"d":"2026-09-08","t":"Remaja kelas 3 SMA, haid pertama kelas 6 SD lalu tidak haid sama sekali, didiagnosis PCOS, sudah tidak minum obat dokter → boleh dicoba 1 butir/hari + stop makanan bertepung + olahraga rutin."}],"kw":["pcos","ovarium polikistik","remaja","anak sma","tidak haid","telat haid","dosis remaja","tepung"]},{"id":59,"q":"Apakah konsumen yang rutin minum banyak obat (mis. obat jantung, obat diabetes, obat saraf) boleh minum Novia?","a":"Tidak disarankan (jangan).\n- Fokus saja dengan obat-obatan rutinnya.\n- Dikhawatirkan memberatkan kerja fungsi organ utama tubuhnya.","p":["Novia"],"k":"minum bersama obat/suplemen","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-09-08","n":2,"kasus":[{"d":"2026-06-28","t":"Rutin minum banyak obat: jantung, diabetes, dan obat saraf → jangan."},{"d":"2026-09-08","t":"Rutin minum Source of Life (Nature's Plus) 1 tablet, metformin 500 2x1, propranolol 10 2x1, fenofibrate 100, amitriptyline 25, clobazam 10 → jangan, fokus obat rutin."}],"kw":["banyak obat","obat rutin","polifarmasi","obat jantung","obat diabetes","obat saraf","diabetes","metformin","propranolol","fenofibrate","amitriptyline","clobazam"]},{"id":60,"q":"Apakah konsumen dengan tumor rahim (sudah 3 tahun tidak haid) boleh minum Novia?","a":"Tidak boleh.\n- Fokus ke pengobatan tumor rahimnya dulu.","p":["Novia"],"k":"kondisi medis & penyakit","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-09-08","n":1,"kasus":[{"d":"2026-09-08","t":"Sudah 3 tahun tidak haid, hasil pemeriksaan tumor rahim → tidak boleh, fokus pengobatan."}],"kw":["tumor rahim","tumor","tidak haid","amenore","rahim","kandungan"]},{"id":61,"q":"Kenapa konsumen pusing/kepala berputar setelah minum kopi lalu DVN di pagi hari tanpa makan dulu?","a":"Penyebabnya minum kopi di pagi hari tanpa didahului makan besar.\n- Kopi pagi tanpa makan besar bisa membuat asam lambung naik drastis sehingga timbul vertigo atau pusing kepala yang berat.\n- Apalagi jika dibarengi konsumsi suplemen atau vitamin lain.\n- Dokter selalu menyarankan makan besar dulu setiap sebelum konsumsi suplemen Wellous.","p":["DVN","Umum"],"k":"efek samping & keluhan","s":"info","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-09-07","n":1,"kasus":[{"d":"2026-09-07","t":"Pagi hanya minum kopi (belum makan), tak lama minum DVN, lalu kepala berputar seperti gempa → efek kopi saat belum makan; makan besar dulu sebelum suplemen."}],"kw":["pusing","vertigo","kepala berputar","kopi","perut kosong","belum makan","asam lambung","makan dulu"]},{"id":62,"q":"Berapa jam jeda minum Novia untuk konsumen yang rutin minum amlodipin 5 mg?","a":"Beri jeda 8 jam.\n- Supaya mudah: amlodipin diminum malam, Novia pagi.\n- Atau sebaliknya.","p":["Novia"],"k":"minum bersama obat/suplemen","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-09-07","n":1,"kasus":[{"d":"2026-09-07","t":"Rutin minum amlodipin 5 mg → jeda 8 jam dengan Novia."}],"kw":["amlodipin","amlodipine","obat darah tinggi","hipertensi","tensi","jeda 8 jam","jeda minum"]},{"id":63,"q":"Bagaimana jika konsumen gatal-gatal dan ruam setiap minum S-Glow, dan alerginya belum sembuh walaupun S-Glow sudah dihentikan?","a":"Tetap stop S-Glow; atasi alerginya dengan obat alergi yang diminum teratur, dan bila tetap belum membaik, periksa langsung ke dokter.\n- Gatal dan ruam setiap minum S-Glow adalah reaksi alergi terhadap salah satu bahan S-Glow, berarti konsumen tidak cocok dengan produk ini.\n- Bila sudah stop tapi masih alergi: tetap minum obat alergi; obat yang disebut dokter: Cetirizine 2x sehari (efeknya membuat mengantuk).\n- Reaksi alergi akan mereda dalam 2–3 hari bila obatnya diminum secara teratur.\n- Pastikan obat alerginya benar-benar diminum secara teratur.\n- Jika sudah teratur tetapi keluhan masih ada (walau S-Glow sudah lama distop), cek langsung ke dokter supaya kondisi terkininya bisa diperiksa secara langsung.","p":["S-Glow"],"k":"efek samping & keluhan","s":"tidak","rd":true,"by":["Dr Rizky Nasution"],"d":"2026-09-06","n":2,"kasus":[{"d":"2026-08-23","t":"Konsumen gatal & ruam tiap minum S-Glow; ±5 hari setelah stop masih alergi (terutama malam) dan bergantung obat alergi (Teflast 6 mg) → stop S-Glow, minum Cetirizine 2x sehari."},{"d":"2026-09-06","t":"Konsumen sebelumnya gatal dan ruam setiap minum S-Glow; S-Glow sudah lama distop dan obat alergi sudah diminum teratur, tetapi alergi belum sembuh → periksa langsung ke dokter."}],"kw":["alergi","gatal","ruam","biduran","kemerahan","cetirizine","obat alergi","tidak cocok","reaksi alergi","alergi tidak sembuh","sglow"]},{"id":64,"q":"Apakah konsumen yang masih memiliki miom (mioma) boleh minum Novia, walaupun miomnya kecil, terkontrol, atau tidak bergejala?","a":"Tidak boleh.\n- Konsumen yang masih memiliki mioma jangan konsumsi Novia, walaupun miomnya tidak nyeri dan haidnya lancar.\n- Alasannya: Novia akan memengaruhi hormonal normal konsumen.\n- Berlaku juga untuk miom dan kista sekaligus walaupun ukurannya masih kecil dan terkontrol.\n- Catatan: jawaban lama (2025-11-15, 2026-04-03, 2026-04-16 — Dr Rizky Nasution) sempat membolehkan selama miom tidak dalam keadaan gawat atau dalam kondisi nyaman (mis. sudah sangat mengecil atau tidak membesar), dengan konsumsi 1 kali per hari di bawah pengawasan atau sesuai dosis anjuran, karena beberapa bahan Novia merangsang kerja otot rahim dan meregulasi hormon; ikuti yang terbaru.","p":["Novia"],"k":"kondisi medis & penyakit","s":"tidak","rd":true,"by":["Dr Rizky Nasution"],"d":"2026-09-06","n":5,"kasus":[{"d":"2026-04-03","t":"Miom sudah sangat mengecil, haid sedikit, dikontrol berkala ke dokter → boleh 1x/hari dengan pengawasan."},{"d":"2026-04-16","t":"Riwayat miom, menurut dokter sudah tidak membesar, dianjurkan pantang kedelai → boleh selama miom dalam kondisi nyaman."},{"d":"2026-09-06","t":"Beberapa miom (terbesar ±16 cm, lainnya kecil) dari USG transvaginal Februari, tidak nyeri, haid normal, hanya minum rempah → jangan minum Novia."}],"kw":["miom","mioma","myoma","myom","mioma uteri","fibroid","tumor jinak rahim","benjolan rahim","rahim","miom dan kista","otot rahim","hormon"]},{"id":65,"q":"Apakah Novia boleh diminum bersama simvastatin dan allopurinol (kolesterol dan asam urat sedang tinggi)?","a":"Bisa, dengan pengaturan waktu minum:\n- Jika simvastatin dan allopurinol selalu diminum bersamaan setiap hari, minum keduanya di malam hari saja.\n- Novia diminum di pagi hari.","p":["Novia"],"k":"minum bersama obat/suplemen","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-09-06","n":1,"kasus":[{"d":"2026-09-06","t":"Kolesterol dan asam urat sedang tinggi, minum simvastatin & allopurinol → kedua obat malam, Novia pagi."}],"kw":["simvastatin","allopurinol","kolesterol","asam urat","obat kolesterol","obat asam urat","waktu minum","jeda minum"]},{"id":66,"q":"Bagaimana jika telinga berdenging setiap kali minum Novia — perlu stop atau cukup dikurangi dosisnya?","a":"Stop saja konsumsi Novia.\n- Telinga berdenging setelah minum suplemen/obat adalah indikasi ototoksik.\n- Artinya konsumen tidak cocok dengan kandungan suplemen/obat yang dikonsumsinya.","p":["Novia"],"k":"efek samping & keluhan","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-09-05","n":1,"kasus":[{"d":"2026-09-05","t":"Sekitar 1 minggu minum Novia muncul telinga berdenging; saat stop hilang, saat minum lagi muncul lagi → stop."}],"kw":["telinga berdenging","kuping berdenging","tinnitus","ototoksik","tidak cocok","efek samping","stop novia"]},{"id":67,"q":"Apakah Novia bisa membantu mencegah menopause dini?","a":"Secara spesifik, tidak.\n- Novia bukan obat hormonal.","p":["Novia"],"k":"manfaat & hasil","s":"info","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-09-04","n":1,"kasus":[],"kw":["menopause dini","mencegah menopause","early menopause","menopause","obat hormonal","hormonal"]},{"id":68,"q":"Apakah konsumen dengan pembengkakan jantung yang masih rutin minum obat boleh minum Novia?","a":"Jangan.\n- Cukup konsumsi obat jantungnya saja.","p":["Novia"],"k":"kondisi medis & penyakit","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-09-03","n":1,"kasus":[{"d":"2026-09-03","t":"Konsumen dengan pembengkakan jantung, rutin minum obat jantung → jangan."}],"kw":["pembengkakan jantung","jantung bengkak","kardiomegali","obat jantung","sakit jantung","jantung"]},{"id":69,"q":"Apakah keluarnya gumpalan darah dari anus saat BAB pada konsumen Novia (sudah lama tidak haid) berhubungan dengan Novia?","a":"Bukan karena Novia.\n- Gumpalan darah dari anus indikasinya bukan karena Novia.\n- Sepertinya ada gejala penyakit lain yang d
