ialami konsumen, seperti hemoroid (wasir).","p":["Novia"],"k":"efek samping & keluhan","s":"info","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-09-03","n":1,"kasus":[{"d":"2026-09-03","t":"Konsumen sudah 1 bulan minum Novia (keluhan lama tidak haid), keluar gumpalan darah dari anus saat BAB → bukan karena Novia, kemungkinan hemoroid."}],"kw":["darah dari anus","bab berdarah","wasir","hemoroid","ambeien","gumpalan darah","tidak haid"]},{"id":70,"q":"Kenapa muncul flek hitam/hiperpigmentasi di wajah (disertai keputihan dan haid jadi sedikit) setelah minum Novia, dan bagaimana memulihkan kulitnya?","a":"Kemungkinan kandungan Novia bereaksi ganda dengan hormon konsumen yang pernah memakai KB; kalau tidak nyaman, stop.\n- Kandungan Novia diduga bereaksi double terhadap hormon konsumen yang pernah memakai KB suntik/pil, sehingga hormonnya menjadi lebih tinggi dan menimbulkan hiperpigmentasi di kulit.\n- Kalau tidak nyaman, hentikan Novia.\n- Pemulihan kulit butuh proses: tetap lakukan perawatan kulit dari luar dan dalam; kondisi hormon seharusnya akan membaik lagi.\n- Evaluasi 1 bulan ke depan; jika tidak ada perubahan, konsultasi langsung ke dokter spesialis kulit (Sp.DVE).","p":["Novia"],"k":"efek samping & keluhan","s":"bersyarat","rd":true,"by":["Dr Rizky Nasution"],"d":"2026-09-02","n":1,"kasus":[{"d":"2026-09-02","t":"Hampir habis 1 botol Novia: flek hitam banyak di wajah, kusam, keputihan kental tiap hari, haid jadi sedikit; pernah KB suntik & pil (sekarang tidak), alergi seafood tidak segar → stop bila tidak nyaman; rawat kulit, evaluasi 1 bulan, lalu ke Sp.DVE."}],"kw":["flek hitam","hiperpigmentasi","melasma","kulit kusam","bekas kb","kb suntik","pil kb","sp.dve","dokter kulit"]},{"id":71,"q":"Apakah orang dewasa sehat boleh minum S-Glow 2 butir pagi dan 2 butir malam?","a":"Tidak disarankan melebihi dosis anjuran.\n- Dosis yang disarankan untuk dewasa adalah 2x sehari.\n- Lebih dari itu jangan.","p":["S-Glow"],"k":"cara minum & dosis","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-09-02","n":1,"kasus":[{"d":"2026-09-02","t":"Konsumen dewasa tanpa riwayat penyakit ingin minum 2 butir pagi + 2 butir malam → jangan melebihi dosis anjuran (2x sehari)."}],"kw":["dosis sglow","dosis","aturan minum","2x sehari","dobel dosis","melebihi dosis","4 butir"]},{"id":72,"q":"Apakah S-Glow boleh diminum oleh orang dengan autoimun tiroid?","a":"Tidak disarankan bila sudah minum obat tiroid.\n- Kalau konsumen sudah mengonsumsi obat-obatan tiroid, jangan minum S-Glow.","p":["S-Glow"],"k":"kondisi medis & penyakit","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-09-02","n":1,"kasus":[],"kw":["autoimun","autoimun tiroid","tiroid","hashimoto","graves","obat tiroid"]},{"id":73,"q":"Apakah konsumen yang rutin minum Apo Clopidogrel, Lipitor, Concor, dan Methycobal boleh minum Novia dan DVN, dan perlu jeda berapa jam?","a":"Novia tidak disarankan; DVN boleh dicoba dengan jeda 6 jam.\n- Obat rutinnya sudah terlalu banyak, jadi Novia tidak disarankan.\n- DVN boleh dicoba dengan jeda waktu 6 jam dari obat rutin.","p":["DVN","Novia"],"k":"minum bersama obat/suplemen","s":"tergantung","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-09-01","n":1,"kasus":[{"d":"2026-09-01","t":"Konsumen rutin minum Apo Clopidogrel, Lipitor, Concor & Methycobal → Novia jangan; DVN boleh dengan jeda 6 jam."}],"kw":["clopidogrel","lipitor","atorvastatin","concor","bisoprolol","methycobal","obat jantung","banyak obat","jeda 6 jam"]},{"id":74,"q":"Apakah konsumen dengan penurunan fungsi ginjal boleh minum BLZ (Biolingzhi)?","a":"Tidak disarankan.\n- Konsumen dengan penurunan fungsi ginjal tidak disarankan minum BLZ.","p":["BLZ Pro"],"k":"kondisi medis & penyakit","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-09-01","n":1,"kasus":[],"kw":["ginjal","fungsi ginjal","penurunan fungsi ginjal","sakit ginjal","biolingzhi","blz","lingzhi"]},{"id":75,"q":"Apakah konsumen dengan haid tidak teratur dan sulit tidur yang minum Ascardia 80 mg 3x seminggu boleh minum Novia?","a":"Boleh, diminum di hari yang tidak minum Ascardia.\n- Ascardia berfungsi mencegah terbentuknya gumpalan darah, sering diberikan untuk pasien dengan indikasi serangan jantung atau stroke.\n- Konsumsi Novia pada hari ketika tidak minum Ascardia.\n- Tetap evaluasi keluhan yang muncul saat mulai minum Novia, karena reaksi tiap orang berbeda-beda.","p":["Novia"],"k":"minum bersama obat/suplemen","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-09-01","n":1,"kasus":[{"d":"2026-09-01","t":"Konsumen haid tidak teratur & sulit tidur, minum Ascardia 80 mg 3x seminggu → Novia di hari tanpa Ascardia, evaluasi keluhan."}],"kw":["ascardia","aspirin","pengencer darah","gumpalan darah","haid tidak teratur","sulit tidur","stroke","jantung"]},{"id":76,"q":"Apakah BLZ Pro (Biolingzhi) bisa membantu penyakit asam urat?","a":"Tidak; BLZ bukan obat untuk asam urat.\n- Fungsi BLZ berbeda, bukan untuk mengobati asam urat.\n- Catatan: jawaban lama (2025-02-07, Nutritionist Novrianti) sempat menyebut BLZ Pro bisa jadi pendukung untuk asam urat, karena jamur lingzhi membantu melancarkan peredaran darah sehingga tidak ada asam yang menumpuk dan menimbulkan peradangan; ikuti yang terbaru.","p":["BLZ Pro"],"k":"manfaat & hasil","s":"tidak","rd":false,"by":["Dr Rizky Nasution","Nutritionist Novrianti"],"d":"2026-09-01","n":2,"kasus":[],"kw":["asam urat","gout","lingzhi","bio lingzhi","blz","peradangan","peredaran darah","biolingzhi","obat asam urat"]},{"id":77,"q":"Apakah Novia punya sertifikat/hasil uji lab, misalnya uji kandungan BKO (bahan kimia obat)?","a":"Ada. Hasil uji lab: dari 231 jenis obat yang diuji, tidak ada yang terdeteksi di Novia.\n- Novia telah diuji terhadap 231 jenis obat oleh Toxicology Laboratory Universiti Sains Malaysia (USM), dan semua obat yang diuji tidak terdeteksi.\n- Bukti yang dibagikan: Certificate of Analysis (COA) skrining obat dengan metode GC-MS (terbit 16 Juli 2025), hasil ND (not detected).\n- Dokumen sertifikat/hasil lab Novia (seperti yang dimiliki Erojan) seharusnya bisa dicek di Google Drive svo.ai.","p":["Novia"],"k":"kandungan & keamanan produk","s":"info","rd":false,"by":["Nutritionist Novrianti","Tim RnD (Ying)"],"d":"2026-08-31","n":2,"kasus":[],"kw":["bko","bahan kimia obat","uji lab","hasil lab","sertifikat","coa","usm","zat kimia","keamanan produk","dokumen","gdrive","svo.ai"]},{"id":78,"q":"Apakah orang yang hanya punya satu ginjal (termasuk karena transplantasi) boleh minum DVN, S-Glow, atau Novia? Apakah bentuk kapsul (Erojan) berpengaruh ke ginjal?","a":"Tidak disarankan — saran terbaru dokter: jangan.\n- Dengan kondisi ginjal hanya 1, dikhawatirkan respons tubuhnya jadi berat terhadap tambahan suplemen.\n- Kondisi 1 ginjal memengaruhi batasan asupan air, vitamin, mineral, dan konsentrat; DVN mengandung vitamin dan konsentrat, jadi kondisi ginjalnya harus dicari tahu dan dikonsultasikan ke dokter dulu.\n- Info kapsul Erojan: kapsulnya dari bovine dan larut di lambung, sehingga kapsulnya sendiri tidak memengaruhi kondisi ginjal.\n- Catatan: jawaban lama (2024-03-26, Nutritionist Novrianti; 2024-12-03, Dr Rizky Nasution) sempat menyarankan boleh dengan dosis dikurangi jadi 1 kali sehari saja (pastikan dulu ada batasan asupan makanan atau tidak); ikuti yang terbaru.","p":["DVN","Novia","Erojan","S-Glow"],"k":"kondisi medis & penyakit","s":"tidak","rd":true,"by":["Dr Rizky Nasution","Nutritionist Novrianti"],"d":"2026-08-27","n":4,"kasus":[{"d":"2024-12-03","t":"Konsumen hanya punya 1 ginjal dan tidak minum obat apa pun → DVN 1x sehari saja."},{"d":"2025-05-17","t":"Konsumen tinggal 1 ginjal dan khawatir soal bentuk kapsul; produk yang dimaksud ternyata DVN → konsultasi dokter dulu soal kondisi ginjalnya."},{"d":"2026-08-27","t":"Keluhan rambut rontok & badan sering kaku; ginjal tinggal 1 karena transplantasi, lambung sensitif; kini sehat tanpa obat dokter, minum suplemen astaxanthin & magnesium → jangan."}],"kw":["satu ginjal","ginjal satu","1 ginjal","ginjal 1","ginjal tunggal","donor ginjal","transplantasi ginjal","cangkok ginjal","ginjal","fungsi ginjal","kapsul","lambung sensitif"]},{"id":79,"q":"Apakah penderita glaukoma yang dilarang minum omega-3 ikan aman minum DVN dan S-Glow?","a":"Konsultasikan dulu ke dokter spesialis mata.\n- Jika ingin konsumsi, konsultasikan dulu dengan dokter spesialis mata konsumen.\n- Karena sudah ada larangan konsumsi omega-3 ikan, dikhawatirkan timbul reaksi alergi juga bila minum DVN dan S-Glow.","p":["DVN","S-Glow"],"k":"kondisi medis & penyakit","s":"tergantung","rd":true,"by":["Dr Rizky Nasution"],"d":"2026-08-26","n":1,"kasus":[{"d":"2026-08-26","t":"Konsumen glaukoma, dilarang minum omega-3 ikan → konsultasi dokter spesialis mata dulu sebelum DVN/S-Glow."}],"kw":["glaukoma","mata","omega 3","minyak ikan","spesialis mata","alergi ikan","kolagen ikan"]},{"id":80,"q":"Apakah normal muncul keputihan basah terus (kadang kecoklatan seperti mau haid) tapi belum haid setelah 2 minggu minum Novia, atau harus stop?","a":"Untuk saat ini masih dalam batas normal; evaluasi 1 minggu.\n- Evaluasi lagi selama 1 minggu ke depan.\n- Jika keluhan masih terus ada dan keputihan semakin bertambah, stop Novia, karena dicurigai ada faktor kesehatan lain yang harus ditangani secara medis.","p":["Novia"],"k":"efek samping & keluhan","s":"bersyarat","rd":true,"by":["Dr Rizky Nasution"],"d":"2026-08-26","n":1,"kasus":[{"d":"2026-08-26","t":"Konsumen 34 th, sebelumnya 2 bulan tidak haid & kering; setelah 2 minggu Novia keputihan, kini basah terus ±1 minggu kadang kecoklatan, belum haid → masih normal; evaluasi 1 minggu, stop bila bertambah."}],"kw":["keputihan","cairan vagina","flek coklat","belum haid","telat haid","miss v basah","evaluasi"]},{"id":81,"q":"Apakah konsumen promil yang ternyata ada bakteri di cairan vagina (sudah diberi obat dokter) boleh melanjutkan Novia?","a":"Stop Novia dulu.\n- Konsultasi ke dokter dan minum obat-obatan dari dokter dulu untuk kondisi kesehatannya sekarang.","p":["Novia"],"k":"kondisi medis & penyakit","s":"tidak","rd":true,"by":["Dr Rizky Nasution"],"d":"2026-08-26","n":1,"kasus":[{"d":"2026-08-26","t":"Konsumen promil, ±2 minggu minum Novia lalu berhenti karena mengira hamil; hasil periksa ternyata bukan hamil, ada bakteri di cairan vagina & diberi obat → stop Novia, ikuti pengobatan dokter."}],"kw":["promil","program hamil","hamil","bakteri vagina","infeksi vagina","keputihan","obat dokter"]},{"id":82,"q":"Apakah penderita diabetes yang masih rutin minum obat diabetes atau memakai insulin boleh minum Novia?","a":"Tidak disarankan.\n- Utamakan obat-obatan diabetesnya dulu.\n- Jika sudah memakai/rutin suntik insulin: metabolik tubuhnya tidak stabil dan gula darah mudah terstimulasi naik-turun, jadi harus sangat hati-hati dalam mengonsumsi suplemen; Novia dikhawatirkan memberikan efek yang memberatkan karena respons tubuh yang berbeda-beda.\n- Catatan: jawaban lama (2026-06-28, Dr Rizky Nasution) sempat membolehkan konsumen diabetes yang rutin minum obat gula dari dokter; ikuti yang terbaru.","p":["Novia"],"k":"kondisi medis & penyakit","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-08-25","n":4,"kasus":[{"d":"2026-07-07","t":"Diabetes dengan insulin, juga maag dan hipertensi; obat: candesartan, insulin, Dapazox, Crestor → jangan."},{"d":"2026-08-12","t":"Konsumen rutin suntik insulin → jangan."},{"d":"2026-08-25","t":"Penderita diabetes yang masih minum obat DM → jangan, utamakan obatnya."}],"kw":["diabetes","dm","diabetes melitus","gula darah","kencing manis","sakit gula","obat gula","obat diabetes","obat dm","insulin","suntik insulin","metabolik"]},{"id":83,"q":"Apakah DVN boleh diminum 11 hari setelah melahirkan?","a":"Tunggu dulu sampai 3 minggu setelah melahirkan.\n- Mulai DVN setelah 3 minggu pasca melahirkan.\n- Pastikan tidak ada keluhan saat konsumen minum DVN.","p":["DVN"],"k":"hamil, menyusui & promil","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-08-25","n":1,"kasus":[{"d":"2026-08-25","t":"Konsumen baru 11 hari melahirkan → tunggu sampai 3 minggu, pastikan tidak ada keluhan."}],"kw":["habis melahirkan","pasca melahirkan","nifas","postpartum","lahiran","3 minggu","ibu baru melahirkan"]},{"id":84,"q":"Kenapa konsumen biduran/gatal-gatal jika minum BLZ, Novia, dan S-Glow di hari yang sama (tidak terjadi jika salah satu dihentikan)?","a":"Kemungkinan dari kandungan salah satu produk, paling mungkin S-Glow.\n- Ada kemungkinan reaksi dari kandungan salah satu dari ketiga produk; yang paling mudah menyebabkan reaksi kemungkinan kandungan S-Glow.\n- Coba stop S-Glow dulu.\n- BLZ dan Novia tetap diminum dosis normal: satu di pagi, satu di malam.","p":["Novia","S-Glow","BLZ Pro"],"k":"efek samping & keluhan","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-08-24","n":1,"kasus":[{"d":"2026-08-24","t":"Biduran/gatal bila BLZ + Novia + S-Glow diminum di hari yang sama → stop S-Glow dulu; BLZ & Novia dosis normal (satu pagi, satu malam)."}],"kw":["biduran","gatal","alergi","urtikaria","kaligata","minum bersamaan","sglow","blz"]},{"id":85,"q":"Apakah konsumen dengan penebalan dinding rahim (termasuk yang disertai haid tidak berhenti, polip, atau akan dikuret) boleh minum Novia?","a":"Tidak disarankan.\n- Dokter menyarankan jangan konsumsi Novia untuk kondisi penebalan dinding rahim.\n- Jika disertai haid tidak berhenti (mis. 2 minggu), kondisinya sudah harus dibantu dengan obat-obatan tertentu dari dokter.\n- Jika disertai polip dan konsumen akan menjalani kuretase → jangan.\n- Jika sedang rutin minum obat dari dokter, tanyakan langsung ke dokter yang memberikan obatnya; keputusan harus berdasarkan pemeriksaan langsung oleh dokter yang merawat.","p":["Novia"],"k":"kondisi medis & penyakit","s":"tidak","rd":true,"by":["Dr Rizky Nasution"],"d":"2026-08-24","n":4,"kasus":[{"d":"2026-05-18","t":"Konsumen dengan penebalan dinding rahim yang sedang rutin minum obat dari dokter → konfirmasi ke dokternya."},{"d":"2026-08-24","t":"Penebalan dinding rahim + haid tidak berhenti 2 minggu → jangan; perlu obat dari dokter."}],"kw":["penebalan dinding rahim","penebalan rahim","dinding rahim tebal","endometrium","hiperplasia endometrium","haid tidak berhenti","haid lama","polip","kuretase","kuret","rahim","obat dokter"]},{"id":86,"q":"Apakah calon konsumen yang minum Ascardia dan Simarc boleh minum Novia?","a":"Tidak disarankan.\n- Ascardia dan Simarc termasuk golongan obat keras.","p":["Novia"],"k":"minum bersama obat/suplemen","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-08-24","n":1,"kasus":[{"d":"2026-08-24","t":"Calon konsumen minum Ascardia dan Simarc → jangan."}],"kw":["ascardia","simarc","aspirin","warfarin","pengencer darah","obat keras","obat jantung"]},{"id":87,"q":"Apakah wajar konsumen 63 tahun keluar flek darah sedikit dan area Miss V terasa basah setelah hampir 2 botol Novia?","a":"Kemungkinan tidak berhubungan dengan Novia.\n- Kejadian tersebut sepertinya tidak ada hubungannya dengan konsumsi Novia.\n- Usia 63 tahun sudah termasuk lansia, jadi tetap waspada terhadap keluhan yang muncul walaupun tanpa konsumsi suplemen.","p":["Novia"],"k":"efek samping & keluhan","s":"info","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-08-23","n":1,"kasus":[{"d":"2026-08-23","t":"Konsumen 63 th, hampir 2 botol Novia, tiba-tiba Miss V basah & ada flek darah sedikit saat cebok → kemungkinan tidak terkait Novia; waspadai keluhan di usia lansia."}],"kw":["flek","flek darah","bercak darah","lansia","menopause","miss v basah","usia 63"]},{"id":88,"q":"Apakah purging yang tidak berhenti setelah 4 minggu minum Novia dan DVN bersamaan berarti konsumen tidak cocok?","a":"Ya, sepertinya konsumen tidak cocok.\n- Purging selama 4 minggu menurut dokter sudah terlalu lama.","p":["DVN","Novia"],"k":"efek samping & keluhan","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-08-23","n":1,"kasus":[{"d":"2026-08-23","t":"Purging tidak berhenti setelah 4 minggu minum Novia + DVN → kemungkinan tidak cocok."}],"kw":["purging","jerawat","breakout","beruntusan","tidak cocok","4 minggu"]},{"id":89,"q":"Apakah penderita penyakit jantung (jantung koroner, penyempitan pembuluh, atau sudah pasang stent) yang rutin minum obat jantung boleh minum DVN (dan S-Glow), dan bagaimana jadwal minumnya?","a":"Boleh, dengan jeda waktu dari obat jantung rutin dan tetap dipantau.\n- Obat jantung tetap diminum rutin sesuai jadwalnya.\n- Saran terbaru (2026-08-23): DVN dan S-Glow tidak apa-apa, tetapi bedakan jam konsumsinya 6 jam dari obat rutin dan pantau keluhan yang muncul tiba-tiba (khawatir ada respons berbeda dari tubuh).\n- Contoh jadwal yang pernah diberikan dokter: obat pagi (±08.00) & malam (±18.00) → DVN pukul 13.00 setelah makan siang; obat pagi & malam (masing-masing 2 butir) → 1 tablet DVN pukul 14.00 setelah makan siang.\n- Jika obat jantung diminum pagi-siang-malam → DVN 3 jam setelah obat siang.\n- Mulai 1 tablet dulu, lalu evaluasi apakah muncul keluhan.\n- Catatan: jawaban lama (2025-12-05, Dr Rizky Nasution) sempat menyebut jarak 8 jam setelah obat rutin (sebelum jadwal obat konsumen diketahui); ikuti yang terbaru.","p":["DVN","S-Glow"],"k":"minum bersama obat/suplemen","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-08-23","n":3,"kasus":[{"d":"2025-12-05","t":"Konsumen 61 tahun dengan jantung koroner, keluhan sudah jarang, rutin 5 obat harian + 2 obat tidak rutin (pagi & malam) → DVN pukul 13.00 setelah makan siang, lalu evaluasi."},{"d":"2026-01-10","t":"Konsumen penyakit jantung (penyempitan) ±1 tahun, rutin minum obat jantung → DVN 1 tablet, 3 jam setelah obat siang, atau pukul 14.00 bila obat hanya pagi dan malam."},{"d":"2026-08-23","t":"Konsumen 61 th, 6 stent karena penebalan kalsium di pembuluh darah (bukan kolesterol), rutin obat jantung → boleh, pantau keluhan, jeda 6 jam."}],"kw":["penyakit jantung","jantung koroner","obat jantung","penyempitan pembuluh","stent","ring jantung","pasang ring","jeda obat","jeda 6 jam","jadwal minum","lansia","cara minum"]},{"id":90,"q":"Apakah penderita autoimun lupus nefritis (lupus yang menyerang ginjal) boleh minum S-Glow?","a":"Tidak disarankan.\n- Untuk autoimun, sebaiknya jangan konsumsi suplemen karena reaksi tiap tubuh pasien terhadap isi suplemen berbeda-beda.\n- Jika tetap ingin, konsultasikan dulu dengan dokter spesialis penyakit dalam yang menangani pasien.","p":["S-Glow"],"k":"kondisi medis & penyakit","s":"tidak","rd":true,"by":["Dr Rizky Nasution"],"d":"2026-08-20","n":1,"kasus":[{"d":"2026-08-20","t":"Pasien autoimun lupus nefritis (mengarah ke ginjal) → jangan konsumsi suplemen; bila ingin, konsultasi Sp.PD."}],"kw":["autoimun","lupus","lupus nefritis","sle","ginjal","sp.pd","penyakit dalam"]},{"id":91,"q":"Apakah konsumen yang sudah operasi angkat kantong empedu (riwayat batu empedu) dan rutin minum alprazolam boleh minum Novia?","a":"Boleh, dengan jeda waktu.\n- Konsumsi Novia sesuai dosis normal.\n- Bedakan waktu minum Novia dan alprazolam selama 8 jam.","p":["Novia"],"k":"minum bersama obat/suplemen","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-08-20","n":1,"kasus":[{"d":"2026-08-20","t":"Riwayat batu empedu, kantong empedu diangkat November 2025, minum alprazolam → boleh dosis normal, jeda 8 jam."}],"kw":["batu empedu","kantong empedu","operasi empedu","alprazolam","obat penenang","jeda 8 jam"]},{"id":92,"q":"Apakah Novia bisa untuk mengobati penyakit kista?","a":"Tidak bisa.\n- Kista membutuhkan tindakan medis spesifik, baik dengan obat-obatan maupun operasi.","p":["Novia"],"k":"manfaat & hasil","s":"tidak","rd":true,"by":["Dr Rizky Nasution"],"d":"2026-08-20","n":1,"kasus":[],"kw":["kista","kista ovarium","obat kista","menyembuhkan kista","operasi kista","klaim produk"]},{"id":93,"q":"Bagaimana jika haid yang biasanya teratur jadi tidak lancar (hanya flek) setelah mulai minum Novia?","a":"Stop Novia dulu; DVN boleh dilanjut.\n- Hentikan Novia sampai periode haid di bulan berikutnya.\n- DVN tidak apa-apa dilanjutkan.","p":["DVN","Novia"],"k":"haid, hormon & menopause","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-08-17","n":1,"kasus":[{"d":"2026-08-17","t":"Konsumen 45 th (indikasi jerawat hormonal, minum DVN + Novia), biasanya haid tiap tgl 10; minum Novia tgl 4, tgl 5 flek lalu stop; tgl 15 hanya flek, haid belum lancar → stop Novia sampai haid bulan berikutnya, DVN lanjut."}],"kw":["haid tidak lancar","telat haid","flek","haid tidak teratur","jerawat hormonal","siklus haid","stop novia"]},{"id":94,"q":"Apakah konsumen yang sedang program gula darah dan memakai Mirena (dipasang di rahim untuk keseimbangan hormon) boleh minum Novia?","a":"Jangan.\n- Dikhawatirkan respons hormonnya jadi berlebihan (over).","p":["Novia"],"k":"minum bersama obat/suplemen","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-08-17","n":1,"kasus":[{"d":"2026-08-17","t":"Konsumen sedang program gula darah dan memakai Mirena untuk keseimbangan hormon → jangan."}],"kw":["mirena","iud","spiral","kb spiral","kb hormonal","gula darah","diabetes","hormon"]},{"id":95,"q":"Apakah Novia boleh dilanjutkan jika keluar flek selama 15 hari setelah haid deras 5 hari (flek sudah berhenti, badan terasa lebih enak)?","a":"Boleh dilanjut jika konsumen merasa nyaman.\n- Reaksi tubuh seperti flek bisa karena efek detoks di tubuh.\n- Jika konsumen merasa tidak nyaman, tidak dilanjutkan juga tidak apa-apa.","p":["Novia"],"k":"haid, hormon & menopause","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-08-17","n":1,"kasus":[{"d":"2026-08-17","t":"Konsumen 50 th, flek 15 hari berturut-turut setelah haid deras 5 hari, kini sudah berhenti & badan terasa enak → boleh lanjut bila nyaman."}],"kw":["flek","flek lama","haid deras","bercak darah","detoks","haid panjang","usia 50"]},{"id":96,"q":"Apakah konsumen yang baru operasi kista coklat dan disarankan dokter suntik Tapros 6 bulan boleh minum Novia?","a":"Jangan dulu; fokus ke terapi Tapros.\n- Novia baru dikonsumsi setelah terapi Tapros selesai.\n- Jangan digabung pemakaiannya.","p":["Novia"],"k":"minum bersama obat/suplemen","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-08-14","n":1,"kasus":[{"d":"2026-08-14","t":"Konsumen 36 th, baru operasi kista coklat, disarankan suntik Tapros 6 bulan → Novia setelah Tapros selesai."}],"kw":["tapros","suntik tapros","kista coklat","endometrioma","operasi kista","pasca operasi","suntik hormon"]},{"id":97,"q":"Apakah konsumen yang minum (atau pernah minum) obat hormon pengatur siklus haid Cyclo-Progynova dari dokter boleh minum Novia?","a":"Tergantung masih diminum atau tidak:\n- Kalau masih minum Cyclo-Progynova → jangan minum Novia.\n- Kalau sudah stop Cyclo-Progynova → boleh minum Novia.\n- Catatan: jawaban lama (2025-08-31, Nutritionist Novrianti) sempat menyarankan konsultasikan dulu sebelum digabung, karena manfaat obat tersebut dan Novia kemungkinan berbeda dan obatnya diresepkan dokter (kemungkinan sengaja untuk program hamil); ikuti yang terbaru.","p":["Novia"],"k":"minum bersama obat/suplemen","s":"tergantung","rd":true,"by":["Dr Rizky Nasution","Nutritionist Novrianti"],"d":"2026-08-13","n":2,"kasus":[{"d":"2026-08-13","t":"Calon konsumen dulu minum Cyclo-Progynova (haid keluar saat minum, bulan berikutnya tanpa obat tidak haid), sekarang sudah berhenti → boleh Novia."}],"kw":["cyclo progynova","cycloprogynova","cyclo","obat hormon","estradiol","siklus haid","obat haid","pemancing haid","tidak haid","program hamil","promil","haid tidak teratur"]},{"id":98,"q":"Apakah konsumen dengan hipoplasia uterus (rahim lebih kecil dari normal) boleh minum Novia?","a":"Boleh dicoba dengan setengah dosis selama 1 minggu dulu.\n- Hipoplasia uterus adalah diagnosa medis untuk ukuran rahim yang lebih kecil dari normal, biasanya akibat bawaan lahir atau genetik keluarga.\n- Mulai dengan setengah dosis anjuran (1 kapsul untuk 2 hari) selama 1 minggu.\n- Pantau dan evaluasi keluhan yang muncul sejak awal konsumsi.","p":["Novia"],"k":"kondisi medis & penyakit","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-08-13","n":1,"kasus":[{"d":"2026-08-13","t":"Konsumen 40 th, setelah 5 tahun pakai KB suntik 3 bulanan haid tak kunjung datang selama 5 tahun; USG: hipoplasia uterus → setengah dosis (1 kapsul/2 hari) 1 minggu, pantau."}],"kw":["hipoplasia uterus","rahim kecil","tidak haid","kb suntik","amenore","setengah dosis","1 kapsul 2 hari"]},{"id":99,"q":"Kenapa konsumen pusing/kliyengan setiap kali minum Novia (saat berhenti hilang, diminum lagi muncul lagi), dan apakah boleh lanjut?","a":"Bisa efek samping dari salah satu bahan Novia atau proses adaptasi tubuh; kalau tidak nyaman, stop saja.\n- Pusing mungkin respons tubuh beradaptasi dengan suplemen yang masuk; Novia membantu menormalkan kembali ketidakseimbangan hormon wanita, dan efek pertama saat bereaksi terhadap hormon bisa berupa pusing, mual, dan muntah.\n- Minum Novia setelah makan yang normal, supaya penyerapan kandungannya bisa diantisipasi oleh lambung.\n- Jika konsumen tidak nyaman dengan proses adaptasi itu, jangan dipaksakan — stop saja, khawatir keluhannya jadi berat dan mengganggu aktivitas sehari-hari.","p":["Novia"],"k":"efek samping & keluhan","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-08-12","n":2,"kasus":[{"d":"2026-03-25","t":"Selalu kliyengan setelah minum Novia, berulang saat dicoba lagi, tanpa obat lain → minum setelah makan normal."},{"d":"2026-08-12","t":"Pusing setelah 8 hari minum Novia; berhenti tidak pusing, minum lagi pusing lagi → adaptasi; stop bila tidak nyaman."}],"kw":["pusing","kliyengan","keleyengan","pening","puyeng","sakit kepala","mual","muntah","adaptasi","setelah makan","efek samping"]},{"id":100,"q":"Apakah safron (salah satu kandungan Novia) aman untuk orang dengan tekanan darah rendah, mengingat safron dikenal membuat tekanan darah tinggi stabil atau cenderung turun?","a":"Aman.\n- Safron juga aman untuk orang dengan tekanan darah rendah.","p":["Novia"],"k":"kandungan & keamanan produk","s":"boleh","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-08-12","n":1,"kasus":[],"kw":["safron","saffron","darah rendah","tekanan darah rendah","hipotensi","tensi rendah","kandungan novia"]},{"id":101,"q":"Apakah konsumen 55 tahun yang minum obat saraf (Lyrica, Mecobalamin) dan obat anti-stroke Briclot (ticagrelor) boleh minum Novia, dan kapan sebaiknya diminum?","a":"Boleh, dengan jeda waktu.\n- Bedakan jam minum Novia dengan obat-obatnya, kalau bisa selisih 6–8 jam.","p":["Novia"],"k":"minum bersama obat/suplemen","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-08-12","n":1,"kasus":[{"d":"2026-08-12","t":"Konsumen 55 th, minum Lyrica 75 mg & Mecobalamin 500 mcg (obat saraf) serta Briclot/ticagrelor 90 mg (anti-stroke) → boleh, jeda 6–8 jam."}],"kw":["obat saraf","lyrica","pregabalin","mecobalamin","briclot","ticagrelor","stroke","pengencer darah","jeda minum"]},{"id":102,"q":"Apakah pengguna minoxidil (oles/gel maupun oral) boleh minum S-Glow?","a":"Boleh, baik untuk pengguna minoxidil oles maupun oral.\n- Minoxidil gel (oles): tidak apa-apa dikonsumsi bersamaan dengan S-Glow.\n- Minoxidil oral (diminum): tidak ada kontraindikasi, silakan dikonsumsi.","p":["S-Glow"],"k":"minum bersama obat/suplemen","s":"boleh","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-08-11","n":2,"kasus":[],"kw":["minoxidil","minoxidil gel","obat oles","rambut rontok","penumbuh rambut","topikal","minoxidil oral","minoxidil tablet","kontraindikasi"]},{"id":103,"q":"Apakah konsumen yang sudah operasi pengangkatan payudara (disebabkan hormon) boleh minum Novia?","a":"Boleh.\n- Konsumsi Novia dengan dosis normal yang dianjurkan.","p":["Novia"],"k":"pasca operasi & tindakan medis","s":"boleh","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-08-10","n":1,"kasus":[{"d":"2026-08-10","t":"Konsumen pasca operasi pengangkatan payudara (penyebabnya terkait hormon) → boleh, dosis normal."}],"kw":["angkat payudara","pengangkatan payudara","mastektomi","operasi payudara","pasca operasi","hormon","payudara"]},{"id":104,"q":"Apakah wanita dalam masa nifas (setelah melahirkan maupun setelah keguguran) boleh minum Novia?","a":"Jangan dulu; selesaikan masa nifasnya.\n- Demi kehati-hatian, karena kondisi ibu setelah melahirkan berbeda-beda.\n- Berlaku juga untuk masa nifas setelah keguguran.\n- Mulai konsumsi Novia setelah minggu ke-6.\n- Catatan: jawaban lama (2026-03-24, Dr Rizky Nasution) sempat membolehkan Novia dengan dosis normal untuk konsumen yang baru seminggu keguguran, karena obat dari dokter/obat pencegah perdarahan sudah habis dan perdarahan sudah berhenti; ikuti yang terbaru.","p":["Novia"],"k":"hamil, menyusui & promil","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-08-08","n":2,"kasus":[{"d":"2026-03-24","t":"Seminggu pasca keguguran, obat dari dokter sudah habis, perdarahan sudah berhenti → saat itu dinyatakan boleh dosis normal (saran lama, lihat Catatan)."},{"d":"2026-08-08","t":"Konsumen keguguran dan masih masa nifas → selesaikan nifas, mulai Novia setelah minggu ke-6."}],"kw":["nifas","keguguran","abortus","pasca keguguran","habis melahirkan","pasca melahirkan","postpartum","lahiran","6 minggu","perdarahan","obat pencegah perdarahan"]},{"id":105,"q":"Kenapa keringat malam muncul lagi saat fase haid padahal sudah rutin minum Novia, dan apakah perlu minum 2 butir sehari?","a":"Cukup dosis normal, lalu evaluasi.\n- Keringat malam terkait metabolisme tubuh akibat hormon yang tidak seimbang (saat hormon tidak seimbang, susah tidur malam dan metabolisme bekerja terus sehingga keringat keluar).\n- Konsumsi Novia dengan dosis normal.\n- Evaluasi lagi setelah 1 minggu pemakaian.","p":["Novia"],"k":"haid, hormon & menopause","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-08-06","n":1,"kasus":[{"d":"2026-08-06","t":"Konsumen rutin minum Novia sore hari; keringat malam yang sempat hilang muncul lagi saat fase haid (sudah 2 bulan begini) → dosis normal, evaluasi 1 minggu."}],"kw":["keringat malam","keringat berlebih","berkeringat","hormon tidak seimbang","dosis novia","2 butir","fase haid","susah tidur"]},{"id":106,"q":"Apakah normal muncul keputihan setelah minum Novia pada konsumen yang sebelumnya tidak pernah keputihan, dan apakah harus distop?","a":"Bisa terjadi keputihan fisiologis akibat reaksi perubahan hormon terhadap Novia; evaluasi dulu.\n- Pastikan dulu keluhan ini memang belum ada sebelum minum Novia.\n- Penyebab keputihan ada dua: fisiologis dan patologis. Novia berfungsi menyeimbangkan hormon dan kesehatan kewanitaan, jadi salah satu efeknya bisa saja keputihan.\n- Jika keputihan berlanjut selama 10 hari, sebaiknya stop Novia karena dikhawatirkan hormonnya tidak berespons baik terhadap Novia.\n- Jika keputihan mengganggu atau disertai nyeri/sakit → boleh distop.\n- Setelah keputihan selesai, kalau mau mencoba lagi, mulai dengan dosis ringan dulu.\n- Catatan: jawaban lama (2026-02-13, Dr Rizky Nasution) sempat menyarankan langsung stop dulu karena tidak ada kandungan Novia yang spesifik berpengaruh ke keputihan, sehingga dianggap ketidakcocokan tubuh dengan isi Novia; ikuti yang terbaru.","p":["Novia"],"k":"efek samping & keluhan","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-08-06","n":3,"kasus":[{"d":"2026-02-13","t":"Konsumen sebelumnya tidak pernah keputihan, keputihan muncul sejak minum Novia → stop dulu, kemungkinan tidak cocok."},{"d":"2026-06-21","t":"Sebelum minum Novia tidak ada keluhan keputihan; setelah 1 bulan keputihan banyak, berlendir, kadang kekuningan."},{"d":"2026-08-06","t":"2 konsumen tanpa riwayat keputihan mengalami keputihan 3 hari–1 minggu setelah mulai Novia → kemungkinan fisiologis; evaluasi, stop bila berlanjut 10 hari."}],"kw":["keputihan","keputihan fisiologis","keputihan patologis","keputihan banyak","keputihan kuning","lendir","cairan vagina","miss v","vagina","hormon","tidak cocok","dosis ringan"]},{"id":107,"q":"Apakah konsumen dengan riwayat aritmia (masih berobat jalan) boleh minum Novia?","a":"Boleh, dengan setengah dosis.\n- Mulai dengan dosis ringan dulu, yaitu setengah dosis.\n- Jika ada obat rutin, bedakan jam minum Novia dengan jam minum obat rutinnya.\n- Konsumen saat ini belum minum obat apa pun: boleh, setengah dosis saja.","p":["Novia"],"k":"kondisi medis & penyakit","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-08-06","n":1,"kasus":[{"d":"2026-08-06","t":"Konsumen dengan riwayat aritmia, masih berobat jalan, saat ini belum minum obat apa pun → boleh, setengah dosis."}],"kw":["aritmia","jantung","detak jantung tidak teratur","jantung berdebar","setengah dosis","obat jantung","berobat jalan"]},{"id":108,"q":"Apakah DVN aman untuk penderita diabetes yang punya luka, dan bisakah membantu memudarkan flek bekas lukanya?","a":"Aman, tapi hasil untuk bekas luka butuh waktu.\n- Dari sisi keamanan, DVN aman.\n- Untuk membantu memudarkan flek bekas luka butuh waktu dan proses.\n- Akar masalahnya adalah diabetesnya; jika diabetes belum tertangani, kulit akan sulit membaik.","p":["DVN"],"k":"kondisi medis & penyakit","s":"boleh","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-08-06","n":1,"kasus":[{"d":"2026-08-06","t":"Konsumen dengan luka/bekas luka diabetes di kaki → DVN aman, tapi perbaikan kulit bergantung pada penanganan diabetesnya."}],"kw":["diabetes","luka diabetes","kencing manis","dm","bekas luka","flek hitam","kulit","gula darah"]},{"id":109,"q":"Kenapa muncul jerawat/beruntusan besar dan merah setelah minum DVN, S-Glow, dan Novia bersamaan, dan bagaimana sebaiknya mengatur konsumsinya?","a":"Coba kurangi dulu produk/dosis yang dikonsumsi.\n- Tanyakan goal konsumen: kalau goalnya hanya kulit, cukup DVN dan S-Glow saja.\n- Untuk konsumen dengan keluhan kompleks (hormon tidak seimbang seperti susah tidur, ditambah flek, kusam, rambut rontok): DVN dan S-Glow boleh dimulai dengan setengah dosis dulu, dan pisahkan waktu minum keduanya.\n- Bila memang sudah ada diagnosa hormon tidak seimbang, wajar mengalami susah tidur malam; metabolisme tubuh pun bekerja terus sehingga keringat keluar.\n- Kalau perlu, periksa dulu ke dokter dan laboratorium, khawatir ketidakseimbangan hormonnya cukup berat dan perlu terapi pengobatan yang lebih kompleks.","p":["DVN","Novia","S-Glow"],"k":"efek samping & keluhan","s":"bersyarat","rd":true,"by":["Dr Rizky Nasution"],"d":"2026-08-05","n":1,"kasus":[{"d":"2026-08-05","t":"Konsumen 41 th, minum DVN + S-Glow + Novia 1 bulan; beruntusan besar & merah sejak minggu pertama; goal kulit + keluhan hormon (susah tidur, flek, kusam, rambut rontok) → DVN & S-Glow setengah dosis, waktu minum dipisah; periksa dokter/lab bila perlu."}],"kw":["jerawat","beruntusan","breakout","hormon tidak seimbang","susah tidur","rambut rontok","setengah dosis","kurangi dosis","flek"]},{"id":110,"q":"Benarkah bahan-bahan Novia tidak disarankan untuk orang dengan tekanan darah rendah?","a":"Tidak benar; tidak ada kontraindikasi dengan tekanan darah rendah.\n- Sepengetahuan dokter, Novia tidak memiliki kontraindikasi dengan pasien tekanan darah rendah (info dari Google tersebut tidak tepat).","p":["Novia"],"k":"kondisi medis & penyakit","s":"boleh","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-08-03","n":1,"kasus":[{"d":"2026-08-03","t":"Konsumen darah rendah (terendah 96/60), tidak minum obat apa pun, membaca di Google bahwa bahan Novia tidak disarankan → tidak ada kontraindikasi."}],"kw":["darah rendah","tekanan darah rendah","hipotensi","tensi rendah","kontraindikasi","google","kandungan novia"]},{"id":111,"q":"Apakah penderita kista atau miom (termasuk kista ovarium, endometriosis, dan adenomiosis) boleh minum DVN atau Novia?","a":"DVN boleh dengan hati-hati — saran terbaru: mulai dengan setengah dosis dulu; Novia tidak disarankan.\n- Jika dokter memberi obat (mis. obat hormonal untuk memancing haid), minum obatnya dan konsultasi lagi ke dokter yang memberi obat setelah obatnya selesai.\n- Novia tidak disarankan karena bisa menimbulkan ketidakseimbangan hormon yang sedang bermasalah dengan adanya miom dan kista.\n- Jika masih minum obat rutin, jam minum DVN dibedakan dengan jarak setidaknya 6 jam dari obat.\n- Tetap dalam pengawasan. Info: mioma terjadi karena berbagai faktor (paparan logam berat, makanan terkontaminasi, kekurangan vitamin D, kekurangan asam amino tertentu serta antioksidan, gaya hidup tidak sehat); DVN mengandung antioksidan dan hasil uji bahan berbahayanya negatif.\n- Catatan: jawaban 2026-04-19 (Dr Rizky Nasution) sempat menyarankan penderita kista jangan minum DVN dulu; jawaban lama (2024-07-08, Nutritionist Novrianti) untuk kista ovarium yang masih berobat menyarankan mulai 1 tablet/hari dan diminum 1–2 jam setelah obat; ikuti yang terbaru.","p":["DVN","Novia"],"k":"kondisi medis & penyakit","s":"bersyarat","rd":true,"by":["Dr Rizky Nasution","Nutritionist Novrianti"],"d":"2026-08-03","n":5,"kasus":[{"d":"2024-05-21","t":"Konsumen 49 tahun dengan miom di rahim, belum pernah minum kolagen → boleh."},{"d":"2026-08-03","t":"Konsumen dengan miom, kista, endometriosis & adenomiosis, telat haid ±3 bulan, belum minum obat hormonal dari dokter karena takut breakout → minum obat dokter; Novia jangan; DVN setengah dosis."}],"kw":["kista","kista ovarium","kista indung telur","miom","mioma","myoma","miom rahim","tumor rahim","endometriosis","adenomiosis","obat hormonal","telat haid"]},{"id":112,"q":"Bagaimana menjawab customer yang khawatir kandungan Pueraria, Kacip Fatimah, dan Hops di Novia tidak aman untuk PCOS (info dari Google)?","a":"Penjelasan untuk customer:\n- Yang mungkin dikhawatirkan adalah Hops: jika dikonsumsi dalam dosis tunggal (hanya Hops saja dalam 1 kapsul/tablet suplemen), efek fitoestrogennya ke tubuh akan sangat tinggi.\n- Di Novia, kadar Hops tidak banyak karena bercampur dengan herbal lainnya, jadi hanya diambil efek antioksidannya saja.","p":["Novia"],"k":"kandungan & keamanan produk","s":"info","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-07-31","n":1,"kasus":[],"kw":["pcos","hops","pueraria","kacip fatimah","fitoestrogen","kandungan novia","antioksidan","google"]},{"id":113,"q":"Apakah konsumen yang ada atau pernah ada cairan di payudara boleh minum Novia, dan apakah Novia termasuk obat hormon?","a":"Tergantung kondisinya saat ini:\n- Jika masih ada endapan cairan, masih dipantau dokter, dan sedang minum obat dokter → jangan dulu; tuntaskan dulu terapi rutinnya dengan pengobatan dari dokter.\n- Jika cairannya sudah tidak ada (USG berikutnya sudah bersih), walaupun dokter mengingatkan terapi/obat hormon bisa memicu cairan muncul lagi → boleh.\n- Novia bukan obat hormon: Novia membantu menyeimbangkan hormon wanita yang sedang terganggu, namun prosesnya dibantu secara alami, bukan dengan obat-obatan.","p":["Novia"],"k":"kondisi medis & penyakit","s":"tergantung","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-07-30","n":2,"kasus":[{"d":"2026-07-27","t":"USG payudara 2025 ada cairan di payudara kanan, USG 2026 sudah tidak ada; dokter USG bilang terapi/obat hormon bisa memicu cairan lagi → boleh, Novia bukan obat-obatan."},{"d":"2026-07-30","t":"Konsumen 33 th, ada endapan cairan di payudara sejak Maret (disuruh cek ulang setelah 6 bulan, hasil USG terlampir), sedang minum obat dokter → jangan dulu."}],"kw":["cairan payudara","endapan cairan","payudara","pd","usg payudara","obat hormon","terapi hormon","bukan obat hormon","herbal","alami","obat dokter","terapi dokter"]},{"id":114,"q":"Apakah boleh minum DVN setelah operasi histerektomi (angkat rahim/miom) atau laparotomi?","a":"Boleh, seharusnya aman karena tidak ada kontraindikasi.\n- Jika masih minum obat-obatan (mis. antibiotik dan kalsium pasca operasi), tetap beri jarak jam minum antara DVN dan obatnya.\n- Tetap evaluasi pemakaiannya selama 1 minggu.","p":["DVN"],"k":"pasca operasi & tindakan medis","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-07-29","n":2,"kasus":[{"d":"2024-10-08","t":"Operasi histerektomi (angkat miom) 8 hari lalu, masih minum antibiotik dan kalsium → boleh, beri jarak jam minum."},{"d":"2026-07-29","t":"Pasca operasi laparotomi H+30 dan histerektomi setahun lalu → aman, evaluasi 1 minggu."}],"kw":["histerektomi","angkat rahim","operasi miom","miom","laparotomi","operasi perut","pasca operasi","habis operasi","antibiotik","kalsium","kontraindikasi"]},{"id":115,"q":"Apa yang harus dilakukan jika muncul gatal, kemerahan, ruam, bentol/bintik merah, atau bengkak (mis. bibir) setelah minum DVN — apakah itu alergi atau reaksi detoks?","a":"Stop DVN dulu — keluhan seperti ini lebih mengarah ke reaksi alergi terhadap salah satu kandungan DVN, bukan detoks.\n- Reaksi detoks hanya berlangsung ±1 minggu sejak awal konsumsi teratur, sedangkan reaksi alergi muncul sejak awal konsumsi; gatal/bintik yang makin melebar mengarah ke alergi.\n- Konsumen bisa saja tidak tahu dirinya alergi terhadap salah satu kandungan DVN walau tidak pernah alergi ikan/seafood. Bengkak (mis. bibir) juga bentuk alergi, kemungkinan dari fish collagen — jangan dilanjutkan supaya tidak menimbulkan efek lanjutan.\n- Gali dulu: sudah berapa lama dan berapa tablet minum DVN, riwayat alergi, makanan/minuman/obat yang dikonsumsi sebelum keluhan muncul, dan perubahan skincare. Mintakan juga data customer dan nomor batch DVN yang dikonsumsi (kirim ke Nutritionist lewat japri).\n- Setelah stop, evaluasi 1–2 minggu (±2 minggu sebagai pembanding): jika keluhan hilang → mungkin memang karena DVN; jika masih ada → kemungkinan faktor lain yang kebetulan muncul bersamaan.\n- Sambil stop, sarankan segera minum obat alergi untuk mengurangi reaksi alerginya (saran pada kasus gatal yang makin melebar).\n- Catatan: jawaban lama (2024-03-20, 2024-04-28 & 2025-04-03, Nutritionist Novrianti; 2025-04-09, Nutritionist Novrianti & Dr Rizky Nasution) sempat menyarankan mengurangi konsumsi dulu (1x sehari/2 hari sekali, atau selang-seling dengan produk kolagen lain) sampai keluhan mereda, baru berhenti bila alergi tetap muncul; ikuti yang terbaru.","p":["DVN"],"k":"efek samping & keluhan","s":"tidak","rd":false,"by":["Dr Rizky Nasution","Nutritionist Novrianti"],"d":"2026-07-28","n":11,"kasus":[{"d":"2024-03-20","t":"Wajah merah, awalnya gatal lalu bengkak dan perih sekitar 7 hari setelah mulai minum; tidak ada riwayat alergi; sunscreen dihentikan 2 hari → (saran lama) minum selang sehari dulu."},{"d":"2024-04-28","t":"Konsumen sudah 1 bulan minum DVN, bentol merah gatal muncul sejak awal konsumsi, tidak ada riwayat alergi → (saran lama) kurangi dosis sampai bintik hilang."},{"d":"2025-01-05","t":"Setelah ±2 minggu minum DVN (diisap), muncul gatal dan merah sampai telinga; tidak alergi ikan; punya darah tinggi dan sudah memberi jeda 4 jam dari obat darah tinggi → stop sementara, evaluasi 1–2 minggu."},{"d":"2025-02-22","t":"Konsumen sudah ±1 bulan minum DVN, gatal di kulit kepala & pinggang tanpa riwayat alergi → stop 2 minggu untuk membandingkan; curiga alergi."},{"d":"2025-04-03","t":"Konsumen gatal & merah sejak botol pertama, makin gatal di botol kedua hingga muncul bintik berair; sebelumnya aman minum kolagen salmon DNA → (saran lama) diduga asupan kolagen berlebih/reaksi adaptasi."},{"d":"2025-04-09","t":"Konsumen gatal sejak botol pertama hingga botol kedua, tidak alergi makanan laut, tidak minum suplemen lain, hanya obat tensi → (saran lama) coba 2 hari sekali; bila tetap alergi, stop DVN."},{"d":"2025-07-11","t":"Keluhan kulit muncul hari ke-3 setelah mulai DVN dan terus bertambah tanpa kenal waktu → dugaan alergi bahan DVN, stop dulu."},{"d":"2025-11-03","t":"Konsumen tanpa riwayat alergi ikan/seafood muncul bintik gatal di tangan sampai lengan yang makin melebar (±5 hari) → alergi, stop DVN dan minum obat alergi."},{"d":"2026-07-28","t":"Bibir bengkak setelah minum DVN (foto dari hari H sampai setelah berhenti 3 hari), konsumen merasa tidak punya alergi → bentuk alergi, kemungkinan fish collagen; stop."}],"kw":["gatal","alergi","reaksi alergi","kemerahan","ruam","bentol","bintik merah","biduran","dermatitis alergi","detoks","bibir bengkak","alergi ikan"]},{"id":116,"q":"Bolehkah suplemen tablet yang biasa dikunyah/diisap diaduk dengan air dulu sebelum diminum, karena konsumen batuk saat mengisapnya?","a":"Boleh.\n- Boleh diaduk dengan air terlebih dahulu.\n- Semoga cara ini bisa mengurangi keluhan (batuk) yang muncul saat dikonsumsi dengan cara diisap.","p":["Umum"],"k":"cara minum & dosis","s":"boleh","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-07-27","n":1,"kasus":[{"d":"2026-07-27","t":"Produk tidak disebutkan di chat. Hari pertama tidak apa-apa, hari kedua saat diisap konsumen batuk dan batuknya makin parah → boleh diaduk dengan air."}],"kw":["batuk","diisap","dikunyah","dilarutkan","diaduk air","cara minum","tablet kunyah","tenggorokan"]},{"id":117,"q":"Bagaimana jika muncul jerawat (termasuk jerawat batu/besar) setelah minum DVN — apakah itu detoks, dan perlu dikurangi atau distop?","a":"Tergantung kapan dan bagaimana jerawatnya muncul:\n- Muncul di awal konsumsi (mis. 2–4 hari setelah mulai) → bisa jadi masih tahap detoksifikasi/reaksi adaptasi (mis. kulit yang terbiasa perawatan dokter jadi lebih sensitif terhadap kandungan yang berbeda dari biasanya).\n- Pada kondisi itu, bila konsumen terganggu: turunkan dosis dulu (mis. 1x sehari) dan pantau 1–2 minggu (saran 2024: tetap lanjut 2–3 minggu dengan dosis dikurangi sambil dilihat perubahannya); jika sudah nyaman, bisa kembali 2 tablet.\n- Sudah dikurangi jadi 1x sehari tetap muncul setiap kali minum (hilang saat berhenti, muncul lagi saat minum lagi) → kemungkinan alergi terhadap salah satu kandungan DVN; jika konsumen terganggu, sarankan tidak melanjutkan DVN.\n- Baru banyak muncul setelah ±3 bulan rutin (DVN + S-Glow) padahal pola makan & gaya hidup tidak berubah → cek dulu pemakaian make up, pergantian skincare, dan aktivitas di luar ruangan; bila semua aman, kemungkinan reaksi alergi yang muncul setelah beberapa kali pemakaian terhadap salah satu kandungan DVN.\n- Soal apakah banyak orang sensitif terhadap L-glutathione: penasihat belum punya data pendukung.","p":["DVN","S-Glow"],"k":"efek samping & keluhan","s":"tergantung","rd":false,"by":["Dr Rizky Nasution","Nutritionist Novrianti"],"d":"2026-07-27","n":4,"kasus":[{"d":"2024-06-25","t":"Konsumen 44 tahun, 2 hari setelah mulai minum timbul jerawat batu yang sakit; sudah dikurangi jadi 1 butir tapi belum mereda → lanjut 1x sehari selama 2–3 minggu."},{"d":"2025-07-02","t":"Jerawat muncul setelah 4 hari minum DVN sesuai dosis, pola makan terjaga → turunkan dosis, pantau 1–2 minggu."},{"d":"2026-04-21","t":"Konsumen DVN muncul jerawat besar; sudah turun ke 1x sehari tetap muncul; berhenti → jerawat berhenti, minum lagi → timbul lagi; tidak alergi ikan → kemungkinan alergi kandungan DVN, sebaiknya stop."},{"d":"2026-07-27","t":"Konsumen 27 th, minum DVN + S-Glow 3 bulan, jerawat banyak muncul di botol ke-3 (sebelumnya hanya 1–2) → cek make up/skincare/aktivitas luar; bila aman, kemungkinan alergi kandungan DVN."}],"kw":["jerawat","jerawat batu","jerawat besar","jerawatan","breakout","acne","purging","detoks","detoksifikasi","reaksi adaptasi","alergi","kurangi dosis"]},{"id":118,"q":"Apakah konsumen yang sedang promil mandiri dan minum asam folat serta probiotik boleh minum Novia?","a":"Boleh, dengan jarak waktu minum.\n- Beri jarak antara Novia dengan asam folat dan probiotik minimal 6 jam.","p":["Novia"],"k":"minum bersama obat/suplemen","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-07-25","n":1,"kasus":[{"d":"2026-07-25","t":"Konsumen haid tidak teratur, menikah 6 tahun belum punya anak, promil mandiri dengan asam folat & probiotik → boleh, jarak minimal 6 jam."}],"kw":["asam folat","folic acid","probiotik","promil","program hamil","haid tidak teratur","jeda minum","susah hamil"]},{"id":119,"q":"Apakah wajar wanita 58 tahun yang sudah 8 tahun tidak haid keluar flek seperti mau haid setelah minum 1 botol Novia, dan bolehkah lanjut?","a":"Boleh lanjut, asalkan tidak ada keluhan dan konsumen merasa nyaman.\n- Yang dikhawatirkan: pada konsumen yang sudah menjelang menopause/tidak haid lagi, munculnya flek dan semacamnya bisa membuat badan tidak nyaman.\n- Jadi tetap sesuaikan dengan keadaan tubuh konsumen.","p":["Novia"],"k":"haid, hormon & menopause","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-07-24","n":1,"kasus":[{"d":"2026-07-24","t":"Konsumen 58 th, berhenti haid sejak usia 50 (karena sakit HNP), setelah 1 botol Novia keluar flek → boleh lanjut jika tidak ada keluhan & nyaman."}],"kw":["flek","menopause","haid lagi","bercak darah","hnp","saraf kejepit","tidak haid","lansia"]},{"id":120,"q":"Apakah konsumen yang sedang minum obat jerawat Isotinon (isotretinoin) dari dokter boleh minum Novia bersamaan?","a":"Tidak disarankan diminum bersamaan.\n- Obat tersebut termasuk obat keras dan efeknya berbeda-beda pada tiap orang.\n- Novia baru boleh dikonsumsi setelah konsumen sudah tidak minum obat tersebut.","p":["Novia"],"k":"minum bersama obat/suplemen","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-07-24","n":1,"kasus":[{"d":"2026-07-24","t":"Konsumen minum Isotinon (isotretinoin 10 mg) untuk jerawat selama ±3 bulan sesuai anjuran dokter → jangan barengan Novia; boleh setelah obatnya selesai."}],"kw":["isotretinoin","isotinon","obat jerawat","jerawat","obat keras","acne","obat dokter"]},{"id":121,"q":"Apakah konsumen yang minum Zymuno boleh minum Novia juga?","a":"Boleh.\n- Beri jeda waktu minum antara keduanya, sekitar 2–3 jam.","p":["Novia"],"k":"minum bersama obat/suplemen","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-07-24","n":1,"kasus":[],"kw":["zymuno","madu herbal","suplemen imun","daya tahan tubuh","jeda minum","suplemen lain"]},{"id":122,"q":"Apakah DVN (atau S-Glow) aman untuk orang dengan gangguan/penurunan fungsi ginjal (kreatinin/ureum tinggi, protein dalam urine)?","a":"Tidak disarankan minum sembarangan — saran terbaru dokter: jangan; jika masih ingin, konsultasi langsung dengan dokter yang merawat.\n- Ureum 52 dan kreatinin 1,6 sudah termasuk penurunan fungsi ginjal ringan ke sedang; jangan konsumsi DVN maupun vitamin apa pun secara sembarangan.\n- Protein urine (+2) dengan eGFR 59 dan rutin minum obat (Ketosteril, Micardis, Jardiance) diperkirakan sudah mengarah ke gagal ginjal → jangan, supaya tidak memberatkan kerja organ ginjal.\n- DVN tidak menaikkan nilai kreatinin, tetapi bagi yang sudah terdiagnosis gagal ginjal, konsumsi suplemen apa pun akan membuat kerja ginjal menjadi berat.\n- Catatan: jawaban lama (2024-11-10, Dr Rizky Nasution; 2025-10-12, Nutritionist Novrianti — kasus ureum/kreatinin 1,3) sempat menyarankan boleh dengan dosis dikurangi jadi 1 butir/tablet per hari, karena penyerapan vitamin dan konsentrat perlu cukup air minum; ikuti yang terbaru.","p":["DVN","S-Glow"],"k":"kondisi medis & penyakit","s":"tidak","rd":true,"by":["Dr Rizky Nasution","Nutritionist Novrianti"],"d":"2026-07-24","n":4,"kasus":[{"d":"2024-11-10","t":"Konsumen punya sakit ginjal dan khawatir kreatinin naik → DVN tidak menaikkan kreatinin, tapi dosis dikurangi jadi 1 butir."},{"d":"2025-10-12","t":"Konsumen dengan ureum/kreatinin 1,3 khawatir efek ke ginjal → DVN cukup 1 tablet per hari."},{"d":"2026-05-26","t":"Konsumen dengan protein urine +2, eGFR 59, kreatinin masih baik, rutin Ketosteril, Micardis, Jardiance → jangan."},{"d":"2026-07-24","t":"Penurunan fungsi ginjal karena kurang minum (ureum 52, kreatinin 1,6), tanpa pengobatan dokter → jangan sembarangan; konsultasi ke dokter yang merawat."}],"kw":["ginjal","fungsi ginjal","penurunan fungsi ginjal","sakit ginjal","gagal ginjal","kreatinin","creatinine","ureum","protein urine","proteinuria","kebocoran protein","egfr"]},{"id":123,"q":"Bagaimana jika konsumen gatal-gatal (di kulit atau tenggorokan) setelah minum S-Glow, padahal merasa tidak punya riwayat alergi?","a":"Stop dulu S-Glow, lalu evaluasi; kemungkinan besar ada indikasi alergi terhadap salah satu kandungan S-Glow.\n- Hentikan konsumsi S-Glow dulu dan amati keluhannya.\n- Jika setelah berhenti keluhan hilang, kemungkinan besar alergi terhadap salah satu kandungan (ingredients) S-Glow → hentikan saja dan jangan konsumsi lagi.\n- Jika gatal kambuh lagi saat S-Glow dilanjutkan (mis. tenggorokan gatal hilang saat berhenti 3 hari, lalu gatal lagi saat diminum lagi), kemungkinan konsumen alergi terhadap yeast (ragi) atau kolagen ikannya.\n- Jika tubuh konsumen memang tidak bisa toleransi, jangan dipaksakan, khawatir keluhan muncul setiap kali minum S-Glow.","p":["S-Glow"],"k":"efek samping & keluhan","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-07-23","n":3,"kasus":[{"d":"2025-07-03","t":"Gatal setelah minum S-Glow, tanpa riwayat alergi dan tidak minum suplemen lain → dugaan alergi bahan, stop dulu."},{"d":"2026-05-07","t":"Konsumen S-Glow gatal-gatal di kulit setelah 4 hari, mengaku tidak punya alergi → stop & evaluasi."},{"d":"2026-07-23","t":"Tenggorokan gatal setelah minum S-Glow; stop 3 hari lalu lanjut, gatal lagi → kemungkinan alergi (yeast/kolagen ikan), jangan dipaksakan."}],"kw":["gatal","gatal-gatal","kulit gatal","tenggorokan gatal","alergi","ruam","biduran","efek samping","sglow","yeast","ragi","kolagen ikan"]},{"id":124,"q":"Apakah konsumen 27 tahun dengan haid/flek berkepanjangan lebih dari 1 bulan (menurut dokter karena hormon) boleh minum Novia, terutama bila masih flek dan sedang minum Cyclo-Progynova?","a":"Tergantung pengobatannya:\n- Pada dasarnya boleh dicoba, asalkan konsumen tidak sedang minum obat-obatan dari dokter.\n- Jika konsumen masih flek (coklat/merah) dan ternyata sedang minum obat dokter (dalam kasus ini Cyclo-Progynova, plus Dohixat untuk jerawat): tunggu selesai dulu, baru mulai Novia.","p":["Novia"],"k":"haid, hormon & menopause","s":"tergantung","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-07-22","n":1,"kasus":[{"d":"2026-07-22","t":"Konsumen 27 th, kulit kusam & haid berkepanjangan >1 bulan (flek coklat/pink, kadang seperti keputihan), sudah ke 3 dokter (kata dokter karena hormon) dan pap smear; masih flek & minum Cyclo-Progynova serta Dohixat → tunggu selesai dulu."}],"kw":["flek","haid berkepanjangan","haid tidak berhenti","cyclo progynova","obat hormon","dohixat","jerawat","hormon"]},{"id":125,"q":"Apakah konsumen usia 60 tahun yang sudah tidak memiliki hormon kortisol (diangkat 2 tahun lalu karena tumor) dan kini minum Fartison boleh minum Novia?","a":"Boleh dicoba, dengan catatan:\n- Tetap beri penjelasan ke konsumen bahwa di usia 60 tahun kondisi hormonal sudah tidak bisa maksimal.","p":["Novia"],"k":"kondisi medis & penyakit","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-07-19","n":2,"kasus":[{"d":"2026-07-18","t":"Usia 60 th, kortisol sudah tidak ada (diangkat 2 tahun lalu karena tumor), kini minum Fartison → boleh dicoba, jelaskan hasil hormonal tidak maksimal di usia ini."},{"d":"2026-07-19","t":"Konsumen 60 th, hormon kortisol sudah tidak ada (pengangkatan karena tumor 2 tahun lalu), rutin minum Fartison → boleh dicoba, dengan penjelasan bahwa hormonal di usia 60 sudah tidak maksimal."}],"kw":["kortisol","hormon kortisol","fartison","tumor","pengangkatan tumor","usia 60","lansia","obat hormon","hormon","obat rutin"]},{"id":126,"q":"Konsumen sudah 2 bulan minum Novia dan awalnya keputihan sembuh, tapi kini keputihan kambuh setiap hari, area kewanitaan sangat kering, dan keluar bercak darah saat berhubungan. Apa sarannya?","a":"Boleh tetap minum Novia, tetapi sambil berobat ke dokter.\n- Ada beberapa kasus keputihan yang harus dibantu dengan obat-obatan; dikhawatirkan ada penyebab lain munculnya keputihan lagi.\n- Kalau hanya dengan suplemen, tidak akan menyelesaikan semua penyebab keputihannya.\n- Sarannya: sambil minum Novia, konsultasi dan diskusi langsung dengan dokter.","p":["Novia"],"k":"efek samping & keluhan","s":"bersyarat","rd":true,"by":["Dr Rizky Nasution"],"d":"2026-07-18","n":1,"kasus":[{"d":"2026-07-18","t":"Usia hampir 50, sudah ada riwayat keputihan sebelum Novia; 2 bulan minum Novia (2 hari sekali) keputihan sempat hilang, lalu kambuh, kering, dan bercak darah saat berhubungan → boleh lanjut sambil konsultasi dokter."}],"kw":["keputihan","keputihan kambuh","keputihan berulang","vagina kering","miss v kering","bercak darah","sakit saat berhubungan","dokter kandungan"]},{"id":127,"q":"Kenapa muncul kemerahan/ruam merah, bentol, gatal-gatal, atau kulit sangat kering (di wajah, leher, sampai badan) setelah minum Novia — apakah alergi, dan apa yang harus dilakukan?","a":"Kemungkinan terbesar reaksi alergi terhadap salah satu kandungan Novia; stop Novia, jangan dipaksakan konsumsinya.\n- Bentol dan gatal adalah reaksi normal tubuh saat sedang alergi terhadap sesuatu yang masuk ke tubuh.\n- Alergi bisa karena faktor genetik maupun tidak, dan bisa saja tiba-tiba muncul saat sudah dewasa atau berusia lanjut.\n- Ada kondisi yang tidak bisa dijelaskan kenapa alergi baru muncul sekarang, tetapi biasanya karena pertambahan usia dan lingkungan.\n- Jika perlu pengobatan untuk alerginya, segera konsultasi langsung ke dokter.","p":["Novia"],"k":"efek samping & keluhan","s":"tidak","rd":true,"by":["Dr Rizky Nasution"],"d":"2026-07-18","n":3,"kasus":[{"d":"2026-02-10","t":"Muka lalu badan merah-merah dan gatal setelah 1 minggu, tetap ada sampai 2 minggu minum Novia; tidak minum obat lain → stop, curiga alergi."}],"kw":["alergi","reaksi alergi","gatal","gatal-gatal","bentol","biduran","kaligata","ruam","ruam merah","merah-merah","kemerahan","kulit kering"]},{"id":128,"q":"Apakah wanita pramenopause/menopause yang sedang terapi hormon Oestrogel/Estrogel (mis. karena sering hot flashes), sendiri atau bersama Utrogestan, boleh minum Novia?","a":"Tidak disarankan.\n- Bisa terjadi dosis ganda (double dose) dan berefek pada ketidakseimbangan hormon.\n- Jika dipakai bersama Utrogestan 100 mg: fungsinya akan tumpang tindih dan bisa mengacaukan dosis pemakaian Utrogestan.","p":["Novia"],"k":"minum bersama obat/suplemen","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-07-16","n":2,"kasus":[{"d":"2026-07-12","t":"Usia 48, pramenopause, 4 bulan memakai Utrogestan 100 mg dan Oestrogel → jangan."}],"kw":["estrogel","oestrogel","utrogestan","progesteron","terapi hormon","obat hormon","hrt","menopause","pramenopause","perimenopause","hot flashes","estrogen"]},{"id":129,"q":"Apakah konsumen yang rutin minum DHEA boleh minum Novia juga?","a":"Tidak disarankan (jangan dicampur).\n- DHEA juga termasuk obat hormonal; dikhawatirkan terjadi dosis ganda (double dose) di tubuh konsumen.","p":["Novia"],"k":"minum bersama obat/suplemen","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-07-15","n":1,"kasus":[],"kw":["dhea","dehydroepiandrosterone","suplemen hormon","obat hormonal","hormon","double dose","dosis ganda"]},{"id":130,"q":"Apakah konsumen yang sudah 2 kali operasi polip (di tuba falopi dan dekat rahim; terakhir Januari 2026), belum haid lagi, dan tidak minum obat boleh minum Novia?","a":"Boleh dicoba, dengan catatan:\n- Bantu evaluasi kondisinya setiap minggu.","p":["Novia"],"k":"pasca operasi & tindakan medis","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-07-14","n":1,"kasus":[{"d":"2026-07-14","t":"Riwayat 2x operasi polip (pertama di tuba falopi, terakhir dekat rahim pada Januari 2026), belum haid lagi, sudah tidak minum obat → boleh dicoba, evaluasi per minggu."}],"kw":["polip","polip rahim","operasi polip","tuba falopi","pasca operasi","belum haid","rahim","evaluasi mingguan"]},{"id":131,"q":"Apakah penderita PCOS yang sudah hampir sebulan keluar flek cukup banyak (belum haid deras) boleh minum Novia?","a":"Stop/jangan minum Novia dulu.\n- Dikhawatirkan memberatkan kondisinya, karena hormon konsumen sedang tidak stabil.","p":["Novia"],"k":"haid, hormon & menopause","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-07-09","n":1,"kasus":[{"d":"2026-07-09","t":"Usia 33, PCOS, Mei–Juni tidak haid deras, hanya flek cukup banyak hampir 1 bulan; belum minum Novia selama flek → stop dulu."}],"kw":["pcos","polikistik","flek","flek lama","spotting","haid tidak teratur","hormon tidak stabil","perdarahan"]},{"id":132,"q":"Apakah konsumen yang sedang berobat saraf (low back pain) dengan obat jam 9 pagi dan jam 9 malam boleh minum Novia?","a":"Boleh, dengan catatan:\n- Minum Novia setelah makan siang.","p":["Novia"],"k":"minum bersama obat/suplemen","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-07-09","n":1,"kasus":[],"kw":["low back pain","lbp","sakit pinggang","nyeri punggung","obat saraf","obat syaraf","jam minum","setelah makan siang"]},{"id":133,"q":"Apakah penderita gastritis (maag) boleh minum Novia, dan apakah Novia bisa menimbulkan reaksi pada lambungnya?","a":"Tergantung derajat keparahan gastritisnya:\n- Kalau sudah kronis → Novia bisa menimbulkan reaksi pada lambung.\n- Kalau belum kronis → seharusnya tidak, selama konsumen makan teratur 3x sehari dan keluhan jarang muncul.\n- Pasien gastritis yang sedang dalam masa perawatan/pengobatan boleh minum Novia, selama tetap minum obatnya secara teratur dan pola makannya juga teratur.","p":["Novia"],"k":"kondisi medis & penyakit","s":"tergantung","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-07-08","n":2,"kasus":[],"kw":["gastritis","maag","maag kronis","sakit maag","lambung","asam lambung","sakit lambung","perih lambung","obat lambung","pola makan","gerd"]},{"id":134,"q":"Konsumen gatal-gatal sampai luka setelah hampir menghabiskan 1 botol DVN (gatal baru muncul saat tersisa 1 butir). Apakah itu karena DVN?","a":"Sepertinya bukan dari DVN.\n- Pasti ada faktor lain yang menyebabkannya; ini lebih ke dermatitis.\n- Ada faktor dari dalam atau luar tubuh yang baru-baru ini memicu alerginya muncul.","p":["DVN"],"k":"efek samping & keluhan","s":"info","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-07-07","n":1,"kasus":[{"d":"2026-07-07","t":"Gatal hebat terutama malam hari, perih saat berkeringat, sampai luka; baru muncul saat DVN tersisa 1 butir dari 1 botol → bukan dari DVN, lebih ke dermatitis."}],"kw":["gatal","gatal-gatal","dermatitis","eksim","luka gatal","ruam","kulit perih","alergi"]},{"id":135,"q":"Apakah orang dengan riwayat Sindrom Stevens-Johnson (SJS) boleh minum DVN?","a":"Tergantung pemicu SJS-nya dan kondisinya sekarang — cari tahu dulu:\n- Pastikan dulu apakah konsumen punya pemicu (trigger) spesifik yang bisa membuat kondisinya kambuh; jika kandungan DVN tidak termasuk pemicu tersebut, DVN bisa dikonsumsi sesuai anjuran pakai.\n- Jika SJS terjadi karena alergi obat berat (sampai dilarang dokter untuk vaksin) → jangan konsumsi DVN; penyakit SJS sangat sensitif dan khas dengan alergi terhadap kandungan materi/obat tertentu (Dr Rizky, 2025-01).\n- Jika sudah sembuh lebih dari 1 tahun dan SJS dipicu dosis obat yang terlalu tinggi (bukan alergi) → boleh dicoba dulu beberapa hari, dan tetap dievaluasi efeknya ke konsumen (Dr Rizky, 2026-07).\n- Tetap waspada terhadap konsumsi apa pun, karena setelah terdiagnosa SJS batas daya tahan (resistensi) tubuh dikhawatirkan menurun.","p":["DVN"],"k":"kondisi medis & penyakit","s":"tergantung","rd":true,"by":["Dr Rizky Nasution","Nutritionist Novrianti"],"d":"2026-07-07","n":3,"kasus":[{"d":"2025-01-07","t":"Konsumen punya riwayat alergi obat berat (Stevens-Johnson), bahkan dilarang dokter untuk vaksin → jangan konsumsi DVN."},{"d":"2026-07-07","t":"Sembuh dari SJS lebih dari 1 tahun lalu; SJS dipicu dosis allopurinol yang terlalu tinggi akibat salah diagnosis; calon peserta program 'pejuang glow up' → boleh dicoba beberapa hari sambil dievaluasi."}],"kw":["stevens johnson","steven johnson","sjs","sindrom stevens-johnson","steven johnson syndrome","alergi obat","alergi berat","riwayat alergi","allopurinol","kulit melepuh","vaksin","kambuh"]},{"id":136,"q":"Apakah S-Glow boleh diminum anak usia 9 tahun yang mengalami kerontokan rambut?","a":"Tidak disarankan; S-Glow boleh dikonsumsi di atas usia 20 tahun.\n- Sebaiknya konsultasi dulu ke dokter soal penyebab rontoknya, karena bisa karena stres, cat rambut, dan semacamnya.\n- S-Glow lebih mendukung kerontokan akibat produksi kolagen tubuh yang mulai menurun, sedangkan di usia 9 tahun produksi kolagen masih bagus.\n- Saat ditanya soal kemasan yang menulis 13 tahun ke atas, dokter tidak menjawab langsung dan menyarankan cek penyebab rontok ke dokter dulu.","p":["S-Glow"],"k":"usia & kelompok khusus","s":"tidak","rd":true,"by":["Dr Rizky Nasution"],"d":"2026-07-04","n":1,"kasus":[],"kw":["anak","anak-anak","usia 9 tahun","batas usia","13 tahun","20 tahun","rambut rontok","kerontokan","kolagen"]},{"id":137,"q":"Apakah konsumen yang baru (seminggu lalu) operasi pengangkatan kista dermoid boleh minum Novia?","a":"Boleh, setelah lewat satu siklus haid berikutnya.\n- Tujuannya memastikan siklus haidnya benar-benar masih normal dan tanpa keluhan.","p":["Novia"],"k":"pasca operasi & tindakan medis","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-07-02","n":1,"kasus":[{"d":"2026-07-02","t":"Usia 31, haid masih ada tapi tidak teratur; seminggu lalu angkat kista dermoid, antibiotik sudah selesai, antinyeri bila perlu → mulai Novia setelah lewat siklus haid berikutnya."}],"kw":["kista dermoid","operasi kista","angkat kista","pasca operasi","siklus haid","haid tidak teratur","kista"]},{"id":138,"q":"Apakah Novia boleh diminum usia 21 tahun yang setiap haid sakit perut sampai demam?","a":"Boleh untuk usia 21 tahun, dengan catatan:\n- Novia bukan obat.\n- Haid sakit sampai demam menandakan ada gejala penyakit lain yang harus diperiksakan ke dokter.","p":["Novia"],"k":"usia & kelompok khusus","s":"bersyarat","rd":true,"by":["Dr Rizky Nasution"],"d":"2026-07-02","n":1,"kasus":[],"kw":["usia 21","remaja","anak muda","batas usia","nyeri haid","sakit perut haid","demam saat haid","dismenore"]},{"id":139,"q":"Haid konsumen jadi berulang dan tidak berhenti-berhenti setelah sebulan minum Novia. Apakah ini efek Novia dan apa yang harus dilakukan?","a":"Stop Novia dulu.\n- Evaluasi selama 1 minggu: apakah keluhan masih sama atau hilang.\n- Pada kasus ini konsumen juga terdiagnosa PCO, sehingga disarankan tidak minum Novia.","p":["Novia"],"k":"efek samping & keluhan","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-06-30","n":1,"kasus":[{"d":"2026-06-30","t":"Usia 34, PCO; haid tgl 3 (darah gelap), berhenti, keluar lagi tgl 6, lalu tgl 20–25 banyak dan belum berhenti → stop Novia, evaluasi 1 minggu."}],"kw":["haid lama","haid tidak berhenti","haid berulang","perdarahan","darah hitam","menstruasi panjang","efek samping","pco"]},{"id":140,"q":"Apakah konsumen yang terdiagnosa PCO (bukan PCOS) dari hasil USG boleh tetap minum Novia?","a":"Tidak disarankan.\n- Kalau memang terdiagnosa PCO, sebaiknya jangan konsumsi Novia.","p":["Novia"],"k":"kondisi medis & penyakit","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-06-30","n":1,"kasus":[{"d":"2026-06-30","t":"Usia 34, sudah sebulan minum Novia, terdiagnosa PCO dari USG → jangan."}],"kw":["pco","pcos","polikistik","ovarium polikistik","usg","kista kecil","haid tidak teratur"]},{"id":141,"q":"Apakah konsumen yang saat ini punya kista atau benjolan di ovarium boleh minum Novia?","a":"Tidak disarankan.\n- Kalau sedang menderita kista (kista masih ada), jangan konsumsi Novia — termasuk yang pernah operasi kista ovarium dan kini ada kista lagi.\n- Jika benjolan di ovarium terjadi akibat pengaruh hormon (kata dokter), berarti hormon konsumen sedang tidak normal; disarankan minum obat hormonal dari dokter.","p":["Novia"],"k":"kondisi medis & penyakit","s":"tidak","rd":true,"by":["Dr Rizky Nasution"],"d":"2026-06-30","n":2,"kasus":[{"d":"2026-05-23","t":"Konsumen dengan kista 2,30 cm saat ini, riwayat operasi kista ovarium tahun 2023 → jangan."}],"kw":["kista","kista ovarium","kista indung telur","benjolan ovarium","ovarium","indung telur","operasi kista","riwayat operasi kista","cyst","kista 2 cm","gangguan hormon","hormon tidak normal"]},{"id":142,"q":"Konsumen 1,5 bulan minum S-Glow lalu muncul bercak cokelat di kulit kepala (rambut ikut tercabut saat dibersihkan). Apa yang harus dilakukan?","a":"Segera stop S-Glow.\n- Dikhawatirkan ini reaksi alergi yang muncul setelah konsumsi S-Glow, walaupun sebelumnya konsumen tidak punya alergi.","p":["S-Glow"],"k":"efek samping & keluhan","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-06-29","n":1,"kasus":[{"d":"2026-06-29","t":"Konsumen 37 th, bercak cokelat di kepala muncul sejak minggu ke-3, muncul lagi setelah dibersihkan, tidak alergi ikan → stop."}],"kw":["bercak cokelat","bercak di kepala","kulit kepala","rambut tercabut","rambut rontok","alergi","reaksi alergi","efek samping"]},{"id":143,"q":"Apakah penderita sirosis hati yang rutin minum obat propranolol boleh minum Erojan?","a":"Tidak (jangan).\n- Kontraindikasi dengan kondisi penyakit pasien dan reaksi obatnya.\n- Fokus ke obat utama dulu.\n- Catatan: jawaban lama (2025-04-30, Nutritionist Novrianti) sempat menyarankan boleh asal diminum beda waktu makan dengan obatnya (dengan alasan ada literatur bahwa Cuscuta chinensis di Erojan memiliki antioksidan khusus untuk menjaga kesehatan hati); ikuti yang terbaru.","p":["Erojan"],"k":"kondisi medis & penyakit","s":"tidak","rd":false,"by":["Dr Rizky Nasution","Nutritionist Novrianti"],"d":"2026-06-29","n":2,"kasus":[{"d":"2025-04-30","t":"Konsumen pria sirosis hati, obat rutin propranolol → saat itu disarankan beda waktu makan dengan obat (jawaban lama)."}],"kw":["sirosis","sirosis hati","liver","lever","hati","penyakit hati","propranolol","kontraindikasi","cuscuta"]},{"id":144,"q":"Apakah konsumen dengan haid tidak lancar yang kata dokter rahimnya agak mengeras (disarankan pap smear) boleh minum Novia?","a":"Tidak disarankan.\n- Tubuh konsumen sedang mengalami ketidakseimbangan hormon dan agak sensitif.\n- Ikuti saran dokter yang merawat saja.","p":["Novia"],"k":"haid, hormon & menopause","s":"tidak","rd":true,"by":["Dr Rizky Nasution"],"d":"2026-06-28","n":1,"kasus":[{"d":"2026-06-28","t":"Haid tidak lancar, rahim dikatakan agak mengeras dan disarankan pap smear, saat ini minum probiotik dan Natur-E → jangan, ikuti dokter."}],"kw":["haid tidak lancar","haid tidak teratur","rahim mengeras","pap smear","probiotik","natur e","hormon tidak seimbang","rahim"]},{"id":145,"q":"Untuk konsumen menopause pascaoperasi angkat rahim dan ovarium yang minum obat hormon Livial dan sering sakit badan serta sendi, bolehkah disarankan BLZ Pro saja?","a":"Tidak disarankan juga.\n- Dokter tidak menyarankan BLZ Pro untuk konsumen dengan kondisi ini.","p":["BLZ Pro"],"k":"minum bersama obat/suplemen","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-06-26","n":1,"kasus":[{"d":"2026-06-26","t":"Angkat rahim & ovarium, menopause, minum Livial, keluhan badan dan sendi sering sakit → BLZ Pro juga tidak disarankan."}],"kw":["blz","blz pro","sakit sendi","nyeri sendi","sakit badan","livial","terapi hormon","menopause"]},{"id":146,"q":"Apakah konsumen yang menopause karena operasi angkat rahim dan ovarium serta sedang minum obat hormon Livial boleh minum Novia?","a":"Tidak disarankan.\n- Berisiko memicu kelebihan efek estrogen di dalam tubuh, dan itu berbahaya.","p":["Novia"],"k":"minum bersama obat/suplemen","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-06-26","n":1,"kasus":[{"d":"2026-06-26","t":"Operasi angkat rahim & ovarium 1,5 tahun lalu, menopause, minum Livial → jangan (risiko kelebihan efek estrogen)."}],"kw":["livial","tibolone","terapi hormon","obat hormon","menopause","angkat rahim","angkat ovarium","estrogen","histerektomi"]},{"id":147,"q":"Konsumen 3 hari minum EVN lalu matanya sakit, bengkak, merah, dan belekan setiap bangun tidur. Apakah ini detoks mata?","a":"Bukan detoks mata; kemungkinan reaksi alergi.\n- Coba stop konsumsi EVN.\n- Jika keluhan hilang setelah stop, kemungkinan konsumen alergi terhadap salah satu kandungan EVN.","p":["EVN"],"k":"efek samping & keluhan","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-06-24","n":1,"kasus":[{"d":"2026-06-24","t":"Konsumen 30 th, 3 hari minum EVN muncul mata sakit, bengkak, merah, belekan → stop, kemungkinan alergi."}],"kw":["mata bengkak","mata merah","sakit mata","belekan","detoks","detox mata","alergi","efek samping"]},{"id":148,"q":"Apakah penderita sakit lambung/maag (termasuk maag kronis yang sering kambuh) boleh minum DVN, dan bagaimana cara minumnya?","a":"Boleh, dengan aturan minum:\n- DVN harus diminum setelah makan (bersamaan dengan makanan).\n- Alasannya: DVN mengandung vitamin C yang mungkin membuat lambung sensitif pada orang dengan riwayat sakit lambung.\n- Bila ada keluhan, minum bersamaan dengan obat maag.\n- Kondisi lambung memang tidak akan bisa sembuh seutuhnya, apalagi bila ada riwayat sakit yang cukup berat sebelumnya.","p":["DVN"],"k":"kondisi medis & penyakit","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution","Nutritionist Novrianti"],"d":"2026-06-24","n":2,"kasus":[{"d":"2025-08-26","t":"Riwayat lambung + fatty liver → DVN diminum bersama makanan (jawaban penasihat fokus ke riwayat lambung)."},{"d":"2026-06-24","t":"Konsumen cocok dengan DVN (flek memudar), punya maag kambuhan sejak ±5 tahun lalu, riwayat jantung bengkak & hipertensi (minum obat rutin, tidak dalam pengawasan dokter) → DVN setelah makan, bersama obat maag bila ada keluhan."}],"kw":["lambung","maag","maag kronis","gastritis","gerd","asam lambung","fatty liver","perlemakan hati","vitamin c","setelah makan","bersama makan","obat maag"]},{"id":149,"q":"Apakah orang yang pernah operasi angkat ginjal (tinggal satu ginjal yang berfungsi) boleh minum S-Glow?","a":"Boleh, dengan catatan:\n- Selama saat ini tidak ada keluhan dan kondisi ginjal tidak memberat, tidak ada masalah.\n- Tetap minum S-Glow sesuai dosisnya.","p":["S-Glow"],"k":"pasca operasi & tindakan medis","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-06-24","n":1,"kasus":[],"kw":["satu ginjal","ginjal tunggal","angkat ginjal","operasi ginjal","nefrektomi","ginjal","fungsi ginjal"]},{"id":150,"q":"Apakah konsumen yang masih rutin minum obat tiroid (termasuk pasca operasi angkat tiroid yang harus minum Euthyrox seumur hidup) boleh minum DVN atau Novia?","a":"Tidak disarankan (jangan dulu) selama masih minum obat tiroid.\n- Karena masih minum obat tiroid, supaya tidak berefek ke mana-mana.\n- Tiroid agak sensitif terhadap bahan obat maupun suplemen.\n- Saran terbaru ini (2026-06-24, Dr Rizky Nasution) diberikan untuk Novia dan DVN pada konsumen yang sudah operasi angkat tiroid 2 tahun lalu dan harus minum Euthyrox seumur hidup.\n- Catatan: jawaban lama (2024-04-19, Nutritionist Novrianti) sempat menyatakan DVN bisa diminum bersama obat tiroid rutin (1 tablet 5 mg tiap malam) jika dalam masa tenang/maintenance, yaitu dosis obat sudah stabil dan tidak berubah atau obat tidak lagi untuk mengobati gejala; ikuti yang terbaru.","p":["DVN","Novia"],"k":"minum bersama obat/suplemen","s":"tidak","rd":false,"by":["Dr Rizky Nasution","Nutritionist Novrianti"],"d":"2026-06-24","n":2,"kasus":[{"d":"2024-04-19","t":"Konsumen rutin minum obat tiroid 1 tablet (5 mg) tiap malam dan sudah membeli DVN → (saran lama) boleh jika dalam fase maintenance."},{"d":"2026-06-24","t":"Operasi angkat tiroid 2 tahun lalu, harus minum Euthyrox seumur hidup → jangan."}],"kw":["tiroid","thyroid","obat tiroid","euthyrox","levothyroxine","operasi tiroid","angkat tiroid","tiroidektomi","hipertiroid","hormon tiroid","gondok","maintenance"]},{"id":151,"q":"Apakah Novia boleh diminum bersamaan dengan suplemen herbal lain (mis. Trilogy berisi vitamin herbal, omega-3, dan probiotik, serta kapsul moringa/kelor)?","a":"Boleh, dengan catatan:\n- Beri jarak: satu diminum pagi, satunya lagi malam.\n- Minum keduanya setelah makan.\n- Evaluasi dan monitor gejala alergi seperti gatal setelah mengonsumsi keduanya.","p":["Novia"],"k":"minum bersama obat/suplemen","s":"bersyarat","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-06-24","n":1,"kasus":[{"d":"2026-06-24","t":"Konsumen juga minum suplemen herbal Trilogy (vitamin-mineral dari ekstrak tanaman, omega-3 minyak ikan teri, probiotik 12 galur) dan kapsul moringa → pisah pagi/malam, setelah makan, pantau alergi."}],"kw":["suplemen herbal","herbal","trilogy","moringa","kelor","multivitamin","omega 3","probiotik","minum bersamaan"]},{"id":152,"q":"Apakah Novia bisa menyebabkan diare?","a":"Sepertinya diare bukan karena Novia.\n- Bisa karena makanan/minuman sehari-hari atau suplemen lain yang dikonsumsi.","p":["Novia"],"k":"efek samping & keluhan","s":"info","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-06-24","n":1,"kasus":[{"d":"2026-06-24","t":"Konsumen diare sejak awal minum Novia (5 hari); Novia diminum siang setelah makan, malamnya minum Irvell."}],"kw":["diare","mencret","bab cair","sakit perut","pencernaan","efek samping","irvell"]},{"id":153,"q":"Apakah DVN bisa menyebabkan kaki bengkak serta perut terasa penuh dan sesak?","a":"Seharusnya tidak.\n- Pada kasus ini, gejalanya sesuai dengan sakit lambung yang sudah mengarah kronis dan kondisi jantung yang pernah bengkak, sehingga kaki juga bengkak.\n- Jika keluhan memberat saat minum DVN → harus distop.\n- Dikhawatirkan kondisi jantung dan lambungnya saat ini sudah tidak bisa menoleransi suplemen maupun vitamin.","p":["DVN"],"k":"efek samping & keluhan","s":"tergantung","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-06-24","n":1,"kasus":[{"d":"2026-06-24","t":"Konsumen dengan maag kronis dan riwayat jantung bengkak mengeluh perut penuh, sesak, dan kaki bengkak → bukan efek DVN; stop bila memberat saat minum DVN."}],"kw":["kaki bengkak","bengkak","perut penuh","begah","sesak","jantung bengkak","maag","lambung","efek samping"]},{"id":154,"q":"Apakah pasien transplantasi ginjal yang setiap hari minum obat rutin boleh minum Novia?","a":"Tidak disarankan.\n- Dokter tidak menyarankan Novia untuk kasus transplantasi ginjal dengan obat rutin harian.","p":["Novia"],"k":"pasca operasi & tindakan medis","s":"tidak","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-06-23","n":1,"kasus":[],"kw":["transplantasi ginjal","transplan ginjal","cangkok ginjal","ginjal","penyakit ginjal","obat rutin"]},{"id":155,"q":"Apakah konsumen yang sedang minum pil KB (mis. Diane) boleh minum Novia, dan KB apa yang cocok bila ingin minum Novia?","a":"Jangan dulu (tidak disarankan) selama masih minum pil KB.\n- Diminum satu per satu saja; dahulukan yang memang diperlukan.\n- Berlaku juga untuk pil KB Diane yang diminum setiap malam.\n- Kalau ingin minum Novia, KB yang disarankan adalah KB IUD.\n- Catatan: jawaban lama (2025-06-30, Nutritionist Novrianti; 2026-02-09, Dr Rizky Nasution) sempat menyarankan boleh asal waktu minumnya dibedakan (mis. satu pagi, satu sore) dan Novia dihentikan bila timbul gejala tidak nyaman; ikuti yang terbaru.","p":["Novia"],"k":"minum bersama obat/suplemen","s":"tidak","rd":false,"by":["Dr Rizky Nasution","Nutritionist Novrianti"],"d":"2026-06-23","n":5,"kasus":[],"kw":["pil kb","kb","kontrasepsi","pil kontrasepsi","keluarga berencana","diane","kb pil","kb hormonal","birth control","iud","spiral","kb yang cocok"]},{"id":156,"q":"Konsumen sudah 2 tahun menopause lalu keluar flek darah setelah minum Novia. Apakah ini normal atau perlu ke dokter?","a":"Normal bila hanya bercak/flek; itu salah satu efek Novia.\n- Novia membantu meregulasi kesehatan organ kewanitaan dan hormonnya.\n- Jika darah yang keluar deras seperti haid dan tidak berhenti-berhenti → stop Novia.","p":["Novia"],"k":"efek samping & keluhan","s":"tergantung","rd":false,"by":["Dr Rizky Nasution"],"d":"2026-06-22","n":1,"kasus":[{"d":"2026-06-22","t":"Sudah 2 tahun menopause, minum Novia ±1 minggu, keluar flek merah sedikit → aman bila hanya bercak."}],"kw":["menopause","flek","bercak darah","haid lagi","menstruasi lagi","perdarahan","pascamenopause","darah keluar"]},{"id":157,"q":"Apakah konsumen dengan riwayat benjolan/tumor jinak payudara (mis. FAM) yang sudah dioperasi atau diterapi dan dinyatakan sembuh boleh minum Novia?","a":"Boleh, selama benjolan/tumornya sudah diterapi dan dinyatakan selesai/sembuh.\n- Syaratnya tidak ada keluhan terkait tumor lagi; nyeri sesekali di area bekas operasi tet
