*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:18px 16px 60px}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:14px}
h1{font-size:21px;line-height:1.25;margin:0 0 4px}
.sub{font-size:13px;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#22a861;margin-right:6px;vertical-align:1px}
.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:6px 11px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.lead{font-size:13px;font-weight:600;margin:4px 0 6px}
.src{font-size:12px;color:var(--muted);margin:0 0 12px}
.searchbox{position:relative;margin-bottom:12px}
.searchrow{display:flex;gap:8px}
.inputwrap{position:relative;flex:1;min-width:0}
#q{width:100%;font:inherit;font-size:16px;padding:12px 38px 12px 40px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);outline:none;box-shadow:var(--shadow)}
#q:focus{border-color:var(--accent)}
#q::placeholder{color:var(--faint)}
#q::-webkit-search-cancel-button,#q::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none}
.ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--faint);pointer-events:none}
#clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--faint);font-size:20px;line-height:1;padding:4px 6px;cursor:pointer;display:none}
#clr.on{display:block}
#go{border-radius:12px;padding:0 16px;font-weight:600;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:20;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(16,24,40,.14);overflow:hidden;display:none}
.sugg.on{display:block}
.sugg .hd{font-size:11.5px;color:var(--muted);padding:8px 12px 4px;text-transform:uppercase;letter-spacing:.04em}
.sugg .opt{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--text);font:inherit;font-size:14px;padding:9px 12px;cursor:pointer;border-top:1px solid var(--soft)}
.sugg .opt:first-of-type{border-top:0}
.sugg .opt.act,.sugg .opt:hover{background:var(--accent-soft)}
.sugg .opt small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.sugg .more{font-size:12.5px;color:var(--accent);padding:8px 12px;border-top:1px solid var(--line);cursor:pointer;background:transparent;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;font-family:inherit}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin:-2px 0 12px;font-size:12.5px;color:var(--muted);align-items:center}
.quick button{font:inherit;font-size:12.5px;border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:3px 10px;cursor:pointer}
.quick button:hover{color:var(--accent);border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:5px 12px;cursor:pointer}
.chip .n{color:var(--faint);margin-left:4px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.on .n{color:inherit;opacity:.8}
.chip:disabled{opacity:.45;cursor:default}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
select{flex:1 1 150px;font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:7px 10px;max-width:100%}
.status{font-size:12.5px;color:var(--muted);margin:2px 0 12px}
.status b{color:var(--text)}
.fix{font-size:12.5px;color:var(--info);margin:-6px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow);scroll-margin-top:12px}

.a{white-space:pre-line;margin:0 0 10px;font-size:14.5px}
.a .note{font-size:12.5px;color:var(--muted);margin-top:6px}
.a .warn{font-size:13px;background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:6px 9px;margin-top:6px}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.tag{background:var(--soft);color:var(--text);border-radius:6px;padding:2px 8px;font-weight:600;font-size:12px}
.badge{border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600}
.st-ok{background:var(--ok-bg);color:var(--ok)} .st-warn{background:var(--warn-bg);color:var(--warn)}

.rd{background:var(--doc-bg);color:var(--doc)} .cnt,.old{background:var(--soft);color:var(--muted);font-weight:500}
.who{color:var(--text);font-weight:600}
.sp{flex:1}
.copy{font:inherit;font-size:12px;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:6px;padding:2px 9px;cursor:pointer}

details.relbox summary{cursor:pointer;color:var(--accent);list-style:none;display:inline-block}
details.relbox summary::-webkit-details-marker{display:none}
details.relbox summary::before{content:'▸ ';}

.rel{font-size:11.5px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 7px}
mark{background:var(--mark);color:var(--mark-ink);border-radius:3px;padding:0 1px}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:22px 18px;text-align:center;color:var(--muted)}
.empty b{color:var(--text)}
#more{display:block;margin:6px auto 0}
footer{margin-top:26px;font-size:12px;color:var(--faint);text-align:center}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);font-size:13px;padding:8px 14px;border-radius:999px;opacity:0;transition:.2s;pointer-events:none;z-index:50}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  .quick{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  .quick::-webkit-scrollbar{display:none}
  .quick button,.quick span{flex:none}
  .filters select{flex:1 1 45%}
  .filters select#cat{flex-basis:100%}
}
</style>

/* ================= Analisis teks ================= */
const SYN1 = new Map();          // kata -> kanonik
const PHRASES = new Map();       // kata pertama -> [{toks,canon}]
const PROTECT = new Set(PROTECT_EXTRA);
function normText(s){
  s = String(s||'').toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g,'');
  s = s.replace(/\bhati[\s-]*(?:hati|2)\b/g,' ');
  s = s.replace(/\bd\s*[.\s]\s*v\s*[.\s]\s*n\b\.?/g,' dvn ');
  s = s.replace(/\bs\s*[-.]?\s*glow\b/g,' sglow ');
  s = s.replace(/\bco+f+i+y*\b/g,' coffiyy ').replace(/\bcof+y\b/g,' coffiyy ');
  s = s.replace(/\bblz\s*-?\s*pro\b/g,' blz ');
  s = s.replace(/\bfemoire\b/g,' novia ');
  s = s.replace(/\bmiss\s*-?\s*v\b/g,' missv ');
  s = s.replace(/\bomega\s*-?\s*3\b/g,' omega3 ');
  s = s.replace(/\bdeg[\s-]*deg(an)?\b/g,' berdebar ');
  s = s.replace(/\b([a-z]{3,})-\1(an|nya|lah)?\b/g,'$1');
  s = s.replace(/\b([a-z]{3,}) \1\b/g,'$1');
  s = s.replace(/\b([a-z]{3,})2(an|nya|lah)?\b/g,'$1');
  s = s.replace(/([a-z])\1{2,}/g,'$1');
  return s;
}
function toks(s){
  const out=[];
  for (let t of normText(s).split(/[^a-z0-9]+/)){
    if (!t) continue;
    t = SLANG[t]||t;
    if (t.length<2 && !/\d/.test(t)) continue;
    out.push(t);
  }
  return out;
}
const PREFIXES = ['meng','meny','mem','men','me','peng','peny','pem','pen','per','pe','ber','be','ter','te','di','ke','se'];
function stem(w){
  if (w.length<5 || PROTECT.has(w) || /\d/.test(w)) return w;
  let s=w;
  for (const x of ['lah','kah','pun']) if (s.endsWith(x) && s.length-x.length>=4){ s=s.slice(0,-x.length); break; }
  for (const x of ['nya','ku','mu']) if (s.endsWith(x) && s.length-x.length>=4){ s=s.slice(0,-x.length); break; }
  if (PROTECT.has(s)) return s;
  for (const x of ['kan','an','i']) if (s.endsWith(x) && s.length-x.length>=4){ s=s.slice(0,-x.length); break; }
  if (PROTECT.has(s)) return s;
  for (let r=0;r<2;r++){
    let hit=false;
    for (const p of PREFIXES){
      if (s.startsWith(p) && s.length-p.length>=4){
        let rest=s.slice(p.length);
        if ((p==='meny'||p==='peny') && /^[aiueo]/.test(rest)) rest='s'+rest;
        s=rest; hit=true; break;
      }
    }
    if (!hit || PROTECT.has(s)) break;
  }
  return s;
}
(function buildSyn(){
  for (const line of SYN_SRC.split('\n')){
    const m=line.match(/^\s*([a-z0-9]+)\s*:\s*(.+)$/); if(!m) continue;
    const canon=m[1];
    PROTECT.add(canon); SYN1.set(canon,canon);
    for (const v of m[2].split(',')){
      const tk=toks(v); if(!tk.length) continue;
      if (tk.length===1){ PROTECT.add(tk[0]); if(!SYN1.has(tk[0])) SYN1.set(tk[0],canon); }
      else { const a=PHRASES.get(tk[0])||[]; a.push({toks:tk,canon}); PHRASES.set(tk[0],a); }
    }
  }
  for (const a of PHRASES.values()) a.sort((x,y)=>y.toks.length-x.toks.length);
  for (const t of Object.values(PROD_TERM)) PROTECT.add(t);
})();
function synOf(t){ return SYN1.get(t) || SYN1.get(stem(t)) || null; }
function findPhrases(tk){
  const hits=[];
  for (let i=0;i<tk.length;i++){
    const cand=PHRASES.get(tk[i]); if(!cand) continue;
    for (const ph of cand){
      const L=ph.toks.length; if(i+L>tk.length) continue;
      let ok=true; for(let j=1;j<L;j++) if(tk[i+j]!==ph.toks[j]){ok=false;break;}
      if(ok){ hits.push({i,L,canon:ph.canon}); break; }
    }
  }
  return hits;
}
// istilah indeks untuk sebuah teks
function terms(text){
  const tk=toks(text), out=[];
  for (const h of findPhrases(tk)) out.push(h.canon);
  for (const t of tk){
    if (STOP.has(t)) continue;
    const st=stem(t); out.push(st);
    const c=synOf(t); if (c && c!==st) out.push(c);
  }
  return out;
}

/* ================= Indeks BM25 ================= */
const FIELDS = [['q',3],['kw',2],['p',2.5],['a',1],['ks',.8],['k',.5]];
const DF = new Map(); let AVGDL=1; const DOCS=[];
const PROD_COUNT = {};
(function buildIndex(){
  let tot=0, minD=Infinity, maxD=-Infinity;
  QA.forEach((e,i)=>{
    const f={q:e.q, kw:(e.kw||[]).join(' , '), p:(e.p||[]).map(p=>PROD_TERM[p]||p).join(' '), a:e.a, ks:(e.kasus||[]).map(x=>x.t).join(' . '), k:e.k||''};
    const tf=new Map(); let len=0;
    for (const [name,w] of FIELDS){
      const ts=terms(f[name]); len+=w*ts.length;
      for (const t of ts) tf.set(t,(tf.get(t)||0)+w);
    }
    for (const t of tf.keys()) DF.set(t,(DF.get(t)||0)+1);
    const dt=Date.parse(e.d)||0; minD=Math.min(minD,dt); maxD=Math.max(maxD,dt);
    DOCS.push({e,i,tf,len,dt}); tot+=len;
    for (const p of (e.p||[])) PROD_COUNT[p]=(PROD_COUNT[p]||0)+1;
  });
  AVGDL = tot/Math.max(1,DOCS.length);
  for (const d of DOCS) d.rec = maxD>minD ? (d.dt-minD)/(maxD-minD) : 0;
})();
const N = DOCS.length, K1=1.2, B=0.5;
function idf(t){ const df=DF.get(t)||0; return Math.log(1+(N-df+.5)/(df+.5)); }
const VOCAB = [...DF.keys()];

function lev(a,b,max){
  if (Math.abs(a.length-b.length)>max) return max+1;
  let prev=new Array(b.length+1); for(let j=0;j<=b.length;j++) prev[j]=j;
  for (let i=1;i<=a.length;i++){
    const cur=[i]; let rowMin=i;
    for (let j=1;j<=b.length;j++){
      let v=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
      if (i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1]) v=Math.min(v,(prev[j-2]??v)+1);
      cur[j]=v; if(v<rowMin) rowMin=v;
    }
    if (rowMin>max) return max+1;
    prev=cur;
  }
  return prev[b.length];
}
function fuzzy(t){
  if (t.length<4) return [];
  const max = t.length>=7?2:1, res=[];
  for (const w of VOCAB){
    if (w.length<3 || w[0]!==t[0] && max<2) continue;
    const d=lev(t,w,max); if (d<=max) res.push([w,d,DF.get(w)]);
  }
  res.sort((x,y)=>x[1]-y[1]||y[2]-x[2]);
  return res.slice(0,3);
}
function prefixes(t){
  const res=[];
  for (const w of VOCAB) if (w.length>t.length && w.startsWith(t)) res.push([w,DF.get(w)]);
  res.sort((x,y)=>y[1]-x[1]);
  return res.slice(0,6).map(x=>x[0]);
}
function analyzeQuery(q){
  const typing = !/\s$/.test(q);
  const tk = toks(q);
  const used = new Array(tk.length).fill(false);
  const concepts=[], fixes=[];
  for (const h of findPhrases(tk)){
    if (used.slice(h.i,h.i+h.L).some(Boolean)) continue;
    for (let j=h.i;j<h.i+h.L;j++) used[j]=true;
    concepts.push({label:tk.slice(h.i,h.i+h.L).join(' '), alts:new Map([[h.canon,1]])});
  }
  tk.forEach((t,i)=>{
    if (used[i] || STOP.has(t)) return;
    const st=stem(t), c=synOf(t), alts=new Map();
    if (c) alts.set(c,1);
    if (DF.has(st)) alts.set(st,1); else if (DF.has(t)) alts.set(t,1);
    const last = i===tk.length-1;
    if (last && typing && t.length>=3) for (const w of prefixes(t)) if(!alts.has(w)) alts.set(w,.8);
    if (!alts.size){
      const fz=fuzzy(st); const fz2=fz.length?fz:fuzzy(t);
      for (const [w,d] of fz2){ alts.set(w, d===1?.75:.6); }
      if (fz2.length) fixes.push([t,fz2[0][0]]);
    }
    if (alts.size && !concepts.some(c=>c.label===t)) concepts.push({label:t, alts});
  });
  const prods=new Set();
  for (const c of concepts) for (const k of c.alts.keys()) if (Object.values(PROD_TERM).includes(k) && k!=='umum') prods.add(k);
  return {concepts, fixes, prods};
}
function search(q){
  const A=analyzeQuery(q);
  if (!A.concepts.length) return {A, hits:[]};
  const PT=new Set(Object.values(PROD_TERM));
  const isProd=c=>[...c.alts.keys()].every(k=>PT.has(k));
  let hits=[], anyTopic=false;
  for (const d of DOCS){
    let sc=0, m=0, topic=false;
    for (const c of A.concepts){
      let best=0;
      for (const [t,w] of c.alts){
        const tf=d.tf.get(t); if(!tf) continue;
        const s=w*idf(t)*tf*(K1+1)/(tf+K1*(1-B+B*d.len/AVGDL));
        if (s>best) best=s;
      }
      if (best>0){ sc+=best; m++; if(!isProd(c)) topic=true; }
    }
    if (!sc) continue;
    const cov=m/A.concepts.length;
    sc *= .3+.7*cov*cov;
    if (A.prods.size && !(d.e.p||[]).some(p=>A.prods.has(PROD_TERM[p]))) sc*=.5;
    sc *= 1+.15*d.rec;
    if (topic) anyTopic=true;
    hits.push({d,sc,topic});
  }
  // kalau ada entri yang cocok dengan topiknya, buang yang cuma cocok nama produk
  if (anyTopic) hits=hits.filter(h=>h.topic);
  hits.sort((x,y)=>y.sc-x.sc);
  const top=hits.length?hits[0].sc:0;
  return {A, hits:hits.filter(h=>h.sc>=top*.15), top};
}

/* ================= Highlight ================= */
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function hl(text, want){
  text=String(text||'');
  if (!want || !want.size) return esc(text);
  const re=/[\p{L}\p{N}]+(?:[.\-'][\p{L}\p{N}]+)*/gu; const words=[]; let m;
  while ((m=re.exec(text))) words.push({s:m.index,e:m.index+m[0].length,w:m[0]});
  const mark=new Array(words.length).fill(false);
  const nt=words.map(x=>{ const t=toks(x.w); return t.length===1?t[0]:t.join(''); });
  words.forEach((x,i)=>{
    const t=nt[i]; if(!t || STOP.has(t)) return;
    if (want.has(t) || want.has(stem(t)) || want.has(synOf(t)||'#')) mark[i]=true;
  });
  for (const h of findPhrases(nt)) if (want.has(h.canon)) for(let j=h.i;j<h.i+h.L;j++) mark[j]=true;
  let out='', pos=0, i=0;
  while (i<words.length){
    if (!mark[i]){ i++; continue; }
    let j=i; while (j+1<words.length && mark[j+1] && /^[\s,/-]*$/.test(text.slice(words[j].e,words[j+1].s))) j++;
    out+=esc(text.slice(pos,words[i].s))+'<mark>'+esc(text.slice(words[i].s,words[j].e))+'</mark>';
    pos=words[j].e; i=j+1;
  }
  return out+esc(text.slice(pos));
}

  const q=state.q.trim();
  const fix=$('fix');
  if (lastRes && lastRes.A.fixes.length){ fix.hidden=false; fix.textContent='🔎 Salah ketik? Dicari juga: '+lastRes.A.fixes.map(([a,b])=>`${a} → ${b}`).join(', '); }
  else fix.hidden=true;
  const total=current.length, shown=Math.min(state.shown,total);
  if (q) $('status').innerHTML = total ? `<b>${total}</b> jawaban relevan untuk “${esc(q)}” — ${state.sort==='auto'?'diurutkan dari yang paling cocok':'urutan dipilih manual'}.` : '';
  else $('status').innerHTML = `Jawaban terbaru dulu. Ketik pertanyaan di atas untuk mencari. <span style="color:var(--faint)">(${total} entri)</span>`;
  if (!total){
    $('list').innerHTML = `<div class="empty"><b>Belum ada jawaban yang cocok.</b><br>Coba kata lain (nama penyakit / obat / keluhan), kurangi filter, atau tanyakan ke grup Q&amp;A.</div>`;
  } else {
    $('list').innerHTML = current.slice(0,shown).map((x,i)=>cardHTML(x,i)).join('');
  }
  $('more').hidden = shown>=total;
  $('more').textContent = `Tampilkan lebih banyak (${total-shown} lagi)`;
}
function renderSugg(){
  const box=$('sugg'), q=state.q.trim();
  if (!q || document.activeElement!==$('q')){ box.classList.remove('on'); $('q').setAttribute('aria-expanded','false'); return; }
  const top=current.slice(0,6);
  if (!top.length){ box.innerHTML='<div class="hd">Tidak ada yang cocok — coba kata lain</div>'; box.classList.add('on'); return; }
  box.innerHTML = '<div class="hd">Pertanyaan paling mirip</div>'+top.map((x,i)=>{
    const st=STATUS[x.e.s];
    return `<button type="button" class="opt${i===state.sel?' act':''}" role="option" id="opt${i}" data-id="${x.e.id}">${hl(x.e.q,want)}<small>${esc((x.e.p||[]).join(', '))}${st?' · '+st[0]+' '+st[1]:''} · ${esc(x.e.d||'')}</small></button>`;
  }).join('') + (current.length>6?`<button type="button" class="more">Lihat semua ${current.length} hasil ↓</button>`:'');
  box.classList.add('on'); $('q').setAttribute('aria-expanded','true');
  box.querySelectorAll('.opt').forEach(b=>b.onmousedown=ev=>{ ev.preventDefault(); openCard(b.dataset.id); });
  const mo=box.querySelector('.more'); if (mo) mo.onmousedown=ev=>{ ev.preventDefault(); closeSugg(); $('list').scrollIntoView({behavior:'smooth'}); };
}
function closeSugg(){ state.sel=-1; $('sugg').classList.remove('on'); $('q').setAttribute('aria-expanded','false'); }
function openCard(id){
  closeSugg(); $('q').blur();
  const idx=current.findIndex(x=>String(x.e.id)===String(id));
  if (idx>=state.shown){ state.shown=idx+1; render(); }
  const el=$('qa-'+id); if(!el) return;
  el.scrollIntoView({behavior:'smooth',block:'start'});
  el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
}
let tmr=null, urlTmr=null;
function onInput(now){
  state.q=$('q').value; state.shown=PAGE; state.sel=-1;
  $('clr').classList.toggle('on', !!state.q);
  clearTimeout(tmr);
  tmr=setTimeout(()=>{ render(); renderSugg(); }, now?0:110);
  clearTimeout(urlTmr); urlTmr=setTimeout(syncURL,600);
}
function syncURL(){
  try{
    const u=new URL(location.href);
    state.q.trim()?u.searchParams.set('q',state.q.trim()):u.searchParams.delete('q');
    state.prod!=='Semua'?u.searchParams.set('p',state.prod):u.searchParams.delete('p');
    history.replaceState(null,'',u);
  }catch(e){}
}
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),1600); }
function copyText(s){
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(s);
  const ta=document.createElement('textarea'); ta.value=s; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }finally{ ta.remove(); }
  return Promise.resolve();
}
function setTheme(t){
  if (t) document.documentElement.setAttribute('data-theme',t); else document.documentElement.removeAttribute('data-theme');
  const dark = t ? t==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  $('theme').textContent = dark?'☀️ Light':'🌙 Dark';
}
function init(){
  initHeader();
  let saved=null; try{ saved=localStorage.getItem('tp-theme'); }catch(e){}
  setTheme(saved);
  $('theme').onclick=()=>{ const dark=document.documentElement.getAttribute('data-theme')==='dark' || (!document.documentElement.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
    const t=dark?'light':'dark'; setTheme(t); try{ localStorage.setItem('tp-theme',t); }catch(e){} };
  const q=$('q');
  q.addEventListener('input',()=>onInput(false));
  q.addEventListener('focus',()=>renderSugg());
  q.addEventListener('blur',()=>setTimeout(closeSugg,120));
  q.addEventListener('keydown',ev=>{
    const opts=[...$('sugg').querySelectorAll('.opt')];
    if (ev.key==='ArrowDown'&&opts.length){ ev.preventDefault(); state.sel=(state.sel+1)%opts.length; renderSugg(); q.setAttribute('aria-activedescendant','opt'+state.sel); }
    else if (ev.key==='ArrowUp'&&opts.length){ ev.preventDefault(); state.sel=(state.sel-1+opts.length)%opts.length; renderSugg(); q.setAttribute('aria-activedescendant','opt'+state.sel); }
    else if (ev.key==='Enter'){ ev.preventDefault(); if (state.sel>=0&&opts[state.sel]) openCard(opts[state.sel].dataset.id); else { clearTimeout(tmr); render(); closeSugg(); q.blur(); } }
    else if (ev.key==='Escape'){ closeSugg(); }
  });
  $('clr').onclick=()=>{ q.value=''; onInput(true); q.focus(); };
  $('go').onclick=()=>{ clearTimeout(tmr); state.q=q.value; render(); closeSugg(); q.blur(); if(state.q.trim()) $('status').scrollIntoView({behavior:'smooth',block:'start'}); };
  $('cat').onchange=e=>{ state.cat=e.target.value; state.shown=PAGE; render(); };
  $('st').onchange=e=>{ state.st=e.target.value; state.shown=PAGE; render(); };
  $('sort').onchange=e=>{ state.sort=e.target.value; state.shown=PAGE; render(); };
  $('more').onclick=()=>{ state.shown+=PAGE; render(); };
  $('list').addEventListener('toggle',ev=>{
    const d=ev.target; if(!d.classList||!d.classList.contains('relbox')||!d.open) return;
    const box=d.querySelector('.relc'); if(box.dataset.done) return;
    const e=BYID.get(d.dataset.id); if(!e) return;
    box.innerHTML=relatedHTML(e); box.dataset.done='1';
  },true);
  $('list').addEventListener('click',ev=>{
    const b=ev.target.closest('.copy'); if(!b) return;
    const e=current[+b.dataset.i]?.e; if(!e) return;
    copyText(`❓ ${e.q}\n${e.a}\n— ${(e.by||[]).join(', ')} (${e.d})`).then(()=>toast('Jawaban disalin'),()=>toast('Gagal menyalin'));
  });
  try{
    const u=new URL(location.href);
    const p=u.searchParams.get('p'); if (p && PRODUCTS.includes(p)) state.prod=p;
    const qq=u.searchParams.get('q'); if (qq){ q.value=qq; state.q=qq; $('clr').classList.add('on'); }
  }catch(e){}
  render();
}
init();
</script>
</body>
